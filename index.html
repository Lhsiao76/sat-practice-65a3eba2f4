/span> rock samples, and planted a flag.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["collected","collect","will collect","are collecting"],"correct":"A","domain":"SEC","concept":"tense","difficulty":"easy","explanation":"The verbs in this list (\"walked,\" \"planted\") are in the simple past, and the event happened in 1969. The middle verb should match: \"collected.\""},{"id":"tense-5","passage":"<p>Every morning, Ms. Alvarez <span class=\"blank\" aria-label=\"blank\">______<\/span> the class garden before the first bell rings.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["waters","watered","had watered","will have watered"],"correct":"A","domain":"SEC","concept":"tense","difficulty":"easy","explanation":"\"Every morning\" describes a habit that is still going on, and the other verb (\"rings\") is in the present tense. A regular, current habit uses the simple present: \"waters.\""},{"id":"tense-6","passage":"<p>Scientists now know that the Moon <span class=\"blank\" aria-label=\"blank\">______<\/span> slowly drifting away from Earth, by about 3.8 centimeters each year.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["was","had been","is","will be"],"correct":"C","domain":"SEC","concept":"tense","difficulty":"easy","explanation":"\"Now know\" and \"each year\" show that this is happening in the present and continuing, so the present tense \"is drifting\" fits. Past forms would suggest it has stopped."},{"id":"verbform-1","passage":"<p>The Golden Gate Bridge, painted a color known as International Orange, <span class=\"blank\" aria-label=\"blank\">______<\/span> San Francisco to Marin County.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["connecting","connects","to connect","having connected"],"correct":"B","domain":"SEC","concept":"verbform","difficulty":"easy","explanation":"Cover up the phrase between the commas: \"The Golden Gate Bridge <span class=\"blank\" aria-label=\"blank\">______<\/span> San Francisco…\" The sentence still needs a main verb, and only \"connects\" has a tense. The other forms can't be a sentence's main verb."},{"id":"verbform-2","passage":"<p>Marie Curie, who won Nobel Prizes in both physics and chemistry, <span class=\"blank\" aria-label=\"blank\">______<\/span> the first woman to win a Nobel Prize.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["being","to be","having been","was"],"correct":"D","domain":"SEC","concept":"verbform","difficulty":"easy","explanation":"The \"who\" clause has its own verb (\"won\"), but the main subject \"Marie Curie\" still needs one. \"Was\" is the only choice that can serve as a main verb."},{"id":"verbform-3","passage":"<p>The old lighthouse on the rocky point, built in 1872 and restored by volunteers in 2019, <span class=\"blank\" aria-label=\"blank\">______<\/span> visitors who climb its 120 steps every summer.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["now welcoming","now to welcome","now welcomes","having now welcomed"],"correct":"C","domain":"SEC","concept":"verbform","difficulty":"medium","explanation":"Remove the phrase between the commas, and you have \"The old lighthouse on the rocky point <span class=\"blank\" aria-label=\"blank\">______<\/span> visitors.\" The sentence needs a main verb with a tense: \"welcomes.\""},{"id":"verbform-4","passage":"<p>Emperor penguins huddle together in large groups to survive the Antarctic winter, <span class=\"blank\" aria-label=\"blank\">______<\/span> turns standing on the cold outer edge of the crowd.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["taking","they take","take","takes"],"correct":"A","domain":"SEC","concept":"verbform","difficulty":"medium","explanation":"The sentence already has a main verb (\"huddle\"), so the part after the comma should be a describing phrase: \"taking turns.\" B creates a comma splice, and C and D would need \"and\" to join a second verb."},{"id":"verbform-5","passage":"<p>The students in Mr. Park's class, after weeks of collecting data on local bird species, <span class=\"blank\" aria-label=\"blank\">______<\/span> their findings to the city council.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["presenting","to present","having presented","presented"],"correct":"D","domain":"SEC","concept":"verbform","difficulty":"easy","explanation":"The subject \"The students\" needs a main verb, and the interrupting phrase doesn't provide one (\"collecting\" belongs to the phrase). Only \"presented\" has a tense and can complete the sentence."},{"id":"verbform-6","passage":"<p>Petra, an ancient city carved into rose-colored sandstone cliffs in what is now Jordan, <span class=\"blank\" aria-label=\"blank\">______<\/span> once a busy center of trade.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["was","being","having been","to be"],"correct":"A","domain":"SEC","concept":"verbform","difficulty":"easy","explanation":"Skip the description between the commas: \"Petra <span class=\"blank\" aria-label=\"blank\">______<\/span> once a busy center of trade.\" It needs a main verb, and \"was\" is the only finite verb. The \"is\" inside the phrase belongs to the phrase, not the main sentence."},{"id":"possessive-1","passage":"<p>The ruby-throated hummingbird weighs about as much as a penny. The <span class=\"blank\" aria-label=\"blank\">______<\/span> beat about 50 times per second, allowing it to hover in front of a flower while it drinks nectar.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["hummingbirds wings","hummingbird's wings","hummingbirds' wings","hummingbird's wing's"],"correct":"B","domain":"SEC","concept":"possessive","difficulty":"easy","explanation":"One hummingbird (\"it\") owns the wings, so the singular possessive \"hummingbird's\" is needed, and \"wings\" is a plain plural. A has no possessive, C is plural possessive (but \"it\" shows one bird), and D wrongly makes \"wings\" possessive."},{"id":"possessive-2","passage":"<p>The school's spring play had only three cast members. All three <span class=\"blank\" aria-label=\"blank\">______<\/span> were sewn by parent volunteers from the drama club, who worked for six weekends to finish them.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["actors costumes","actor's costumes","actors' costumes","actors' costume's"],"correct":"C","domain":"SEC","concept":"possessive","difficulty":"easy","explanation":"Three actors own the costumes, so the plural possessive \"actors'\" is needed, and \"costumes\" is a plain plural. A has no possessive, B is singular, and D wrongly makes \"costumes\" possessive."},{"id":"possessive-3","passage":"<p>Several <span class=\"blank\" aria-label=\"blank\">______<\/span> from the local university visited our class to explain how they study earthquakes.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["scientist's","scientists","scientists'","scientist"],"correct":"B","domain":"SEC","concept":"possessive","difficulty":"easy","explanation":"\"Several\" means more than one, and the scientists don't own anything here (they just visited). So you need a simple plural with no apostrophe: \"scientists.\""},{"id":"possessive-4","passage":"<p>The <span class=\"blank\" aria-label=\"blank\">______<\/span> section of the library was moved to the second floor to make room for a new computer lab.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["childrens'","childrens","children's","childs'"],"correct":"C","domain":"SEC","concept":"possessive","difficulty":"medium","explanation":"\"Children\" is already plural (it doesn't end in s), so its possessive just adds 's: \"children's.\" \"Childrens\" isn't a word."},{"id":"possessive-5","passage":"<p>During last Friday's championship game between Lincoln High and Roosevelt High, both <span class=\"blank\" aria-label=\"blank\">______<\/span> wore matching blue jerseys, which confused the referees until one team switched to its white practice shirts.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["schools' teams","schools teams","school's teams","schools' team's"],"correct":"A","domain":"SEC","concept":"possessive","difficulty":"medium","explanation":"\"Both\" refers to the two schools named, Lincoln High and Roosevelt High, and the teams belong to them, so the plural possessive \"schools'\" is needed, followed by the plain plural \"teams.\" B has no possessive, C is singular, and D wrongly makes \"teams\" possessive."},{"id":"possessive-6","passage":"<p>My <span class=\"blank\" aria-label=\"blank\">______<\/span> produced so many zucchini this summer that she gave a bag of them to every neighbor on her street. Next year, she plans to plant half as many.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["grandmothers garden","grandmothers' garden","grandmother's garden's","grandmother's garden"],"correct":"D","domain":"SEC","concept":"possessive","difficulty":"easy","explanation":"\"She\" shows one grandmother owns the garden, so the singular possessive \"grandmother's\" is needed, and \"garden\" needs no apostrophe because it doesn't own anything. A has no possessive, B is plural, and C wrongly makes \"garden\" possessive."},{"id":"modifier-1","passage":"<p>Covered in thick white fur, <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["the Arctic's snowy landscape hides the polar bear well.","the polar bear blends easily into the snowy Arctic landscape.","the snowy Arctic landscape is where the polar bear blends in easily.","blending easily into the snowy Arctic landscape is what the polar bear does."],"correct":"B","domain":"SEC","concept":"modifier","difficulty":"easy","explanation":"The polar bear is the thing covered in fur, so \"the polar bear\" must come right after the comma. A and C make it sound like the landscape has fur."},{"id":"modifier-2","passage":"<p>After practicing the piano for three hours, <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["Mia's fingers were sore.","the piano needed to be tuned.","Mia's fingers felt sore to her.","Mia rubbed her sore fingers."],"correct":"D","domain":"SEC","concept":"modifier","difficulty":"easy","explanation":"Mia did the practicing, so \"Mia\" must come right after the comma. In A and C, \"Mia's fingers\" comes first, which says the fingers practiced. In B, the piano practiced!"},{"id":"modifier-3","passage":"<p>The tomb of the young pharaoh had been hidden beneath debris in Egypt's Valley of the Kings for more than 3,000 years. Discovered in 1922 by archaeologist Howard Carter, <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["Tutankhamun's tomb contained more than 5,000 objects.","archaeologist Howard Carter found more than 5,000 objects in Tutankhamun's tomb.","Howard Carter's team cataloged more than 5,000 objects in Tutankhamun's tomb.","there were more than 5,000 objects in Tutankhamun's tomb."],"correct":"A","domain":"SEC","concept":"modifier","difficulty":"medium","explanation":"\"Discovered in 1922 by archaeologist Howard Carter\" describes the tomb, so \"Tutankhamun's tomb\" must come right after the comma. B and C would mean that Carter (or his team) was discovered by Carter, and D has no noun for the phrase to modify."},{"id":"modifier-4","passage":"<p>Known for its towering sandstone arches, <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["visitors flock to Arches National Park in Utah each year.","Utah's Arches National Park draws more than a million visitors each year.","more than a million people visit Utah's Arches National Park each year.","each year more than a million visitors go to Utah's Arches National Park."],"correct":"B","domain":"SEC","concept":"modifier","difficulty":"easy","explanation":"The park is what's known for its arches (\"its\" refers to the park), so the park must come right after the comma. A, C, and D put visitors, people, or \"each year\" there instead."},{"id":"modifier-5","passage":"<p>In the final 100 meters of the 1,500-meter race, Amara moved from fourth place to second. Sprinting toward the finish line, <span class=\"blank\" aria-label=\"blank\">______<\/span> as the crowd cheered.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["Amara's legs began to burn","the crowd's cheers grew louder for Amara","Amara felt her legs begin to burn","the burning in Amara's legs grew stronger"],"correct":"C","domain":"SEC","concept":"modifier","difficulty":"medium","explanation":"\"Sprinting toward the finish line\" describes Amara, so \"Amara\" must be the subject right after the comma. In A it is her legs that sprint, in B the cheers, and in D the burning."},{"id":"modifier-6","passage":"<p>Written over the course of a single summer, <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["Leah finished her first novel just before school started.","Leah completed her first novel in time for the new school year.","Leah's first novel was finished just before school started.","finishing her first novel just before school started was Leah's proudest moment."],"correct":"C","domain":"SEC","concept":"modifier","difficulty":"easy","explanation":"The novel is what was written, so \"Leah's first novel\" must follow the comma. A and B make it sound like Leah herself was written over a summer."},{"id":"transition-1","passage":"<p>Penguins are birds, but they cannot fly. <span class=\"blank\" aria-label=\"blank\">______<\/span> their wings have evolved into stiff flippers that make them powerful swimmers.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["For this reason,","Instead,","Similarly,","For example,"],"correct":"B","domain":"EI","concept":"transition","difficulty":"medium","explanation":"The second sentence tells what penguin wings do in place of flying, so \"Instead\" fits. The flippers aren't caused by the inability to fly (A), and swimming isn't an example of not flying (D)."},{"id":"transition-2","passage":"<p>The bridge's steel cables had begun to rust after decades of exposure to salty sea air. <span class=\"blank\" aria-label=\"blank\">______<\/span> city engineers closed the bridge to heavy trucks until repairs could be made.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["However,","For example,","As a result,","Likewise,"],"correct":"C","domain":"EI","concept":"transition","difficulty":"medium","explanation":"The rust (cause) led to closing the bridge to heavy trucks (effect), so \"As a result\" is the logical link. There's no contrast, so \"However\" doesn't fit."},{"id":"transition-3","passage":"<p>Many animals use tools. <span class=\"blank\" aria-label=\"blank\">______<\/span> chimpanzees strip the leaves from twigs and poke the twigs into termite mounds to fish out insects.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["For instance,","Nevertheless,","In contrast,","Therefore,"],"correct":"A","domain":"EI","concept":"transition","difficulty":"medium","explanation":"The second sentence gives a specific example of the general statement \"Many animals use tools,\" so \"For instance\" is correct."},{"id":"transition-4","passage":"<p>Bamboo grows remarkably fast; some species can grow nearly a meter in a single day. <span class=\"blank\" aria-label=\"blank\">______<\/span> bamboo is extremely strong for its weight, which makes it a popular building material in many parts of Asia.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["Instead,","In contrast,","For example,","Moreover,"],"correct":"D","domain":"EI","concept":"transition","difficulty":"medium","explanation":"The second sentence adds another impressive quality of bamboo (strength) to the first one (speed of growth). \"Moreover\" means \"in addition.\" There's no contrast, and strength isn't an example of fast growth."},{"id":"transition-5","passage":"<p>The team's robot failed to complete the obstacle course in both of the first two rounds of the competition. <span class=\"blank\" aria-label=\"blank\">______<\/span> the judges awarded the team a prize for the most creative design.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["Consequently,","Even so,","For instance,","Similarly,"],"correct":"B","domain":"EI","concept":"transition","difficulty":"hard","explanation":"Winning a prize is surprising after failing twice. \"Even so\" means \"despite that.\" \"Consequently\" would wrongly say that failing caused the prize."},{"id":"transition-6","passage":"<p>To make paper by hand, workers first soak plant fibers in water and beat them into a pulp. <span class=\"blank\" aria-label=\"blank\">______<\/span> they spread the pulp in a thin layer over a screen and let it dry.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["Next,","Nonetheless,","In other words,","By contrast,"],"correct":"A","domain":"EI","concept":"transition","difficulty":"medium","explanation":"The text describes steps in order (\"first …\"), and spreading the pulp is the following step, so \"Next\" fits. The second sentence doesn't restate or contrast with the first."},{"id":"transition-7","passage":"<p>Wood frogs survive Alaska's harsh winters by allowing much of their bodies to freeze solid; in spring, they thaw and hop away. <span class=\"blank\" aria-label=\"blank\">______<\/span> some young painted turtles spend their first winter partly frozen in their underground nests before thawing in spring.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["Instead,","As a result,","Similarly,","In other words,"],"correct":"C","domain":"EI","concept":"transition","difficulty":"hard","explanation":"Both animals survive winter by partly freezing and thawing in spring, which is the same strategy, so \"Similarly\" fits. The turtles aren't caused by the frogs (B), and the second sentence isn't a restatement (D)."},{"id":"transition-8","passage":"<p>Scientists describe the kakapo, a parrot from New Zealand, as nocturnal. <span class=\"blank\" aria-label=\"blank\">______<\/span> the kakapo is active mainly at night and rests during the day.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["However,","As a result,","For example,","In other words,"],"correct":"D","domain":"EI","concept":"transition","difficulty":"medium","explanation":"The second sentence explains what \"nocturnal\" means, restating the first sentence in plainer words. \"In other words\" signals a restatement."},{"id":"synthesis-1","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Giant sequoias grow naturally only on the western slopes of California's Sierra Nevada.<\/li><li>The largest giant sequoia, called General Sherman, is about 84 meters tall.<\/li><li>General Sherman's trunk is about 11 meters wide at its base.<\/li><li>Some giant sequoias are more than 3,000 years old.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize the size of the largest giant sequoia. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Giant sequoias grow naturally only in California's Sierra Nevada.","Some giant sequoias are more than 3,000 years old.","The largest giant sequoia, General Sherman, stands about 84 meters tall, with a trunk about 11 meters wide at its base.","Giant sequoias grow naturally only on the western slopes of California's Sierra Nevada, and some of them are more than 3,000 years old."],"correct":"C","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"The goal is SIZE, so the answer needs the height and width measurements. B is about age, A is about location, and D combines location and age without giving any measurements."},{"id":"synthesis-2","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Camels live in deserts in Africa and Asia.<\/li><li>Llamas live in the Andes Mountains of South America.<\/li><li>Camels and llamas both belong to the camelid family.<\/li><li>People have used both animals for thousands of years to carry heavy loads.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize a similarity between camels and llamas. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Camels live in the deserts of Africa and Asia, while llamas live high in the Andes Mountains of South America.","Like camels, llamas belong to the camelid family and have long been used by people to carry heavy loads.","Llamas live in the Andes Mountains of South America.","Camels live in deserts, but llamas live in mountains."],"correct":"B","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"\"Similarity\" means what they have in common: same family and the same use by people. A and D emphasize DIFFERENCES, the opposite of the goal."},{"id":"synthesis-3","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Katherine Johnson was a mathematician at NASA.<\/li><li>She calculated flight paths for early U.S. space missions.<\/li><li>In 1962, before becoming the first American to orbit Earth, astronaut John Glenn asked that Johnson personally check the computer's calculations for his flight.<\/li><li>She received the Presidential Medal of Freedom in 2015.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize how much astronauts trusted Johnson's work. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Katherine Johnson, a NASA mathematician, received the Presidential Medal of Freedom in 2015.","NASA mathematician Katherine Johnson calculated flight paths for early U.S. space missions.","Johnson calculated flight paths for early space missions and later received a national honor.","Before his 1962 orbit, John Glenn asked that Johnson personally check the computer's calculations."],"correct":"D","domain":"EI","concept":"synthesis","difficulty":"easy","explanation":"The goal is to show how much astronauts TRUSTED Johnson's work. Only D mentions an astronaut, John Glenn, who asked for Johnson specifically to check the computer's math. A and C emphasize her honors, and B describes her job; all are accurate, but none shows an astronaut's trust."},{"id":"synthesis-4","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>The Dust Bowl was a period of severe dust storms in the U.S. Great Plains during the 1930s.<\/li><li>Farmers had plowed up native grasses whose deep roots held the soil in place.<\/li><li>A long drought dried out the exposed soil.<\/li><li>Strong winds then carried the loose soil away in huge clouds.<\/li><\/ul>","chart":null,"stem":"The student wants to explain what caused the Dust Bowl. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["After farmers plowed up the deep-rooted grasses that held the soil in place, a long drought dried out the exposed soil, and strong winds carried it away.","During the 1930s, the U.S. Great Plains were struck again and again by severe dust storms as strong winds carried loose soil away in huge clouds.","Strong winds are common on the Great Plains.","The Dust Bowl took place in the Great Plains of the United States."],"correct":"A","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"The goal is CAUSES, and A lays out the chain of causes (plowing, then drought, then wind). B describes the storms themselves and D says where they happened; neither explains why the soil was loose enough to blow away."},{"id":"synthesis-5","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Mercury is the planet closest to the Sun.<\/li><li>Mercury's daytime temperature can reach about 430°C.<\/li><li>At night, Mercury's temperature can drop to about −180°C.<\/li><li>Mercury has almost no atmosphere to trap heat.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize the difference between Mercury's daytime and nighttime temperatures. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Mercury is the closest planet to the Sun.","Because Mercury has almost no atmosphere to trap heat, its temperature can drop to about −180°C at night.","Mercury's temperature swings from about 430°C during the day to about −180°C at night.","Mercury's daytime temperature can reach about 430°C."],"correct":"C","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"A \"difference\" needs both numbers side by side. D gives only the daytime temperature, and B gives a reason and only the nighttime temperature, so it never shows the difference."},{"id":"synthesis-6","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>The kora is a stringed instrument from West Africa.<\/li><li>It has 21 strings.<\/li><li>Its body is made from a large gourd covered with cowhide.<\/li><li>For centuries, musicians called griots have played the kora while telling stories and histories.<\/li><\/ul>","chart":null,"stem":"The student wants to introduce the kora to an audience unfamiliar with it. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The kora has 21 strings.","Griots have played music for centuries.","The body of the kora is made from a large gourd covered with cowhide, and the instrument has a total of 21 strings.","The kora, a 21-string instrument from West Africa, has long been played by griots, musicians who tell stories and histories."],"correct":"D","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"An unfamiliar audience needs to know what the kora is and where it's from, and any special terms (like \"griots\") need to be explained. D does all of that; the others give single details without introducing the instrument. C lists physical details but never says what kind of instrument the kora is or where it comes from."},{"id":"synthesis-7","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Researchers asked 100 volunteers to memorize a list of words.<\/li><li>Half of the volunteers then slept for eight hours; the other half stayed awake for the same amount of time.<\/li><li>When tested, the volunteers who had slept remembered about 20 percent more words.<\/li><li>The researchers concluded that sleep helps the brain store new memories.<\/li><\/ul>","chart":null,"stem":"The student wants to present the study's conclusion. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Researchers asked 100 volunteers to memorize a list of words; half then slept for eight hours, and the other half stayed awake for the same amount of time.","Because volunteers who slept recalled about 20 percent more words than those who stayed awake, the researchers concluded that sleep helps the brain store new memories.","Half of the volunteers slept for eight hours.","The volunteers were tested on a list of words."],"correct":"B","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"Only B states the conclusion (sleep helps store memories), along with the result that supports it. The other choices describe how the study was set up."},{"id":"wic-9","passage":"<p>Although early reviewers dismissed the composer's experimental symphony as mere noise, later critics came to <span class=\"blank\" aria-label=\"blank\">______<\/span> it as a turning point in modern music, praising the very clashing sounds that had once offended audiences.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["disregard","imitate","celebrate","misinterpret"],"correct":"C","domain":"CS","concept":"wic","difficulty":"medium","explanation":"\"Although\" contrasts early dismissal with later critics, who were \"praising the very clashing sounds.\" They came to \"celebrate\" the symphony as a turning point. \"Disregard\" matches the early reviewers, not the later critics, and nothing suggests the critics copied (\"imitate\") or misunderstood (\"misinterpret\") it."},{"id":"wic-10","passage":"<p>The witness's account was frustratingly <span class=\"blank\" aria-label=\"blank\">______<\/span>: she could not recall the color of the car, the time of the accident, or even which direction the driver had been heading.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["vague","meticulous","emphatic","persuasive"],"correct":"A","domain":"CS","concept":"wic","difficulty":"medium","explanation":"The colon introduces evidence: she couldn't remember any specific details. \"Vague\" means unclear or lacking detail. \"Meticulous\" (very careful and detailed) is the opposite."},{"id":"wic-11","passage":"<p>Botanist Lucia Ferrer's claim that the orchid is pollinated by only a single moth species remains <span class=\"blank\" aria-label=\"blank\">______<\/span>: although the idea is plausible, no one has yet observed the moth visiting the flower.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["obsolete","indisputable","celebrated","speculative"],"correct":"D","domain":"CS","concept":"wic","difficulty":"hard","explanation":"The claim is \"plausible\" but hasn't been confirmed by observation, so it is \"speculative,\" based on reasoning rather than proof. \"Indisputable\" is the opposite, and \"obsolete\" would mean it had been replaced."},{"id":"wic-12","passage":"<p>The mayor's speech was notably <span class=\"blank\" aria-label=\"blank\">______<\/span>; she spoke for only three minutes, yet she managed to outline every major part of her plan.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["rambling","concise","hesitant","ornate"],"correct":"B","domain":"CS","concept":"wic","difficulty":"medium","explanation":"Covering everything in only three minutes means the speech was short but complete. \"Concise\" means saying a lot in few words. \"Rambling\" and \"ornate\" suggest long or fancy speech."},{"id":"wic-13","passage":"<p>Some historians argue that the treaty did not resolve the conflict so much as <span class=\"blank\" aria-label=\"blank\">______<\/span> it: by leaving the border dispute unsettled, the agreement allowed tensions to grow worse over the following decade.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["exacerbate","formalize","moderate","publicize"],"correct":"A","domain":"CS","concept":"wic","difficulty":"hard","explanation":"The colon explains the blank: leaving the dispute unsettled let tensions \"grow worse,\" so the treaty made the conflict worse, or \"exacerbated\" it. \"Moderate\" means the opposite, and nothing suggests the treaty made the conflict official (\"formalize\") or better known (\"publicize\")."},{"id":"wic-14","passage":"<p>The novelist is known for her <span class=\"blank\" aria-label=\"blank\">______<\/span> style; a single sentence of hers may run for half a page, drifting through memories, side comments, and descriptions before it finally reaches its point.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["terse","measured","rambling","austere"],"correct":"C","domain":"CS","concept":"wic","difficulty":"medium","explanation":"The semicolon introduces an example: sentences that run for half a page and drift through side comments before reaching the point. That style is \"rambling.\" \"Terse\" (using few words) is the opposite, and nothing in the text describes the style as \"measured\" or \"austere.\""},{"id":"wic-15","passage":"<p>To avoid wasting the expedition's limited supplies, the team leader was <span class=\"blank\" aria-label=\"blank\">______<\/span> about rationing, measuring out each day's food and water to the gram.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["cavalier","scrupulous","hesitant","furtive"],"correct":"B","domain":"CS","concept":"wic","difficulty":"hard","explanation":"Measuring \"each day's food and water to the gram\" shows extreme care and precision: \"scrupulous.\" \"Cavalier\" (careless, offhand) is the opposite, and nothing shows the leader was \"hesitant\" or \"furtive\" (secretive)."},{"id":"wic-16","passage":"<p>Because the results of the first trial were so <span class=\"blank\" aria-label=\"blank\">______<\/span>, with some patients improving dramatically and others not at all, the researchers could draw no firm conclusion about the drug's effectiveness.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["uniform","promising","conclusive","inconsistent"],"correct":"D","domain":"CS","concept":"wic","difficulty":"hard","explanation":"Some patients improved dramatically and others didn't improve at all, so the results varied widely. \"Inconsistent\" fits. \"Uniform\" (all the same) and \"conclusive\" contradict \"no firm conclusion.\""},{"id":"wic-17","passage":"<p>Many species of deep-sea fish are <span class=\"blank\" aria-label=\"blank\">______<\/span>: they are rarely seen by researchers because they live in waters too deep and dark for most cameras and submarines to reach.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["elusive","aggressive","abundant","colorful"],"correct":"A","domain":"CS","concept":"wic","difficulty":"hard","explanation":"The fish are \"rarely seen\" because they are hard to reach. \"Elusive\" means difficult to find or catch. The text says nothing about how aggressive, common, or colorful they are."},{"id":"wic-18","passage":"<p>Although the two scientists agreed on the basic facts, their interpretations of the data were strikingly <span class=\"blank\" aria-label=\"blank\">______<\/span>: one saw evidence of a warming trend, while the other saw only normal variation.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["consistent","speculative","divergent","tentative"],"correct":"C","domain":"CS","concept":"wic","difficulty":"hard","explanation":"\"Although\" signals a contrast with agreeing on the facts, and the colon gives the example: one scientist saw a warming trend and the other saw normal variation. Their interpretations were \"divergent\" (different). \"Consistent\" is the opposite, and the text says nothing about the interpretations being uncertain (\"tentative,\" \"speculative\")."},{"id":"wic-19","passage":"<p>The tiny town's library had a <span class=\"blank\" aria-label=\"blank\">______<\/span> budget, so the librarians relied on donated books and volunteer staff to keep it open.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["lavish","meager","itemized","disputed"],"correct":"B","domain":"CS","concept":"wic","difficulty":"medium","explanation":"The librarians had to rely on donated books and volunteers, which shows they had little money: a \"meager\" budget. \"Lavish\" is the opposite, and an \"itemized\" or \"disputed\" budget wouldn't explain why they needed donations."},{"id":"wic-20","passage":"<p>Critics of the proposal argued that its benefits were <span class=\"blank\" aria-label=\"blank\">______<\/span> at best: the new highway would shorten commutes by less than a minute while costing hundreds of millions of dollars.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["substantial","enduring","pervasive","negligible"],"correct":"D","domain":"CS","concept":"wic","difficulty":"hard","explanation":"The colon explains the blank: the highway would save \"less than a minute\" while costing hundreds of millions of dollars, so its benefits were tiny, or \"negligible.\" \"Substantial\" is the opposite, and the critics' point is the size of the benefit, not whether it is \"enduring\" or \"pervasive.\""},{"id":"wic-21","passage":"<p>Though often shown in films as fierce hunters of humans, most shark species are fairly <span class=\"blank\" aria-label=\"blank\">______<\/span> toward people, rarely approaching swimmers and almost never attacking them.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["indifferent","hostile","affectionate","inquisitive"],"correct":"A","domain":"CS","concept":"wic","difficulty":"hard","explanation":"\"Though\" contrasts the film image (fierce hunters) with reality: sharks rarely approach swimmers and almost never attack. They show little interest in people: \"indifferent.\" \"Hostile\" matches the film image, not reality, and \"affectionate\" and \"inquisitive\" would mean sharks seek people out, which the text says they rarely do."},{"id":"wic-22","passage":"<p>The physicist's early theory, once widely accepted, is now considered <span class=\"blank\" aria-label=\"blank\">______<\/span>; newer measurements have shown that several of its key predictions were incorrect.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["unorthodox","influential","obsolete","contentious"],"correct":"C","domain":"CS","concept":"wic","difficulty":"hard","explanation":"A theory whose key predictions were shown to be wrong is no longer in use, so it is \"obsolete\" (out of date). \"Contentious\" would mean people still argue about it, and \"unorthodox\" describes an unconventional idea, not a disproved one, but the measurements have settled the question."},{"id":"wic-23","passage":"<p>In her memoir, the chef writes about her grandmother's cooking with <span class=\"blank\" aria-label=\"blank\">______<\/span>, recalling each dish fondly and crediting her grandmother with inspiring her entire career.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["indifference","reverence","suspicion","impatience"],"correct":"B","domain":"CS","concept":"wic","difficulty":"hard","explanation":"Recalling dishes \"fondly\" and giving her grandmother credit for her career shows deep respect and admiration, which is \"reverence.\" The other choices are negative or uncaring."},{"id":"wic-24","passage":"<p>Engineers designed the bridge to be <span class=\"blank\" aria-label=\"blank\">______<\/span>, able to bend slightly in strong winds and during earthquakes without cracking.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["rigid","ornamental","temporary","flexible"],"correct":"D","domain":"CS","concept":"wic","difficulty":"medium","explanation":"\"Able to bend slightly … without cracking\" defines \"flexible.\" \"Rigid\" means stiff and unbending, which is the opposite."},{"id":"wic-25","passage":"<p>The class was <span class=\"blank\" aria-label=\"blank\">______<\/span> to begin the long research project, but once they started building the model city, no one wanted to stop.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["reluctant","eager","qualified","permitted"],"correct":"A","domain":"CS","concept":"wic","difficulty":"medium","explanation":"\"But\" contrasts the start with what happened later (\"no one wanted to stop\"), so at first the class did not want to begin: they were \"reluctant.\" \"Eager\" is the opposite, and \"qualified\" and \"permitted\" don't set up the contrast."},{"id":"wic-26","passage":"<p>Without enough rain, the farmers' wheat crop was <span class=\"blank\" aria-label=\"blank\">______<\/span>, producing only half the usual harvest.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["abundant","uniform","sparse","resilient"],"correct":"C","domain":"CS","concept":"wic","difficulty":"easy","explanation":"Without enough rain, the crop produced \"only half the usual harvest,\" so it was thin and small: \"sparse.\" \"Abundant\" and \"resilient\" suggest the crop did well, and \"uniform\" (all the same) doesn't explain the small harvest."},{"id":"wic-27","passage":"<p>The detective's <span class=\"blank\" aria-label=\"blank\">______<\/span> question made the suspect nervous; it showed that she already knew far more about the crime than he had expected.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["random","pointed","polite","confusing"],"correct":"B","domain":"CS","concept":"wic","difficulty":"hard","explanation":"A \"pointed\" question is sharp and aimed directly at something specific, which is why it revealed what the detective knew. A \"random\" or \"confusing\" question wouldn't show she knew a lot."},{"id":"wic-28","passage":"<p>The heavy wooden table was built to be <span class=\"blank\" aria-label=\"blank\">______<\/span>, and after a hundred years of family dinners, it still stood as sturdy as the day it was made.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["fragile","portable","decorative","durable"],"correct":"D","domain":"CS","concept":"wic","difficulty":"medium","explanation":"Still \"sturdy\" after a hundred years means it was built to last, which is \"durable.\" \"Fragile\" (easily broken) is the opposite."},{"id":"wic-29","passage":"<p>Anyone who hopes to see the comet should be <span class=\"blank\" aria-label=\"blank\">______<\/span>: it appears for only a few minutes before sunrise, and it won't return for another 70 years.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["prompt","fearful","doubtful","generous"],"correct":"A","domain":"CS","concept":"wic","difficulty":"medium","explanation":"The comet is visible only briefly, so viewers must be on time. \"Prompt\" means acting quickly or on time. Nothing suggests fear, doubt, or generosity."},{"id":"wic-30","passage":"<p>Though he usually answered questions in long, careful paragraphs, Mr. Tanaka's reply to the reporter was <span class=\"blank\" aria-label=\"blank\">______<\/span>: \"No comment.\"<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["detailed","heartfelt","curt","rambling"],"correct":"C","domain":"CS","concept":"wic","difficulty":"hard","explanation":"\"Though\" contrasts his usual \"long, careful paragraphs\" with this reply, \"No comment,\" which is short and abrupt: \"curt.\" \"Detailed\" and \"rambling\" describe long answers, the opposite of the reply, and nothing shows strong feeling (\"heartfelt\")."},{"id":"wic-31","passage":"<p>The two friends' personalities were <span class=\"blank\" aria-label=\"blank\">______<\/span>: Jae loved loud parties, while Omar preferred quiet hikes alone.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["identical","contrasting","mysterious","harmonious"],"correct":"B","domain":"CS","concept":"wic","difficulty":"medium","explanation":"Loud parties versus quiet solo hikes are opposite preferences, so their personalities were \"contrasting.\" \"Identical\" is the opposite of what the colon shows."},{"id":"wic-32","passage":"<p>Volunteers worked to <span class=\"blank\" aria-label=\"blank\">______<\/span> the old theater, repairing its seats, repainting its walls, and fixing its leaky roof so that it could open again.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["demolish","abandon","sell","restore"],"correct":"D","domain":"CS","concept":"wic","difficulty":"medium","explanation":"Repairing and fixing the theater so it can reopen means bringing it back to good condition, which is \"restore.\" \"Demolish\" means tear down, the opposite."},{"id":"structure-7","passage":"<p>Many people assume that early humans used caves mainly as places to live. Yet archaeological evidence suggests that people rarely lived deep inside caves, where it was dark and damp; they usually camped near cave entrances. <u>The paintings found far from the entrances, in narrow passages that could be reached only by crawling, may therefore have served some purpose other than decorating a home.<\/u><\/p>","chart":null,"stem":"Which choice best describes the function of the underlined sentence in the text as a whole?","choices":["It provides evidence that early humans lived deep inside caves.","It describes the techniques early humans used to make paintings in the narrow passages of caves.","It questions whether early humans made the paintings at all.","It draws a conclusion about the paintings based on evidence about where people lived."],"correct":"D","domain":"CS","concept":"structure","difficulty":"hard","explanation":"\"Therefore\" signals a conclusion. Since people didn't live deep in caves, paintings found deep inside probably weren't home decorations. A contradicts the evidence, and the text never describes painting methods."},{"id":"structure-8","passage":"<p>In 1928, Alexander Fleming returned from a vacation to find mold growing in one of his dishes of bacteria. A less observant scientist might simply have thrown the dish away. Fleming, however, noticed that the bacteria closest to the mold had died. His curiosity about that small detail led to the discovery of penicillin, the first widely used antibiotic.<\/p>","chart":null,"stem":"Which choice best states the main purpose of the text?","choices":["To show how close attention to an unexpected detail led to an important discovery","To argue that scientists should take more vacations","To explain in detail how penicillin kills bacteria","To compare Fleming's laboratory methods with those of other scientists who were studying bacteria at the time"],"correct":"A","domain":"CS","concept":"structure","difficulty":"hard","explanation":"The text emphasizes Fleming noticing a small, surprising detail (\"however, noticed\") and that this curiosity led to penicillin. The vacation is just background, and the text never explains how penicillin works. Fleming is contrasted only with a hypothetical \"less observant scientist,\" not compared with real scientists' methods."},{"id":"structure-9","passage":"<p>Some cities have begun painting rooftops white. Dark roofs absorb sunlight and heat the buildings beneath them, forcing air conditioners to work harder. White roofs reflect much of that sunlight away. A study in one city found that buildings with white roofs used up to 20 percent less energy for cooling on hot days.<\/p>","chart":null,"stem":"Which choice best describes the overall structure of the text?","choices":["It describes a problem caused by dark roofs and explains why cities have not yet found a solution.","It compares the costs and energy savings of several kinds of roofing materials used in cities.","It introduces a practice, explains the reasoning behind it, and reports evidence of its benefit.","It argues that all buildings should have dark roofs."],"correct":"C","domain":"CS","concept":"structure","difficulty":"medium","explanation":"Sentence 1 introduces white roofs, sentences 2–3 explain why they help, and sentence 4 gives study results. Costs are never compared, and the text favors white roofs, not dark ones. The text presents white roofs as a solution rather than saying none has been found."},{"id":"structure-10","passage":"<p class=\"intro\">The following text is from an original short story.<\/p>\n<p>Nadia had promised herself she wouldn't cry at the airport. She checked her passport twice, joked with her father about airplane food, and hugged her little brother quickly, as if it were an ordinary school morning. <u>Only when the security line turned the corner and her family disappeared from view did she let her hands stop being steady.<\/u><\/p>","chart":null,"stem":"Which choice best describes the function of the underlined sentence in the text as a whole?","choices":["It reveals that Nadia has forgotten her passport.","It shows that Nadia's calm behavior had been a deliberate effort to hide her emotions.","It suggests that Nadia is more excited about the trip than she had let her family see.","It explains why Nadia's family decided not to come to the airport."],"correct":"B","domain":"CS","concept":"structure","difficulty":"hard","explanation":"Nadia acted normal on purpose (she \"had promised herself\"), and the underlined sentence shows she lets her feelings out only once her family can't see. Her family did come, and she had her passport. The feeling she hid is sadness at leaving (she had promised not to cry), not excitement."},{"id":"crosstext-7","passage":"<p class=\"caption\">Text 1<\/p>\n<p>Many astronomers once assumed that planets orbiting other stars would resemble those in our solar system, with small rocky planets close to their star and large gas giants farther away.<\/p>\n<p class=\"caption\">Text 2<\/p>\n<p>Since the 1990s, astronomers have found thousands of planets around other stars. Among the first discovered were \"hot Jupiters,\" gas giants orbiting extremely close to their stars, far closer than Mercury is to the Sun. Many other systems, however, do have arrangements similar to our own.<\/p>","chart":null,"stem":"Based on the texts, how would the astronomers in Text 2 most likely respond to the assumption in Text 1?","choices":["By agreeing that it accurately describes every planetary system","By claiming that no other planetary system resembles our solar system, since gas giants in other systems orbit extremely close to their stars","By arguing that gas giants cannot exist close to their stars","By pointing out that discoveries show the assumption doesn't hold for all systems, even though some systems do fit it"],"correct":"D","domain":"CS","concept":"crosstext","difficulty":"hard","explanation":"Hot Jupiters break the assumed pattern, but Text 2 also says \"many other systems … do have arrangements similar to our own.\" So D is a partial disagreement. B ignores that last sentence, and C contradicts the hot Jupiters."},{"id":"crosstext-8","passage":"<p class=\"caption\">Text 1<\/p>\n<p>Linguist Ana Ruiz argues that texting has harmed young people's writing skills, pointing to the abbreviations and missing punctuation common in text messages.<\/p>\n<p class=\"caption\">Text 2<\/p>\n<p>Researcher David Kim compared students' text messages with essays they wrote for school. Although the students used many abbreviations when texting, those abbreviations almost never appeared in their essays. Kim concludes that students switch between casual and formal writing depending on the situation.<\/p>","chart":null,"stem":"Based on the texts, how would Kim (Text 2) most likely respond to Ruiz's argument (Text 1)?","choices":["He would argue that the habits she points to in text messages don't necessarily carry over into students' formal writing.","He would agree that students' school essays are full of abbreviations.","He would claim that students rarely send text messages.","He would argue that using abbreviations makes school essays stronger."],"correct":"A","domain":"CS","concept":"crosstext","difficulty":"hard","explanation":"Kim found that texting habits didn't show up in essays, which challenges Ruiz's evidence. B contradicts his finding, and he never says abbreviations improve essays."},{"id":"crosstext-9","passage":"<p class=\"caption\">Text 1<\/p>\n<p>Some city leaders argue that building more parking garages downtown is the best way to bring more shoppers to local businesses.<\/p>\n<p class=\"caption\">Text 2<\/p>\n<p>A study of downtown shopping districts found that shoppers who arrived on foot, by bike, or by bus visited stores more often each month and spent more in total than shoppers who drove, even though drivers spent more on each visit.<\/p>","chart":null,"stem":"Based on the texts, how would the author of Text 2 most likely respond to the city leaders in Text 1?","choices":["By agreeing that parking garages are the only way to help local businesses","By suggesting that focusing only on drivers may overlook shoppers who contribute more to local businesses over time","By claiming that drivers spend less on each visit than shoppers who arrive on foot, by bike, or by bus","By arguing that businesses should move out of downtown areas"],"correct":"B","domain":"CS","concept":"crosstext","difficulty":"medium","explanation":"The study shows non-drivers spend more in total, so focusing only on parking might miss valuable shoppers. C contradicts the text (\"drivers spent more on each visit\")."},{"id":"crosstext-10","passage":"<p class=\"caption\">Text 1<\/p>\n<p>Many nutrition guides once told people to avoid eggs because eggs contain cholesterol, which was thought to raise the level of cholesterol in the blood.<\/p>\n<p class=\"caption\">Text 2<\/p>\n<p>More recent studies have found that for most healthy people, the cholesterol in food has only a small effect on blood cholesterol. Researchers note, however, that a minority of people are especially sensitive to cholesterol in their diet.<\/p>","chart":null,"stem":"Based on the texts, how would the researchers in Text 2 most likely respond to the advice in Text 1?","choices":["By agreeing that everyone should avoid eggs completely","By arguing that eggs contain no cholesterol","By saying the advice was likely too broad for most people, though it might still matter for some","By claiming that blood cholesterol has nothing to do with health for most people, regardless of what they eat"],"correct":"C","domain":"CS","concept":"crosstext","difficulty":"hard","explanation":"Text 2 says dietary cholesterol has a small effect for MOST people but notes some people are sensitive, so the advice was too broad but not entirely wrong. B and D make claims Text 2 never makes."},{"id":"central-7","passage":"<p class=\"intro\">The following text is from an original novel.<\/p>\n<p>When the letter from the music conservatory finally arrived, Lin didn't open it. She set it on the piano, where it leaned against the music stand all afternoon while she practiced the same difficult passage again and again. She told herself she was waiting until she got the passage right. But each time her fingers stumbled, her eyes drifted to the envelope.<\/p>","chart":null,"stem":"Which choice best states the main idea of the text?","choices":["Lin delays learning a result she cares about, and her nervousness shows even as she tries to focus on practicing.","Lin has decided not to attend the conservatory.","Lin has already learned that she was accepted to the conservatory and is now practicing for her first lesson there.","Lin is frustrated because the piano is out of tune."],"correct":"A","domain":"II","concept":"central","difficulty":"hard","explanation":"She avoids opening the letter, but \"each time her fingers stumbled, her eyes drifted to the envelope,\" showing the letter is on her mind. She hasn't opened it, so she can't know the result (C)."},{"id":"central-8","passage":"<p>Spider silk is one of the toughest materials known: pound for pound, some kinds can absorb more energy before breaking than steel. Scientists would like to produce it in large quantities for uses such as medical stitches and lightweight protective gear. Spiders, however, are difficult to farm, because many species are territorial and will eat one another. Researchers are therefore trying to produce silk proteins using bacteria, yeast, and even silkworms instead.<\/p>","chart":null,"stem":"Which choice best states the main idea of the text?","choices":["Spiders are more dangerous to people than most people think.","Steel is no longer used in protective gear.","Because spider silk is valuable but spiders are hard to farm, scientists are looking for other ways to produce it.","Silkworms produce stronger silk than spiders do."],"correct":"C","domain":"II","concept":"central","difficulty":"medium","explanation":"The text moves from why silk is valuable, to the problem with farming spiders, to the solution researchers are trying. C covers all of it. A, B, and D aren't supported."},{"id":"detail-7","passage":"<p>The Dead Sea, which lies between Jordan and Israel, is so salty that fish and most plants cannot survive in it. The water's high salt content also makes it unusually dense, so swimmers float on its surface with almost no effort.<\/p>","chart":null,"stem":"According to the text, why do swimmers float easily in the Dead Sea?","choices":["The water is unusually warm.","The salty water is very dense.","There are no fish to disturb them.","The sea is very shallow."],"correct":"B","domain":"II","concept":"detail","difficulty":"medium","explanation":"The text says the salt makes the water \"unusually dense, so swimmers float.\" The lack of fish is a separate detail, not the reason for floating."},{"id":"detail-8","passage":"<p class=\"intro\">The following text is from an original short story.<\/p>\n<p>Grandpa Ike kept a small notebook in his coat pocket at all times. He didn't write appointments or grocery lists in it. Instead, whenever he heard a word he didn't know (on the radio, at the hardware store, in a conversation overheard at the bus stop), he wrote it down, and that evening he would look it up in the enormous dictionary on his kitchen table.<\/p>","chart":null,"stem":"According to the text, what does Grandpa Ike use his notebook for?","choices":["Keeping track of his appointments","Writing grocery lists","Recording the names of radio programs and songs he hears and enjoys","Writing down unfamiliar words so he can look them up later"],"correct":"D","domain":"II","concept":"detail","difficulty":"hard","explanation":"The text says he wrote down words he didn't know and looked them up each evening. A and B are exactly what the text says he did NOT use it for."},{"id":"coe-text-7","passage":"<p>Psychologist Dana Levi claims that people remember information better after explaining it to someone else than after only reading it.<\/p>","chart":null,"stem":"Which finding, if true, would most directly support Levi's claim?","choices":["Participants who explained a passage to a partner after reading it recalled more of it a week later than participants who spent the same time rereading it.","Participants who explained a passage to a partner reported that explaining was tiring.","Participants recalled more of a passage the day after reading it than a week after reading it.","Participants who read a passage twice recalled more of it a week later than participants who read it only once, regardless of how carefully they had read it."],"correct":"A","domain":"II","concept":"coe-text","difficulty":"hard","explanation":"The claim compares explaining with only reading, and A tests exactly that with equal time. D compares two kinds of reading and never involves explaining."},{"id":"coe-text-8","passage":"<p>Economist Raj Patel hypothesizes that a town's new farmers market drew customers away from the town's grocery stores.<\/p>","chart":null,"stem":"Which finding, if true, would most directly weaken Patel's hypothesis?","choices":["Grocery store sales fell after the farmers market opened.","Grocery store sales stayed about the same after the market opened, even though the market attracted many shoppers.","The farmers market sells mostly fruits and vegetables.","Many shoppers said they enjoyed visiting the new farmers market more than shopping at the town's grocery stores."],"correct":"B","domain":"II","concept":"coe-text","difficulty":"hard","explanation":"If the market drew customers away, grocery sales should drop. B shows they didn't, despite the market being busy, which weakens the hypothesis. A would support it. D describes shoppers' preferences, which wouldn't weaken the hypothesis."},{"id":"coe-text-9","passage":"<p>In the original novel <em>Harbor Lights<\/em>, the narrator describes Captain Mendes as both strict and caring toward his crew.<\/p>","chart":null,"stem":"Which quotation from the novel most effectively illustrates the claim?","choices":["\"The captain ate alone in his cabin each night, the door shut tight, and the crew learned not to knock for any reason.\"","\"Captain Mendes had sailed these waters for thirty years.\"","\"He punished every sailor who arrived late to watch, yet he never ate his own supper before making sure each man had been fed.\"","\"The crew whispered that the captain had once been a pirate, and none of them dared to ask him whether the rumor was true.\""],"correct":"C","domain":"II","concept":"coe-text","difficulty":"medium","explanation":"The claim needs BOTH traits. Punishing lateness shows strictness, and feeding his crew before himself shows care. A and D suggest a distant or feared captain but show no care for the crew, and B shows neither trait."},{"id":"coe-text-10","passage":"<p>Historian Grace Owusu argues that a 1962 newspaper editorial changed public opinion about a proposed dam in her state.<\/p>","chart":null,"stem":"Which finding, if true, would most directly support Owusu's argument?","choices":["The editorial was written by a well-known journalist.","The dam was eventually built several years later.","Many newspapers in the state published editorials on a wide range of topics that year, and the proposed dam was among the most frequently discussed issues in the state.","Surveys taken just before and after the editorial appeared showed support for the dam dropping from 60 percent to 35 percent, with no other major dam news in between."],"correct":"D","domain":"II","concept":"coe-text","difficulty":"hard","explanation":"To show the editorial CHANGED opinion, you need a before-and-after shift with no other likely cause. D provides both. A says who wrote it but not what effect it had. C shows the dam was widely discussed but not that the editorial changed anyone's mind."},{"id":"coe-text-11","passage":"<p>In the original poem \"Morning Bus,\" the speaker expresses a feeling of loneliness despite being surrounded by people.<\/p>","chart":null,"stem":"Which quotation from the poem most effectively illustrates the claim?","choices":["\"Forty strangers breathing in a row, / and not one voice that knows my name.\"","\"The driver hums an old familiar tune / and taps the wheel at every yellow light.\"","\"Rain streaks the window like a pencil sketch / of trees I've passed a hundred times before.\"","\"We rumble past the bakery and the school, / the same two corners every single day.\""],"correct":"A","domain":"II","concept":"coe-text","difficulty":"medium","explanation":"\"Forty strangers\" shows a crowd, and \"not one voice that knows my name\" shows loneliness, so both parts of the claim are covered. The other lines describe the ride without loneliness."},{"id":"coe-text-12","passage":"<p>Botanist Kwame Asante hypothesizes that a certain climbing vine grows toward nearby trees because it detects the shade the trees cast, not because it detects the trees' scent.<\/p>","chart":null,"stem":"Which finding, if true, would most directly support Asante's hypothesis?","choices":["The vine grows faster in sunny areas than in shady ones.","The vine grows toward trees that have a strong scent.","In a greenhouse, the vine grew toward a dark screen that blocked light but had no scent, and it did not grow toward an unshaded container of crushed tree leaves.","The vine is commonly found in forests with many trees."],"correct":"C","domain":"II","concept":"coe-text","difficulty":"hard","explanation":"The hypothesis says shade matters and scent doesn't. C separates the two: the vine followed shade with no scent and ignored scent with no shade. B points toward scent, the opposite."},{"id":"coe-text-13","passage":"<p>In an original essay, the author argues that boredom can be valuable because it pushes people to invent their own activities.<\/p>","chart":null,"stem":"Which quotation from the essay most effectively supports the author's argument?","choices":["\"Most people dislike waiting in long lines at the grocery store.\"","\"On the rainy afternoon when the power went out, my sister and I, with nothing to watch or play, invented a kingdom out of couch cushions and cardboard.\"","\"Boredom is one of the most common complaints among teenagers during summer vacation, when many of them spend long, empty afternoons at home with very little else to do.\"","\"Some studies suggest that people check their phones dozens of times each day.\""],"correct":"B","domain":"II","concept":"coe-text","difficulty":"medium","explanation":"B shows boredom (\"nothing to watch or play\") leading to invention (a cushion kingdom), which is exactly the argument. C mentions boredom but not any benefit."},{"id":"coe-quant-7","passage":"<p class=\"caption\">Average Number of Birds Counted per Hour at Three Feeders<\/p>\n<table class=\"data\"><thead><tr><th>Feeder type<\/th><th>Before squirrel guard<\/th><th>After squirrel guard<\/th><\/tr><\/thead><tbody><tr><td>Tube<\/td><td>14<\/td><td>22<\/td><\/tr><tr><td>Platform<\/td><td>18<\/td><td>19<\/td><\/tr><tr><td>Hopper<\/td><td>11<\/td><td>20<\/td><\/tr><\/tbody><\/table>\n<p>A student hypothesizes that adding a squirrel guard increases bird visits more for tube and hopper feeders than for platform feeders.<\/p>","chart":null,"stem":"Which choice best describes data from the table that support the student's hypothesis?","choices":["Bird counts rose by 8 per hour at the tube feeder and 9 at the hopper feeder but by only 1 at the platform feeder.","The platform feeder had the most birds per hour before the guard was added.","All three feeders had more birds per hour after the guard was added, with the hopper feeder rising from 11 birds per hour to 20 birds per hour.","The hopper feeder had 20 birds per hour after the guard was added."],"correct":"A","domain":"II","concept":"coe-quant","difficulty":"hard","explanation":"The hypothesis compares the SIZE of the increases, so you must calculate each change: tube +8, hopper +9, platform +1. C is true but doesn't compare the increases."},{"id":"coe-quant-8","passage":"<p>The theater's manager claims that the average ticket price in 2024 was more than 50 percent higher than it was in 2016.<\/p>","chart":{"type":"line","title":"Average Ticket Price at Starlight Cinema","yLabel":"Price (dollars)","labels":["2016","2018","2020","2022","2024"],"values":[9,10,8,11,12]},"stem":"Which choice best describes data from the graph that weaken the manager's claim?","choices":["The average price rose from $11 in 2022 to $12 in 2024, its highest level in the period shown.","The average price dropped between 2018 and 2020.","The highest average price shown was in 2024.","The average price rose from $9 in 2016 to $12 in 2024, an increase of only about 33 percent."],"correct":"D","domain":"II","concept":"coe-quant","difficulty":"hard","explanation":"A 50 percent increase from $9 would be $13.50, but the 2024 price was $12, about 33 percent higher. Only D compares 2016 with 2024, which is what the claim is about. A covers only 2022 to 2024, not the 2016 starting point the claim depends on."},{"id":"coe-quant-9","passage":"<p class=\"caption\">Volunteers at Riverside Cleanup Events<\/p>\n<table class=\"data\"><thead><tr><th>Month<\/th><th>Adults<\/th><th>Teens<\/th><\/tr><\/thead><tbody><tr><td>April<\/td><td>40<\/td><td>12<\/td><\/tr><tr><td>June<\/td><td>35<\/td><td>30<\/td><\/tr><tr><td>August<\/td><td>38<\/td><td>45<\/td><\/tr><\/tbody><\/table>\n<p>The organizers noticed that teen participation grew much faster than adult participation over the spring and summer. <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most effectively uses data from the table to complete the statement?","choices":["For example, 40 adults volunteered in April and 38 volunteered in August, so adult participation barely changed over the same months.","For example, teen volunteers rose from 12 in April to 45 in August, while adult volunteers stayed between 35 and 40.","For example, 30 teens volunteered in June.","For example, more adults than teens volunteered in April."],"correct":"B","domain":"II","concept":"coe-quant","difficulty":"medium","explanation":"The statement compares how much each group CHANGED. B shows teens rising sharply while adults stayed about the same. A describes only the adults, so it can't show that teens grew faster, and C and D give single numbers with no comparison over time."},{"id":"coe-quant-10","passage":"<p>A researcher claims that the share of students who read for fun drops most sharply between grade 6 and grade 8.<\/p>","chart":{"type":"bar","title":"Students Who Read for Fun at Least Once a Week","yLabel":"Percent of students","labels":["Grade 4","Grade 6","Grade 8","Grade 10"],"values":[72,58,41,33]},"stem":"Which choice best describes data from the graph that support the researcher's claim?","choices":["Grade 4 had the highest percentage, at 72 percent.","Fewer than half of grade 10 students read for fun at least once a week.","The percentage fell by 17 points from grade 6 to grade 8, more than the 14-point drop from grade 4 to grade 6 or the 8-point drop from grade 8 to grade 10.","The percentage fell from 72 percent in grade 4 to 33 percent in grade 10."],"correct":"C","domain":"II","concept":"coe-quant","difficulty":"hard","explanation":"\"Most sharply\" means you must compare every drop: 14, then 17, then 8 points. C shows that the grade 6 to 8 drop is the biggest. D shows the overall decline but not where it was steepest."},{"id":"inference-7","passage":"<p>Biologists had measured the lizards on a small Caribbean island just before a powerful hurricane struck. When they measured the surviving lizards after the storm, they found that the survivors had, on average, larger toe pads and shorter back legs than the lizards measured before. Because these lizards cling to branches during high winds, this finding suggests that <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most logically completes the text?","choices":["the hurricane caused the lizards' legs to shrink.","lizards with larger toe pads and shorter back legs may have been better able to hold on during the storm.","long-legged lizards had left the island before the storm arrived, so only lizards with shorter back legs were left to be measured afterward.","lizards on other islands have longer back legs."],"correct":"B","domain":"II","concept":"inference","difficulty":"hard","explanation":"The survivors differed from the earlier group, and the lizards survive by clinging, so the traits likely helped them hold on. A confuses survival with change (a storm doesn't shrink legs), and C and D bring in information the text doesn't give."},{"id":"inference-8","passage":"<p>Pumpkin farmers in one region noticed that their harvests were smaller in years when fewer bees were seen in their fields. Pumpkin flowers must be visited by insects that carry pollen from male flowers to female flowers before fruit can develop. This suggests that <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most logically completes the text?","choices":["the smaller harvests may have resulted partly from fewer flowers being pollinated.","pumpkins grow larger when no insects visit them.","bees prefer pumpkin flowers to all other flowers.","weather has no effect on pumpkin harvests."],"correct":"A","domain":"II","concept":"inference","difficulty":"medium","explanation":"Fruit needs insect pollination, and fewer bees appeared in poor years, so fewer pollinated flowers is a logical explanation. \"Partly\" keeps the claim modest. D overreaches; the text never rules out weather."},{"id":"inference-9","passage":"<p>Historians studying a 1700s merchant's account books found that his purchases of sugar and tea for his own household increased sharply in 1765. That same year, his records show that he began selling fabric to customers in three new towns and that his total income nearly doubled. Based on these records, it is most reasonable to conclude that <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most logically completes the text?","choices":["sugar and tea became much cheaper in 1765.","the merchant stopped selling fabric after 1765.","the merchant's customers in the new towns mainly bought tea.","the merchant's higher income may have allowed him to buy more sugar and tea."],"correct":"D","domain":"II","concept":"inference","difficulty":"hard","explanation":"His income nearly doubled in the same year his household bought more sugar and tea, so the extra money is a reasonable explanation. Prices (A) are never mentioned, and the new customers bought fabric, not tea (C)."},{"id":"inference-10","passage":"<p>In an experiment, researchers gave two groups of children the same puzzle. Afterward, children in the first group were praised for being smart, while children in the second group were praised for working hard. When later offered a choice between an easy puzzle and a challenging one, most children in the second group chose the challenging puzzle, while most in the first group chose the easy one. This suggests that <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most logically completes the text?","choices":["the children in the first group were smarter than those in the second group.","all children prefer easy puzzles.","the kind of praise children receive may influence their willingness to take on challenges.","praise has no effect on the choices children make."],"correct":"C","domain":"II","concept":"inference","difficulty":"hard","explanation":"The only difference between the groups was the type of praise, and the groups chose differently, so the praise likely mattered. B is disproved by the second group, and D is the opposite of the result."},{"id":"boundaries-7","passage":"<p>The first successful vaccine was developed by English doctor Edward Jenner in <span class=\"blank\" aria-label=\"blank\">______<\/span> it protected people against smallpox.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["1796;","1796,","1796","1796, and,"],"correct":"A","domain":"SEC","concept":"boundaries","difficulty":"medium","explanation":"Both sides are independent clauses, so a semicolon joins them. B is a comma splice, C is a run-on, and D adds an extra comma after \"and.\""},{"id":"sva-7","passage":"<p>Neither the coach nor the players <span class=\"blank\" aria-label=\"blank\">______<\/span> expecting the storm to arrive so quickly.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["was","is","has been","were"],"correct":"D","domain":"SEC","concept":"sva","difficulty":"medium","explanation":"With \"neither … nor\" (and \"either … or\"), the verb agrees with the subject closer to it. Here that's \"the players,\" which is plural, so use \"were.\""},{"id":"colon-7","passage":"<p>The lighthouse keeper's log described the terrible storm in a single <span class=\"blank\" aria-label=\"blank\">______<\/span> \"Waves over the gallery, glass cracked, light still burning.\"<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["sentence;","sentence, and","sentence:","sentence"],"correct":"C","domain":"SEC","concept":"colon","difficulty":"medium","explanation":"The first part is a complete sentence, and the quotation that follows is the \"single sentence\" it mentions. A colon introduces it. A semicolon (A) would need a complete clause after it."},{"id":"modifier-7","passage":"<p>High in California's White Mountains, bristlecone pines grow slowly in thin, rocky soil, adding only a sliver of wood each year. Having survived for more than 4,000 years, <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["the bristlecone pine known as Methuselah is among the oldest known living trees.","scientists consider the bristlecone pine known as Methuselah to be among the oldest known living trees.","the age of the bristlecone pine known as Methuselah makes it among the oldest living trees.","among the oldest known living trees is the bristlecone pine known as Methuselah."],"correct":"A","domain":"SEC","concept":"modifier","difficulty":"medium","explanation":"\"Having survived for more than 4,000 years\" describes the tree, so the tree must come right after the comma. B puts scientists there (they haven't survived 4,000 years), C puts \"the age,\" and D begins with \"among the oldest,\" not the tree."},{"id":"pronoun-7","passage":"<p>Although the two toy companies merged in 2019, each still sells produc
