function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function uid(){ return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pct(a,b){ return b ? Math.round(100*a/b) : 0; }
function flat(sess){ return sess.modules.reduce(function(a,m){ return a.concat(m); }, []); }
function LET(i){ return 'ABCD'[i]; }

/* ---------- history / stats ---------- */
function seenInfo(){
  var info = {};
  Object.keys(S.sessions).forEach(function(sid){
    var s = S.sessions[sid];
    flat(s).forEach(function(id){
      var r = info[id] || (info[id] = {n:0, last:0});
      r.n++; r.last = Math.max(r.last, s.createdAt || 0);
    });
  });
  return info;
}
function finishedSessions(){
  return S.archiveIds.map(function(id){ return S.sessions[id]; }).sort(function(a,b){ return a.finishedAt - b.finishedAt; });
}
function conceptStats(){
  var st = {};
  CONCEPTS.forEach(function(c){ st[c.id] = {seen:0, correct:0, unsure:0, hist:[], lastSeen:0, lastPracticed:0}; });
  finishedSessions().forEach(function(s){
    flat(s).forEach(function(id){
      var q = Q[id]; if (!q) return; var r = st[q.concept];
      var ok = s.answers[id] === q.correct, un = !!s.unsure[id];
      r.seen++; if (ok) r.correct++; if (un) r.unsure++;
      r.hist.push(ok && !un ? 1 : 0);
      r.lastSeen = Math.max(r.lastSeen, s.finishedAt);
      if (s.kind === 'practice') r.lastPracticed = Math.max(r.lastPracticed, s.finishedAt);
    });
  });
  CONCEPTS.forEach(function(c){
    var r = st[c.id], recent = r.hist.slice(-6);
    r.recentRate = recent.length ? recent.reduce(function(a,b){return a+b;},0)/recent.length : 0;
    r.recentMiss = recent.indexOf(0) >= 0;
    if (!r.seen) r.status = 'new';
    else if (r.hist.length >= 5 && r.hist.slice(-5).every(function(x){return x===1;})) r.status = 'mastered';
    else if (r.recentRate < 0.6) r.status = 'weak';
    else r.status = 'improving';
    r.archived = !!S.conceptArchived[c.id];
    r.needs = !r.archived && (r.status === 'weak' || (r.status === 'improving' && r.recentMiss));
  });
  return st;
}
var STATUS_LABEL = {weak:'Weak', improving:'Improving', mastered:'Mastered', 'new':'Not tried yet'};
function weakConcepts(st){
  st = st || conceptStats();
  return CONCEPTS.filter(function(c){ return st[c.id].needs; })
    .sort(function(a,b){ return st[a.id].recentRate - st[b.id].recentRate; })
    .map(function(c){ return c.id; });
}
function sessionResults(s){
  var res = {total:0, correct:0, unsure:0, modules:[], byDomain:{}, byConcept:{}, review:[]};
  s.modules.forEach(function(m, mi){
    var mr = {total:m.length, correct:0};
    m.forEach(function(id, qi){
      var q = Q[id]; if (!q) return;
      var ans = s.answers[id], ok = ans === q.correct, un = !!s.unsure[id];
      res.total++; if (ok) { res.correct++; mr.correct++; } if (un) res.unsure++;
      var d = res.byDomain[q.domain] || (res.byDomain[q.domain] = {total:0, correct:0});
      d.total++; if (ok) d.correct++;
      var c = res.byConcept[q.concept] || (res.byConcept[q.concept] = {total:0, correct:0, unsure:0});
      c.total++; if (ok) c.correct++; if (un) c.unsure++;
      if (!ok || un) res.review.push({id:id, mod:mi, num:qi+1, ok:ok, un:un, ans:ans || null});
    });
    res.modules.push(mr);
  });
  res.weakConcepts = [];
  res.review.forEach(function(r){ var c = Q[r.id].concept; if (res.weakConcepts.indexOf(c) < 0) res.weakConcepts.push(c); });
  return res;
}

/* ---------- building sessions ---------- */
function pickForConcept(cid, n, exclude, info, prefDiff){
  var pool = DATA.bank.filter(function(q){ return q.concept === cid && !exclude[q.id]; });
  pool = shuffle(pool);
  pool.sort(function(a,b){
    var sa = info[a.id] ? info[a.id].n : 0, sb = info[b.id] ? info[b.id].n : 0;
    if ((sa>0) !== (sb>0)) return sa>0 ? 1 : -1;
    if (prefDiff){ var da = a.difficulty===prefDiff?0:1, db = b.difficulty===prefDiff?0:1; if (da!==db) return da-db; }
    if (sa !== sb) return sa - sb;
    var la = info[a.id] ? info[a.id].last : 0, lb = info[b.id] ? info[b.id].last : 0;
    return la - lb;
  });
  var out = pool.slice(0, n);
  if (out.length < n) { // bank exhausted for this test: fall back to original questions of the concept
    var extra = shuffle(DATA.test.filter(function(q){ return q.concept === cid && !exclude[q.id]; }));
    out = out.concat(extra.slice(0, n - out.length));
  }
  return out.map(function(q){ return q.id; });
}
function newSession(kind, title, modules, extra){
  var s = {id:uid(), kind:kind, title:title, createdAt:now(), finishedAt:null, modules:modules,
           timed: kind === 'test', timeLeft: modules.map(function(){ return MODULE_SECONDS; }), timerHidden:false,
           mod:0, idx:0, stage:'q', answers:{}, marked:{}, unsure:{}};
  if (extra) for (var k in extra) s[k] = extra[k];
  S.sessions[s.id] = s; S.openIds.push(s.id); save();
  return s;
}
function startOriginal(){
  var s = newSession('test', 'Original Practice Test', ORIGINAL_MODULES.map(function(m){return m.slice();}), {source:'original'});
  go('run', s.id);
}
function generateTest(){
  var info = seenInfo(), exclude = {}, repeats = 0;
  var modules = BLUEPRINT.map(function(bp, mi){
    var ids = [];
    bp.forEach(function(slot){
      var got = pickForConcept(slot[0], slot[1], exclude, info, mi === 0 ? 'medium' : 'hard');
      got.forEach(function(id){ exclude[id] = 1; if (info[id]) repeats++; ids.push(id); });
    });
    return ids;
  });
  S.counters.test = (S.counters.test || 0) + 1;
  var s = newSession('test', 'Generated Test #' + S.counters.test, modules, {source:'generated', repeats:repeats});
  if (repeats) {
    modal('Heads up', '<p>This test has <b>' + repeats + '</b> question' + (repeats===1?'':'s') + ' you have seen before, because the question bank ran out of new questions for some skills. Everything else is new.</p>', [{label:'OK', primary:true}]);
  }
  go('run', s.id);
}
function startPractice(conceptIds, label){
  conceptIds = conceptIds.slice(0, MAX_PRACTICE_CONCEPTS);
  if (!conceptIds.length) return;
  var info = seenInfo(), exclude = {}, ids = [];
  conceptIds.forEach(function(cid){
    pickForConcept(cid, PER_CONCEPT, exclude, info, null).forEach(function(id){ exclude[id] = 1; ids.push(id); });
  });
  S.counters.practice = (S.counters.practice || 0) + 1;
  var s = newSession('practice', 'Practice Set #' + S.counters.practice + (label ? ' (' + label + ')' : ''), [ids], {source:'practice', targets:conceptIds});
  go('run', s.id);
}
function finishSession(s){
  s.finishedAt = now(); s.stage = 'done';
  S.openIds = S.openIds.filter(function(id){ return id !== s.id; });
  if (S.archiveIds.indexOf(s.id) < 0) S.archiveIds.push(s.id);
  save();
  go('results', s.id);
}

/* ---------- navigation ---------- */
var app = document.getElementById('app');
var view = {page:'home', sid:null, filter:'all'};
function go(page, sid){
  view = {page:page, sid:sid || null, filter:'all'};
  S.ui = {page:page, sid:sid || null}; save();
  render(); window.scrollTo(0,0);
}

/* ---------- modal ---------- */
var modalRoot = document.getElementById('modal-root');
var modalHandlers = [];
function modal(title, bodyHtml, buttons){
  modalHandlers = buttons || [{label:'OK', primary:true}];
  modalRoot.innerHTML = '<div class="mback" role="dialog" aria-modal="true"><div class="mbox"><h3>' + esc(title) + '</h3><div>' + bodyHtml +
    '</div><div class="mbtns">' + modalHandlers.map(function(b, i){
      return '<button class="btn ' + (b.primary?'primary ':'') + (b.danger?'danger':'') + '" data-mbtn="' + i + '">' + esc(b.label) + '</button>'; }).join('') + '</div></div></div>';
}

/* ---------- charts ---------- */
function niceMax(v){ var p = Math.pow(10, Math.floor(Math.log10(v))); var m = v/p; var n = m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10; return n*p; }
function chartSVG(ch){
  var W=560,H=320,L=62,R=16,T=40,B=50, pw=W-L-R, ph=H-T-B;
  var max = niceMax(Math.max.apply(null, ch.values) * 1.12), n = ch.values.length;
  var o = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(ch.title)+'">';
  o += '<text x="'+(W/2)+'" y="20" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">'+esc(ch.title)+'</text>';
  for (var i=0;i<=5;i++){ var v = max*i/5, y = T+ph-ph*i/5;
    o += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#e3e6eb"/>';
    o += '<text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="#5b6470">'+(Math.round(v*10)/10)+'</text>'; }
  o += '<line x1="'+L+'" x2="'+L+'" y1="'+T+'" y2="'+(T+ph)+'" stroke="#5b6470"/><line x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+ph)+'" y2="'+(T+ph)+'" stroke="#5b6470"/>';
  o += '<text transform="translate(16,'+(T+ph/2)+') rotate(-90)" text-anchor="middle" font-size="12" fill="#5b6470">'+esc(ch.yLabel||'')+'</text>';
  var step = pw/n, pts = [];
  ch.values.forEach(function(v, i){
    var cx = L + step*i + step/2, y = T + ph - ph*v/max;
    o += '<text x="'+cx+'" y="'+(T+ph+20)+'" text-anchor="middle" font-size="13" fill="#1f2328">'+esc(ch.labels[i])+'</text>';
    if (ch.type === 'bar'){
      var bw = Math.min(56, step*0.6);
      o += '<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+(T+ph-y)+'" fill="#4f7be8"/>';
    }
    o += '<text x="'+cx+'" y="'+(y-8)+'" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">'+v+'</text>';
    pts.push([cx,y]);
  });
  if (ch.type === 'line'){
    o += '<polyline fill="none" stroke="#1d4ed8" stroke-width="2.5" points="'+pts.map(function(p){return p.join(',');}).join(' ')+'"/>';
    pts.forEach(function(p){ o += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4.5" fill="#1d4ed8"/>'; });
  }
  return o + '</svg>';
}
function passageHTML(q){ return (q.chart ? '<div class="chart">'+chartSVG(q.chart)+'</div>' : '') + q.passage; }

      '<p><b>'+answered+'</b> of '+mod.length+' answered · <b>'+(mod.length-answered)+'</b> unanswered · <b>'+marked+'</b> 🔖 marked for review · <b>'+uns+'</b> 🤔 unsure</p>' +

/* ---------- results / review ---------- */
function fromSessionConcepts(s){

    var x = r.byConcept[a], y = r.byConcept[b];

}
function renderResults(){

  h += '</div>';
  // domain table

  h += '</tbody></table></div></div>';

  CONCEPTS.filter(function(c){ return r.byConcept[c.id]; }).sort(function(a,b){ var x=r.byConcept[a.id], y=r.byConcept[b.id]; return (x.correct/x.total)-(y.correct/y.total); }).forEach(function(c){

function statusBadge(o){ return o.archived ? '<span class="badge b-archived">Archived</span>' : '<span class="badge b-'+o.status+'">'+STATUS_LABEL[o.status]+'</span>'; }
function reviewSection(s, r){
  var wrong = r.review.filter(function(x){ return !x.ok; }), cu = r.review.filter(function(x){ return x.ok && x.un; });

}
function reviewCard(s, x){
  var q = Q[x.id], c = CMAP[q.concept], isTest = s.kind === 'test';

  if (!x.ok && x.un) status += ' <span class="badge b-unsure">🤔 Also flagged unsure</span>';

  var h = '<div class="rv"><div class="rv-h"><b>'+label+'</b>'+status+'<span class="badge b-new" style="margin-left:auto">'+esc(c.name)+'</span></div><div class="rv-b">';

  h += '<div class="stem">'+q.stem+'</div>';
  q.choices.forEach(function(ch, i){ var L = LET(i), isC = L === q.correct, isP = L === x.ans;
    h += '<div class="rchoice'+(isC?' correct':'')+(isP&&!isC?' picked':'')+'"><span class="L">'+L+')</span><span>'+ch+'</span>'+(isC?'<span class="tag" style="color:var(--ok)">✓ Correct answer</span>':'')+(isP&&!isC?'<span class="tag" style="color:var(--bad)">✗ Your answer</span>':'')+(isP&&isC?'<span class="tag" style="color:var(--ok)">(your answer)</span>':'')+'</div>'; });
  h += '<div class="yours"><div><b>Your answer:</b> '+(x.ans ? x.ans+') '+q.choices['ABCD'.indexOf(x.ans)] : '<i>No answer</i>')+'</div><div><b>Correct answer:</b> '+q.correct+') '+q.choices['ABCD'.indexOf(q.correct)]+'</div></div>';

  h += '<div class="lesson"><b>Concept: '+esc(c.name)+'</b> <span class="small muted">('+DOMAINS[c.domain]+')</span><br>'+esc(c.lesson)+'</div>';
  return h + '</div></div>';
}

    '<p class="small muted"><b>Weak</b>: under 60% solid in your last 6 tries. <b>Mastered</b>: your last 5 tries were all solid. <b>Improving</b>: in between, or too few tries so far to call it mastered. Archive a mastered skill to hide it from practice (it still appears on full tests); restore it any time.</p>' +
    (weak.length ? '<button class="btn primary" data-act="practice-weak">Practice my weak concepts ('+Math.min(weak.length,MAX_PRACTICE_CONCEPTS)+' skill'+(weak.length>1?'s':'')+')</button>' : '') + '</div>';
  function table(list, archivedSection){
    var t = '<div class="tscroll"><table class="t" style="table-layout:fixed;min-width:760px"><colgroup><col style="width:26%"><col style="width:13%"><col style="width:7%"><col style="width:10%"><col style="width:8%"><col style="width:11%"><col style="width:11%"><col style="width:14%"></colgroup><thead><tr><th>Skill</th><th>Status</th><th>Seen</th><th>% correct</th><th>Unsure</th><th>Last seen</th><th>Last practiced</th><th></th></tr></thead><tbody>';
    list.forEach(function(c){ var o = st[c.id];
      t += '<tr><td><b>'+esc(c.name)+'</b><div class="small muted">'+DOMAINS[c.domain]+'</div></td><td>'+statusBadge(o)+'</td><td>'+o.seen+'</td><td>'+(o.seen?pct(o.correct,o.seen)+'%':'—')+'</td><td>'+o.unsure+'</td><td class="small">'+fmtDay(o.lastSeen)+'</td><td class="small">'+fmtDay(o.lastPracticed)+'</td><td><div class="row" style="flex-wrap:nowrap">' +
        '<button class="btn small" data-act="practice-one" data-c="'+c.id+'">Practice</button>' +
        (archivedSection ? '<button class="btn small" data-act="restore" data-c="'+c.id+'">Restore</button>' : (o.status==='mastered' ? '<button class="btn small" data-act="archive-c" data-c="'+c.id+'">Archive</button>' : '')) + '</div></td></tr>'; });
    return t + '</tbody></table></div>';
  }
  DOMAIN_ORDER.forEach(function(d){
    var list = CONCEPTS.filter(function(c){ return c.domain === d && !st[c.id].archived; });
    if (list.length) h += '<div class="card"><h3>'+DOMAINS[d]+'</h3>' + table(list, false) + '</div>';
  });
  var arch = CONCEPTS.filter(function(c){ return st[c.id].archived; });
  if (arch.length) h += '<div class="card"><h3>Archived skills (hidden from practice)</h3>' + table(arch, true) + '</div>';
  app.innerHTML = h + '</div>';
}

/* ---------- archive ---------- */
function renderArchive(){
  var ids = S.archiveIds.slice().sort(function(a,b){ return S.sessions[b].finishedAt - S.sessions[a].finishedAt; });
  var h = nav() + '<div class="wrap">' + storageWarning() + '<div class="card"><h2>Past tests &amp; practice sets</h2>';
  if (!ids.length) h += '<p class="muted">Nothing here yet. Finished tests and practice sets are saved here automatically with your answers, scores, and explanations.</p>';
  else {
    h += '<div class="tscroll"><table class="t"><thead><tr><th>Date</th><th>Name</th><th>Score</th><th>Missed</th><th>Unsure</th><th></th></tr></thead><tbody>';
    ids.forEach(function(id){ var s = S.sessions[id], r = sessionResults(s);
      h += '<tr><td class="small">'+fmtDate(s.finishedAt)+'</td><td><b>'+esc(s.title)+'</b><div class="small muted">'+(s.kind==='test'?'Full test':'Practice')+'</div></td><td><b>'+r.correct+'/'+r.total+'</b><div class="small muted">'+(s.kind==='test'?r.modules.map(function(m,i){return 'M'+(i+1)+' '+m.correct+'/'+m.total;}).join(' · '):pct(r.correct,r.total)+'%')+'</div></td><td>'+(r.total-r.correct)+'</td><td>'+r.unsure+'</td><td><div class="row" style="flex-wrap:nowrap"><button class="btn small primary" data-act="open" data-sid="'+id+'">Open</button><button class="btn small danger" data-act="del" data-sid="'+id+'">Delete</button></div></td></tr>'; });
    h += '</tbody></table></div>';
  }
  app.innerHTML = h + '</div></div>';
}

/* ---------- backup ---------- */
function exportText(){ return JSON.stringify({app:'dsat-rw-simulator', kind:'backup', exportedAt:new Date().toISOString(), state:S}); }
function renderBackup(){
  var h = nav() + '<div class="wrap">' + storageWarning() + '<div class="card"><h2>Back up your progress</h2>' +
    '<p>Your tests, practice sets, and concept history live in this browser\'s storage on this device. If that storage gets cleared (or you switch devices), restore everything from a backup file.</p>' +
    '<p class="small muted">Last backup: '+(S.lastExport?fmtDate(S.lastExport):'never')+' · '+S.archiveIds.length+' finished, '+S.openIds.length+' in progress.</p>' +
    '<div class="row"><button class="btn primary" data-act="export">⬇️ Download backup file</button><button class="btn" data-act="export-text">Show backup as text (copy/paste)</button></div>' +
    '<p class="small muted">On iPad, the file goes to your Downloads folder in the Files app. Keep it somewhere safe, like iCloud Drive or Google Drive.</p></div>' +
    '<div class="card"><h2>Restore from a backup</h2><p class="small muted"><b>Merge</b> adds anything from the backup that isn\'t already here (nothing is deleted). <b>Replace</b> wipes this device\'s progress and uses only the backup.</p>' +
    '<p><input type="file" id="impfile" accept=".json,application/json,text/plain"></p>' +
    '<p class="small muted">…or paste backup text:</p><textarea class="bk" id="imptext" placeholder="Paste backup text here"></textarea>' +
    '<div class="row" style="margin-top:10px"><button class="btn primary" data-act="import" data-mode="merge">Merge backup</button><button class="btn danger" data-act="import" data-mode="replace">Replace with backup</button></div></div>' +
    '<div class="card"><h2>Start completely over</h2><p class="small muted">Erases every test, practice set, and all concept history on this device. Download a backup first if you might want it later.</p><button class="btn danger" data-act="wipe">Erase all progress</button></div></div>';
  app.innerHTML = h;
}
function doExport(){
  var txt = exportText();
  try {
    var blob = new Blob([txt], {type:'application/json'});
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    var d = new Date(), stamp = d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    a.href = url; a.download = 'sat-rw-progress-' + stamp + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    S.lastExport = now(); save();
    modal('Backup created', '<p>If no file appeared (some viewer apps block downloads), use <b>Show backup as text</b> instead and paste it into a note or email to yourself.</p>', [{label:'OK', primary:true, onClick:render}]);
  } catch(e){ showExportText(); }
}
function showExportText(){
  modal('Backup text', '<p class="small">Select all of this text and copy it into a note, document, or email to yourself. To restore, paste it on the Backup page.</p><textarea class="bk" id="exptext" readonly>'+esc(exportText())+'</textarea>',
    [{label:'Copy', primary:true, onClick:function(){ var t = exportText(); if (navigator.clipboard) navigator.clipboard.writeText(t).catch(function(){}); S.lastExport = now(); save(); render(); }}, {label:'Close'}]);
  var ta = document.getElementById('exptext'); if (ta) { ta.focus(); ta.select(); }
}
function parseBackup(txt){
  var o = JSON.parse(txt);
  var st = o && o.state ? o.state : o;
  if (!st || typeof st !== 'object' || !st.sessions || !Array.isArray(st.archiveIds)) throw new Error('This does not look like a simulator backup file.');
  Object.keys(st.sessions).forEach(function(id){ var s = st.sessions[id];
    if (!s || !Array.isArray(s.modules) || typeof s.answers !== 'object') throw new Error('Backup file is damaged (session ' + id + ').'); });
  return st;
}
function doImport(mode){
  var f = document.getElementById('impfile'), t = document.getElementById('imptext');
  function apply(txt){
    var st;
    try { st = parseBackup(txt); } catch(e){ modal('Could not restore', '<p>'+esc(e.message || 'Unreadable file.')+'</p>'); return; }
    var go2 = function(){
      if (mode === 'replace'){ S = st; normalize(); }
      else {
        var added = 0;
        Object.keys(st.sessions).forEach(function(id){ if (!S.sessions[id]) { S.sessions[id] = st.sessions[id]; added++;
          if (st.sessions[id].finishedAt) S.archiveIds.push(id); else S.openIds.push(id); } });
        Object.keys(st.conceptArchived || {}).forEach(function(c){ if (st.conceptArchived[c]) S.conceptArchived[c] = true; });
        S.counters.test = Math.max(S.counters.test||0, (st.counters||{}).test||0);
        S.counters.practice = Math.max(S.counters.practice||0, (st.counters||{}).practice||0);
        normalize();
      }
      save();
      modal('Restored', '<p>Your progress was '+(mode==='replace'?'replaced with':'merged from')+' the backup. You now have '+S.archiveIds.length+' finished tests/sets.</p>', [{label:'OK', primary:true, onClick:function(){ go('home'); }}]);
    };
    if (mode === 'replace') confirmBox('Replace everything?', '<p>This erases the progress currently on this device and uses only the backup.</p>', 'Replace', go2, true); else go2();
  }
  if (f && f.files && f.files[0]){ var rd = new FileReader(); rd.onload = function(){ apply(String(rd.result)); }; rd.readAsText(f.files[0]); }
  else if (t && t.value.trim()) apply(t.value.trim());
  else modal('Nothing to restore', '<p>Choose a backup file or paste backup text first.</p>');
}

/* ---------- render ---------- */
function render(){
  var p = view.page;
  if (p === 'run') renderRun();
  else if (p === 'results') renderResults();
  else if (p === 'tracker') renderTracker();
  else if (p === 'archive') renderArchive();
  else if (p === 'backup') renderBackup();
  else renderHome();
}

/* ---------- actions ---------- */
function choose(L){
  var s = curSession(), id = s.modules[s.mod][s.idx];
  if (s.answers[id] === L) delete s.answers[id]; else s.answers[id] = L;
  save(); render();
}
function move(d){
  var s = curSession(), n = s.modules[s.mod].length;
  if (s.stage === 'check'){ if (d < 0){ s.stage = 'q'; s.idx = n-1; } }
  else if (d > 0){ if (s.idx < n-1) s.idx++; else s.stage = 'check'; }
  else if (s.idx > 0) s.idx--;
  save(); render();
  var rb = document.getElementById('rbody'); if (rb) rb.scrollTop = 0;
  var panes = document.querySelectorAll('.pane'); for (var i=0;i<panes.length;i++) panes[i].scrollTop = 0;
}
var ACTIONS = {
  nav: function(el){ go(el.getAttribute('data-page')); },
  resume: function(el){ go('run', el.getAttribute('data-sid')); },
  open: function(el){ go('results', el.getAttribute('data-sid')); },
  discard: function(el){ var id = el.getAttribute('data-sid'), s = S.sessions[id];
    confirmBox('Discard this '+(s.kind==='test'?'test':'practice set')+'?', '<p>Your answers in <b>'+esc(s.title)+'</b> will be erased. ' + (s.source==='original' ? 'You can start the original test again from the beginning.' : 'Its questions stay marked as seen.') + '</p>', 'Discard', function(){
      S.openIds = S.openIds.filter(function(x){ return x !== id; }); delete S.sessions[id]; save(); render(); }, true); },
  del: function(el){ var id = el.getAttribute('data-sid'), s = S.sessions[id];
    confirmBox('Delete from history?', '<p><b>'+esc(s.title)+'</b> ('+fmtDate(s.finishedAt)+') will be removed from Past Tests and from your concept history. This can\'t be undone unless you have a backup.</p>', 'Delete', function(){
      S.archiveIds = S.archiveIds.filter(function(x){ return x !== id; }); delete S.sessions[id]; save(); render(); }, true); },
  'start-orig': function(){ startOriginal(); },
  'gen-test': function(){ generateTest(); },
  'practice-weak': function(){ startPractice(weakConcepts(), 'weak concepts'); },
  'practice-from': function(el){ var s = S.sessions[el.getAttribute('data-sid')]; startPractice(fromSessionConcepts(s), 'from ' + s.title); },
  'practice-one': function(el){ var c = el.getAttribute('data-c'); startPractice([c], CMAP[c].name); },
  'archive-c': function(el){ S.conceptArchived[el.getAttribute('data-c')] = true; save(); render(); },
  restore: function(el){ delete S.conceptArchived[el.getAttribute('data-c')]; save(); render(); },
  choose: function(el){ choose(el.getAttribute('data-l')); },
  mark: function(){ var s = curSession(), id = s.modules[s.mod][s.idx]; if (s.marked[id]) delete s.marked[id]; else s.marked[id] = true; save(); render(); },
  unsure: function(){ var s = curSession(), id = s.modules[s.mod][s.idx]; if (s.unsure[id]) delete s.unsure[id]; else s.unsure[id] = true; save(); render(); },
  next: function(){ move(1); },
  back: function(){ move(-1); },
  grid: function(){ var s = curSession(); modal((s.kind==='test'?'Module '+(s.mod+1):'Practice')+' questions', gridHTML(s, true) + legendHTML() + '<p style="margin-top:14px"><button class="btn" data-act="tocheck">Go to Review Page</button></p>', [{label:'Close'}]); },
  timer: function(){ var s = curSession(); s.timerHidden = !s.timerHidden; save(); render(); },
  exit: function(){ save(); go('home'); },
  submit: function(){ var s = curSession(), mod = s.modules[s.mod], un = mod.filter(function(id){ return !s.answers[id]; }).length;
    var what = s.kind==='test' ? 'Module '+(s.mod+1) : 'this practice set';
    confirmBox('Submit '+what+'?', (un ? '<p><b>'+un+'</b> question'+(un>1?'s are':' is')+' unanswered. There\'s no penalty for guessing, so it\'s smart to answer every question.</p>' : '<p>All questions answered.</p>') + (s.kind==='test'&&s.mod===0 ? '<p>You won\'t be able to return to Module 1.</p>' : ''), 'Submit', submitModule); },
  'start-m2': function(){ var s = curSession(); s.mod = 1; s.idx = 0; s.stage = 'q'; save(); render(); },
  filter: function(el){ view.filter = el.getAttribute('data-f'); render(); var rv = document.getElementById('review'); if (rv && rv.scrollIntoView) rv.scrollIntoView(); },
  export: function(){ doExport(); },
  'export-text': function(){ showExportText(); },
  import: function(el){ doImport(el.getAttribute('data-mode')); },
  wipe: function(){ confirmBox('Erase all progress?', '<p>Every test, practice set, and all concept history on this device will be deleted.</p>', 'Erase everything', function(){ S = blankState(); save(); go('home'); }, true); }
};
app.addEventListener('click', function(e){
  var g = e.target.closest('[data-goto]');
  if (g && view.page === 'run') { var gs = curSession(); gs.idx = +g.getAttribute('data-goto'); gs.stage = 'q'; save(); render(); return; }
  var el = e.target.closest('[data-act]'); if (!el) return;
  var fn = ACTIONS[el.getAttribute('data-act')]; if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener('keydown', function(e){
  if (modalOpen() || view.page !== 'run') return;
  var t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var s = curSession(); if (!s || s.stage !== 'q') return;
  var k = e.key.toUpperCase();
  if ('ABCD'.indexOf(k) >= 0 && k.length === 1) { choose(k); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { move(1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { move(-1); e.preventDefault(); }
});

/* ---------- timer ---------- */
var lastTick = now(), saveCounter = 0;
function tick(){
  var t = now(), dt = Math.min(t - lastTick, 2000) / 1000; lastTick = t;
  if (view.page !== 'run' || document.hidden) return;
  var s = curSession(); if (!s || !s.timed || s.finishedAt || (s.stage !== 'q' && s.stage !== 'check')) return;
  var before = s.timeLeft[s.mod];
  s.timeLeft[s.mod] = Math.max(0, before - dt);
  var left = s.timeLeft[s.mod];
  var clock = document.getElementById('clock');
  if (clock) clock.textContent = fmtClock(left);
  if (before > 300 && left <= 300) { render(); if (!modalOpen()) modal('5 minutes left', '<p>Make sure every question has an answer. Guessing is better than leaving one blank.</p>'); }
  if (++saveCounter % 5 === 0) save();
  if (left <= 0 && before > 0){
    save();
    modal('Time\'s up', '<p>Module '+(s.mod+1)+' has ended, and your answers have been submitted.</p>', [{label:'Continue', primary:true}]);
    submitModule();
  }
}
setInterval(tick, 1000);
document.addEventListener('visibilitychange', function(){ lastTick = now(); if (document.hidden) save(); });
window.addEventListener('pagehide', save);

/* ---------- boot ---------- */
load();
if (S.ui && S.ui.page === 'run' && S.sessions[S.ui.sid] && !S.sessions[S.ui.sid].finishedAt) view = {page:'run', sid:S.ui.sid, filter:'all'};
else if (S.ui && S.ui.page === 'results' && S.sessions[S.ui.sid]) view = {page:'results', sid:S.ui.sid, filter:'all'};
else if (S.ui && ['tracker','archive','backup'].indexOf(S.ui.page) >= 0) view = {page:S.ui.page, sid:null, filter:'all'};
render();
window.__SAT = {state:function(){ return S; }, Q:Q, DATA:DATA, conceptStats:conceptStats, sessionResults:sessionResults, weakConcepts:weakConcepts, view:function(){ return view; }};
})();

</script>
</body>
</html>
