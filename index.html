,"section":"math","concept":"lin-eq1","domain":"ALG","difficulty":"medium","stem":"A plumber charges a $65 service fee plus $48 per hour of work. One bill came to $281. For how many hours of work was the customer billed?","explanation":"Solve \\(65 + 48h = 281\\): \\(48h = 216\\), so \\(h = 4.5\\) hours.","format":"spr","answers":["4.5","9/2"]},{"id":"m-le1-08","section":"math","concept":"lin-eq1","domain":"ALG","difficulty":"easy","stem":"If \\(7 + 2x = 19\\), what is the value of \\(4x\\)?","explanation":"\\(2x = 12\\), so \\(4x = 2(2x) = 24\\). Choice A is the value of \\(x\\), not \\(4x\\).","format":"mc","choices":["6","12","24","52"],"correct":"C"},{"id":"m-le1-09","section":"math","concept":"lin-eq1","domain":"ALG","difficulty":"medium","stem":"What value of \\(x\\) is the solution to the equation \\(\\frac{2}{3}(x - 4) = \\frac{1}{2}x + 1\\)?","explanation":"Multiply every term by 6 to clear fractions: \\(4(x - 4) = 3x + 6\\). Then \\(4x - 16 = 3x + 6\\), so \\(x = 22\\).","format":"spr","answers":["22"]},{"id":"m-le1-10","section":"math","concept":"lin-eq1","domain":"ALG","difficulty":"easy","stem":"A school buys \\(x\\) boxes of markers for $12 each and pays a $15 delivery fee. The total cost is $171. Which equation represents this situation?","explanation":"The boxes cost \\(12x\\) dollars, and the one-time fee adds 15, so \\(12x + 15 = 171\\). Choice C would charge the fee 12 times.","format":"mc","choices":["\\(12x + 15 = 171\\)","\\(15x + 12 = 171\\)","\\(12(x + 15) = 171\\)","\\(27x = 171\\)"],"correct":"A"},{"id":"m-le1-11","section":"math","concept":"lin-eq1","domain":"ALG","difficulty":"hard","stem":"The equation \\(\\frac{3x + 6}{4} = \\frac{x - 2}{2} + k\\), where \\(k\\) is a constant, has the solution \\(x = 10\\). What is the value of \\(k\\)?","explanation":"Substitute \\(x = 10\\): the left side is \\(\\frac{36}{4} = 9\\) and \\(\\frac{x - 2}{2} = 4\\). So \\(9 = 4 + k\\) and \\(k = 5\\).","format":"mc","choices":["3","5","7","9"],"correct":"B"},{"id":"m-le1-12","section":"math","concept":"lin-eq1","domain":"ALG","difficulty":"easy","stem":"If \\(\\frac{2x}{5} = 8\\), what is the value of \\(x\\)?","explanation":"Multiply both sides by 5 to get \\(2x = 40\\), then divide by 2: \\(x = 20\\).","format":"mc","choices":["4","16","20","40"],"correct":"C"},{"id":"m-le1-13","section":"math","concept":"lin-eq1","domain":"ALG","difficulty":"medium","stem":"What is the solution to the equation \\(0.4(x + 15) = 0.25x + 9\\)?","explanation":"Distribute: \\(0.4x + 6 = 0.25x + 9\\). Subtract: \\(0.15x = 3\\), so \\(x = \\frac{3}{0.15} = 20\\).","format":"mc","choices":["12","15","20","24"],"correct":"C"},{"id":"m-le1-14","section":"math","concept":"lin-eq1","domain":"ALG","difficulty":"hard","stem":"In the equation \\((k - 2)x + 12 = 4x + 2k\\), \\(k\\) is a constant. If the equation has infinitely many solutions, what is the value of \\(k\\)?","explanation":"For infinitely many solutions, the \\(x\\)-coefficients must match, \\(k - 2 = 4\\), so \\(k = 6\\), and the constants must match too: \\(12 = 2(6)\\). Both hold, so \\(k = 6\\).","format":"spr","answers":["6"]},{"id":"m-le1-15","section":"math","concept":"lin-eq1","domain":"ALG","difficulty":"medium","stem":"If \\(4x - 9 = 3\\), what is the value of \\(8x - 9\\)?","explanation":"\\(4x = 12\\), so \\(8x = 24\\) and \\(8x - 9 = 15\\). Choice D is \\(8x\\) before subtracting 9.","format":"mc","choices":["3","6","15","24"],"correct":"C"},{"id":"m-lf-01","section":"math","concept":"lin-fn","domain":"ALG","difficulty":"easy","stem":"The function \\(f\\) is defined by \\(f(x) = 3x - 5\\). What is the value of \\(f(4)\\)?","explanation":"\\(f(4) = 3(4) - 5 = 12 - 5 = 7\\).","format":"mc","choices":["−7","2","7","17"],"correct":"C"},{"id":"m-lf-02","section":"math","concept":"lin-fn","domain":"ALG","difficulty":"easy","stem":"The table shows four values of \\(x\\) and their corresponding values of \\(y\\). Which equation could represent the linear relationship between \\(x\\) and \\(y\\)?","explanation":"Each time \\(x\\) increases by 1, \\(y\\) increases by 3, so the slope is 3. When \\(x = 1\\), \\(y = 5\\), so \\(5 = 3(1) + b\\) and \\(b = 2\\): \\(y = 3x + 2\\).","fig":"<table class=\"data\"><thead><tr><th>\\(x\\)<\/th><th>\\(y\\)<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>5<\/td><\/tr><tr><td>2<\/td><td>8<\/td><\/tr><tr><td>3<\/td><td>11<\/td><\/tr><tr><td>4<\/td><td>14<\/td><\/tr><\/tbody><\/table>","format":"mc","choices":["\\(y = x + 4\\)","\\(y = 3x + 2\\)","\\(y = 5x\\)","\\(y = 2x + 3\\)"],"correct":"B"},{"id":"m-lf-03","section":"math","concept":"lin-fn","domain":"ALG","difficulty":"medium","stem":"The fare, in dollars, for a taxi ride of \\(m\\) miles is given by \\(f(m) = 2.5m + 3.75\\). What is the best interpretation of 2.5 in this context?","explanation":"In \\(f(m) = 2.5m + 3.75\\), 2.5 is the slope, the change in fare per mile. The 3.75 is the starting fee (the fare when \\(m = 0\\)). A 1-mile ride costs \\(2.5 + 3.75 = 6.25\\) dollars, not 2.50.","format":"mc","choices":["The fare increases by $2.50 for each additional mile.","The fare for a ride of 0 miles is $2.50.","The total fare for a 1-mile ride is $2.50.","The taxi travels 2.5 miles for each dollar of fare."],"correct":"A"},{"id":"m-lf-04","section":"math","concept":"lin-fn","domain":"ALG","difficulty":"medium","stem":"The graph of the linear function \\(f\\) passes through the points \\((2, 7)\\) and \\((6, 19)\\). What is the value of \\(f(0)\\)?","explanation":"The slope is \\(\\frac{19 - 7}{6 - 2} = 3\\). Going back 2 units in \\(x\\) from \\((2, 7)\\) lowers \\(y\\) by \\(2 \\cdot 3 = 6\\), so \\(f(0) = 1\\).","format":"mc","choices":["1","3","4","7"],"correct":"A"},{"id":"m-lf-05","section":"math","concept":"lin-fn","domain":"ALG","difficulty":"medium","stem":"The function \\(g\\) is defined by \\(g(x) = -4x + b\\), where \\(b\\) is a constant. If \\(g(3) = 10\\), what is the value of \\(g(-2)\\)?","explanation":"From \\(g(3) = -12 + b = 10\\), \\(b = 22\\). Then \\(g(-2) = -4(-2) + 22 = 8 + 22 = 30\\).","format":"spr","answers":["30"]},{"id":"m-lf-06","section":"math","concept":"lin-fn","domain":"ALG","difficulty":"hard","stem":"For the linear function \\(h\\), \\(h(5) = 3\\) and \\(h(9) = -5\\). What is the \\(x\\)-coordinate of the \\(x\\)-intercept of the graph of \\(y = h(x)\\)?","explanation":"The slope is \\(\\frac{-5 - 3}{9 - 5} = -2\\), so \\(h(x) = -2(x - 5) + 3 = -2x + 13\\). Setting \\(h(x) = 0\\) gives \\(x = \\frac{13}{2}\\).","format":"mc","choices":["3","6","\\(\\frac{13}{2}\\)","13"],"correct":"C"},{"id":"m-lf-07","section":"math","concept":"lin-fn","domain":"ALG","difficulty":"easy","stem":"The graph of the linear function \\(y = f(x)\\) is shown. What is the slope of the graph?","explanation":"The line passes through \\((0, 3)\\) and \\((6, 0)\\). Slope \\(= \\frac{0 - 3}{6 - 0} = -\\frac{1}{2}\\). The line falls from left to right, so the slope is negative.","fig":"<div class=\"mfigw\"><svg class=\"mfig\" viewBox=\"0 0 300 240\" width=\"300\" height=\"240\" role=\"img\" aria-label=\"Line through (0, 3) and (6, 0)\" font-family=\"-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif\"><line x1=\"26\" x2=\"26\" y1=\"214\" y2=\"26\" stroke=\"#e1e5ea\"/><line x1=\"50.8\" x2=\"50.8\" y1=\"214\" y2=\"26\" stroke=\"#e1e5ea\"/><line x1=\"75.6\" x2=\"75.6\" y1=\"214\" y2=\"26\" stroke=\"#e1e5ea\"/><line x1=\"100.4\" x2=\"100.4\" y1=\"214\" y2=\"26\" stroke=\"#e1e5ea\"/><line x1=\"125.2\" x2=\"125.2\" y1=\"214\" y2=\"26\" stroke=\"#e1e5ea\"/><line x1=\"150\" x2=\"150\" y1=\"214\" y2=\"26\" stroke=\"#e1e5ea\"/><line x1=\"174.8\" x2=\"174.8\" y1=\"214\" y2=\"26\" stroke=\"#e1e5ea\"/><line x1=\"199.6\" x2=\"199.6\" y1=\"214\" y2=\"26\" stroke=\"#e1e5ea\"/><line x1=\"224.4\" x2=\"224.4\" y1=\"214\" y2=\"26\" stroke=\"#e1e5ea\"/><line x1=\"249.2\" x2=\"249.2\" y1=\"214\" y2=\"26\" stroke=\"#e1e5ea\"/><line x1=\"274\" x2=\"274\" y1=\"214\" y2=\"26\" stroke=\"#e1e5ea\"/><line x1=\"26\" x2=\"274\" y1  and a \\(y\\)-intercept of \\((0, -3)\\). Which equation defines line \\(\\ell\\)?","explanation":"Slope-intercept form is \\(y = mx + b\\) with slope \\(m = 4\\) and \\(y\\)-intercept \\(b = -3\\): \\(y = 4x - 3\\).","format":"mc","choices":["\\(y = 4x - 3\\)","\\(y = -3x + 4\\)","\\(y = 4x + 3\\)","\\(y = -4x - 3\\)"],"correct":"A"},{"id":"m-lf-12","section":"math","concept":"lin-fn","domain":"ALG","difficulty":"hard","stem":"The function \\(f\\) is defined by \\(f(x) = ax + b\\), where \\(a\\) and \\(b\\) are constants. If \\(f(2) - f(-3) = 20\\) and \\(f(0) = 7\\), what is the value of \\(f(1)\\)?","explanation":"\\(f(2) - f(-3) = (2a + b) - (-3a + b) = 5a = 20\\), so \\(a = 4\\). Since \\(f(0) = b = 7\\), \\(f(1) = 4 + 7 = 11\\).","format":"spr","answers":["11"]},{"id":"m-lf-13","section":"math","concept":"lin-fn","domain":"ALG","difficulty":"medium","stem":"A line in the \\(xy\\)-plane passes through the point \\((-2, 5)\\) and has a slope of \\(-\\frac{3}{2}\\). Which of the following points also lies on the line?","explanation":"The line is \\(y = 5 - \\frac{3}{2}(x + 2)\\). At \\(x = 2\\): \\(y = 5 - \\frac{3}{2}(4) = -1\\), so \\((2, -1)\\) is on the line. At \\(x = 0\\) the line gives 2 (not 3), at \\(x = 4\\) it gives \\(-4\\), and at \\(x = -4\\) it gives 8.","format":"mc","choices":["\\((0, 3)\\)","\\((4, -3)\\)","\\((-4, 2)\\)","\\((2, -1)\\)"],"correct":"D"},{"id":"m-lf-14","section":"math","concept":"lin-fn","domain":"ALG","difficulty":"medium","stem":"A tank contains 500 liters of water and is drained at a constant rate. After 12 minutes, the tank contains 380 liters. How many minutes after draining begins will the tank be empty?","explanation":"The tank loses \\(500 - 380 = 120\\) liters in 12 minutes, which is 10 liters per minute. Emptying 500 liters takes \\(500 \\div 10 = 50\\) minutes.","format":"mc","choices":["38","40","50","62"],"correct":"C"},{"id":"m-le2-01","section":"math","concept":"lin-eq2","domain":"ALG","difficulty":"easy","stem":"Which point \\((x, y)\\) is a solution to the equation \\(3x + 2y = 12\\)?","explanation":"Test each point: \\(3(2) + 2(3) = 6 + 6 = 12\\). The others give 13, 14, and 11.","format":"mc","choices":["\\((2, 3)\\)","\\((3, 2)\\)","\\((4, 1)\\)","\\((1, 4)\\)"],"correct":"A"},{"id":"m-le2-02","section":"math","concept":"lin-eq2","domain":"ALG","difficulty":"easy","stem":"What is the \\(y\\)-intercept of the graph of \\(4x + 5y = 40\\) in the \\(xy\\)-plane?","explanation":"The \\(y\\)-intercept is where \\(x = 0\\): \\(5y = 40\\), so \\(y = 8\\). Choice C is the \\(x\\)-intercept.","format":"mc","choices":["\\((0, 10)\\)","\\((8, 0)\\)","\\((10, 0)\\)","\\((0, 8)\\)"],"correct":"D"},{"id":"m-le2-03","section":"math","concept":"lin-eq2","domain":"ALG","difficulty":"medium","stem":"A store sells notebooks for $3.00 each and pens for $1.50 each. Maria spent exactly $24.00 on \\(n\\) notebooks and \\(p\\) pens. Which equation represents this situation?","explanation":"Notebooks cost \\(3n\\) dollars and pens cost \\(1.5p\\) dollars; together they total 24: \\(3n + 1.5p = 24\\).","format":"mc","choices":["\\(1.5n + 3p = 24\\)","\\(4.5(n + p) = 24\\)","\\(3n = 1.5p + 24\\)","\\(3n + 1.5p = 24\\)"],"correct":"D"},{"id":"m-le2-04","section":"math","concept":"lin-eq2","domain":"ALG","difficulty":"medium","stem":"What is the slope of the line with equation \\(6x - 3y = 9\\) in the \\(xy\\)-plane?","explanation":"Solve for \\(y\\): \\(-3y = -6x + 9\\), so \\(y = 2x - 3\\). The slope is 2.","format":"mc","choices":["−2","\\(\\frac{1}{2}\\)","2","3"],"correct":"C"},{"id":"m-le2-05","section":"math","concept":"lin-eq2","domain":"ALG","difficulty":"medium","stem":"Line \\(k\\) is perpendicular to the line with equation \\(2x + 5y = 10\\). What is the slope of line \\(k\\)?","explanation":"Solving for \\(y\\) gives \\(y = -\\frac{2}{5}x + 2\\), with slope \\(-\\frac{2}{5}\\). A perpendicular slope is the negative reciprocal: \\(\\frac{5}{2}\\).","format":"mc","choices":["\\(-\\frac{5}{2}\\)","\\(-\\frac{2}{5}\\)","\\(\\frac{2}{5}\\)","\\(\\frac{5}{2}\\)"],"correct":"D"},{"id":"m-le2-06","section":"math","concept":"lin-eq2","domain":"ALG","difficulty":"hard","stem":"Line \\(p\\) passes through the point \\((1, 4)\\) and is parallel to the line \\(3x - 4y = 7\\). Which equation defines line \\(p\\)?","explanation":"The given line is \\(y = \\frac{3}{4}x - \\frac{7}{4}\\), so line \\(p\\) also has slope \\(\\frac{3}{4}\\). Using \\((1, 4)\\): \\(4 = \\frac{3}{4} + b\\), so \\(b = \\frac{13}{4}\\).","format":"mc","choices":["\\(y = \\frac{3}{4}x + 4\\)","\\(y = -\\frac{4}{3}x + \\frac{16}{3}\\)","\\(y = \\frac{4}{3}x + \\frac{8}{3}\\)","\\(y = \\frac{3}{4}x + \\frac{13}{4}\\)"],"correct":"D"},{"id":"m-le2-07","section":"math","concept":"lin-eq2","domain":"ALG","difficulty":"easy","stem":"The point \\((a, 6)\\) lies on the line \\(y = -2x + 10\\). What is the value of \\(a\\)?","explanation":"Substitute \\(y = 6\\): \\(6 = -2a + 10\\), so \\(-2a = -4\\) and \\(a = 2\\).","format":"mc","choices":["−2","2","4","8"],"correct":"B"},{"id":"m-le2-08","section":"math","concept":"lin-eq2","domain":"ALG","difficulty":"medium","stem":"The graph of \\(\\frac{x}{3} + \\frac{y}{5} = 1\\) in the \\(xy\\)-plane has an \\(x\\)-intercept at \\((a, 0)\\) and a \\(y\\)-intercept at \\((0, b)\\). What is the value of \\(a + b\\)?","explanation":"Setting \\(y = 0\\) gives \\(\\frac{x}{3} = 1\\), so \\(a = 3\\). Setting \\(x = 0\\) gives \\(b = 5\\). So \\(a + b = 8\\).","format":"spr","answers":["8"]},{"id":"m-le2-09","section":"math","concept":"lin-eq2","domain":"ALG","difficulty":"medium","stem":"The graph of a line in the \\(xy\\)-plane is shown. Which equation defines the line?","explanation":"The line passes through \\((0, -2)\\) and \\((4, 4)\\), so its slope is \\(\\frac{6}{4} = \\frac{3}{2}\\) and \\(y = \\frac{3}{2}x - 2\\). Multiplying by 2 and rearranging: \\(3x - 2y = 4\\).","fig":"<div class=\"mfigw\"><svg class=\"mfig\" viewBox=\"0 0 300 333\" width=\"300\ ?","explanation":"5 extra pounds of beef cost \\(7 \\cdot 5 = 35\\) more dollars. To keep the total the same, chicken must cost $35 less: \\(35 \\div 4 = 8.75\\) fewer pounds.","format":"mc","choices":["It must decrease by 5 pounds.","It must increase by 8.75 pounds.","It must decrease by 7 pounds.","It must decrease by 8.75 pounds."],"correct":"D"},{"id":"m-le2-11","section":"math","concept":"lin-eq2","domain":"ALG","difficulty":"easy","stem":"If \\(2x + y = 14\\) and \\(x = 5\\), what is the value of \\(y\\)?","explanation":"Substitute \\(x = 5\\): \\(10 + y = 14\\), so \\(y = 4\\).","format":"mc","choices":["4","5","9","14"],"correct":"A"},{"id":"m-le2-12","section":"math","concept":"lin-eq2","domain":"ALG","difficulty":"hard","stem":"The points \\((2, k)\\) and \\((k, 8)\\) lie on a line with a slope of 3. What is the value of \\(k\\)?","explanation":"Slope \\(= \\frac{8 - k}{k - 2} = 3\\). Then \\(8 - k = 3k - 6\\), so \\(4k = 14\\) and \\(k = 3.5\\).","format":"spr","answers":["3.5","7/2"]},{"id":"m-sys-01","section":"math","concept":"systems","domain":"ALG","difficulty":"easy","stem":"\\(x + y = 10\\)<br>\\(x - y = 4\\)<br>What is the value of \\(x\\) in the solution to the system of equations above?","explanation":"Add the equations: \\(2x = 14\\), so \\(x = 7\\). (Then \\(y = 3\\), choice A.)","format":"mc","choices":["3","6","7","10"],"correct":"C"},{"id":"m-sys-02","section":"math","concept":"systems","domain":"ALG","difficulty":"easy","stem":"\\(y = 2x\\)<br>\\(3x + y = 25\\)<br>What is the value of \\(x\\) in the solution to the system?","explanation":"Substitute \\(y = 2x\\): \\(3x + 2x = 25\\), so \\(5x = 25\\) and \\(x = 5\\).","format":"mc","choices":["5","10","12.5","25"],"correct":"A"},{"id":"m-sys-03","section":"math","concept":"systems","domain":"ALG","difficulty":"medium","stem":"\\(2x + 3y = 18\\)<br>\\(x - y = -1\\)<br>Which ordered pair \\((x, y)\\) is the solution to the system?","explanation":"From the second equation, \\(x = y - 1\\). Substitute: \\(2(y - 1) + 3y = 18\\), so \\(5y = 20\\), \\(y = 4\\), and \\(x = 3\\). Choice B satisfies the first equation but not the second.","format":"mc","choices":["\\((3, 4)\\)","\\((4, 3)\\)","\\((6, 2)\\)","\\((0, 6)\\)"],"correct":"A"},{"id":"m-sys-04","section":"math","concept":"systems","domain":"ALG","difficulty":"medium","stem":"A theater sells adult tickets for $12 and student tickets for $7. One night it sold 150 tickets for a total of $1,425. How many adult tickets were sold?","explanation":"Let \\(a + s = 150\\) and \\(12a + 7s = 1425\\). Substituting \\(s = 150 - a\\): \\(12a + 1050 - 7a = 1425\\), so \\(5a = 375\\) and \\(a = 75\\).","format":"spr","answers":["75"]},{"id":"m-sys-05","section":"math","concept":"systems","domain":"ALG","difficulty":"medium","stem":"\\(3x - 2y = 5\\)<br>\\(6x - 4y = 10\\)<br>How many solutions does the system of equations have?","explanation":"The second equation is exactly 2 times the first, so both describe the same line. Every point on that line is a solution: infinitely many.","format":"mc","choices":["Zero","Exactly one","Exactly two","Infinitely many"],"correct":"D"},{"id":"m-sys-06","section":"math","concept":"systems","domain":"ALG","difficulty":"hard","stem":"\\(kx + 3y = 9\\)<br>\\(4x + 6y = 5\\)<br>In the system of equations, \\(k\\) is a constant. For what value of \\(k\\) does the system have no solution?","explanation":"No solution means parallel lines: equal slopes, different intercepts. The slopes are \\(-\\frac{k}{3}\\) and \\(-\\frac{4}{6} = -\\frac{2}{3}\\), so \\(k = 2\\). Then the first equation becomes \\(4x + 6y = 18\\), which is parallel to \\(4x + 6y = 5\\).","format":"mc","choices":["2","3","4","6"],"correct":"A"},{"id":"m-sys-07","section":"math","concept":"systems","domain":"ALG","difficulty":"medium","stem":"\\(x + 2y = 11\\)<br>\\(3x + 2y = 21\\)<br>If \\((x, y)\\) is the solution to the system, what is the value of \\(x + y\\)?","explanation":"Subtract the first equation from the second: ones cost $13.50, and 2 muffins and 4 scones cost $15.00. What is the total cost of 1 muffin and 1 scone?","explanation":"Double the first equation: \\(6m + 4s = 27\\). Subtract \\(2m + 4s = 15\\): \\(4m = 12\\), so \\(m = 3\\). Then \\(2(3) + 4s = 15\\) gives \\(s = 2.25\\). Together: $5.25.","format":"mc","choices":["$4.50","$5.25","$5.75","$6.00"],"correct":"B"},{"id":"m-sys-11","section":"math","concept":"systems","domain":"ALG","difficulty":"medium","stem":"The length \\(\\ell\\) of a rectangle is 3 inches more than twice its width \\(w\\), and the perimeter of the rectangle is 54 inches. Which system of equations represents this situation?","explanation":"'3 more than twice the width' is \\(2w + 3\\), and perimeter is \\(2\\ell + 2w\\). (The rectangle is 19 by 8.) Choice C uses \\(\\ell + w\\), which is only half the perimeter.","format":"mc","choices":["\\(\\ell = 3w + 2\\)<br>\\(2\\ell + 2w = 54\\)","\\(\\ell = 2w + 3\\)<br>\\(2\\ell + 2w = 54\\)","\\(\\ell = 2w + 3\\)<br>\\(\\ell + w = 54\\)","\\(w = 2\\ell + 3\\)<br>\\(2\\ell + 2w = 54\\)"],"correct":"B"},{"id":"m-sys-12","section":"math","concept":"systems","domain":"ALG","difficulty":"hard","stem":"\\(3x + 4y = 2\\)<br>\\(5x - 2y = 12\\)<br>If \\((x, y)\\) is the solution to the system, what is the value of \\(x - y\\)?","explanation":"Multiply the second equation by 2 (\\(10x - 4y = 24\\)) and add it to the first: \\(13x = 26\\), so \\(x = 2\\). Then \\(6 + 4y = 2\\) gives \\(y = -1\\), and \\(x - y = 3\\).","format":"spr","answers":["3"]},{"id":"m-sys-13","section":"math","concept":"systems","domain":"ALG","difficulty":"easy","stem":"\\(4x - y = 9\\)<br>\\(2x + y = 9\\)<br>If \\((x, y)\\) satisfies the system, what is the value of \\(3x\\)?","explanation":"Adding the equations eliminates \\(y\\): \\(6x = 18\\), so \\(x = 3\\) and \\(3x = 9\\).","format":"mc","choices":["3","6","9","18"],"correct":"C"},{"id":"m-sys-14","section":"math","concept":"systems","domain":"ALG","difficulty":"hard","stem":"\\(ax + by = 12\\)<br>\\(2x + 3y = 4\\)<br>In the system, \\(a\\) and \\(b\\) are constants. If the system has infinitely many solutions, what is the value of \\(a + b\\)?","explanation":"For infinitely many solutions the first equation must be a multiple of the second. Since \\(12 = 3 \\cdot 4\\), the multiple is 3: \\(a = 6\\) and \\(b = 9\\), so \\(a + b = 15\\).","format":"spr","answers":["15"]},{"id":"m-ineq-01","section":"math","concept":"lin-ineq","domain":"ALG","difficulty":"easy","stem":"Which value of \\(x\\) satisfies the inequality \\(3x - 4 > 11\\)?","explanation":"Add 4 and divide by 3: \\(x > 5\\). Only 6 is greater than 5. (\\(x = 5\\) gives \\(11 > 11\\), which is false.)","format":"mc","choices":["2","4","5","6"],"correct":"D"},{"id":"m-ineq-02","section":"math","concept":"lin-ineq","domain":"ALG","difficulty":"easy","stem":"A delivery van can carry at most 2,000 pounds. The driver weighs 180 pounds, and each box weighs 45 pounds. Which inequality represents the possible numbers of boxes \\(b\\) the van can carry with the driver?","explanation":"The total weight is the driver plus \\(45b\\) for the boxes, and 'at most' means \\(\\le\\): \\(180 + 45b \\le 2{,}000\\). (This allows up to 40 boxes.)","format":"mc","choices":["\\(180 + 45b \\ge 2{,}000\\)","\\(45 + 180b \\le 2{,}000\\)","\\(180b + 45 \\ge 2{,}000\\)","\\(180 + 45b \\le 2{,}000\\)"],"correct":"D"},{"id":"m-ineq-03","section":"math","concept":"lin-ineq","domain":"ALG","difficulty":"medium","stem":"What is the greatest integer value of \\(x\\) that satisfies \\(7 - 2x \\ge -8\\)?","explanation":"Subtract 7: \\(-2x \\ge -15\\). Dividing by \\(-2\\) flips the sign: \\(x \\le 7.5\\). The greatest integer is 7.","format":"spr","answers":["7"]},{"id":"m-ineq-04","section":"math","concept":"lin-ineq","domain":"ALG","difficulty":"medium","stem":"\\(y < 2x - 3\\)<br>\\(y \\ge -x + 1\\)<br>Which point \\((x, y)\\) is a solution to the system of inequalities?","explanation":"For \\((3, 1)\\): \\(1 < 3\\) ":"mc","choices":["4","5","6.5","20"],"correct":"B"},{"id":"m-ineq-08","section":"math","concept":"lin-ineq","domain":"ALG","difficulty":"medium","stem":"Which of the following is a possible value of \\(x\\) if \\(-3 < 2x + 1 < 9\\)?","explanation":"Subtract 1 from all parts, then divide by 2: \\(-2 < x < 4\\). The endpoints are not included, so only 3 works.","format":"mc","choices":["−3","−2","3","4"],"correct":"C"},{"id":"m-ineq-09","section":"math","concept":"lin-ineq","domain":"ALG","difficulty":"hard","stem":"In the inequality \\(kx + 4 > 2x - 1\\), \\(k\\) is a constant. For which value of \\(k\\) is the inequality true for every real number \\(x\\)?","explanation":"Rewrite as \\((k - 2)x > -5\\). If \\(k \\ne 2\\), some large positive or negative \\(x\\) makes it false. If \\(k = 2\\), it becomes \\(0 > -5\\), which is always true.","format":"mc","choices":["0","2","4","5"],"correct":"B"},{"id":"m-ineq-10","section":"math","concept":"lin-ineq","domain":"ALG","difficulty":"medium","stem":"Which of the following describes all solutions to \\(5 - 3x \\le x + 13\\)?","explanation":"Subtract \\(x\\) and 5 from both sides: \\(-4x \\le 8\\). Dividing by \\(-4\\) flips the inequality: \\(x \\ge -2\\).","format":"mc","choices":["\\(x \\le -2\\)","\\(x \\ge -2\\)","\\(x \\ge 2\\)","\\(x \\le 2\\)"],"correct":"B"},{"id":"m-ineq-11","section":"math","concept":"lin-ineq","domain":"ALG","difficulty":"hard","stem":"In the \\(xy\\)-plane, a region is defined by \\(y \\le 3x + 6\\) and \\(y \\le -x + 10\\). What is the greatest possible \\(y\\)-coordinate of a point in this region?","explanation":"The region lies below both lines, so its highest point is where they meet: \\(3x + 6 = -x + 10\\) gives \\(x = 1\\) and \\(y = 9\\). Anywhere else, at least one line is lower.","format":"spr","answers":["9"]},{"id":"m-ineq-12","section":"math","concept":"lin-ineq","domain":"ALG","difficulty":"medium","stem":"A phone plan costs $25 per month plus $0.10 per text message. What is the greatest number of text messages a customer can send in a month and keep the monthly bill under $40?","explanation":"\\(25 + 0.10t < 40\\) gives \\(0.10t < 15\\), so \\(t < 150\\). The bill must be under $40, so 150 texts (exactly $40) is too many; the most is 149.","format":"spr","answers":["149"]},{"id":"m-eqv-01","section":"math","concept":"equiv","domain":"ADV","difficulty":"easy","stem":"Which expression is equivalent to \\(3(x + 4) - 2x\\)?","explanation":"Distribute: \\(3x + 12 - 2x = x + 12\\). Choice A forgets to multiply the 4 by 3.","format":"mc","choices":["\\(x + 4\\)","\\(5x + 12\\)","\\(x + 7\\)","\\(x + 12\\)"],"correct":"D"},{"id":"m-eqv-02","section":"math","concept":"equiv","domain":"ADV","difficulty":"easy","stem":"Which expression is equivalent to \\((2x^2 + 5x) - (x^2 - 3x)\\)?","explanation":"Subtracting \\(-3x\\) adds \\(3x\\): \\(2x^2 - x^2 + 5x + 3x = x^2 + 8x\\). Choice A forgets to distribute the negative sign.","format":"mc","choices":["\\(x^2 + 2x\\)","\\(x^2 + 8x\\)","\\(3x^2 + 2x\\)","\\(x^2 - 8x\\)"],"correct":"B"},{"id":"m-eqv-03","section":"math","concept":"equiv","domain":"ADV","difficulty":"medium","stem":"Which expression is equivalent to \\((x + 5)(x - 3)\\)?","explanation":"Multiply each term: \\(x^2 - 3x + 5x - 15 = x^2 + 2x - 15\\).","format":"mc","choices":["\\(x^2 - 15\\)","\\(x^2 - 2x - 15\\)","\\(x^2 + 8x - 15\\)","\\(x^2 + 2x - 15\\)"],"correct":"D"},{"id":"m-eqv-04","section":"math","concept":"equiv","domain":"ADV","difficulty":"easy","stem":"Which expression is equivalent to \\(x^2 - 49\\)?","explanation":"This is a difference of squares: \\(a^2 - b^2 = (a - b)(a + b)\\) with \\(a = x\\) and \\(b = 7\\).","format":"mc","choices":["\\((x - 7)^2\\)","\\((x - 7)(x + 7)\\)","\\((x - 49)(x + 1)\\)","\\((x + 7)^2\\)"],"correct":"B"},{"id":"m-eqv-05","section":"math","concept":"equiv","domain":"ADV","difficulty":"medium","stem":"If \\((ax + 3)(2x - 1) = 6x^2 + 3x - 3\\) for all values of \\(x\\), where \\(a\\) is a constant, what is the value of \\(a\\)?","explanation":"The \\(x^2\\)-term on the left is \\(2a x^2\\), so \\(2a = 6\\) and \\(a = 3\\). Check: \\((3x + 3)(2x - 1) = 6x^2 - 3x + 6x - 3 = 6x^2 + 3x - 3\\).","format":"spr","answers":["3"]},{"id":"m-eqv-06","section":"math","concept":"equiv","domain":"ADV","difficulty":"medium","stem":"For \\(x > 0\\), which expression is equivalent to \\(x^{\\frac{5}{2}}\\)?","explanation":"\\(x^{\\frac{5}{2}} = x^{2 + \\frac{1}{2}} = x^2 \\cdot x^{\\frac{1}{2}} = x^2\\sqrt{x}\\). Choice A is \\(x^{\\frac{2}{5}}\\), with the fraction flipped.","format":"mc","choices":["\\(\\sqrt[5]{x^2}\\)","\\(\\frac{x^5}{2}\\)","\\(x\\sqrt[5]{x}\\)","\\(x^2\\sqrt{x}\\)"],"correct":"D"},{"id":"m-eqv-07","section":"math","concept":"equiv","domain":"ADV","difficulty":"medium","stem":"Which expression is equivalent to \\((4x^2y^3)(3xy^{-1})\\), where \\(x \\ne 0\\) and \\(y \\ne 0\\)?","explanation":"Multiply coefficients (\\(4 \\cdot 3 = 12\\)) and add exponents of like bases: \\(x^{2+1} = x^3\\) and \\(y^{3 + (-1)} = y^2\\).","format":"mc","choices":["\\(12x^3y^2\\)","\\(7x^3y^2\\)","\\(12x^2y^3\\)","\\(12x^3y^4\\)"],"correct":"A"},{"id":"m-eqv-08","section":"math","concept":"equiv","domain":"ADV","difficulty":"medium","stem":"Which expression is equivalent to \\(\\frac{1}{x + 2} + \\frac{3}{x - 1}\\), for \\(x \\ne -2\\) and \\(x \\ne 1\\)?","explanation":"Use the common denominator \\((x + 2)(x - 1)\\): the numerator is \\(1(x - 1) + 3(x + 2) = 4x + 5\\). Choice C adds numerators and denominators, which is not allowed.","format":"mc","choices":["\\(\\frac{4}{(x + 2)(x - 1)}\\)","\\(\\frac{4x + 7}{(x + 2)(x - 1)}\\)","\\(\\frac{4}{2x + 1}\\)","\\(\\frac{4x + 5}{(x + 2)(x - 1)}\\)"],"correct":"D"},{"id":"m-eqv-09","section":"math","concept":"equiv","domain":"ADV","difficulty":"hard","stem":"The expression \\(2x^2 - 12x + 7\\) can be written in the form \\(a(x - h)^2 + k\\), where \\(a\\), \\(h\\), and \\(k\\) are constants. What is the value of \\(k\\)?","explanation":"Factor 2 from the \\(x\\)-terms: \\(2(x^2 - 6x) + 7 = 2(x^2 - 6x + 9) - 18 + 7 = 2(x - 3)^2 - 11\\). So \\(k = -11\\) (the minimum value of the expression).","format":"spr","answers":["-11"]},{"id":"m-eqv-10","section":"math","concept":"equiv","domain":"ADV","difficulty":"hard","stem":"Which expression is equivalent to \\(\\frac{x^2 - 9}{x^2 + x - 6}\\) for \\(x \\ne -3\\) and \\(x \\ne 2\\)?","explanation":"Factor: \\(\\frac{(x - 3)(x + 3)}{(x + 3)(x - 2)}\\). Cancel the common factor \\(x + 3\\) to get \\(\\frac{x - 3}{x - 2}\\).","format":"mc","choices":["\\(\\frac{x - 3}{x - 2}\\)","\\(\\frac{x + 3}{x - 2}\\)","\\(\\frac{3}{2}\\)","\\(\\frac{x - 3}{x + 2}\\)"],"correct":"A"},{"id":"m-eqv-11","section":"math","concept":"equiv","domain":"ADV","difficulty":"easy","stem":"Which expression is equivalent to \\(6x^2 + 9x\\)?","explanation":"The greatest common factor is \\(3x\\): \\(6x^2 + 9x = 3x(2x) + 3x(3) = 3x(2x + 3)\\).","format":"mc","choices":["\\(3x(2x + 9)\\)","\\(6x(x + 9)\\)","\\(x(6x + 3)\\)","\\(3x(2x + 3)\\)"],"correct":"D"},{"id":"m-eqv-12","section":"math","concept":"equiv","domain":"ADV","difficulty":"medium","stem":"The expression \\((3x - 2)^2\\) is equivalent to \\(ax^2 + bx + c\\), where \\(a\\), \\(b\\), and \\(c\\) are constants. What is the value of \\(b\\)?","explanation":"\\((3x - 2)^2 = 9x^2 - 12x + 4\\), so \\(b = -12\\). Choice B forgets that the middle term is doubled: \\(2(3x)(-2)\\).","format":"mc","choices":["−12","−6","4","9"],"correct":"A"},{"id":"m-eqv-13","section":"math","concept":"equiv","domain":"ADV","difficulty":"medium","stem":"For \\(x > 0\\), which expression is equivalent to \\(\\frac{\\sqrt{x^3}}{x^{-1}}\\)?","explanation":"\\(\\sqrt{x^3} = x^{\\frac{3}{2}}\\), and dividing by \\(x^{-1}\\) is the same as multiplying by \\(x\\): \\(x^{\\frac{3}{2} + 1} = x^{\\frac{5}{2}}\\).","format":"mc","choices":["\\(x^{\\frac{1}{2}}\\)","\\(x^{\\frac{5}{2}}\\)","\\(x^{\\frac{3}{2}}\\)","\\(x^{-\\frac{3}{2}}\\)"],"correct":"B"},{"id":"m-eqv-14","section":"math","concept":"equiv","domain":"ADV","difficulty":"hard","stem":"The expression \\(\\frac{4x + 1}{x - 2}\\) is equivalent to \\(4 + \\frac{k}{x - 2}\\), where \\(k\\) is a constant and \\(x \\ne 2\\). What is the value of \\(k\\)?","explanation":"Write the numerator in terms of \\(x - 2\\): \\(4x + 1 = 4(x - 2) + 9\\). Dividing by \\(x - 2\\) gives \\(4 + \\frac{9}{x - 2}\\), so \\(k = 9\\).","format":"spr","answers":["9"]},{"id":"m-eqv-15","section":"math","concept":"equiv","domain":"ADV","difficulty":"medium","stem":"Which expression is equivalent to \\((2x - 3)(x^2 + x - 1)\\)?","explanation":"\\(2x(x^2 + x - 1) = 2x^3 + 2x^2 - 2x\\) and \\(-3(x^2 + x - 1) = -3x^2 - 3x + 3\\). Adding: \\(2x^3 - x^2 - 5x + 3\\).","format":"mc","choices":["\\(2x^3 + 2x^2 - 2x - 3\\)","\\(2x^3 - x^2 - 5x + 3\\)","\\(2x^3 - x^2 - x + 3\\)","\\(2x^3 + 5x^2 - 5x + 3\\)"],"correct":"B"},{"id":"m-eqv-16","section":"math","concept":"equiv","domain":"ADV","difficulty":"easy","stem":"Which expression is equivalent to \\(4(3 - x) + 2(x + 1)\\)?","explanation":"\\(12 - 4x + 2x + 2 = 14 - 2x\\).","format":"mc","choices":["\\(14 + 2x\\)","\\(13 - 2x\\)","\\(10 - 6x\\)","\\(14 - 2x\\)"],"correct":"D"},{"id":"m-eqv-17","section":"math","concept":"equiv","domain":"ADV","difficulty":"medium","stem":"If \\(x^2 + kx + 25 = (x + m)^2\\) for all values of \\(x\\), where \\(k\\) and \\(m\\) are positive constants, what is the value of \\(k\\)?","explanation":"\\((x + m)^2 = x^2 + 2mx + m^2\\). Matching constants, \\(m^2 = 25\\), so \\(m = 5\\) (positive). Then \\(k = 2m = 10\\).","format":"mc","choices":["5","10","25","50"],"correct":"B"},{"id":"m-eqv-18","section":"math","concept":"equiv","domain":"ADV","difficulty":"easy","stem":"Which expression is equivalent to \\(\\frac{x^2 - 4x}{x}\\) for \\(x \\ne 0\\)?","explanation":"Divide each term of the numerator by \\(x\\): \\(\\frac{x^2}{x} - \\frac{4x}{x} = x - 4\\).","format":"mc","choices":["\\(x - 4x\\)","\\(x^2 - 4\\)","\\(-3x\\)","\\(x - 4\\)"],"correct":"D"},{"id":"m-eqv-19","section":"math","concept":"equiv","domain":"ADV","difficulty":"medium","stem":"For \\(x > 0\\), which expression is equivalent to \\(\\left(x^{\\frac{1}{3}}\\right)^{6} \\cdot x^{-1}\\)?","explanation":"\\(\\left(x^{\\frac{1}{3}}\\right)^6 = x^{2}\\), and \\(x^2 \\cdot x^{-1} = x^{1} = x\\).","format":"mc","choices":["\\(x\\)","\\(x^2\\)","\\(x^{-2}\\)","\\(x^{\\frac{1}{2}}\\)"],"correct":"A"},{"id":"m-eqv-20","section":"math","concept":"equiv","domain":"ADV","difficulty":"hard","stem":"Which expression is equivalent to \\(4^{x} \\cdot 2^{x + 3}\\)?","explanation":"Write \\(4^x\\) as \\((2^2)^x = 2^{2x}\\). Then \\(2^{2x} \\cdot 2^{x + 3} = 2^{3x + 3}\\).","format":"mc","choices":["\\(2^{3x + 3}\\)","\\(2^{2x + 3}\\)","\\(8^{2x + 3}\\)","\\(6^{2x + 3}\\)"],"correct":"A"},{"id":"m-nle-01","section":"math","concept":"nonlin-eq","domain":"ADV","difficulty":"easy","stem":"If \\(x^2 = 49\\) and \\(x > 0\\), what is the value of \\(x\\)?","explanation":"The solutions of \\(x^2 = 49\\) are 7 and \\(-7\\); since \\(x > 0\\), \\(x = 7\\).","format":"mc","choices":["−7","7","24.5","49"],"correct":"B"},{"id":"m-nle-02","section":"math","concept":"nonlin-eq","domain":"ADV","difficulty":"easy","stem":"What are the solutions to \\((x - 4)(x + 6) = 0\\)?","explanation":"A product is 0 when a factor is 0: \\(x - 4 = 0\\) gives 4, and \\(x + 6 = 0\\) gives \\(-6\\).","format":"mc","choices":["\\(4\\) and \\(-6\\)","\\(-4\\) and \\(6\\)","\\(4\\) and \\(6\\)","\\(-4\\) and \\(-6\\)"],"correct":"A"},{"id":"m-nle-03","section":"math","concept":"nonlin-eq","domain":"ADV","difficulty":"medium","stem":"What is the positive solution to \\(x^2 - 5x - 14 = 0\\)?","explanation":"Factor: \\((x - 7)(x + 2) = 0\\), so \\(x = 7\\) or \\(x = -2\\). The positive solution is 7.","format":"mc","choices":["2","5","7","14"],"correct":"C"},{"id":"m-nle-04","section":"math","concept":"nonlin-eq","domain":"ADV","difficulty":"medium","stem":"How many distinct real solutions does the equation \\(2x^2 + 3x + 5 = 0\\) have?","explanation":"The discriminant is \\(b^2 - 4ac = 9 - 40 = -31\\). A negative discriminant means no real solutions.","format":"mc","choices":["Zero","Exactly one","Exactly two","Infinitely many"],"correct":"A"},{"id":"m-nle-05","section":"math","concept":"nonlin-eq","domain":"ADV","difficulty":"medium","stem":"What are the solutions to \\(x^2 + 6x + 4 = 0\\)?","explanation":"Complete the square: \\(x^2 + 6x + 9 = 5\\), so \\((x + 3)^2 = 5\\) and \\(x + 3 = \\pm\\sqrt{5}\\). Thus \\(x = -3 \\pm \\sqrt{5}\\).","format":"mc","choices":["\\(x = 3 \\pm \\sqrt{5}\\)","\\(x = -6 \\pm \\sqrt{5}\\)","\\(x = -3 \\pm \\sqrt{13}\\)","\\(x = -3 \\pm \\sqrt{5}\\)"],"correct":"D"},{"id":"m-nle-06","section":"math","concept":"nonlin-eq","domain":"ADV","difficulty":"hard","stem":"Which of the following gives all solutions to \\(\\sqrt{x + 7} = x - 5\\)?","explanation":"Square both sides: \\(x + 7 = x^2 - 10x + 25\\), so \\(x^2 - 11x + 18 = 0\\) and \\(x = 2\\) or \\(x = 9\\). Check: \\(x = 2\\) gives \\(\\sqrt{9} = 3\\) but \\(2 - 5 = -3\\), so 2 is extraneous. Only 9 works.","format":"mc","choices":["\\(9\\) only","\\(2\\) only","\\(2\\) and \\(9\\)","There are no solutions."],"correct":"A"},{"id":"m-nle-07","section":"math","concept":"nonlin-eq","domain":"ADV","difficulty":"medium","stem":"The graphs of \\(y = x^2 - 2x + 3\\) and \\(y = 2x + 3\\) intersect at the points \\((0, 3)\\) and \\((a, b)\\). What is the value of \\(a\\)?","explanation":"Set the expressions equal: \\(x^2 - 2x + 3 = 2x + 3\\), so \\(x^2 - 4x = 0\\) and \\(x(x - 4) = 0\\). The other intersection has \\(a = 4\\).","format":"spr","answers":["4"]},{"id":"m-nle-08","section":"math","concept":"nonlin-eq","domain":"ADV","difficulty":"hard","stem":"In the equation \\(kx^2 - 6x + 3 = 0\\), \\(k\\) is a nonzero constant. If the equation has exactly one real solution, what is the value of \\(k\\)?","explanation":"Exactly one real solution means the discriminant is 0: \\((-6)^2 - 4(k)(3) = 36 - 12k = 0\\), so \\(k = 3\\).","format":"spr","answers":["3"]},{"id":"m-nle-09","section":"math","concept":"nonlin-eq","domain":"ADV","difficulty":"medium","stem":"What value of \\(x\\) satisfies \\(\\frac{3}{x} = \\frac{12}{x + 6}\\)?","explanation":"Cross-multiply: \\(3(x + 6) = 12x\\), so \\(3x + 18 = 12x\\), \\(9x = 18\\), and \\(x = 2\\). (This does not make a denominator 0.)","format":"mc","choices":["2","3","4","6"],"correct":"A"},{"id":"m-nle-10","section":"math","concept":"nonlin-eq","domain":"ADV","difficulty":"easy","stem":"If \\(2^{x + 1} = 32\\), what is the value of \\(x\\)?","explanation":"\\(32 = 2^5\\), so \\(x + 1 = 5\\) and \\(x = 4\\).","format":"mc","choices":["3","4","5","16"],"correct":"B"},{"id":"m-nle-11","section":"math","concept":"nonlin-eq","domain":"ADV","difficulty":"hard","stem":"The equation \\(x^2 + bx + 12 = 0\\), where \\(b\\) is a constant, has solutions 2 and \\(r\\). What is the value of \\(b\\)?","explanation":"The product of the solutions is \\(\\frac{c}{a} = 12\\), so \\(2r = 12\\) and \\(r = 6\\). The sum is \\(-\\frac{b}{a} = -b\\), so \\(-b = 8\\) and \\(b = -8\\).","format":"spr","answers":["-8"]},{"id":"m-nle-12","section":"math","concept":"nonlin-eq","domain":"ADV","difficulty":"medium","stem":"What is the sum of the solutions to \\(|2x - 5| = 9\\)?","explanation":"Either \\(2x - 5 = 9\\) (so \\(x = 7\\)) or \\(2x - 5 = -9\\) (so \\(x = -2\\)). The sum is \\(7 + (-2) = 5\\).","format":"spr","answers":["5"]},{"id":"m-nle-13","section":"math","concept":"nonlin-eq","domain":"ADV","difficulty":"medium","stem":"What are the solutions to \\((x + 3)^2 = 16\\)?","explanation":"Take square roots: \\(x + 3 = 4\\) or \\(x + 3 = -4\\), so \\(x = 1\\) or \\(x = -7\\).","format":"mc","choices":["\\(-1\\) and \\(7\\)","\\(13\\) and \\(-19\\)","\\(4\\) and \\(-4\\)","\\(1\\) and \\(-7\\)"],"correct":"D"},{"id":"m-nle-14","section":"math","concept":"nonlin-eq","domain":"ADV","difficul  vertex is at \\(x = -\\frac{b}{2a} = -\\frac{12}{-4} = 3\\). Then \\(f(3) = -18 + 36 - 5 = 13\\). The parabola opens down, so 13 is the maximum.","format":"spr","answers":["13"]},{"id":"m-nlf-08","section":"math","concept":"nonlin-fn","domain":"ADV","difficulty":"medium","stem":"The height, in feet, of a ball \\(t\\) seconds after it is thrown is \\(h(t) = -16t^2 + 64t + 5\\). How many seconds after it is thrown does the ball reach its maximum height?","explanation":"The maximum is at the vertex: \\(t = -\\frac{b}{2a} = -\\frac{64}{-32} = 2\\). Choice D is the maximum height, 69 feet, not the time.","format":"mc","choices":["2","4","5","69"],"correct":"A"},{"id":"m-nlf-09","section":"math","concept":"nonlin-fn","domain":"ADV","difficulty":"medium","stem":"The function \\(g\\) is defined by \\(g(x) = x^3 - 4x\\). What is the positive \\(x\\)-intercept of the graph of \\(y = g(x)\\)?","explanation":"Factor: \\(x(x^2 - 4) = x(x - 2)(x + 2) = 0\\). The zeros are \\(-2\\), 0, and 2, so the positive \\(x\\)-intercept is 2.","format":"mc","choices":["1","2","4","8"],"correct":"B"},{"id":"m-nlf-10","section":"math","concept":"nonlin-fn","domain":"ADV","difficulty":"medium","stem":"For a polynomial function \\(p\\), \\(p(3) = 0\\). Which of the following must be a factor of \\(p(x)\\)?","explanation":"By the factor theorem, \\(p(c) = 0\\) means \\((x - c)\\) is a factor. With \\(c = 3\\), \\(x - 3\\) is a factor.","format":"mc","choices":["\\(x + 3\\)","\\(x - 9\\)","\\(3x + 1\\)","\\(x - 3\\)"],"correct":"D"},{"id":"m-nlf-11","section":"math","concept":"nonlin-fn","domain":"ADV","difficulty":"easy","stem":"What is the \\(y\\)-intercept of the graph of \\(f(x) = 2^x + 3\\) in the \\(xy\\)-plane?","explanation":"Set \\(x = 0\\): \\(f(0) = 2^0 + 3 = 1 + 3 = 4\\). Remember \\(2^0 = 1\\), not 0.","format":"mc","choices":["\\((0, 2)\\)","\\((0, 3)\\)","\\((0, 5)\\)","\\((0, 4)\\)"],"correct":"D"},{"id":"m-nlf-12","section":"math","concept":"nonlin-fn","domain":"ADV","difficulty":"hard","stem":"The exponential function \\(f\\) is defined by \\(f(x) = a(b)^x\\), where \\(a\\) and \\(b\\) are positive constants. The graph of \\(y = f(x)\\) passes through \\((0, 5)\\) and \\((2, 45)\\). What is the value of \\(f(3)\\)?","explanation":"\\(f(0) = a = 5\\). Then \\(5b^2 = 45\\), so \\(b^2 = 9\\) and \\(b = 3\\). So \\(f(3) = 5 \\cdot 27 = 135\\).","format":"spr","answers":["135"]},{"id":"m-nlf-13","section":"math","concept":"nonlin-fn","domain":"ADV","difficulty":"easy","stem":"The function \\(f(x) = 1{,}200(1.04)^x\\) gives the balance, in dollars, of a savings account \\(x\\) years after it was opened. By what percent does the balance increase each year?","explanation":"The growth factor is \\(1.04 = 1 + 0.04\\), so the balance grows by 0.04, or 4%, each year. Choice D is the factor written as a percent.","format":"mc","choices":["0.04%","4%","40%","104%"],"correct":"B"},{"id":"m-nlf-14","section":"math","concept":"nonlin-fn","domain":"ADV","difficulty":"hard","stem":"The graph of the quadratic function \\(f\\) is shown. If \\(f(x) = a(x + 1)^2 + 4\\), where \\(a\\) is a constant, what is the value of \\(a\\)?","explanation":"The graph passes through \\((1, 0)\\). Substitute: \\(0 = a(1 + 1)^2 + 4 = 4a + 4\\), so \\(a = -1\\). This fits the graph, which opens downward.","fig":"<div class=\"mfigw\"><svg class=\"mfig\" viewBox=\"0 0 300 366\" width=\"300\" height=\"366\" role=\"img\" aria-label=\"Downward parabola with vertex (-1, 4) through (1, 0) and (-3, 0)\" font-family=\"-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif\"><line x1=\"26\" x2=\"26\" y1=\"340\" y2=\"26\" stroke=\"#e1e5ea\"/><line x1=\"53.56\" x2=\"53.56\" y1=\"340\" y2=\"26\" stroke=\"#e1e5ea\"/><line x1=\"81.11\" x2=\"81.11\" y1=\"340\" y2=\"26\" stroke=\"#e1e5ea\"/><line x1=\"108.67\" x2=\"108.67\" y1=\"340\" y2=\"26\" stroke=\"#e1e5ea\"/><line x1=\"136.22\" x2=\"136.22\" y1=\"340\" y2=\"26\" stroke=\"#e1e5ea\"/><line x1=\"163.78\" x2=\"163.78\" y1=\"340\" y2=\"26\" st iculty":"easy","stem":"The function \\(f\\) is defined by \\(f(x) = \\sqrt{x + 9}\\). What is the value of \\(f(16)\\)?","explanation":"\\(f(16) = \\sqrt{16 + 9} = \\sqrt{25} = 5\\). Note \\(\\sqrt{16} + 9 = 13\\) is not the same thing.","format":"mc","choices":["4","5","7","25"],"correct":"B"},{"id":"m-nlf-18","section":"math","concept":"nonlin-fn","domain":"ADV","difficulty":"medium","stem":"The height, in meters, of a ball \\(t\\) seconds after it is launched from the ground is \\(h(t) = -4.9t^2 + 19.6t\\). How many seconds after launch does the ball hit the ground?","explanation":"Set \\(h(t) = 0\\): \\(-4.9t(t - 4) = 0\\), so \\(t = 0\\) (launch) or \\(t = 4\\). It lands after 4 seconds.","format":"spr","answers":["4"]},{"id":"m-nlf-19","section":"math","concept":"nonlin-fn","domain":"ADV","difficulty":"hard","stem":"The function \\(f\\) is defined by \\(f(x) = x^2 - 6x + c\\), where \\(c\\) is a constant. If the minimum value of \\(f(x)\\) is 4, what is the value of \\(c\\)?","explanation":"The vertex is at \\(x = \\frac{6}{2} = 3\\), so the minimum value is \\(f(3) = 9 - 18 + c = c - 9\\). Setting \\(c - 9 = 4\\) gives \\(c = 13\\).","format":"spr","answers":["13"]},{"id":"m-nlf-20","section":"math","concept":"nonlin-fn","domain":"ADV","difficulty":"medium","stem":"The amount of a medication in a patient's body decreases by 20% every 2 hours. The initial amount is 900 milligrams. Which function gives the amount \\(A\\), in milligrams, after \\(h\\) hours?","explanation":"Decreasing by 20% leaves 80%, so the factor is 0.8. It applies once every 2 hours, which is \\(\\frac{h}{2}\\) times in \\(h\\) hours. Choice A keeps only 20% each time.","format":"mc","choices":["\\(A(h) = 900(0.2)^{\\frac{h}{2}}\\)","\\(A(h) = 900(0.8)^{2h}\\)","\\(A(h) = 900 - 0.2\\left(\\frac{h}{2}\\right)\\)","\\(A(h) = 900(0.8)^{\\frac{h}{2}}\\)"],"correct":"D"},{"id":"m-nlf-21","section":"math","concept":"nonlin-fn","domain":"ADV","difficulty":"hard","stem":"The function \\(f\\) is defined by \\(f(x) = a(x - 1)(x - 5)\\), where \\(a\\) is a constant. The graph of \\(y = f(x)\\) passes through the point \\((3, 8)\\). What is the value of \\(a\\)?","explanation":"Substitute \\((3, 8)\\): \\(8 = a(2)(-2) = -4a\\), so \\(a = -2\\).","format":"spr","answers":["-2"]},{"id":"m-nlf-22","section":"math","concept":"nonlin-fn","domain":"ADV","difficulty":"medium","stem":"The function \\(f\\) is defined by \\(f(x) = 3x^2 - 2\\). For what positive value of \\(x\\) does \\(f(x) = 25\\)?","explanation":"\\(3x^2 - 2 = 25\\) gives \\(3x^2 = 27\\), so \\(x^2 = 9\\) and \\(x = 3\\). Choice C is \\(x^2\\).","format":"mc","choices":["3","\\(\\sqrt{\\frac{23}{3}}\\)","9","27"],"correct":"A"},{"id":"m-nlf-23","section":"math","concept":"nonlin-fn","domain":"ADV","difficulty":"medium","stem":"The function \\(f\\) is defined by \\(f(x) = 5(1.2)^x\\). What is the value of \\(\\frac{f(x + 1)}{f(x)}\\) for any value of \\(x\\)?","explanation":"\\(\\frac{5(1.2)^{x + 1}}{5(1.2)^x} = 1.2^{(x + 1) - x} = 1.2\\). An exponential function is multiplied by the same factor each time \\(x\\) increases by 1.","format":"mc","choices":["0.2","1.2","5","6"],"correct":"B"},{"id":"m-nlf-24","section":"math","concept":"nonlin-fn","domain":"ADV","difficulty":"medium","stem":"The table shows several values of the quadratic function \\(q\\). Which equation defines \\(q\\)?","explanation":"\\(q(0) = 3\\) gives the constant 3, and the zeros are 1 and 3, so \\(q(x) = (x - 1)(x - 3) = x^2 - 4x + 3\\). Check: \\(q(-1) = 1 + 4 + 3 = 8\\) ✓.","fig":"<table class=\"data\"><thead><tr><th>\\(x\\)<\/th><th>\\(q(x)\\)<\/th><\/tr><\/thead><tbody><tr><td>-1<\/td><td>8<\/td><\/tr><tr><td>0<\/td><td>3<\/td><\/tr><tr><td>1<\/td><td>0<\/td><\/tr><tr><td>2<\/td><td>-1<\/td><\/tr><tr><td>3<\/td><td>0<\/td><\/tr><\/tbody><\/table>","format":"mc","choices":["\\(q(x) = x^2 - 4x + 3\\)","\\(q(x) = x^2 + 4x + 3\\)","\\(q(x) = -x^2 + 4x - 3\\)","\\(q(x) = x^2 - 2x + 3\\)"],"correct":"A"},{"id":"m-rat-01","section":"math","concept":"ratios","domain":"PSDA","difficulty":"easy","stem":"A recipe uses 3 cups of flour to make 24 cookies. At this rate, how many cups of flour are needed to make 40 cookies?","explanation":"Set up a proportion: \\(\\frac{3}{24} = \\frac{c}{40}\\). Then \\(c = \\frac{3 \\cdot 40}{24} = 5\\) cups.","format":"mc","choices":["4","5","6","8"],"correct":"B"},{"id":"m-rat-02","section":"math","concept":"ratios","domain":"PSDA","difficulty":"easy","stem":"A car travels 165 miles in 3 hours at a constant speed. At this speed, how many miles will the car travel in 5 hours?","explanation":"The speed is \\(165 \\div 3 = 55\\) miles per hour, so in 5 hours the car travels \\(55 \\cdot 5 = 275\\) miles.","format":"mc","choices":["225","250","275","330"],"correct":"C"},{"id":"m-rat-03","section":"math","concept":"ratios","domain":"PSDA","difficulty":"medium","stem":"There are 2.54 centimeters in 1 inch. To the nearest tenth of an inch, how many inches are in 30 centimeters?","explanation":"Divide by the number of centimeters per inch: \\(30 \\div 2.54 \\approx 11.81\\), which rounds to 11.8. Choice D multiplies instead of dividing.","format":"mc","choices":["11.8","12.4","27.5","76.2"],"correct":"A"},{"id":"m-rat-04","section":"math","concept":"ratios","domain":"PSDA","difficulty":"medium","stem":"A printer prints 18 pages per minute. How many hours will it take the printer to print 3,240 pages?","explanation":"\\(3{,}240 \\div 18 = 180\\) minutes, and \\(180 \\div 60 = 3\\) hours.","format":"spr","answers":["3"]},{"id":"m-rat-05","section":"math","concept":"ratios","domain":"PSDA","difficulty":"medium","stem":"On a map, 1 centimeter represents 25 kilometers. Two towns are 7.4 centimeters apart on the map. What is the actual distance, in kilometers, between the towns?","explanation":"Multiply by the scale: \\(7.4 \\cdot 25 = 185\\) kilometers.","format":"mc","choices":["32.4","135","185","250"],"correct":"C"},{"id":"m-rat-06","section":"math","concept":"ratios","domain":"PSDA","difficulty":"hard","stem":"Pipe A alone can fill a tank in 6 hours, and pipe B alone can fill the same tank in 3 hours. If both pipes work together at these rates, how many hours will it take to fill the tank?","explanation":"Add the rates, not the times: \\(\\frac{1}{6} + \\frac{1}{3} = \\frac{1}{2}\\) tank per hour, so filling 1 tank takes 2 hours. Choice C averages the times.","format":"mc","choices":["2","3","4.5","9"],"correct":"A"},{"id":"m-rat-07","section":"math","concept":"ratios","domain":"PSDA","difficulty":"medium","stem":"A rectangular garden measures 12 feet by 15 feet. What is the area of the garden in square yards? (1 yard = 3 feet)","explanation":"Convert each length first: 12 ft = 4 yd and 15 ft = 5 yd, so the area is \\(4 \\cdot 5 = 20\\) square yards. (1 square yard = 9 square feet, and \\(180 \\div 9 = 20\\).)","format":"spr","answers":["20"]},{"id":"m-rat-08","section":"math","concept":"ratios","domain":"PSDA","difficulty":"medium","stem":"A metal has a density of 8.9 grams per cubic centimeter. What is the mass, in grams, of a solid cube of this metal with an edge length of 3 centimeters?","explanation":"The volume is \\(3^3 = 27\\) cubic centimeters, and mass = density × volume = \\(8.9 \\cdot 27 = 240.3\\) grams. Choice A uses the edge length instead of the volume.","format":"mc","choices":["26.7","80.1","240.3","712.0"],"correct":"C"},{"id":"m-pct-01","section":"math","concept":"percent","domain":"PSDA","difficulty":"easy","stem":"What is 15% of 240?","explanation":"\\(0.15 \\cdot 240 = 36\\).","format":"mc","choices":["16","24","36","225"],"correct":"C"},{"id":"m-pct-02","section":"math","concept":"percent","domain":"PSDA","difficulty":"easy","stem":"A jacket that normally costs $80 is on sale for 25% off. What is the sale price?","explanation":"25% off leaves 75% of the price: \\(0.75 \\cdot 80 = 60\\). Choice D subtracts only $5... check by finding the discount: \\(0.25 \\cdot 80 = 20\\), and \\(80 - 20 = 60\\).","format":"mc","choices":["$55","$60","$65","$75"],"correct":"B"},{"id":"m-pct-03","section":"math","concept":"percent","domain":"PSDA","difficulty":"medium","stem":"The price of an item increased from $50 to $62. By what percent did the price increase?","explanation":"Percent change = \\(\\frac{62 - 50}{50} \\cdot 100 = \\frac{12}{50} \\cdot 100 = 24\\%\\). Choice B divides by the new price instead of the original.","format":"mc","choices":["12%","19.4%","24%","62%"],"correct":"C"},{"id":"m-pct-04","section":"math","concept":"percent","domain":"PSDA","difficulty":"medium","stem":"After a 20% increase, the price of a concert ticket is $90. What was the price, in dollars, before the increase?","explanation":"The new price is 1.2 times the original: \\(1.2p = 90\\), so \\(p = 75\\). Choice B takes 20% off $90, which is not the same as undoing a 20% increase.","format":"mc","choices":["$70","$72","$75","$108"],"correct":"C"},{"id":"m-pct-05","section":"math","concept":"percent","domain":"PSDA","difficulty":"medium","stem":"The value of a collectible card increased by 20% in one year and then decreased by 20% the next year. The final value is what percent of the original value?","explanation":"Multiply the factors: \\(1.20 \\cdot 0.80 = 0.96\\), so the final value is 96% of the original. The changes don't cancel because the 20% decrease is taken from a larger amount.","format":"spr","answers":["96"]},{"id":"m-pct-06","section":"math","concept":"percent","domain":"PSDA","difficulty":"hard","stem":"The number \\(p\\) is 30% of \\(q\\), and \\(q\\) is 40% of \\(r\\). The number \\(p\\) is what percent of \\(r\\)?","explanation":"\\(p = 0.30q\\) and \\(q = 0.40r\\), so \\(p = 0.30 \\cdot 0.40r = 0.12r\\). That's 12% of \\(r\\).","format":"spr","answers":["12"]},{"id":"m-pct-07","section":"math","concept":"percent","domain":"PSDA","difficulty":"easy","stem":"In a class of 32 students, 12 students walk to school. What percent of the students walk to school?","explanation":"\\(\\frac{12}{32} = 0.375\\), or 37.5%. Choice D is the percent who do not walk.","format":"mc","choices":["12%","32%","37.5%","62.5%"],"correct":"C"},{"id":"m-pct-08","section":"math","concept":"percent","domain":"PSDA","difficulty":"medium","stem":"A club had 40 members. Over one year, the number of members increased by 150%. How many members did the club have at the end of the year?","explanation":"An increase of 150% adds \\(1.5 \\cdot 40 = 60\\) members, so the club has \\(40 + 60 = 100\\) members. Choice A is 150% <i>of<\/i> 40, not a 150% increase.","format":"mc","choices":["60","100","150","190"],"correct":"B"},{"id":"m-d1-01","section":"math","concept":"data1","domain":"PSDA","difficulty":"easy","stem":"What is the mean of the data set 4, 7, 7, 9, 13?","explanation":"The sum is \\(4 + 7 + 7 + 9 + 13 = 40\\), and \\(40 \\div 5 = 8\\).","format":"mc","choices":["7","8","9","40"],"correct":"B"},{"id":"m-d1-02","section":"math","concept":"data1","domain":"PSDA","difficulty":"easy","stem":"What is the median of the data set 3, 11, 6, 9, 2, 8?","explanation":"Sorted: 2, 3, 6, 8, 9, 11. With 6 values, the median is the mean of the middle two: \\(\\frac{6 + 8}{2} = 7\\).","format":"mc","choices":["6","6.5","7","7.5"],"correct":"C"},{"id":"m-d1-03","section":"math","concept":"data1","domain":"PSDA","difficulty":"medium","stem":"The dot plot shows the number of pets owned by each of 13 students. What is the median number of pets?","explanation":"With 13 values, the median is the 7th value in order. Counting dots from the left: two 0s, four 1s (6 values so far), then the 7th value is a 2.","fig":"<div class=\"mfigw\"><svg class=\"mfig\" viewBox=\"0 0 340 114\" width=\"340\" height=\"114\" role=\"img\" aria-label=\"Dot plot\" font-family=\"-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif\"><line x1=\"20\" x2=\"320\" y1=\"80\" y2=\"80\" stroke=\"#1f2328\"/><line x1=\"20\" x2=\"20\" y1=\"80\" y2=\"85\" stroke=\"#1f2328\"/><text x=\"20\" y=\"98\" font-size=\"11\" text-anchor=\"middl data1","domain":"PSDA","difficulty":"medium","stem":"Data set A: 10, 20, 30, 40, 50<br>Data set B: 28, 29, 30, 31, 32<br>Which statement about the two data sets is true?","explanation":"Both sets have mean (and median) 30. The values in A are far from 30, while the values in B are clustered tightly around 30, so A has the larger standard deviation.","format":"mc","choices":["The means are equal, and the standard deviation of B is greater.","The means are equal, and the standard deviation of A is greater.","The mean of A is greater than the mean of B.","The median of B is greater than the median of A."],"correct":"B"},{"id":"m-d1-06","section":"math","concept":"data1","domain":"PSDA","difficulty":"medium","stem":"The histogram shows the time, in minutes, that 20 students spent on homework one night. Each interval includes its left endpoint but not its right endpoint. How many students spent at least 30 minutes on homework?","explanation":"The bars for 30–40 and 40–50 minutes have heights 6 and 3, so \\(6 + 3 = 9\\) students spent at least 30 minutes.","fig":"<div class=\"mfigw\"><svg class=\"mfig\" viewBox=\"0 0 340 244\" width=\"340\" height=\"244\" role=\"img\" aria-label=\"Histogram\" font-family=\"-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif\"><line x1=\"44\" x2=\"326\" y1=\"204\" y2=\"204\" stroke=\"#e1e5ea\"/><text x=\"39\" y=\"208\" font-size=\"11\" text-anchor=\"end\" fill=\"#3d4450\">0<\/text><line x1=\"44\" x2=\"326\" y1=\"176.57\" y2=\"176.57\" stroke=\"#e1e5ea\"/><text x=\"39\" y=\"180.57\" font-size=\"11\" text-anchor=\"end\" fill=\"#3d4450\">1<\/text><line x1=\"44\" x2=\"326\" y1=\"149.14\" y2=\"149.14\" stroke=\"#e1e5ea\"/><text x=\"39\" y=\"153.14\" font-size=\"11\" text-anchor=\"end\" fill=\"#3d4450\">2<\/text><line x1=\"44\" x2=\"326\" y1=\"121.71\" y2=\"121.71\" stroke=\"#e1e5ea\"/><text x=\"39\" y=\"125.71\" font-size=\"11\" text-anchor=\"end\" fill=\"#3d4450\">3<\/text><line x1=\"44\" x2=\"326\" y1=\"94.29\" y2=\"94.29\" stroke=\"#e1e n and the median?","explanation":"The mean drops from about 29.2 to 16, while the median drops only from 16.5 to 15. An outlier pulls the mean much more than the median.","format":"mc","choices":["Both decrease, and the mean decreases by more than the median.","Both decrease, and the median decreases by more than the mean.","The mean decreases, and the median stays the same.","The median decreases, and the mean stays the same."],"correct":"A"},{"id":"m-d2-01","section":"math","concept":"data2","domain":"PSDA","difficulty":"medium","stem":"The scatterplot shows 9 data points and a line of best fit, whose equation is \\(y = 2.5x + 10\\). Based on the line of best fit, what is the predicted value of \\(y\\) when \\(x = 12\\)?","explanation":"Substitute \\(x = 12\\): \\(y = 2.5(12) + 10 = 30 + 10 = 40\\).","fig":"<div class=\"mfigw\"><svg class=\"mfig\" viewBox=\"0 0 340 265\" width=\"340\" height=\"265\" role=\"img\" aria-label=\"Scatterplot with line of best fit y = 2.5x + 10\" font-family=\"-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif\"><line x1=\"50\" x2=\"50\" y1=\"223\" y2=\"12\" stroke=\"#e1e5ea\"/><text x=\"50\" y=\"237\" font-size=\"11\" text-anchor=\"middle\" fill=\"#3d4450\">0<\/text><line x1=\"96\" x2=\"96\" y1=\"223\" y2=\"12\" stroke=\"#e1e5ea\"/><text x=\"96\" y=\"237\" font-size=\"11\" text-anchor=\"middle\" fill=\"#3d4450\">2<\/text><line x1=\"142\" x2=\"142\" y1=\"223\" y2=\"12\" stroke=\"#e1e5ea\"/><text x=\"142\" y=\"237\" font-size=\"11\" text-anchor=\"middle\" fill=\"#3d4450\">4<\/text><line x1=\"188\" x2=\"188\" y1=\"223\" y2=\"12\" stroke=\"#e1e5ea\"/><text x=\"188\" y=\"237\" font-size=\"11\" text-anchor=\"middle\" fill=\"#3d4450\">6<\/text><line x1=\"234\" x2=\"234\" y1=\"223\" y2=\"12\" stroke=\"#e1e5ea\"/><text x=\"234\" y=\"237\" font-size=\"11\" text-anchor=\"middle\" fill=\"#3d4450\">8<\/text><line x1=\"280\" x2=\"280\" y1=\"223\" y2=\"12\" stroke=\"#e1e5ea\"/><text x=\"280\" y=\"237\" font-size=\"11\" text-anchor=\"middle\" fi \" fill=\"#1d4ed8\"/><circle cx=\"280\" cy=\"75.3\" r=\"4\" fill=\"#1d4ed8\"/><\/svg><\/div>","format":"mc","choices":["30","35","40","45"],"correct":"C"},{"id":"m-d2-02","section":"math","concept":"data2","domain":"PSDA","difficulty":"medium","stem":"A line of best fit for data on study time and test scores is \\(y = 4.5x + 62\\), where \\(x\\) is the number of hours a student studied and \\(y\\) is the student's score. What is the best interpretation of 4.5 in this context?","explanation":"4.5 is the slope of the line: the predicted change in score for each 1-hour increase in study time. The 62 is the predicted score for 0 hours.","format":"mc","choices":["For each additional hour of studying, the predicted score increases by 4.5 points.","A student who doesn't study is predicted to score 4.5 points.","The predicted score is 4.5 times the number of hours a student studied.","Each student studied for an average of 4.5 hours."],"correct":"A"},{"id":"m-d2-03","section":"math","concept":"data2","domain":"PSDA","difficulty":"easy","stem":"The scatterplot shows 8 data points and the line \\(y = x + 1\\). How many of the data points lie above the line?","explanation":"Points above the line have \\(y > x + 1\\): \\((1, 3)\\), \\((3, 5)\\), \\((5, 7)\\), and \\((7, 9)\\). That's 4 points; the other 4 lie below the line.","fig":"<div class=\"mfigw\"><svg class=\"mfig\" viewBox=\"0 0 340 265\" width=\"340\" height=\"265\" role=\"img\" aria-label=\"Scatterplot of 8 points with the line y = x + 1\" font-family=\"-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif\"><line x1=\"50\" x2=\"50\" y1=\"223\" y2=\"12\" stroke=\"#e1e5ea\"/><text x=\"50\" y=\"237\" font-size=\"11\" text-anchor=\"middle\" fill=\"#3d4450\">0<\/text><line x1=\"80.67\" x2=\"80.67\" y1=\"223\" y2=\"12\" stroke=\"#e1e5ea\"/><text x=\"80.67\" y=\"237\" font-size=\"11\" text-anchor=\"middle\" fill=\"#3d4450\">1<\/text><line x1=\"111.33\" x2=\"111.33\" y1=\"223\" y2=\"12\" stroke=\"#e1e5ea\"/><text x=\"111.
