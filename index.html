n view described in the first sentence.","It corrects a common belief, and the rest of the text then expands on that correction.","It introduces a scientific debate about how the Sahara formed.","It explains why sand dunes are found only in the Sahara."],"correct":"B","domain":"CS","concept":"structure","difficulty":"medium","explanation":"\"In fact\" signals a correction of the belief in the first sentence, and the last sentence describes what the rest of the Sahara is actually like. Nothing in the text discusses a debate about how the desert formed."},{"id":"structure-5","passage":"<p class=\"intro\">The following text is from an original short story.<\/p>\n<p>Jun had practiced the speech for weeks. He knew every word, every pause, every place to look up at the audience. But when he stepped onto the stage and saw the rows of faces, the first line vanished from his mind like a bird startled from a branch. He gripped the podium. Then, from the third row, his little sister gave him a small, ridiculous wave, and the words came back.<\/p>","chart":null,"stem":"Which choice best describes the overall structure of the text?","choices":["It explains why a character dislikes public speaking and decides to avoid it in the future.","It compares two siblings' different approaches to giving speeches.","It describes a character's careful preparation, a sudden setback, and an unexpected moment that resolves the setback.","It presents a character's memories of a performance from early childhood."],"correct":"C","domain":"CS","concept":"structure","difficulty":"medium","explanation":"The story moves from preparation (practiced for weeks) to a problem (he forgets the first line) to a resolution (his sister's wave brings the words back). The sister doesn't give a speech, and Jun never decides to avoid speaking."},{"id":"structure-6","passage":"<p>Some scientists once argued that dogs see the world only in black and white. Studies over the past few decades, however, have shown that dogs do see some colors, mainly blues and yellows, though they have trouble telling red from green. <u>This may explain why a dog can lose track of a red ball lying in green grass but quickly spot a blue one.<\/u><\/p>","chart":null,"stem":"Which choice best describes the function of the underlined sentence in the text as a whole?","choices":["It presents evidence that dogs see only in black and white.","It describes the experiment that researchers used to test dog vision.","It questions whether studies of dog vision were reliable.","It offers an everyday example of how the research findings might apply."],"correct":"D","domain":"CS","concept":"structure","difficulty":"medium","explanation":"After describing what studies found (dogs struggle to tell red from green), the underlined sentence gives a familiar situation that the finding helps explain. It doesn't describe an experiment or doubt the research."},{"id":"crosstext-1","passage":"<p class=\"caption\">Text 1<\/p>\n<p>Many schools have banned cell phones during the school day. Supporters of these bans argue that phones distract students and that removing them improves focus and test scores for everyone.<\/p>\n<p class=\"caption\">Text 2<\/p>\n<p>Education researcher Lila Moreno studied schools that banned phones. She found that test scores rose mainly among students who had been struggling before the ban; for students who were already doing well, scores barely changed.<\/p>","chart":null,"stem":"Based on the texts, how would Moreno (Text 2) most likely respond to the supporters' argument in Text 1?","choices":["She would say that phone bans have no effect on any students.","She would argue that the benefits of a ban may be concentrated among certain students rather than shared by everyone.","She would claim that phones actually improve students' focus.","She would agree that test scores rise equally for all students after a ban."],"correct":"B","domain":"CS","concept":"crosstext","difficulty":"medium","explanation":"Moreno found gains mostly for struggling students, so she would qualify the claim that bans help \"everyone.\" A goes too far (some students did improve), and D contradicts her finding."},{"id":"crosstext-2","passage":"<p class=\"caption\">Text 1<\/p>\n<p>For decades, people repeated the claim that the Great Wall of China is visible from the Moon with the naked eye. The claim appeared in textbooks and trivia books as an established fact.<\/p>\n<p class=\"caption\">Text 2<\/p>\n<p>Astronauts who have orbited Earth report that the Great Wall is extremely difficult to see even from low orbit, about 400 kilometers up, because it is narrow and similar in color to the land around it. The Moon is nearly 1,000 times farther away.<\/p>","chart":null,"stem":"Based on the texts, how would the astronauts in Text 2 most likely respond to the claim described in Text 1?","choices":["They would consider the claim very unlikely to be true, since the wall is hard to see even from much closer.","They would agree with the claim, since the wall is very long.","They would say that the wall is easier to see from the Moon than from low orbit.","They would argue that the claim was accurate before parts of the wall were damaged."],"correct":"A","domain":"CS","concept":"crosstext","difficulty":"medium","explanation":"If the wall is barely visible from 400 kilometers, it would be far harder to see from a distance nearly 1,000 times greater. So the astronauts would doubt the claim. Nothing in Text 2 supports B, C, or D."},{"id":"crosstext-3","passage":"<p class=\"caption\">Text 1<\/p>\n<p>Some nutrition writers claim that breakfast is the most important meal of the day and that skipping it leads to weight gain.<\/p>\n<p class=\"caption\">Text 2<\/p>\n<p>In a controlled study, researchers assigned adults either to eat breakfast or to skip it for 16 weeks. The two groups showed no meaningful difference in weight change. The researchers noted, however, that the study did not include children or teenagers, whose needs may differ.<\/p>","chart":null,"stem":"Based on the texts, how would the researchers in Text 2 most likely respond to the claim in Text 1?","choices":["They would fully agree, since eating breakfast caused weight loss in their study.","They would argue that breakfast is harmful for children.","They would say that their findings don't support the claim for adults, while leaving open whether it might apply to younger people.","They would claim that no one should eat breakfast."],"correct":"C","domain":"CS","concept":"crosstext","difficulty":"hard","explanation":"The study found no difference for adults, which doesn't support the claim, but the researchers carefully note they didn't study young people. C captures both parts. B and D make claims the researchers never make."},{"id":"crosstext-4","passage":"<p class=\"caption\">Text 1<\/p>\n<p>Historian Paul Vance argues that the printing press, introduced to Europe around 1450, spread new ideas rapidly because books could suddenly be produced cheaply and in large numbers.<\/p>\n<p class=\"caption\">Text 2<\/p>\n<p>Historian Rosa Klein agrees that printing made books far cheaper, but she points out that in the 1500s most Europeans could not read. In her view, new ideas spread largely through sermons, public readings, and conversations in which literate people shared what they had read.<\/p>","chart":null,"stem":"Based on the texts, how would Klein (Text 2) most likely respond to Vance's argument (Text 1)?","choices":["She would reject the idea that printing made books cheaper.","She would argue that printing had no influence on the spread of ideas.","She would claim that most Europeans in the 1500s were able to read.","She would add that printed ideas often reached people indirectly, through spoken sharing by those who could read."],"correct":"D","domain":"CS","concept":"crosstext","difficulty":"hard","explanation":"Klein agrees books got cheaper (so not A) but adds that most people heard ideas from readers, not books. That's a refinement of Vance's argument, not a total rejection (B), and C contradicts her point."},{"id":"crosstext-5","passage":"<p class=\"caption\">Text 1<\/p>\n<p>Many homeowners rake up and remove every dead leaf from their yards each fall, believing that a tidy yard is a healthy yard.<\/p>\n<p class=\"caption\">Text 2<\/p>\n<p>Ecologist Sam Ortiz notes that fallen leaves provide winter shelter for many insects, including the caterpillars of some butterflies and moths, and that leaves break down into nutrients that enrich the soil. Ortiz recommends leaving at least some leaves in garden beds.<\/p>","chart":null,"stem":"Based on the texts, how would Ortiz (Text 2) most likely respond to the homeowners' belief in Text 1?","choices":["By suggesting that removing every leaf may take away benefits that leaves provide to yards","By agreeing that dead leaves harm the soil","By arguing that all lawns should be replaced with piles of leaves","By claiming that insects damage healthy gardens"],"correct":"A","domain":"CS","concept":"crosstext","difficulty":"medium","explanation":"Ortiz describes benefits of leaves (shelter for insects, nutrients for soil), so he would say a perfectly \"tidy\" yard loses those benefits. C is too extreme because he recommends leaving only \"some\" leaves in garden beds."},{"id":"crosstext-6","passage":"<p class=\"caption\">Text 1<\/p>\n<p>Some music teachers insist that students must master reading sheet music before they learn to play songs by ear, because reading music gives students a strong foundation.<\/p>\n<p class=\"caption\">Text 2<\/p>\n<p>In a study of beginning violin students, those who first learned simple songs by ear and only later learned to read music became fluent readers just as quickly as students who were taught to read music first. They also reported enjoying their lessons more.<\/p>","chart":null,"stem":"Based on the texts, how would the author of Text 2 most likely respond to the teachers in Text 1?","choices":["By agreeing that learning by ear slows down students' ability to read music","By arguing that students should never learn to read music","By pointing out that the order the teachers insist on may not be necessary for students to become fluent readers","By claiming that the violin is harder to learn than other instruments"],"correct":"C","domain":"CS","concept":"crosstext","difficulty":"medium","explanation":"The ear-first students became fluent readers \"just as quickly,\" so the teachers' required order may not be needed. B is too extreme, since the ear-first students still learned to read music."},{"id":"central-1","passage":"<p class=\"intro\">The following text is from an original short story.<\/p>\n<p>Every Saturday, Ines helped her grandmother at the market stall, stacking oranges into neat pyramids. She had always thought it was the dullest job in the world. But this Saturday, her grandmother was home with a cold, and Ines ran the stall alone. By noon she had learned the names of a dozen regular customers, settled an argument about the price of lemons, and sold every last orange. Walking home, she found herself already planning next week's display.<\/p>","chart":null,"stem":"Which choice best states the main idea of the text?","choices":["Ines discovers that she enjoys the stall once she takes on real responsibility for it.","Ines is deeply worried about her grandmother's health.","Ines prefers selling lemons to selling oranges.","The market is busiest on Saturdays around noon."],"correct":"A","domain":"II","concept":"central","difficulty":"medium","explanation":"The story turns on \"But this Saturday\": Ines goes from finding the job dull to eagerly planning next week's display after running the stall herself. The grandmother's cold and the lemons are just details."},{"id":"central-2","passage":"<p>Nearly all the bananas sold in grocery stores in North America and Europe belong to a single variety, the Cavendish. Because new Cavendish plants are grown from cuttings rather than from seeds, the plants are almost genetically identical. That sameness makes the bananas easy to grow and ship, but it also means that a disease able to kill one plant can kill nearly all of them. A fungus known as Tropical Race 4 is now spreading through banana farms on several continents, and scientists are racing to develop resistant varieties.<\/p>","chart":null,"stem":"Which choice best states the main idea of the text?","choices":["Bananas are the most popular fruit in the world.","The Cavendish banana's genetic sameness makes it convenient to grow but leaves it vulnerable to disease.","Scientists have already developed a banana that resists every disease.","Banana plants are grown from seeds collected on several continents."],"correct":"B","domain":"II","concept":"central","difficulty":"medium","explanation":"The whole text builds to one point: the uniformity that makes the Cavendish easy to grow also makes it vulnerable, as the spreading fungus shows. C overstates (scientists are still \"racing\"), and D contradicts the text (cuttings, not seeds)."},{"id":"central-3","passage":"<p class=\"intro\">The following text is from an original short story.<\/p>\n<p>Dev had built the model bridge exactly as the instructions showed, gluing each tiny stick in place over three evenings. When his teacher set a heavy textbook on it, the bridge snapped in the middle. Dev stared at the pieces for a long moment. Then he picked up a pencil and began sketching triangles, dozens of them, wondering which shape would hold.<\/p>","chart":null,"stem":"Which choice best states the main idea of the text?","choices":["Dev is angry with his teacher for breaking his bridge.","Dev decides to give up building model bridges.","After a failure, Dev turns his attention to figuring out a stronger design.","Dev prefers drawing to building."],"correct":"C","domain":"II","concept":"central","difficulty":"medium","explanation":"The bridge fails, and instead of quitting, Dev starts sketching shapes to find one that \"would hold.\" The text never shows anger at the teacher, and he clearly doesn't give up."},{"id":"central-4","passage":"<p>For many years, scientists thought that trees in a forest mainly competed with one another for water, light, and nutrients. Research has since shown that the roots of many trees are linked underground by networks of fungi. Through these networks, trees can exchange carbon and other substances, and some researchers argue that older trees may even pass nutrients to young seedlings growing in their shade.<\/p>","chart":null,"stem":"Which choice best states the main idea of the text?","choices":["Fungi are harmful to the roots of most trees.","Young seedlings grow better in full sunlight than in shade.","Scientists have proven that older trees deliberately care for their own offspring.","Research suggests that trees may interact through underground networks in more ways than scientists once believed."],"correct":"D","domain":"II","concept":"central","difficulty":"hard","explanation":"The text contrasts the old view (trees just compete) with newer research (trees connected and exchanging substances). C overstates a claim that \"some researchers argue\" \"may\" be true."},{"id":"central-5","passage":"<p class=\"intro\">The following text is from an original novel.<\/p>\n<p>Aunt Rosa's house was full of rules: shoes off at the door, no voices above a murmur, every cushion in its place. At first, Celia felt as if she were holding her breath the entire summer. Yet by August she noticed that she had read eleven books, learned to bake bread, and spent long, quiet evenings talking with her aunt on the porch. The silence she had dreaded had made room for things she never found time for at home.<\/p>","chart":null,"stem":"Which choice best states the main idea of the text?","choices":["Celia plans to make her own home as strict as her aunt's.","Celia finds that the quiet, rule-filled summer she dreaded gave her room for rewarding experiences.","Aunt Rosa refuses to talk with Celia during the summer.","Celia dislikes reading and baking."],"correct":"B","domain":"II","concept":"central","difficulty":"medium","explanation":"\"Yet by August\" marks the shift: the silence she dreaded \"had made room\" for books, baking, and talks with her aunt. C and D contradict the text, and A is never mentioned."},{"id":"central-6","passage":"<p>Honeyguides are small African birds that eat beeswax, but they cannot easily break into bees' nests on their own. When honey hunters in parts of Mozambique want honey, they make a special trilling call. Honeyguides respond by leading them to a nest; the people open it, take the honey, and leave the wax behind for the birds. Researchers found that honeyguides were more likely to guide people who made this traditional call than people who made other sounds.<\/p>","chart":null,"stem":"Which choice best states the main idea of the text?","choices":["Honeyguides eat only honey and refuse to eat wax.","People in Mozambique keep honeyguides as pets.","Honeyguides break into bees' nests more easily than people can.","Honeyguides and people cooperate to get into bees' nests, and the birds respond especially to a traditional call."],"correct":"D","domain":"II","concept":"central","difficulty":"hard","explanation":"The text describes a partnership (birds lead, people open the nest, both benefit) and a finding about the special call. A and C contradict the text: the birds eat wax and can't easily open nests."},{"id":"detail-1","passage":"<p>Emperor penguins breed during the Antarctic winter. After the female lays a single egg, she passes it to the male and returns to the sea to feed. For about two months, the male balances the egg on his feet, covering it with a warm fold of skin called a brood pouch, and eats nothing until the female returns.<\/p>","chart":null,"stem":"According to the text, what does the male emperor penguin do while the female is at sea?","choices":["He feeds the chick with fish he has caught.","He keeps the egg warm on his feet without eating.","He builds a nest of stones for the egg.","He travels to the sea to find food for the female."],"correct":"B","domain":"II","concept":"detail","difficulty":"medium","explanation":"The last sentence says the male balances the egg on his feet under a brood pouch and \"eats nothing.\" He doesn't catch fish or travel to sea; the female is the one who feeds."},{"id":"detail-2","passage":"<p>The city of Venice, Italy, is built on more than 100 small islands in a shallow lagoon. Many of its buildings rest on wooden posts driven deep into the mud. Because the posts are packed tightly together and remain underwater, where little oxygen reaches them, the wood has resisted rotting for centuries.<\/p>","chart":null,"stem":"According to the text, why have the wooden posts under Venice resisted rotting?","choices":["They are coated with a special paint.","They are replaced every few years.","They stay underwater, where little oxygen reaches them.","They are made from a type of wood that cannot rot."],"correct":"C","domain":"II","concept":"detail","difficulty":"medium","explanation":"The last sentence gives the reason directly: the posts stay underwater with little oxygen. Paint, replacement, and rot-proof wood are never mentioned."},{"id":"detail-3","passage":"<p class=\"intro\">The following text is from an original short story.<\/p>\n<p>Rafael didn't care about winning the science fair. What he wanted was to find out whether the bean plants on his windowsill grew faster with music. So every evening, while his sisters argued over the television, he played the same violin recording for the plants on the left side of the sill and left the plants on the right side in silence.<\/p>","chart":null,"stem":"According to the text, what is Rafael's main goal?","choices":["To win first prize at the science fair","To learn to play the violin","To keep his sisters from arguing","To learn whether music affects how fast bean plants grow"],"correct":"D","domain":"II","concept":"detail","difficulty":"medium","explanation":"The text states it directly: \"What he wanted was to find out whether the bean plants … grew faster with music.\" It also says he \"didn't care about winning,\" which rules out A."},{"id":"detail-4","passage":"<p>Glaciers may look motionless, but they move constantly. Under the pressure of the glacier's enormous weight, the ice near the bottom becomes able to flow slowly, like extremely thick syrup. Meltwater beneath a glacier can also act as a lubricant, helping the ice slide over the ground below.<\/p>","chart":null,"stem":"According to the text, what is one effect of meltwater beneath a glacier?","choices":["It helps the glacier slide over the ground.","It causes the glacier to freeze solid.","It makes the glacier heavier.","It stops the ice at the bottom from flowing."],"correct":"A","domain":"II","concept":"detail","difficulty":"medium","explanation":"The last sentence says meltwater acts \"as a lubricant, helping the ice slide over the ground below.\" Weight is what makes the bottom ice flow; meltwater doesn't stop that."},{"id":"detail-5","passage":"<p>Ruth Wakefield, who ran the Toll House Inn in Massachusetts with her husband, is credited with inventing the chocolate chip cookie in the late 1930s. She added chopped pieces of a semisweet chocolate bar to her cookie dough. In return for allowing a chocolate company to print her recipe on its packaging, she reportedly received a lifetime supply of chocolate.<\/p>","chart":null,"stem":"According to the text, what did Wakefield reportedly receive in exchange for letting her recipe be printed?","choices":["A lifetime supply of chocolate","A large payment of money","Ownership of the chocolate company","A new inn in Massachusetts"],"correct":"A","domain":"II","concept":"detail","difficulty":"medium","explanation":"The final sentence says she \"reportedly received a lifetime supply of chocolate.\" The inn was already hers, and no payment or ownership is mentioned."},{"id":"detail-6","passage":"<p>Pufferfish defend themselves in two ways. When threatened, a pufferfish rapidly gulps water, swelling its stretchy stomach until its body is several times its normal size and difficult for predators to swallow. Many pufferfish species also contain a powerful toxin that makes them dangerous for most predators to eat.<\/p>","chart":null,"stem":"According to the text, how does swelling up help a pufferfish?","choices":["It releases a toxin into the water.","It allows the fish to swim faster.","It changes the fish's color to warn predators.","It makes the fish difficult for predators to swallow."],"correct":"D","domain":"II","concept":"detail","difficulty":"medium","explanation":"The text says swelling makes the body \"difficult for predators to swallow.\" The toxin is a separate, second defense, so A mixes up two different details."},{"id":"coe-text-1","passage":"<p>Nutrition researcher Hana Ito claims that children are more willing to eat vegetables that they have helped grow themselves.<\/p>","chart":null,"stem":"Which finding, if true, would most directly support Ito's claim?","choices":["In a school study, students who grew carrots and peas in a class garden ate more of those vegetables at lunch than classmates who were served the same vegetables but had not grown them.","Students in a school gardening program said they enjoyed spending time outdoors.","Most school cafeterias serve vegetables at least three times a week.","Children who did not take part in gardening ate more fruit than children who did."],"correct":"A","domain":"II","concept":"coe-text","difficulty":"medium","explanation":"The claim links growing vegetables to eating more of them. A compares growers and non-growers eating the SAME vegetables, which directly tests the claim. B is about enjoying the outdoors, not eating vegetables."},{"id":"coe-text-2","passage":"<p>In the original novel <em>The Paper Orchard<\/em>, the narrator describes her younger brother, Eli, as remarkably patient.<\/p>","chart":null,"stem":"Which quotation from the novel most effectively illustrates the claim?","choices":["\"Eli was the tallest boy in his class and the fastest runner on the team.\"","\"Eli liked oranges more than any other fruit, and he ate one every morning.\"","\"Eli spent the whole afternoon untangling the kite string, knot by knot, without once complaining.\"","\"When Eli was angry, he slammed the door so hard that the windows rattled.\""],"correct":"C","domain":"II","concept":"coe-text","difficulty":"medium","explanation":"Working slowly through a tangled string \"without once complaining\" shows patience. D shows the opposite (a short temper), and A and B describe other traits."},{"id":"coe-text-3","passage":"<p>Archaeologist Neema Otieno hypothesizes that people living at an ancient coastal settlement traded with communities far inland.<\/p>","chart":null,"stem":"Which finding, if true, would most directly support Otieno's hypothesis?","choices":["Large numbers of fish bones were found at the settlement.","The settlement's houses were built from local stone.","The settlement was abandoned after a large storm.","Tools made from a type of volcanic glass found only in mountains 300 kilometers inland were discovered at the settlement."],"correct":"D","domain":"II","concept":"coe-text","difficulty":"medium","explanation":"Materials that come only from far inland must have arrived somehow, and trade is a strong explanation. Fish bones and local stone show the settlement used nearby resources, which says nothing about inland trade."},{"id":"coe-text-4","passage":"<p>A student claims that in the original poem \"River Song,\" the speaker presents the river as both gentle and powerful.<\/p>","chart":null,"stem":"Which quotation from the poem most effectively illustrates the student's claim?","choices":["\"The river runs beside the mill / and through the sleeping town.\"","\"It hums against the pebbles, soft as breath, / then tears the old bridge loose and carries it to sea.\"","\"I fished here as a child beside my father, / our lines drawn silver in the light.\"","\"Its water, cold and clear in early spring, / reflects the willows leaning on its banks.\""],"correct":"B","domain":"II","concept":"coe-text","difficulty":"hard","explanation":"The claim needs BOTH qualities. \"Soft as breath\" shows gentleness and \"tears the old bridge loose\" shows power. D is only gentle, and A and C show neither quality clearly."},{"id":"coe-text-5","passage":"<p>Sociologist Marcus Bell claims that people who live in neighborhoods with more parks feel more connected to their neighbors.<\/p>","chart":null,"stem":"Which finding, if true, would most directly weaken Bell's claim?","choices":["Neighborhoods with many parks also tend to have more trees along their streets.","Parks are more common in large cities than in small towns.","Residents of neighborhoods with many parks and residents of neighborhoods with few parks reported similar levels of connection to their neighbors.","Residents of neighborhoods with many parks reported feeling more connected to their neighbors than residents of neighborhoods with few parks."],"correct":"C","domain":"II","concept":"coe-text","difficulty":"hard","explanation":"To weaken the claim, you need evidence that parks DON'T go with more connection. C shows no difference between the groups. D would support the claim, not weaken it."},{"id":"coe-text-6","passage":"<p>Biologist Amara Singh hypothesizes that crows can recognize and remember individual human faces.<\/p>","chart":null,"stem":"Which finding, if true, would most directly support Singh's hypothesis?","choices":["Crows often gather in large groups to sleep at night.","Crows that had been captured by researchers wearing a particular mask scolded people wearing that same mask years later but ignored people wearing a different mask.","Crows eat a wide variety of foods, including insects, seeds, and fruit.","Crows build their nests high in trees."],"correct":"B","domain":"II","concept":"coe-text","difficulty":"medium","explanation":"B shows crows reacting to one specific \"face\" (the mask) and not to another, even years later. That's recognition and memory. The other choices are true-sounding facts about crows that have nothing to do with faces."},{"id":"coe-quant-1","passage":"<p class=\"caption\">Books Checked Out at Maple Street Library (thousands)<\/p>\n<table class=\"data\"><thead><tr><th>Year<\/th><th>Print books<\/th><th>E-books<\/th><\/tr><\/thead><tbody><tr><td>2019<\/td><td>120<\/td><td>30<\/td><\/tr><tr><td>2021<\/td><td>105<\/td><td>52<\/td><\/tr><tr><td>2023<\/td><td>98<\/td><td>71<\/td><\/tr><\/tbody><\/table>\n<p>The head librarian claims that from 2019 to 2023, e-book checkouts grew while print book checkouts declined.<\/p>","chart":null,"stem":"Which choice most effectively uses data from the table to support the librarian's claim?","choices":["In 2023, the library had 98,000 print book checkouts.","In 2021, the library had 52,000 e-book checkouts.","Print book checkouts were higher than e-book checkouts in every year shown.","Print book checkouts fell from 120,000 in 2019 to 98,000 in 2023, while e-book checkouts rose from 30,000 to 71,000."],"correct":"D","domain":"II","concept":"coe-quant","difficulty":"medium","explanation":"The claim describes two trends over time, so the evidence must show both: print going down AND e-books going up. A and B give single numbers, and C is true but doesn't show any change."},{"id":"coe-quant-2","passage":"<p>A student claims that Lumen Valley has a dry season in the middle of the year.<\/p>","chart":{"type":"bar","title":"Average Monthly Rainfall in Lumen Valley","yLabel":"Rainfall (mm)","labels":["Jan","Mar","May","Jul","Sep","Nov"],"values":[80,65,30,10,25,70]},"stem":"Which choice best describes data from the graph that support the student's claim?","choices":["Of the months shown, January has the most rainfall, at 80 millimeters.","March has 65 millimeters of rainfall.","Rainfall drops from 80 millimeters in January to just 10 millimeters in July before rising again to 70 millimeters in November.","November has 70 millimeters of rainfall."],"correct":"C","domain":"II","concept":"coe-quant","difficulty":"medium","explanation":"A \"dry season in the middle of the year\" means rainfall is low around midyear compared with the start and end. Only C shows that dip and recovery. The other choices give single values that don't show a pattern."},{"id":"coe-quant-3","passage":"<p class=\"caption\">How Students Get to Ridgeview Middle School (% of students)<\/p>\n<table class=\"data\"><thead><tr><th>Method<\/th><th>2020<\/th><th>2024<\/th><\/tr><\/thead><tbody><tr><td>Bus<\/td><td>45<\/td><td>38<\/td><\/tr><tr><td>Car<\/td><td>35<\/td><td>30<\/td><\/tr><tr><td>Bike<\/td><td>8<\/td><td>17<\/td><\/tr><tr><td>Walk<\/td><td>12<\/td><td>15<\/td><\/tr><\/tbody><\/table>\n<p>The principal hypothesized that new bike lanes built near the school in 2022 would lead more students to bike to school.<\/p>","chart":null,"stem":"Which choice best describes data from the table that support the principal's hypothesis?","choices":["The bus was the most common way to get to school in both 2020 and 2024.","The percentage of students who biked to school more than doubled, from 8 percent in 2020 to 17 percent in 2024.","The percentage of students who walked to school rose from 12 percent to 15 percent.","The percentage of students who traveled by car fell from 35 percent to 30 percent."],"correct":"B","domain":"II","concept":"coe-quant","difficulty":"medium","explanation":"The hypothesis is specifically about biking, so the best support is the rise in biking after the lanes were built (8% to 17%). Walking and car data are accurate but aren't about bikes."},{"id":"coe-quant-4","passage":"<p>A park ranger claims that the number of visitors to Pine Lake State Park has risen every year since 2019.<\/p>","chart":{"type":"line","title":"Visitors to Pine Lake State Park","yLabel":"Visitors (thousands)","labels":["2019","2020","2021","2022","2023"],"values":[210,340,300,260,255]},"stem":"Which choice best describes data from the graph that weaken the ranger's claim?","choices":["Visits rose from 210,000 in 2019 to 340,000 in 2020.","More people visited the park in 2023 than in 2019.","Visits fell from 340,000 in 2020 to 300,000 in 2021.","The park had 255,000 visitors in 2023."],"correct":"C","domain":"II","concept":"coe-quant","difficulty":"hard","explanation":"\"Risen every year\" is disproved by any year with a drop, and C shows one. A and B fit the claim, and D is a single number without a comparison."},{"id":"coe-quant-5","passage":"<p class=\"caption\">Tomato Harvest With and Without Straw Mulch (kilograms per garden plot)<\/p>\n<table class=\"data\"><thead><tr><th>Tomato variety<\/th><th>No mulch<\/th><th>Straw mulch<\/th><\/tr><\/thead><tbody><tr><td>Roma<\/td><td>12<\/td><td>15<\/td><\/tr><tr><td>Cherry<\/td><td>9<\/td><td>10<\/td><\/tr><tr><td>Beefsteak<\/td><td>14<\/td><td>21<\/td><\/tr><\/tbody><\/table>\n<p>A gardener hypothesizes that straw mulch increases the harvest the most for Beefsteak tomatoes.<\/p>","chart":null,"stem":"Which choice best describes data from the table that support the gardener's hypothesis?","choices":["All three varieties produced more tomatoes with straw mulch than without it.","Beefsteak tomatoes produced 14 kilograms per plot without mulch.","Cherry tomatoes had the smallest harvest without mulch.","Mulch raised the Beefsteak harvest by 7 kilograms per plot, compared with 3 kilograms for Roma and 1 kilogram for Cherry."],"correct":"D","domain":"II","concept":"coe-quant","difficulty":"hard","explanation":"The hypothesis is about where mulch helps the MOST, so you must compare the size of the increases. D does that (7 vs. 3 vs. 1). A is true but doesn't show which variety gained most."},{"id":"coe-quant-6","passage":"<p class=\"caption\">Hours of Sleep and Average Quiz Score in Ms. Lee's Class<\/p>\n<table class=\"data\"><thead><tr><th>Sleep the night before<\/th><th>Average quiz score<\/th><\/tr><\/thead><tbody><tr><td>Less than 6 hours<\/td><td>68<\/td><\/tr><tr><td>6 to 8 hours<\/td><td>79<\/td><\/tr><tr><td>More than 8 hours<\/td><td>85<\/td><\/tr><\/tbody><\/table>\n<p>A student examining the data concluded that students who slept more the night before tended to score higher on the quiz. <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most effectively uses data from the table to complete the statement?","choices":["For example, students who slept more than 8 hours had an average score of 85.","For example, the average score rose from 68 for students who slept less than 6 hours to 79 for those who slept 6 to 8 hours and 85 for those who slept more than 8 hours.","For example, students who slept 6 to 8 hours had an average score of 79.","For example, the lowest average score in the table was 68."],"correct":"B","domain":"II","concept":"coe-quant","difficulty":"medium","explanation":"\"Tended to score higher with more sleep\" is a trend, so the evidence must show scores rising across the sleep groups. Only B shows all three groups in order."},{"id":"inference-1","passage":"<p>Researchers placed identical bird feeders in two similar parks. In Park A, they played recordings of hawk calls near the feeders for one hour each morning; in Park B, they played no recordings. Over the following month, small songbirds visited the Park A feeders far less often than the Park B feeders, even during hours when no recordings were playing. These results suggest that <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most logically completes the text?","choices":["songbirds prefer the type of food offered in Park B.","hawks live only in Park A.","the songbirds may have come to treat the Park A feeders as dangerous places.","hawk calls attract songbirds to feeders."],"correct":"C","domain":"II","concept":"inference","difficulty":"hard","explanation":"The only difference between the parks was the hawk calls, and birds stayed away even when no calls were playing, so they seem to have learned the spot was risky. The feeders were identical (so not A), and D is the opposite of the result."},{"id":"inference-2","passage":"<p>In many cities, orange streetlights are being replaced with bright white LED lights, which use less energy. Studies show that many night-flying insects are strongly attracted to white light but much less attracted to orange light. Insects that circle streetlights all night are easy prey for bats and often die from exhaustion. Therefore, switching to white LED lights could <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most logically completes the text?","choices":["reduce the number of bats living in cities.","increase the number of insects lost near streetlights.","cause streetlights to use more energy than before.","make insects more attracted to orange light."],"correct":"B","domain":"II","concept":"inference","difficulty":"medium","explanation":"White light attracts more insects, and insects around lights often die, so more white lights likely means more insects lost. C contradicts the text (LEDs use less energy), and nothing suggests fewer bats."},{"id":"inference-3","passage":"<p>Archaeologists studying an ancient village found that the oldest houses, built around 3000 BCE, had no pits for storing food, while houses built around 2500 BCE each had several large pits for storing grain. Pollen from wheat and barley first appears in the village's soil layers around 2600 BCE. Taken together, these findings suggest that <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most logically completes the text?","choices":["the village was abandoned around 3000 BCE.","villagers were growing wheat well before 3000 BCE.","the oldest houses were larger than the later houses.","the villagers began storing grain after they began growing crops."],"correct":"D","domain":"II","concept":"inference","difficulty":"medium","explanation":"Crop pollen appears around 2600 BCE, and grain pits appear in houses from around 2500 BCE, so farming seems to come first and storage after. B contradicts the pollen evidence, and house size is never discussed."},{"id":"inference-4","passage":"<p>On a hot summer afternoon, an engineering class measured the surface temperatures of two playground slides of the same color that had been sitting in full sun for the same amount of time. The metal slide measured 70°C, hot enough to burn skin, while the plastic slide measured 45°C. These results suggest that <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most logically completes the text?","choices":["the material a slide is made from can affect how hot it gets in the sun.","plastic slides are safer than metal slides in every way.","the plastic slide must have been in the shade.","the color of a slide is the only thing that determines its temperature."],"correct":"A","domain":"II","concept":"inference","difficulty":"medium","explanation":"Color, sunlight, and time were the same; only the material differed, so the material likely affected the temperature. B overgeneralizes (\"in every way\"), C contradicts the text, and D is disproved by the result."},{"id":"inference-5","passage":"<p>Fennec foxes live in the Sahara, where daytime temperatures can be extremely high. Their very large ears contain many blood vessels close to the surface of the skin. When blood flows through these vessels, heat from the fox's body can pass into the surrounding air.<\/p>","chart":null,"stem":"Based on the text, the fennec fox's large ears most likely <span class=\"blank\" aria-label=\"blank\">______<\/span>","choices":["help the fox hear prey moving underground.","allow the fox to store water.","help the fox release extra body heat.","make the fox easier for predators to spot."],"correct":"C","domain":"II","concept":"inference","difficulty":"medium","explanation":"The text connects the ears' blood vessels to body heat passing into the air, so they help the fox cool off. A may be true in real life, but this text never mentions hearing. Inferences must come from the text."},{"id":"inference-6","passage":"<p>In a study of reading habits, researchers gave one group of teenagers a short novel as a printed book and gave another group the same novel on tablets. After reading, both groups answered the same questions. The two groups scored similarly on questions about the main plot, but the printed-book group scored higher on questions about the order in which events happened. One possible explanation for these results is that <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most logically completes the text?","choices":["tablets cannot display long novels.","teenagers do not enjoy reading on tablets.","the tablet group did not finish reading the novel.","the physical feel of turning pages may help readers keep track of when events occur."],"correct":"D","domain":"II","concept":"inference","difficulty":"hard","explanation":"The only gap was in remembering the ORDER of events, and turning physical pages could give a sense of where you are in a story. If the tablet group hadn't finished (C), they would likely have done worse on the main plot too."},{"id":"boundaries-1","passage":"<p>A lightning bolt can heat the air around it to about 30,000 degrees <span class=\"blank\" aria-label=\"blank\">______<\/span> that is roughly five times hotter than the surface of the Sun.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["Celsius,","Celsius","Celsius;","Celsius and"],"correct":"C","domain":"SEC","concept":"boundaries","difficulty":"medium","explanation":"Both parts are independent clauses (\"A lightning bolt can heat…\" and \"that is roughly five times hotter…\"). A semicolon correctly joins them. A is a comma splice, B is a run-on, and D needs a comma before \"and.\""},{"id":"boundaries-2","passage":"<p>One of the first lending libraries in the American colonies opened in Philadelphia in <span class=\"blank\" aria-label=\"blank\">______<\/span> Benjamin Franklin and a group of friends founded it so that members could share books.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["1731,","1731.","1731","1731 and"],"correct":"B","domain":"SEC","concept":"boundaries","difficulty":"medium","explanation":"Two complete sentences meet here, so a period works. A comma alone (A) makes a comma splice, nothing (C) makes a run-on, and \"and\" without a comma (D) is also incorrect for joining two independent clauses."},{"id":"boundaries-3","passage":"<p>The giant panda is classified as a <span class=\"blank\" aria-label=\"blank\">______<\/span> about 99 percent of its diet consists of bamboo.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["carnivore, however,","carnivore; however,","carnivore however","carnivore, however;"],"correct":"B","domain":"SEC","concept":"boundaries","difficulty":"hard","explanation":"\"However\" is a transition, not a conjunction, so it can't join two independent clauses with just commas. Use a semicolon before it and a comma after it. D puts the semicolon in the wrong place."},{"id":"boundaries-4","passage":"<p>Mount Everest is the highest mountain above sea <span class=\"blank\" aria-label=\"blank\">______<\/span> Mauna Kea in Hawaii is taller when measured from its base on the ocean floor.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["level, but","level but,","level,","level however"],"correct":"A","domain":"SEC","concept":"boundaries","difficulty":"medium","explanation":"A comma plus the conjunction \"but\" correctly joins two independent clauses. B puts the comma after \"but,\" C is a comma splice, and D uses \"however\" without the needed semicolon and comma."},{"id":"boundaries-5","passage":"<p>Octopuses have three <span class=\"blank\" aria-label=\"blank\">______<\/span> two pump blood through the gills, and the third pumps it to the rest of the body.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["hearts,","hearts","hearts that","hearts;"],"correct":"D","domain":"SEC","concept":"boundaries","difficulty":"medium","explanation":"\"Octopuses have three hearts\" is a complete sentence, and so is \"two pump blood … body.\" A semicolon joins them. A is a comma splice, B is a run-on, and C makes the sentence ungrammatical."},{"id":"boundaries-6","passage":"<p>The Atacama Desert in Chile is one of the driest places on <span class=\"blank\" aria-label=\"blank\">______<\/span> some weather stations there have never recorded a single drop of rain.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["Earth,","Earth","Earth;","Earth, and,"],"correct":"C","domain":"SEC","concept":"boundaries","difficulty":"medium","explanation":"Two independent clauses need a semicolon (or a period, or a comma plus a conjunction). A is a comma splice, B is a run-on, and D adds an incorrect comma after \"and.\""},{"id":"colon-1","passage":"<p>Every member of the camping club must bring three <span class=\"blank\" aria-label=\"blank\">______<\/span> a flashlight, a water bottle, and a sleeping bag.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["items:","items;","items,","items"],"correct":"A","domain":"SEC","concept":"colon","difficulty":"medium","explanation":"\"Every member … must bring three items\" is a complete sentence, so a colon can introduce the list that names them. A semicolon would need a full sentence after it, and a comma or no punctuation doesn't properly introduce the list."},{"id":"colon-2","passage":"<p>The recipe for the bread <span class=\"blank\" aria-label=\"blank\">______<\/span> flour, water, salt, and yeast.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["requires:","requires;","requires","requires,"],"correct":"C","domain":"SEC","concept":"colon","difficulty":"medium","explanation":"A colon must follow a complete sentence, and \"The recipe for the bread requires\" is not complete without its object. The list is simply the object of the verb, so no punctuation goes between \"requires\" and the list."},{"id":"colon-3","passage":"<p>Lena finally understood why the plant on her windowsill was <span class=\"blank\" aria-label=\"blank\">______<\/span> she had been watering it every day, and its roots were rotting in the soggy soil.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["dying,","dying, because,","dying:","dying"],"correct":"C","domain":"SEC","concept":"colon","difficulty":"hard","explanation":"The first part is a complete sentence, and what follows explains WHY the plant was dying. A colon can introduce an explanation. A is a comma splice, D is a run-on, and B has an extra comma after \"because.\""},{"id":"colon-4","passage":"<p>The town's new recycling program accepts four kinds of <span class=\"blank\" aria-label=\"blank\">______<\/span> paper, cardboard, glass, and aluminum.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["material;","material:","material, such as:","material,"],"correct":"B","domain":"SEC","concept":"colon","difficulty":"medium","explanation":"The clause before the blank is complete, and the list names the four kinds, so a colon is correct. A colon should never come right after \"such as\" (C), and a semicolon can't introduce a list (A)."},{"id":"colon-5","passage":"<p>The science fair winners came from three <span class=\"blank\" aria-label=\"blank\">______<\/span> Portland, Oregon; Austin, Texas; and Denver, Colorado.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["cities,","cities","cities;","cities:"],"correct":"D","domain":"SEC","concept":"colon","difficulty":"hard","explanation":"A complete clause introduces a list, so use a colon. Notice that the items themselves contain commas (\"Portland, Oregon\"), which is why semicolons separate the items. That's the one time semicolons belong in a list."},{"id":"colon-6","passage":"<p>Maria's three favorite authors <span class=\"blank\" aria-label=\"blank\">______<\/span> Jacqueline Woodson, Kwame Alexander, and Rick Riordan.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["are:","are","are,","are;"],"correct":"B","domain":"SEC","concept":"colon","difficulty":"medium","explanation":"\"Maria's three favorite authors are\" isn't a complete thought until the names are added, so no colon. The names complete the verb, so no punctuation belongs between \"are\" and the list."},{"id":"supplement-1","passage":"<p>The Komodo dragon—the largest living lizard <span class=\"blank\" aria-label=\"blank\">______<\/span> can grow to about three meters long.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["species—","species,","species;","species"],"correct":"A","domain":"SEC","concept":"supplement","difficulty":"medium","explanation":"The extra information opens with a dash, so it must close with a dash. Remove \"the largest living lizard species\" and the sentence still works: \"The Komodo dragon can grow to about three meters long.\""},{"id":"supplement-2","passage":"<p>Mae Jemison, the first African American woman to travel to <span class=\"blank\" aria-label=\"blank\">______<\/span> is also a physician and an engineer.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["space—","space,","space","space;"],"correct":"B","domain":"SEC","concept":"supplement","difficulty":"medium","explanation":"The description opens with a comma after \"Mae Jemison,\" so it must close with a comma. A dash would not match, and a semicolon would wrongly split the subject from its verb \"is.\""},{"id":"supplement-3","passage":"<p>The tuatara (a reptile found only in New <span class=\"blank\" aria-label=\"blank\">______<\/span> belongs to a group of animals that dates back more than 200 million years.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["Zealand),","Zealand,","Zealand)","Zealand—"],"correct":"C","domain":"SEC","concept":"supplement","difficulty":"medium","explanation":"An opening parenthesis needs a closing parenthesis. No comma should follow it, because that would separate the subject \"The tuatara\" from its verb \"belongs.\""},{"id":"supplement-4","passage":"<p>Poet <span class=\"blank\" aria-label=\"blank\">______<\/span> won the National Book Award in 2014 for <em>Brown Girl Dreaming<\/em>, a memoir written in verse.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["Jacqueline Woodson","Jacqueline Woodson,",", Jacqueline Woodson,","Jacqueline, Woodson"],"correct":"A","domain":"SEC","concept":"supplement","difficulty":"hard","explanation":"When a title like \"Poet\" comes directly before a name, the name is essential, so no commas are used. B also puts a single comma between the subject and the verb \"won,\" which is never allowed."},{"id":"supplement-5","passage":"<p>The Amazon River, which carries more water than any other river in the <span class=\"blank\" aria-label=\"blank\">______<\/span> empties into the Atlantic Ocean.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["world","world—","world;","world,"],"correct":"D","domain":"SEC","concept":"supplement","difficulty":"medium","explanation":"The \"which\" clause opens with a comma after \"River,\" so it must close with a comma before the verb \"empties.\" A dash doesn't match the opening comma, and leaving it open (A) runs the clause into the main verb."},{"id":"supplement-6","passage":"<p>Saturn's rings, made mostly of chunks of ice and <span class=\"blank\" aria-label=\"blank\">______<\/span> are surprisingly thin; in many places they are only about 10 meters thick.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["rock","rock—","rock,","rock;"],"correct":"C","domain":"SEC","concept":"supplement","difficulty":"hard","explanation":"The phrase \"made mostly of chunks of ice and rock\" opens with a comma, so it closes with a comma. A dash wouldn't match, and a semicolon would cut the subject \"Saturn's rings\" off from its verb \"are.\""},{"id":"sva-1","passage":"<p>The box of old photographs that my grandmother kept in her closet <span class=\"blank\" aria-label=\"blank\">______<\/span> pictures from her childhood in Manila.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["contains","contain","are containing","have contained"],"correct":"A","domain":"SEC","concept":"sva","difficulty":"medium","explanation":"Cross out \"of old photographs that my grandmother kept in her closet.\" The subject is \"box,\" which is singular, so it needs the singular verb \"contains.\""},{"id":"sva-2","passage":"<p>At the bottom of the ocean, near vents of hot water, <span class=\"blank\" aria-label=\"blank\">______<\/span> giant tube worms that can grow more than two meters long.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["lives","has lived","live","is living"],"correct":"C","domain":"SEC","concept":"sva","difficulty":"medium","explanation":"This sentence is inverted: the subject comes after the verb. The subject is \"giant tube worms\" (plural), so the plural verb \"live\" is correct, not \"ocean\" or \"water.\""},{"id":"sva-3","passage":"<p>The soccer coach and her assistant <span class=\"blank\" aria-label=\"blank\">______<\/span> every practice video before the big game.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["reviews","has reviewed","is reviewing","review"],"correct":"D","domain":"SEC","concept":"sva","difficulty":"medium","explanation":"Two subjects joined by \"and\" (the coach AND her assistant) make a plural subject, so the plural verb \"review\" is needed. The other choices are all singular."},{"id":"sva-4","passage":"<p>Each of the students in the robotics club <span class=\"blank\" aria-label=\"blank\">______<\/span> responsible for building one part of the robot.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["is","are","were","have been"],"correct":"A","domain":"SEC","concept":"sva","difficulty":"medium","explanation":"The subject is \"Each,\" which is always singular. \"Of the students in the robotics club\" is just a prepositional phrase, so ignore \"students\" and use the singular \"is.\""},{"id":"sva-5","passage":"<p>The number of electric cars on the road <span class=\"blank\" aria-label=\"blank\">______<\/span> grown rapidly over the past decade.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["have","has","are","were"],"correct":"B","domain":"SEC","concept":"sva","difficulty":"hard","explanation":"The subject is \"The number,\" which is singular, not \"cars.\" So the verb is \"has grown.\" C and D also create forms that don't make sense (\"are grown\")."},{"id":"sva-6","passage":"<p>The research team's findings about how dolphins use whistles to call one another by name <span class=\"blank\" aria-label=\"blank\">______<\/span> surprised many scientists.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["has","is","have","was"],"correct":"C","domain":"SEC","concept":"sva","difficulty":"hard","explanation":"The subject is \"findings\" (plural); everything from \"about\" to \"name\" describes them. The word right before the blank, \"name,\" is singular, which is the trap. The plural subject needs \"have.\""},{"id":"pronoun-1","passage":"<p>When the city council announced <span class=\"blank\" aria-label=\"blank\">______<\/span> decision to build a new skate park, dozens of residents cheered.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["their","its","it's","they're"],"correct":"B","domain":"SEC","concept":"pronoun","difficulty":"medium","explanation":"The antecedent is \"the city council,\" a single group, so it takes the singular possessive \"its.\" \"It's\" means \"it is,\" and \"their\" is plural."},{"id":"pronoun-2","passage":"<p>Sea turtles often return to the beaches where they hatched in order to lay <span class=\"blank\" aria-label=\"blank\">______<\/span> own eggs.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["its","it's","their","they're"],"correct":"C","domain":"SEC","concept":"pronoun","difficulty":"medium","explanation":"The antecedent \"Sea turtles\" is plural, so the plural possessive \"their\" is correct. \"They're\" means \"they are.\""},{"id":"pronoun-3","passage":"<p>The school band practiced for months, and <span class=\"blank\" aria-label=\"blank\">______<\/span> performance at the state competition earned a gold rating.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["their","it's","they're","its"],"correct":"D","domain":"SEC","concept":"pronoun","difficulty":"medium","explanation":"\"The school band\" is one group (singular), so the possessive \"its\" is correct. \"It's\" means \"it is,\" which doesn't fit."},{"id":"pronoun-4","passage":"<p>Each of the museum's galleries has <span class=\"blank\" aria-label=\"blank\">______<\/span> own theme, from ancient Egypt to modern photography.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["its","their","it's","they're"],"correct":"A","domain":"SEC","concept":"pronoun","difficulty":"hard","explanation":"The antecedent is \"Each,\" which is singular (each one gallery), so use \"its.\" Don't be fooled by the plural \"galleries\" in the prepositional phrase."},{"id":"pronoun-5","passage":"<p>The marine scientists, working closely with the ship's crew, recorded the storm's wind speeds in <span class=\"blank\" aria-label=\"blank\">______<\/span> logbooks.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["its","it's","they're","their"],"correct":"D","domain":"SEC","concept":"pronoun","difficulty":"hard","explanation":"The logbooks belong to \"the marine scientists\" (plural), so the plural possessive \"their\" is correct. \"They're\" means \"they are,\" and \"its\" is singular."},{"id":"pronoun-6","passage":"<p>Although the tomato is often treated as a vegetable in cooking, <span class=\"blank\" aria-label=\"blank\">______<\/span> classified by botanists as a fruit because it develops from a flower and contains seeds.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["its","it's","their","they're"],"correct":"B","domain":"SEC","concept":"pronoun","difficulty":"medium","explanation":"The blank needs a subject and a verb: \"it is classified.\" \"It's\" is the contraction of \"it is.\" \"Its\" (no apostrophe) only shows ownership."},{"id":"tense-1","passage":"<p>Since 2010, the number of bald eagles nesting along the river <span class=\"blank\" aria-label=\"blank\">______<\/span> steadily, thanks in part to cleaner water.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["increased","has increased","will increase","increases"],"correct":"B","domain":"SEC","concept":"tense","difficulty":"medium","explanation":"\"Since 2010\" describes something that began in the past and continues to now. That calls for the present perfect, \"has increased.\" Simple past (A) would suggest the change is over."},{"id":"tense-2","passage":"<p>By the time the firefighters arrived, the neighbors <span class=\"blank\" aria-label=\"blank\">______<\/span> the small kitchen fire with an extinguisher.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["are already putting out","have already put out","had already put out","will have already put out"],"correct":"C","domain":"SEC","concept":"tense","difficulty":"hard","explanation":"Putting out the fire happened BEFORE the firefighters arrived, which is itself in the past. An action finished before another past action uses the past perfect, \"had put out.\""},{"id":"tense-3","passage":"<p>Next spring, the students in Mr. Okafor's class <span class=\"blank\" aria-label=\"blank\">______<\/span> their science projects at the regional fair in Boise.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["presented","have presented","had presented","will present"],"correct":"D","domain":"SEC","concept":"tense","difficulty":"medium","explanation":"\"Next spring\" points to the future, so the future tense \"will present\" is correct. All the other choices are past forms."},{"id":"tense-4","passage":"<p>In July 1969, Apollo 11 astronauts Neil Armstrong and Buzz Aldrin walked on the Moon, <span class=\"blank\" aria-label=\"blank\">______<\/span> rock samples, and planted a flag.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["collected","collect","will collect","are collecting"],"correct":"A","domain":"SEC","concept":"tense","difficulty":"medium","explanation":"The verbs in this list (\"walked,\" \"planted\") are in the simple past, and the event happened in 1969. The middle verb should match: \"collected.\""},{"id":"tense-5","passage":"<p>Every morning, Ms. Alvarez <span class=\"blank\" aria-label=\"blank\">______<\/span> the class garden before the first bell rings.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["waters","watered","had watered","will have watered"],"correct":"A","domain":"SEC","concept":"tense","difficulty":"medium","explanation":"\"Every morning\" describes a habit that is still going on, and the other verb (\"rings\") is in the present tense. A regular, current habit uses the simple present: \"waters.\""},{"id":"tense-6","passage":"<p>Scientists now know that the Moon <span class=\"blank\" aria-label=\"blank\">______<\/span> slowly drifting away from Earth, by about 3.8 centimeters each year.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["was","had been","is","will be"],"correct":"C","domain":"SEC","concept":"tense","difficulty":"medium","explanation":"\"Now know\" and \"each year\" show that this is happening in the present and continuing, so the present tense \"is drifting\" fits. Past forms would suggest it has stopped."},{"id":"verbform-1","passage":"<p>The Golden Gate Bridge, painted a color known as International Orange, <span class=\"blank\" aria-label=\"blank\">______<\/span> San Francisco to Marin County.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["connecting","connects","to connect","having connected"],"correct":"B","domain":"SEC","concept":"verbform","difficulty":"medium","explanation":"Cover up the phrase between the commas: \"The Golden Gate Bridge <span class=\"blank\" aria-label=\"blank\">______<\/span> San Francisco…\" The sentence still needs a main verb, and only \"connects\" has a tense. The other forms can't be a sentence's main verb."},{"id":"verbform-2","passage":"<p>Marie Curie, who won Nobel Prizes in both physics and chemistry, <span class=\"blank\" aria-label=\"blank\">______<\/span> the first woman to win a Nobel Prize.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["being","to be","having been","was"],"correct":"D","domain":"SEC","concept":"verbform","difficulty":"medium","explanation":"The \"who\" clause has its own verb (\"won\"), but the main subject \"Marie Curie\" still needs one. \"Was\" is the only choice that can serve as a main verb."},{"id":"verbform-3","passage":"<p>The old lighthouse on the rocky point, built in 1872 and restored by volunteers in 2019, <span class=\"blank\" aria-label=\"blank\">______<\/span> visitors who climb its 120 steps every summer.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["now welcoming","now to welcome","now welcomes","having now welcomed"],"correct":"C","domain":"SEC","concept":"verbform","difficulty":"hard","explanation":"Remove the phrase between the commas, and you have \"The old lighthouse on the rocky point <span class=\"blank\" aria-label=\"blank\">______<\/span> visitors.\" The sentence needs a main verb with a tense: \"welcomes.\""},{"id":"verbform-4","passage":"<p>Emperor penguins huddle together in large groups to survive the Antarctic winter, <span class=\"blank\" aria-label=\"blank\">______<\/span> turns standing on the cold outer edge of the crowd.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["taking","they take","take","takes"],"correct":"A","domain":"SEC","concept":"verbform","difficulty":"hard","explanation":"The sentence already has a main verb (\"huddle\"), so the part after the comma should be a describing phrase: \"taking turns.\" B creates a comma splice, and C and D would need \"and\" to join a second verb."},{"id":"verbform-5","passage":"<p>The students in Mr. Park's class, after weeks of collecting data on local bird species, <span class=\"blank\" aria-label=\"blank\">______<\/span> their findings to the city council.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["presenting","to present","having presented","presented"],"correct":"D","domain":"SEC","concept":"verbform","difficulty":"medium","explanation":"The subject \"The students\" needs a main verb, and the interrupting phrase doesn't provide one (\"collecting\" belongs to the phrase). Only \"presented\" has a tense and can complete the sentence."},{"id":"verbform-6","passage":"<p>Petra, an ancient city carved into rose-colored sandstone cliffs in what is now Jordan, <span class=\"blank\" aria-label=\"blank\">______<\/span> once a busy center of trade.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["was","being","having been","to be"],"correct":"A","domain":"SEC","concept":"verbform","difficulty":"medium","explanation":"Skip the description between the commas: \"Petra <span class=\"blank\" aria-label=\"blank\">______<\/span> once a busy center of trade.\" It needs a main verb, and \"was\" is the only finite verb. The \"is\" inside the phrase belongs to the phrase, not the main sentence."},{"id":"possessive-1","passage":"<p>The <span class=\"blank\" aria-label=\"blank\">______<\/span> wings beat about 50 times per second, allowing it to hover in front of a flower.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["hummingbirds","hummingbird's","hummingbirds'","hummingbirds's"],"correct":"B","domain":"SEC","concept":"possessive","difficulty":"medium","explanation":"\"It\" later in the sentence shows there's just one bird, and the bird owns the wings. Singular possessive = 's: \"hummingbird's.\" D (\"-s's\") is never correct for a plural."},{"id":"possessive-2","passage":"<p>All three <span class=\"blank\" aria-label=\"blank\">______<\/span> costumes were sewn by parent volunteers from the drama club.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["actors","actor's","actors'","actors's"],"correct":"C","domain":"SEC","concept":"possessive","difficulty":"medium","explanation":"There are three actors (plural), and the costumes belong to them, so you need a plural possessive: add an apostrophe after the s, \"actors'.\" B would mean only one actor."},{"id":"possessive-3","passage":"<p>Several <span class=\"blank\" aria-label=\"blank\">______<\/span> from the local university visited our class to explain how they study earthquakes.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["scientist's","scientists","scientists'","scientist"],"correct":"B","domain":"SEC","concept":"possessive","difficulty":"medium","explanation":"\"Several\" means more than one, and the scientists don't own anything here (they just visited). So you need a simple plural with no apostrophe: \"scientists.\""},{"id":"possessive-4","passage":"<p>The <span class=\"blank\" aria-label=\"blank\">______<\/span> section of the library was moved to the second floor to make room for a new computer lab.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["childrens'","childrens","children's","childs'"],"correct":"C","domain":"SEC","concept":"possessive","difficulty":"hard","explanation":"\"Children\" is already plural (it doesn't end in s), so its possessive just adds 's: \"children's.\" \"Childrens\" isn't a word."},{"id":"possessive-5","passage":"<p>Both <span class=\"blank\" aria-label=\"blank\">______<\/span> teams wore matching blue jerseys, which confused the referees.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["schools'","schools","school's","schools's"],"correct":"A","domain":"SEC","concept":"possessive","difficulty":"hard","explanation":"\"Both\" means two schools (plural), and the teams belong to them, so use the plural possessive \"schools'.\" C would mean one school."},{"id":"possessive-6","passage":"<p>My <span class=\"blank\" aria-label=\"blank\">______<\/span> garden produced so many zucchini this summer that she gave a bag of them to every neighbor on her street.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["grandmothers","grandmothers'","grandmothers's","grandmother's"],"correct":"D","domain":"SEC","concept":"possessive","difficulty":"medium","explanation":"\"She\" shows there's one grandmother, and she owns the garden, so the singular possessive \"grandmother's\" is correct."},{"id":"modifier-1","passage":"<p>Covered in thick white fur, <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["the Arctic's snowy landscape hides the polar bear well.","the polar bear blends easily into the snowy Arctic landscape.","the snowy Arctic landscape is where the polar bear blends in easily.","blending easily into the snowy Arctic landscape is what the polar bear does."],"correct":"B","domain":"SEC","concept":"modifier","difficulty":"medium","explanation":"The polar bear is the thing covered in fur, so \"the polar bear\" must come right after the comma. A and C make it sound like the landscape has fur."},{"id":"modifier-2","passage":"<p>After practicing the piano for three hours, <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["Mia's fingers were sore.","the piano needed to be tuned.","Mia's fingers felt sore to her.","Mia rubbed her sore fingers."],"correct":"D","domain":"SEC","concept":"modifier","difficulty":"medium","explanation":"Mia did the practicing, so \"Mia\" must come right after the comma. In A and C, \"Mia's fingers\" comes first, which says the fingers practiced. In B, the piano practiced!"},{"id":"modifier-3","passage":"<p>Discovered in 1922 by archaeologist Howard Carter, <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["Tutankhamun's tomb contained more than 5,000 objects.","archaeologist Howard Carter found more than 5,000 objects in Tutankhamun's tomb.","Howard Carter's team cataloged more than 5,000 objects in Tutankhamun's tomb.","there were more than 5,000 objects in Tutankhamun's tomb."],"correct":"A","domain":"SEC","concept":"modifier","difficulty":"hard","explanation":"The tomb is what was discovered by Carter, so \"Tutankhamun's tomb\" must follow the comma. B would say Carter was discovered by himself, and C says his team was discovered."},{"id":"modifier-4","passage":"<p>Known for its towering sandstone arches, <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["visitors flock to Arches National Park in Utah each year.","Utah's Arches National Park draws more than a million visitors each year.","more than a million people visit Utah's Arches National Park each year.","each year more than a million visitors go to Utah's Arches National Park."],"correct":"B","domain":"SEC","concept":"modifier","difficulty":"medium","explanation":"The park is what's known for its arches (\"its\" refers to the park), so the park must come right after the comma. A, C, and D put visitors, people, or \"each year\" there instead."},{"id":"modifier-5","passage":"<p>Sprinting toward the finish line, <span class=\"blank\" aria-label=\"blank\">______<\/span> as the crowd cheered.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["Amara's legs began to burn","the crowd's cheers grew louder for Amara","Amara felt her legs begin to burn","the burning in Amara's legs grew stronger"],"correct":"C","domain":"SEC","concept":"modifier","difficulty":"hard","explanation":"Amara is the one sprinting, so her name must come first after the comma. A (\"Amara's legs\") makes the legs the sprinter, which is a common trap with possessives."},{"id":"modifier-6","passage":"<p>Written over the course of a single summer, <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["Leah finished her first novel just before school started.","Leah completed her first novel in time for the new school year.","Leah's first novel was finished just before school started.","finishing her first novel just before school started was Leah's proudest moment."],"correct":"C","domain":"SEC","concept":"modifier","difficulty":"medium","explanation":"The novel is what was written, so \"Leah's first novel\" must follow the comma. A and B make it sound like Leah herself was written over a summer."},{"id":"transition-1","passage":"<p>Penguins are birds, but they cannot fly. <span class=\"blank\" aria-label=\"blank\">______<\/span> their wings have evolved into stiff flippers that make them powerful swimmers.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["For this reason,","Instead,","Similarly,","For example,"],"correct":"B","domain":"EI","concept":"transition","difficulty":"medium","explanation":"The second sentence tells what penguin wings do in place of flying, so \"Instead\" fits. The flippers aren't caused by the inability to fly (A), and swimming isn't an example of not flying (D)."},{"id":"transition-2","passage":"<p>The bridge's steel cables had begun to rust after decades of exposure to salty sea air. <span class=\"blank\" aria-label=\"blank\">______<\/span> city engineers closed the bridge to heavy trucks until repairs could be made.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["However,","For example,","As a result,","Likewise,"],"correct":"C","domain":"EI","concept":"transition","difficulty":"medium","explanation":"The rust (cause) led to closing the bridge to heavy trucks (effect), so \"As a result\" is the logical link. There's no contrast, so \"However\" doesn't fit."},{"id":"transition-3","passage":"<p>Many animals use tools. <span class=\"blank\" aria-label=\"blank\">______<\/span> chimpanzees strip the leaves from twigs and poke the twigs into termite mounds to fish out insects.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["For instance,","Nevertheless,","In contrast,","Therefore,"],"correct":"A","domain":"EI","concept":"transition","difficulty":"medium","explanation":"The second sentence gives a specific example of the general statement \"Many animals use tools,\" so \"For instance\" is correct."},{"id":"transition-4","passage":"<p>Bamboo grows remarkably fast; some species can grow nearly a meter in a single day. <span class=\"blank\" aria-label=\"blank\">______<\/span> bamboo is extremely strong for its weight, which makes it a popular building material in many parts of Asia.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["Instead,","In contrast,","For example,","Moreover,"],"correct":"D","domain":"EI","concept":"transition","difficulty":"medium","explanation":"The second sentence adds another impressive quality of bamboo (strength) to the first one (speed of growth). \"Moreover\" means \"in addition.\" There's no contrast, and strength isn't an example of fast growth."},{"id":"transition-5","passage":"<p>The team's robot failed to complete the obstacle course in both of the first two rounds of the competition. <span class=\"blank\" aria-label=\"blank\">______<\/span> the judges awarded the team a prize for the most creative design.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["Consequently,","Even so,","For instance
