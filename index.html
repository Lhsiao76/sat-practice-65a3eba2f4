ts under <span class=\"blank\" aria-label=\"blank\">______<\/span> original name.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["their","its","it's","they're"],"correct":"B","domain":"SEC","concept":"pronoun","difficulty":"medium","explanation":"The antecedent of the pronoun is \"each\" (each company), which is singular, so it takes \"its.\" Don't match the pronoun to \"two toy companies.\""},{"id":"transition-9","passage":"<p>The ancient Romans built roads so well that some are still in use today, nearly 2,000 years later. <span class=\"blank\" aria-label=\"blank\">______<\/span> many modern highways need major repairs after only a few decades.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["By contrast,","For example,","As a result,","Likewise,"],"correct":"A","domain":"EI","concept":"transition","difficulty":"hard","explanation":"Roads lasting 2,000 years and highways needing repairs within decades are opposites, so a contrast transition fits. Modern highways aren't an example of Roman roads or a result of them."},{"id":"transition-10","passage":"<p>Many people assume that a slowing metabolism is the main reason adults gain weight as they age. <span class=\"blank\" aria-label=\"blank\">______<\/span> a large 2021 study found that metabolism stays fairly steady from about age 20 to age 60.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["Accordingly,","Similarly,","However,","For instance,"],"correct":"C","domain":"EI","concept":"transition","difficulty":"hard","explanation":"The study's finding contradicts the common assumption, so a contrast word is needed. \"Accordingly\" and \"For instance\" would suggest the study supports the assumption."},{"id":"transition-11","passage":"<p>The first tea bags were reportedly small silk pouches meant only to hold samples of loose tea for customers to try at home. <span class=\"blank\" aria-label=\"blank\">______<\/span> some customers began brewing the tea without removing it from the pouches, and a new way of making tea caught on.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["In other words,","Soon, however,","Similarly,","In conclusion,"],"correct":"B","domain":"EI","concept":"transition","difficulty":"hard","explanation":"The pouches were meant only as sample holders, but customers used them in an unexpected way. \"Soon, however\" shows a change over time that goes against the original purpose. The second sentence isn't a restatement (A) or a conclusion (D)."},{"id":"transition-12","passage":"<p>Recycling one aluminum can saves enough energy to run a television for about three hours. <span class=\"blank\" aria-label=\"blank\">______<\/span> recycling aluminum uses about 95 percent less energy than making new aluminum from raw ore.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["Nevertheless,","Instead,","In contrast,","In fact,"],"correct":"D","domain":"EI","concept":"transition","difficulty":"medium","explanation":"The second sentence backs up and strengthens the first with an even bigger fact about the energy savings. \"In fact\" adds emphasis in the same direction. There's no contrast."},{"id":"transition-13","passage":"<p>The marathon's organizers had prepared for warm weather, setting up extra water stations along the course. <span class=\"blank\" aria-label=\"blank\">______<\/span> the morning of the race brought cold rain and strong wind, and runners needed blankets more than water.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["As it turned out,","For this reason,","Similarly,","In addition,"],"correct":"A","domain":"EI","concept":"transition","difficulty":"hard","explanation":"The organizers expected heat, but what actually happened was the opposite. \"As it turned out\" signals an outcome different from what was expected. \"For this reason\" wrongly suggests that the planning caused the rain."},{"id":"synthesis-8","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>The Mariana Trench is in the western Pacific Ocean.<\/li><li>Its deepest known point, the Challenger Deep, is about 10,900 meters below sea level.<\/li><li>Mount Everest rises about 8,850 meters above sea level.<\/li><li>In 1960, Jacques Piccard and Don Walsh became the first people to reach the Challenger Deep.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize how deep the Challenger Deep is by making a comparison. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The Challenger Deep is about 10,900 meters deep, so Mount Everest, at about 8,850 meters tall, could fit inside with room to spare.","The Mariana Trench is located in the western Pacific Ocean.","In 1960, Jacques Piccard and Don Walsh became the first people to descend to the Challenger Deep, which lies about 10,900 meters below sea level.","Mount Everest rises about 8,850 meters above sea level."],"correct":"A","domain":"EI","concept":"synthesis","difficulty":"hard","explanation":"The goal requires a comparison that shows depth, and only A compares the trench's depth with Everest's height. D gives Everest's height alone, with no comparison. C gives the depth but makes no comparison."},{"id":"synthesis-9","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Octavia E. Butler was an American science fiction author.<\/li><li>She published her first novel, <em>Patternmaster<\/em>, in 1976.<\/li><li>In 1995, she became the first science fiction writer to receive a MacArthur Fellowship, an award sometimes called a \"genius grant.\"<\/li><li>Her novel <em>Kindred<\/em> is often taught in schools.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize an achievement that made Butler a \"first.\" Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Butler's novel <em>Kindred<\/em> is often taught in schools.","In 1995, Octavia E. Butler became the first science fiction writer to receive a MacArthur Fellowship.","Butler published her first novel, <em>Patternmaster<\/em>, in 1976, nearly two decades before receiving a MacArthur Fellowship.","Octavia E. Butler was an American science fiction author."],"correct":"B","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"The goal asks for an achievement that was a \"first.\" Only B describes one. C mentions her \"first novel,\" but that's simply her first book, not a first-ever achievement."},{"id":"synthesis-10","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Some city bike-share programs use docking stations, where bikes must be picked up and returned.<\/li><li>Other programs are \"dockless\": bikes can be left anywhere within a service area.<\/li><li>Docking stations keep sidewalks orderly.<\/li><li>Dockless bikes are more convenient for riders but are sometimes left blocking sidewalks.<\/li><\/ul>","chart":null,"stem":"The student wants to present the main tradeoff between the two types of programs. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Some bike-share programs use docking stations, where bikes must be picked up and returned, which keeps sidewalks orderly.","Dockless bikes can be left anywhere within a service area.","Docking stations keep sidewalks orderly, while dockless bikes are more convenient but sometimes end up blocking sidewalks.","Bike-share programs give riders a way to travel around a city."],"correct":"C","domain":"EI","concept":"synthesis","difficulty":"hard","explanation":"A tradeoff means each option has an advantage the other lacks. C shows that docks are orderly and dockless bikes are convenient but can be messy. The other choices describe only one type."},{"id":"synthesis-11","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Ada Lovelace was a mathematician born in London in 1815.<\/li><li>She worked with Charles Babbage on his design for a mechanical computer called the Analytical Engine.<\/li><li>In 1843, she published notes that included a step-by-step method for the machine to calculate a series of numbers.<\/li><li>Many historians consider this method the first published computer program.<\/li><\/ul>","chart":null,"stem":"The student wants to explain why Lovelace is often called the first computer programmer. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Ada Lovelace, a mathematician born in London in 1815, worked with Charles Babbage on his design for a mechanical computer called the Analytical Engine.","Lovelace worked with Charles Babbage.","The Analytical Engine was a mechanical computer designed by Charles Babbage.","Lovelace's 1843 notes included a step-by-step method for Babbage's Analytical Engine to calculate numbers, which many historians consider the first published computer program."],"correct":"D","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"To explain WHY she's called the first programmer, you need the method she wrote and that historians see it as the first program. D includes both. A, B, and C mention Babbage or his machine but not the program she wrote."},{"id":"synthesis-12","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>In 2019, researchers attached tiny tracking devices to 50 Arctic terns.<\/li><li>Arctic terns migrate between the Arctic and Antarctica each year.<\/li><li>The researchers wanted to learn which routes the birds take and where they stop to rest.<\/li><li>Some of the tracked birds flew more than 90,000 kilometers in a single year.<\/li><\/ul>","chart":null,"stem":"The student wants to present the aim of the research study. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["To learn which routes Arctic terns take and where they stop to rest, researchers attached tracking devices to 50 of the birds in 2019.","Some Arctic terns flew more than 90,000 kilometers in a single year.","Arctic terns migrate between the Arctic and Antarctica each year.","In 2019, researchers attached tiny tracking devices to 50 Arctic terns, and some of the tracked birds flew more than 90,000 kilometers in a single year."],"correct":"A","domain":"EI","concept":"synthesis","difficulty":"hard","explanation":"The \"aim\" is what the researchers wanted to learn, and A states it directly. B is a result, and D describes the method and a result without the purpose."},{"id":"synthesis-13","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>The Great Pyramid of Giza was completed around 2560 BCE.<\/li><li>It was built as a tomb for the pharaoh Khufu.<\/li><li>The Colosseum in Rome was completed in 80 CE.<\/li><li>It was built as an arena for public games and shows.<\/li><\/ul>","chart":null,"stem":"The student wants to contrast the purposes of the two structures. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The Great Pyramid was completed around 2560 BCE, more than two thousand six hundred years before the Colosseum in Rome was completed in 80 CE.","While the Great Pyramid was built as a tomb for the pharaoh Khufu, the Colosseum was an arena for public games and shows.","Both the Great Pyramid and the Colosseum are famous ancient structures.","The Colosseum, in Rome, was completed in 80 CE."],"correct":"B","domain":"EI","concept":"synthesis","difficulty":"hard","explanation":"The goal is to contrast PURPOSES. B sets \"tomb\" against \"arena\" with \"While.\" A contrasts dates, not purposes, which is a common trap."},{"id":"synthesis-14","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Ynes Mexia was a Mexican American botanist.<\/li><li>She began studying plants in her fifties.<\/li><li>She collected about 145,000 plant specimens on expeditions across the Americas.<\/li><li>Around 500 of the plants she collected were new to science.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize how productive Mexia was as a plant collector. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Ynes Mexia was a Mexican American botanist.","Ynes Mexia, a Mexican American botanist, began studying plants in her fifties and later went on collecting expeditions across the Americas.","On expeditions across the Americas, Mexia collected about 145,000 plant specimens, around 500 of which were new to science.","Mexia was a botanist who went on expeditions."],"correct":"C","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"\"Productive\" means she produced a lot, and C gives the impressive numbers. B is interesting but is about when she started, not how much she collected. B mentions her expeditions but gives no sense of how much she collected."},{"id":"synthesis-15","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>In 2017, Middleton School started its classes 50 minutes later in the morning.<\/li><li>Before the change, classes had started at 7:30 a.m.<\/li><li>After the change, students slept an average of 34 more minutes per night.<\/li><li>Attendance also improved after the change.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize the effects of the later start time. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Before 2017, classes at Middleton School started at 7:30 a.m., but that year the school moved the start of its classes 50 minutes later.","In 2017, Middleton School changed its daily schedule.","Middleton School's later start time began in 2017.","After Middleton School moved its start time 50 minutes later, students slept an average of 34 more minutes per night, and attendance improved."],"correct":"D","domain":"EI","concept":"synthesis","difficulty":"hard","explanation":"\"Effects\" means results. D gives both results (more sleep, better attendance). A, B, and C describe the change itself, not what it led to."},{"id":"synthesis-16","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Many animals use camouflage to avoid predators.<\/li><li>The leaf-tailed gecko of Madagascar has a flat, wrinkled tail that looks like a dead leaf.<\/li><li>Some moths have wing patterns that resemble tree bark.<\/li><li>Camouflage can also help predators sneak up on prey.<\/li><\/ul>","chart":null,"stem":"The student wants to give a specific example of an animal that uses camouflage. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The leaf-tailed gecko of Madagascar has a flat, wrinkled tail that looks like a dead leaf.","Many animals use camouflage to avoid predators.","Camouflage can also help predators sneak up on prey.","Camouflage is used by animals around the world."],"correct":"A","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"The goal asks for a SPECIFIC example, and A names one animal and describes its disguise. B and C are general statements about camouflage, not examples."},{"id":"synthesis-17","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>The Brooklyn Bridge opened in New York City in 1883.<\/li><li>When it opened, it was the longest suspension bridge in the world.<\/li><li>It was the first suspension bridge to use steel wire for its cables.<\/li><li>Today, more than 100,000 vehicles cross it each day.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize what made the bridge an engineering milestone when it opened. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The Brooklyn Bridge opened in New York City in 1883.","Today, more than 100,000 vehicles cross the Brooklyn Bridge each day, well over a century after it first opened in New York City in 1883.","When it opened in 1883, the Brooklyn Bridge was the world's longest suspension bridge and the first to use steel wire for its cables.","The Brooklyn Bridge is located in New York City."],"correct":"C","domain":"EI","concept":"synthesis","difficulty":"hard","explanation":"The goal focuses on what was groundbreaking WHEN IT OPENED, and C gives both records. B is impressive, but it describes today's traffic, not an engineering milestone from 1883."},{"id":"synthesis-18","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>The blue whale is the largest animal known to have ever lived.<\/li><li>An adult blue whale can be about 30 meters long.<\/li><li>The whale shark is the largest living fish.<\/li><li>An adult whale shark is typically about 12 meters long.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize the difference in length between the two animals. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The whale shark is the largest living fish.","An adult blue whale, at about 30 meters long, can be more than twice the length of a typical 12-meter adult whale shark.","Both the blue whale and the whale shark live in the ocean.","The blue whale is the largest animal known to have ever lived, while the whale shark holds the title of the largest living fish."],"correct":"B","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"A difference in length requires both lengths, and B compares them directly. C points out a similarity, the opposite of the goal. D contrasts the two animals' records but gives no lengths, so it can't show how different they are."},{"id":"synthesis-19","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Researchers studied whether listening to music while studying affects test scores.<\/li><li>Sixty college students took part.<\/li><li>Students who studied in silence scored slightly higher than students who listened to music with lyrics.<\/li><li>The study tested only one type of test: vocabulary quizzes.<\/li><\/ul>","chart":null,"stem":"The student wants to acknowledge a limitation of the study. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Students who studied in silence scored slightly higher than those who listened to music with lyrics.","Sixty college students took part in a study about music and studying.","Researchers studied whether listening to music while studying affects test scores.","Because the study tested only vocabulary quizzes, its results may not apply to other kinds of tests."],"correct":"D","domain":"EI","concept":"synthesis","difficulty":"hard","explanation":"A limitation is a reason the results might not apply widely. D uses the \"only vocabulary quizzes\" note to point that out. A reports the result, not a limitation."},{"id":"wic-e1","passage":"<p>Marine biologist Tomás Ferreira spent three summers counting sea turtle nests on a small island off the coast of Brazil. Because the number of nests stayed nearly the same from one year to the next, Ferreira described the island's turtle population as <span class=\"blank\" aria-label=\"blank\">______<\/span>, though he noted that a single severe storm season could change that.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["growing","unusual","threatened","stable"],"correct":"D","domain":"CS","concept":"wic","difficulty":"easy","explanation":"The nest count \"stayed nearly the same\" each year, so the population is \"stable.\" \"Growing\" contradicts that clue, and \"threatened\" goes against it too: the text says only that a storm \"could change that,\" so the population is fine for now.","source":"calibration-2026-10-07"},{"id":"wic-e2","passage":"<p>In her study of city parks, urban planner Grace Odum found that parks with benches, shade trees, and drinking fountains drew far more visitors than parks without them. These simple features, Odum concluded, play an <span class=\"blank\" aria-label=\"blank\">______<\/span> role in whether people choose to spend time outdoors in a city.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["unclear","accidental","artistic","important"],"correct":"D","domain":"CS","concept":"wic","difficulty":"easy","explanation":"Parks with the features \"drew far more visitors,\" so the features matter a lot: their role is \"important.\" \"Unclear\" is tempting, but Odum reached a definite conclusion, so the role isn't unclear.","source":"calibration-2026-10-07"},{"id":"wic-e3","passage":"<p class=\"intro\">The following text is from an original short story.<\/p>\n<p>Leila had heard that her new teacher was strict, so she was surprised when Mr. Castillo greeted each student by name and laughed easily at their jokes. Still, she soon learned that he had a sharp eye: no unfinished homework assignment or whispered conversation ever escaped his attention.<\/p>","chart":null,"stem":"As used in the text, what does the word \"sharp\" most nearly mean?","choices":["pointed","painful","alert","sudden"],"correct":"C","domain":"CS","concept":"wic","difficulty":"easy","explanation":"After the colon, the text explains that nothing \"escaped his attention,\" so a \"sharp eye\" is an alert one. \"Pointed\" is the literal meaning of \"sharp\" (a sharp knife), but it doesn't fit an eye that notices things.","source":"calibration-2026-10-07"},{"id":"wic-e4","passage":"<p>Many early films had no recorded sound, so theaters often hired musicians to play live music during each showing. Once technology made it possible to record sound directly onto film in the late 1920s, these live performances became less <span class=\"blank\" aria-label=\"blank\">______<\/span>, and by the mid-1930s most theaters had stopped hiring musicians.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["enjoyable","skilled","necessary","expensive"],"correct":"C","domain":"CS","concept":"wic","difficulty":"easy","explanation":"Musicians were hired because films had no sound. When films could carry their own sound, live music was no longer needed, so it became less \"necessary.\" Nothing in the text says the music became less \"enjoyable\"; the change came from the technology.","source":"calibration-2026-10-07"},{"id":"wic-e5","passage":"<p>Chef Amara Diallo keeps her restaurant's menu short, offering only six main dishes at a time. She says that a <span class=\"blank\" aria-label=\"blank\">______<\/span> menu allows her kitchen staff to prepare every dish with care instead of rushing to make dozens of different meals.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["seasonal","colorful","limited","expensive"],"correct":"C","domain":"CS","concept":"wic","difficulty":"easy","explanation":"The menu is \"short,\" with \"only six main dishes,\" which describes a \"limited\" menu. \"Seasonal\" is a real type of menu, but the text is about the number of dishes, not when they are served.","source":"calibration-2026-10-07"},{"id":"structure-e1","passage":"<p>Every spring, volunteers in the town of Millbrook gather along Cedar Creek to pick up trash that washed downstream during winter storms. Last year, more than 200 people took part, collecting nearly two tons of plastic bottles, bags, and other waste in a single afternoon. Organizer Dana Whitfield says the event has grown each year since it began in 2015, and that the creek is now noticeably cleaner, with more fish and birds returning to the area.<\/p>","chart":null,"stem":"Which choice best states the main purpose of the text?","choices":["To explain how winter storms carry trash into nearby streams and rivers","To describe a community cleanup event and its effects on a local creek","To argue that towns should pass stricter laws to prevent people from littering","To compare Millbrook's cleanup event with similar events held in other towns"],"correct":"B","domain":"CS","concept":"structure","difficulty":"easy","explanation":"The whole text describes the cleanup (who, when, how much trash) and ends with its results (a cleaner creek and returning wildlife). Storms are mentioned only as the reason trash ends up in the creek, so explaining how storms move trash isn't the main purpose.","source":"calibration-2026-10-07"},{"id":"structure-e2","passage":"<p><u>For centuries, many people believed that touching a toad could give a person warts.<\/u> Scientists now know that this idea is false. Warts are caused by a virus that spreads between people, not by contact with toads or frogs. The bumps on a toad's skin are actually glands, and some of them release substances that make the toad taste bad to predators.<\/p>","chart":null,"stem":"Which choice best describes the function of the underlined sentence in the text as a whole?","choices":["It presents a common belief that the rest of the text shows to be incorrect.","It describes a scientific finding that the rest of the text supports with evidence.","It explains the purpose of the bumps found on a toad's skin.","It introduces a question about toads and warts that scientists have not yet been able to answer."],"correct":"A","domain":"CS","concept":"structure","difficulty":"easy","explanation":"The next sentence says \"this idea is false,\" and the rest of the text explains why, so the underlined sentence sets up a belief that the text corrects. The bumps' purpose is explained later in the text, not in the underlined sentence.","source":"calibration-2026-10-07"},{"id":"crosstext-e1","passage":"<p class=\"caption\">Text 1<\/p>\n<p>Many people assume that young children learn best in classrooms decorated with colorful posters, maps, and artwork. Bright, busy walls, the thinking goes, make a classroom more exciting and keep students engaged in their lessons. As a result, many teachers spend hours before each school year covering nearly every wall.<\/p>\n<p class=\"caption\">Text 2<\/p>\n<p>Over two weeks, psychologist Hana Kimura and her team taught kindergartners short science lessons in two rooms: one with heavily decorated walls and one with nearly bare walls. Children in the decorated room spent more time looking around the room and less time paying attention to the lesson, and afterward they scored lower on quizzes than the children in the bare room did.<\/p>","chart":null,"stem":"Based on the texts, how would Kimura and her team (Text 2) most likely respond to the assumption described in Text 1?","choices":["They would argue that heavily decorated walls may distract young children instead of helping them learn.","They would agree that colorful decorations help young children pay closer attention during lessons.","They would suggest that science is harder for young children to learn than other school subjects are.","They would claim that most kindergartners prefer bare classrooms to brightly decorated ones."],"correct":"A","domain":"CS","concept":"crosstext","difficulty":"easy","explanation":"In Kimura's study, children in the decorated room paid less attention and scored lower, so the team would push back on the idea that busy walls help learning. The study measured attention and quiz scores, not which room children liked better, so the claim about what kindergartners prefer isn't supported.","source":"calibration-2026-10-07"},{"id":"central-e1","passage":"<p>Honeybees are famous for making honey, but they also play a major role in growing much of the food that people eat. As bees move from flower to flower collecting nectar, they carry pollen that allows many plants to produce fruits and seeds. Crops such as apples, almonds, and blueberries depend heavily on this process. In fact, some farmers rent hives of honeybees each year and place them in their fields to make sure their crops are pollinated.<\/p>","chart":null,"stem":"Which choice best states the main idea of the text?","choices":["Honeybees make more honey when they collect nectar from apple and almond trees.","Farmers who rent honeybee hives earn more money than farmers who do not.","Honeybees prefer to collect nectar from blueberries rather than from other plants.","Honeybees are important to food production because they pollinate many crops."],"correct":"D","domain":"II","concept":"central","difficulty":"easy","explanation":"Every sentence supports the idea that bees matter for food because they pollinate crops: they carry pollen, crops depend on it, and farmers rent hives. The text never compares farmers' earnings, so the choice about renting hives and money goes beyond what the text says.","source":"calibration-2026-10-07"},{"id":"central-e2","passage":"<p class=\"intro\">The following text is from an original short story.<\/p>\n<p>For weeks, Priya had dreaded moving to a new city. She would miss her friends, her school, and the corner bakery where she bought a cinnamon roll every Saturday. But on her first morning in the new apartment, she opened the window and heard music drifting up from the street below, where a band was setting up for a neighborhood festival. Priya leaned out to watch, and for the first time in weeks, she smiled.<\/p>","chart":null,"stem":"Which choice best states the main idea of the text?","choices":["Priya discovers that her new neighborhood has a better bakery than her old one.","After an unexpected moment, Priya begins to feel hopeful about her new home.","Priya decides to join a band so that she can make friends in her new city.","Priya regrets moving because her new apartment is noisier than her old one."],"correct":"B","domain":"II","concept":"central","difficulty":"easy","explanation":"The text moves from Priya dreading the move to smiling \"for the first time in weeks\" after hearing the festival music, so she starts to feel hopeful. The music cheers her up rather than bothering her, so the idea that she finds the apartment too noisy reverses the text.","source":"calibration-2026-10-07"},{"id":"detail-e1","passage":"<p class=\"intro\">The following text is from an original short story. Ruth is helping her grandfather in his workshop.<\/p>\n<p>Ruth handed her grandfather the small brass hinge, and he turned it over slowly in his fingers. \"This came from the cabinet my father built,\" he said. \"It's older than I am.\" He polished the hinge with a soft cloth until it shone, then fitted it carefully onto the new cabinet door that he and Ruth had spent all week building. \"Now,\" he said, smiling, \"a piece of the old cabinet will always be part of the new one.\"<\/p>","chart":null,"stem":"According to the text, why does Ruth's grandfather put the brass hinge on the new cabinet?","choices":["He could not find any new hinges that fit the cabinet door.","He wants part of an older cabinet to be included in the new one.","He wants to teach Ruth how to polish old pieces of metal until they shine like new.","He plans to sell the new cabinet to a collector of antiques."],"correct":"B","domain":"II","concept":"detail","difficulty":"easy","explanation":"The grandfather says it directly: \"a piece of the old cabinet will always be part of the new one.\" He does polish the hinge, but nothing suggests he is doing it to teach Ruth a skill.","source":"calibration-2026-10-07"},{"id":"detail-e2","passage":"<p>In 2015, the New Horizons spacecraft flew past Pluto and sent back the first detailed images of its surface. Scientists were surprised to see a large, heart-shaped region of smooth ice with almost no craters. Because craters build up over time as space rocks strike a surface, the lack of craters told scientists that the ice in this region must be relatively young, probably formed or resurfaced within the last ten million years.<\/p>","chart":null,"stem":"According to the text, why did scientists conclude that the ice in the heart-shaped region is relatively young?","choices":["It has almost no craters on its surface.","It has a shape that looks like a heart.","It is brighter than other parts of Pluto.","It was first photographed by a spacecraft in 2015."],"correct":"A","domain":"II","concept":"detail","difficulty":"easy","explanation":"The text explains that craters build up over time, so \"the lack of craters\" showed the ice is young. The heart shape is a real detail from the text, but it isn't the reason given for the conclusion.","source":"calibration-2026-10-07"},{"id":"coe-text-e1","passage":"<p>Ecologist Ravi Menon noticed that a species of small songbird in his study area seemed to sing at higher pitches near busy roads than in quiet forests. Menon hypothesized that the birds raise the pitch of their songs so that they can be heard over the low rumble of traffic noise.<\/p>","chart":null,"stem":"Which finding, if true, would most directly support Menon's hypothesis?","choices":["The songbirds living near roads were slightly larger, on average, and had longer tails than the songbirds living in forests.","The songbirds living near roads sang at the same pitch whether traffic was heavy or light.","Several other bird species also live near the busy roads in Menon's study area.","When recordings of traffic noise were played in quiet forests, the birds there began singing at higher pitches."],"correct":"D","domain":"II","concept":"coe-text","difficulty":"easy","explanation":"If adding traffic noise alone makes forest birds sing higher, that links the pitch change to the noise, just as Menon proposes. Birds singing at the same pitch whether traffic is heavy or light would weaken the hypothesis, not support it.","source":"calibration-2026-10-07"},{"id":"coe-text-e2","passage":"<p>In a novel about a family that lives near a lighthouse, the narrator often describes her younger brother, Theo, as endlessly curious about how everyday objects work.<\/p>","chart":null,"stem":"Which quotation from the novel most effectively illustrates the claim?","choices":["\"Theo was the tallest boy in his class by nearly a full head, and he liked to stand at the back of every school photograph.\"","\"Theo took apart the kitchen clock to see what made it tick, then asked Father what each tiny gear was for.\"","\"Theo liked to sleep late on Saturday mornings, long after the rest of us had finished breakfast and gone outside to work.\"","\"Theo always waited by the front window for the mail carrier, hoping that a letter from our cousin had finally arrived.\""],"correct":"B","domain":"II","concept":"coe-text","difficulty":"easy","explanation":"Taking apart a clock and asking what each gear does shows curiosity about how an object works. Waiting for a letter shows hope or excitement, but not curiosity about how things work.","source":"calibration-2026-10-07"},{"id":"coe-quant-e1","passage":"<p class=\"caption\">Students Who Biked to Lincoln High School<\/p>\n<table class=\"data\"><thead><tr><th>Month<\/th><th>Number of students<\/th><\/tr><\/thead><tbody><tr><td>September<\/td><td>46<\/td><\/tr><tr><td>October<\/td><td>39<\/td><\/tr><tr><td>November<\/td><td>22<\/td><\/tr><tr><td>December<\/td><td>8<\/td><\/tr><\/tbody><\/table>\n<p>A school's student council counted how many students rode bicycles to Lincoln High School on one day each month. The council found that biking to school dropped sharply as the weather grew colder. For example, <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most effectively uses data from the table to complete the example?","choices":["22 students biked to school in October, and 39 biked in November.","46 students biked to school in September, but only 8 biked in December.","more students biked to school in November than in October.","46 students biked to school in September, more than in any other month shown."],"correct":"B","domain":"II","concept":"coe-quant","difficulty":"easy","explanation":"The example has to show a big drop as the months get colder, and 46 in September down to 8 in December does that accurately. The September total is correct, but on its own it shows no drop at all. The other two choices misread the table.","source":"calibration-2026-10-07"},{"id":"coe-quant-e2","passage":"<p>A student researched how many hours of daylight four US cities receive on June 21. The student claims that on this date, the farther north a city is, the more hours of daylight it receives. Of the four cities, Miami is the farthest south, followed by Denver, Seattle, and Anchorage, which is the farthest north.<\/p>","chart":{"type":"bar","title":"Hours of Daylight on June 21","yLabel":"Hours of daylight","labels":["Miami","Denver","Seattle","Anchorage"],"values":[13.8,15.0,16.0,19.4]},"stem":"Which choice most effectively uses data from the graph to support the student's claim?","choices":["Anchorage had about 19.4 hours of daylight, while Miami had about 13.8 hours.","Denver had about 16.0 hours of daylight, while Seattle had about 15.0 hours.","Denver and Seattle each had about 15.0 hours of daylight.","Each of the four cities had more than 12 hours of daylight."],"correct":"A","domain":"II","concept":"coe-quant","difficulty":"easy","explanation":"Anchorage is farthest north and Miami is farthest south, and the graph shows Anchorage with far more daylight (19.4 hours compared with 13.8), which supports the claim. It's true that every city had more than 12 hours, but that doesn't compare north with south. The Denver and Seattle choices misread the graph.","source":"calibration-2026-10-07"},{"id":"inference-e1","passage":"<p>Sea otters eat large numbers of sea urchins, which feed on kelp, a type of seaweed that forms underwater forests. In parts of the Pacific coast where sea otters were hunted until few remained, sea urchin populations grew rapidly and many kelp forests disappeared. When sea otters were protected and returned to some of these areas, researchers observed that <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most logically completes the text?","choices":["sea urchins in those areas began eating more kelp than before.","the kelp forests in those areas began to grow back.","sea otters in those areas began to feed mainly on kelp.","the number of sea urchins in those areas increased even further."],"correct":"B","domain":"II","concept":"inference","difficulty":"easy","explanation":"Otters eat urchins, and urchins eat kelp. When otters return, there are fewer urchins, so the kelp can recover. More urchins, or urchins eating more kelp, is the pattern from when the otters were gone, the reverse of what returning otters would cause.","source":"calibration-2026-10-07"},{"id":"boundaries-e1","passage":"<p>Lake Baikal in southern Siberia holds more fresh water than any other lake in the world. In winter, its surface freezes so solidly that the ice can be more than a meter <span class=\"blank\" aria-label=\"blank\">______<\/span> trucks sometimes drive across it on routes marked by local officials.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["thick and","thick, and","thick,","thick"],"correct":"B","domain":"SEC","concept":"boundaries","difficulty":"easy","explanation":"Two independent clauses (\"the ice can be more than a meter thick\" and \"trucks sometimes drive across it...\") are joined correctly with a comma plus \"and.\" A comma alone makes a comma splice, no punctuation makes a run-on, and \"and\" with no comma doesn't follow the convention for joining two independent clauses.","source":"calibration-2026-10-07"},{"id":"boundaries-e2","passage":"<p>In 1905, Madam C. J. Walker started a hair-care company that eventually employed thousands of people, most of them women. The <span class=\"blank\" aria-label=\"blank\">______<\/span> one of the first American women to become a self-made millionaire.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["company, made her","company; made her","company made her","company: made her"],"correct":"C","domain":"SEC","concept":"boundaries","difficulty":"easy","explanation":"\"The company\" is the subject and \"made\" is its verb, and no punctuation belongs between a subject and its verb. A comma, semicolon, or colon would split the sentence in the wrong place.","source":"calibration-2026-10-07"},{"id":"colon-e1","passage":"<p>The museum's new exhibit focuses on a single <span class=\"blank\" aria-label=\"blank\">______<\/span> ancient Polynesian navigators crossed thousands of kilometers of open ocean using only the stars, the waves, and the flight paths of birds as guides.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["question; how","question. How","question how","question: how"],"correct":"D","domain":"SEC","concept":"colon","difficulty":"easy","explanation":"The colon introduces the question the exhibit focuses on, which explains \"a single question.\" A semicolon or a period would leave \"how ancient Polynesian navigators crossed...\" as a fragment, and no punctuation runs the two parts together.","source":"calibration-2026-10-07"},{"id":"supplement-e1","passage":"<p>Mae Jemison, a doctor and <span class=\"blank\" aria-label=\"blank\">______<\/span> became the first African American woman to travel to space when she flew aboard the space shuttle Endeavour in 1992. Before joining NASA, she had served as a medical officer in the Peace Corps.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["engineer,","engineer","engineer;","engineer—"],"correct":"A","domain":"SEC","concept":"supplement","difficulty":"easy","explanation":"The phrase \"a doctor and engineer\" is extra information about Mae Jemison. It opens with a comma, so it has to close with a comma. A dash can't close a phrase that opened with a comma, a semicolon would cut the sentence apart, and leaving out the comma leaves the phrase unclosed.","source":"calibration-2026-10-07"},{"id":"supplement-e2","passage":"<p>The giant panda—a bear native to the mountains of central <span class=\"blank\" aria-label=\"blank\">______<\/span> spends up to fourteen hours a day eating bamboo. Because bamboo provides little nutrition, an adult panda must eat between 12 and 38 kilograms of it every day.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["China,","China;","China","China—"],"correct":"D","domain":"SEC","concept":"supplement","difficulty":"easy","explanation":"The extra phrase \"a bear native to the mountains of central China\" opens with a dash, so it has to close with a dash. A comma or semicolon doesn't match the opening dash, and no punctuation leaves the phrase unclosed.","source":"calibration-2026-10-07"},{"id":"sva-e1","passage":"<p>The bright colors on a poison dart frog's skin <span class=\"blank\" aria-label=\"blank\">______<\/span> predators that the frog is toxic and should not be eaten. Scientists call this kind of warning coloration aposematism.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["warns","is warning","has warned","warn"],"correct":"D","domain":"SEC","concept":"sva","difficulty":"easy","explanation":"The subject is the plural \"colors,\" not \"skin,\" which is part of the phrase \"on a poison dart frog's skin.\" A plural subject takes the plural verb \"warn.\" The other choices are singular verbs.","source":"calibration-2026-10-07"},{"id":"sva-e2","passage":"<p>Every year, thousands of runners from around the world travel to Massachusetts to compete in the Boston Marathon. The race, which was first held in 1897, <span class=\"blank\" aria-label=\"blank\">______<\/span> the oldest annual marathon in the world.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["are","were","have been","is"],"correct":"D","domain":"SEC","concept":"sva","difficulty":"easy","explanation":"The subject is the singular \"race,\" and the phrase \"which was first held in 1897\" doesn't change that. A singular subject takes the singular verb \"is.\" \"Are,\" \"were,\" and \"have been\" are plural, perhaps matching \"runners\" from the sentence before.","source":"calibration-2026-10-07"},{"id":"pronoun-e1","passage":"<p>Venice, Italy, is built on more than 100 small islands in a shallow lagoon. Instead of relying on streets, the city uses canals as <span class=\"blank\" aria-label=\"blank\">______<\/span> main roads, and many residents travel by boat rather than by car.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["its","their","it's","they're"],"correct":"A","domain":"SEC","concept":"pronoun","difficulty":"easy","explanation":"The pronoun refers to \"the city,\" which is singular, and it shows possession (the city's main roads), so \"its\" is correct. \"Their\" is plural, and \"it's\" and \"they're\" are contractions, not possessives.","source":"calibration-2026-10-07"},{"id":"tense-e1","passage":"<p>In July 1969, astronauts Neil Armstrong and Buzz Aldrin <span class=\"blank\" aria-label=\"blank\">______<\/span> on the Moon while their crewmate Michael Collins orbited overhead in the command module. The Apollo 11 mission lasted about eight days.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["land","landed","will land","are landing"],"correct":"B","domain":"SEC","concept":"tense","difficulty":"easy","explanation":"The date \"July 1969\" and the past-tense verb \"orbited\" show that the landing happened in the past, so the simple past \"landed\" is correct. The other choices are present or future tense.","source":"calibration-2026-10-07"},{"id":"verbform-e1","passage":"<p>Researchers studying coral reefs have found that some corals can recover from heat damage if water temperatures return to normal quickly. To help reefs survive extreme heat waves, scientists <span class=\"blank\" aria-label=\"blank\">______<\/span> ways to shade or cool small areas of ocean water.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["are testing","testing","to test","having tested"],"correct":"A","domain":"SEC","concept":"verbform","difficulty":"easy","explanation":"The sentence needs a main verb for the subject \"scientists.\" \"Are testing\" is a complete verb. \"Testing,\" \"to test,\" and \"having tested\" can't be the main verb on their own, so they leave the sentence incomplete.","source":"calibration-2026-10-07"},{"id":"verbform-e2","passage":"<p>Completed in 1883, the Brooklyn Bridge was the longest suspension bridge in the world when it opened. Its designer, John Roebling, died before construction began, so his son, Washington Roebling, <span class=\"blank\" aria-label=\"blank\">______<\/span> the project.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["taking over","took over","to take over","having taken over"],"correct":"B","domain":"SEC","concept":"verbform","difficulty":"easy","explanation":"The clause after \"so\" needs a main verb for \"his son, Washington Roebling.\" \"Took over\" is a complete past-tense verb. The other choices are not complete verbs, so they leave the clause without a main verb.","source":"calibration-2026-10-07"},{"id":"possessive-e1","passage":"<p>Five students on the school's robotics team spent months building a machine that sorts recycling by material. At the state competition, the <span class=\"blank\" aria-label=\"blank\">______<\/span> impressed the judges, who awarded the team first place.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["student's invention","students invention","students' invention","student's inventions'"],"correct":"C","domain":"SEC","concept":"possessive","difficulty":"easy","explanation":"The invention belongs to five students, so the plural possessive \"students'\" is needed, and \"invention\" is a singular noun with no apostrophe. \"Student's\" means only one student, and \"students\" without an apostrophe doesn't show possession.","source":"calibration-2026-10-07"},{"id":"modifier-e1","passage":"<p>Born in a small village in Kenya in 1940, <span class=\"blank\" aria-label=\"blank\">______<\/span> founded the Green Belt Movement, an organization that has planted tens of millions of trees across Africa. In 2004, she became the first African woman to win the Nobel Peace Prize.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["Wangari Maathai's work","Wangari Maathai's organization","it was Wangari Maathai who","Wangari Maathai"],"correct":"D","domain":"SEC","concept":"modifier","difficulty":"easy","explanation":"The phrase \"Born in a small village in Kenya in 1940\" describes a person, so that person, Wangari Maathai, has to come right after the comma. Her work or her organization wasn't \"born,\" and \"it\" isn't the person the phrase describes.","source":"calibration-2026-10-07"},{"id":"transition-e1","passage":"<p>For many years, scientists believed that octopuses lived almost entirely alone, meeting only to mate. <span class=\"blank\" aria-label=\"blank\">______<\/span> divers off the coast of Australia have found sites where dozens of octopuses live close together, sharing dens and interacting every day.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["Recently, however,","For example,","Similarly,","As a result,"],"correct":"A","domain":"EI","concept":"transition","difficulty":"easy","explanation":"The second sentence describes a new finding that goes against the old belief, so a contrast transition is needed: \"Recently, however.\" \"For example\" would wrongly present octopuses living together as an example of octopuses living alone.","source":"calibration-2026-10-07"},{"id":"transition-e2","passage":"<p>Some plants have developed clever ways to spread their seeds far from the parent plant. <span class=\"blank\" aria-label=\"blank\">______<\/span> each seed of a dandelion is attached to a tiny parachute of fine hairs that can carry it long distances on the wind.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["However,","In contrast,","For example,","Finally,"],"correct":"C","domain":"EI","concept":"transition","difficulty":"easy","explanation":"The dandelion's parachute seeds are one case of a plant's \"clever ways to spread\" seeds, so \"For example\" fits. \"However\" and \"In contrast\" signal a contrast, but the second sentence agrees with the first.","source":"calibration-2026-10-07"},{"id":"transition-e3","passage":"<p>Glass is made mostly from sand, which must be heated to more than 1,500 degrees Celsius before it melts. Producing that much heat takes a large amount of energy. <span class=\"blank\" aria-label=\"blank\">______<\/span> adding recycled glass, which melts at a lower temperature than raw sand does, can help glassmakers reduce their energy use.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["On the other hand,","Nevertheless,","For this reason,","For instance,"],"correct":"C","domain":"EI","concept":"transition","difficulty":"easy","explanation":"Because melting sand takes so much energy, using glass that melts at a lower temperature saves energy. That cause-and-effect link calls for \"For this reason.\" \"Nevertheless\" would suggest that recycled glass helps in spite of the energy problem, when it actually helps because of it.","source":"calibration-2026-10-07"},{"id":"synthesis-e1","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>The Golden Gate Bridge is a suspension bridge in San Francisco, California.<\/li><li>It opened to traffic in 1937.<\/li><li>Its main span is 1,280 meters long.<\/li><li>When it opened, its main span was the longest of any suspension bridge in the world.<\/li><li>The bridge is painted a color called \"International Orange.\"<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize the record-setting length of the Golden Gate Bridge. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The Golden Gate Bridge's 1,280-meter main span was the world's longest suspension bridge span when it opened.","The Golden Gate Bridge, which opened to traffic in 1937, is a suspension bridge located in San Francisco, California.","Located in San Francisco, California, the Golden Gate Bridge is a suspension bridge painted a distinctive orange color.","The Golden Gate Bridge, a famous suspension bridge in San Francisco, is painted a color called \"International Orange.\""],"correct":"A","domain":"EI","concept":"synthesis","difficulty":"easy","explanation":"Only one choice mentions the span's length and that it set a world record. The other choices are accurate, but they focus on the bridge's location, opening date, or color.","source":"calibration-2026-10-07"},{"id":"synthesis-e2","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Alligators and crocodiles are both large reptiles.<\/li><li>Alligators have wide, U-shaped snouts.<\/li><li>Crocodiles have narrower, V-shaped snouts.<\/li><li>Alligators live mainly in fresh water.<\/li><li>Many crocodiles can live in salt water.<\/li><\/ul>","chart":null,"stem":"The student wants to contrast the snout shapes of alligators and crocodiles. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Alligators and crocodiles are both large reptiles, and alligators live mainly in fresh water.","Many crocodiles can live in salt water, while alligators live mainly in fresh water.","While alligators have wide, U-shaped snouts, crocodiles have narrower, V-shaped snouts.","Alligators, which are large reptiles, have wide snouts and live mainly in fresh water."],"correct":"C","domain":"EI","concept":"synthesis","difficulty":"easy","explanation":"The goal is a contrast of snout shapes, and only the correct choice describes both animals' snouts. The choice about salt water and fresh water also makes a contrast, but it contrasts where the animals live, not their snouts.","source":"calibration-2026-10-07"},{"id":"synthesis-e3","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Ada Lovelace was an English mathematician born in 1815.<\/li><li>She worked with inventor Charles Babbage on his design for a mechanical computer called the Analytical Engine.<\/li><li>In 1843, she published notes explaining how the machine could calculate a series of numbers.<\/li><li>Many historians consider these notes to be the first published computer program.<\/li><\/ul>","chart":null,"stem":"The student wants to explain why Lovelace is important in the history of computing. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Ada Lovelace, an English mathematician, was born in 1815 and later worked with inventor Charles Babbage.","Charles Babbage designed a mechanical computer called the Analytical Engine, and Ada Lovelace was a mathematician.","Many historians consider Lovelace's 1843 notes on Babbage's Analytical Engine to be the first published computer program.","Born in 1815, Ada Lovelace was an English mathematician who published a set of notes in 1843."],"correct":"C","domain":"EI","concept":"synthesis","difficulty":"easy","explanation":"Lovelace matters to computing history because her notes are considered the first published computer program, and only one choice says so. The other choices give accurate facts about her life without explaining why she is important.","source":"calibration-2026-10-07"},{"id":"boundaries-q1","concept":"boundaries","domain":"SEC","difficulty":"medium","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","passage":"<p>Engineer Priya Das often asks her first-year students how a bridge made of steel can carry a heavy freight train without <span class=\"blank\" aria-label=\"blank\">______<\/span> To help them find out, she has them build small model bridges from paper and glue and then test how much weight each one can hold.<\/p>","choices":["bending?","bending.","bending,","bending"],"correct":"B","explanation":"\"Das often asks her students how a bridge...can carry a train\" reports a question indirectly; the sentence itself is a statement, so it ends with a period. A question mark is used only for a direct question. A comma or no punctuation would join two complete sentences incorrectly.","chart":null,"source":"calibration-2026-10-07"},{"id":"boundaries-q2","concept":"boundaries","domain":"SEC","difficulty":"easy","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","passage":"<p>The science museum's newest exhibit begins with a single question painted in large letters across the entrance wall: why do some living things glow in the <span class=\"blank\" aria-label=\"blank\">______<\/span> The rooms that follow show deep-sea fish, fireflies, and mushrooms that make their own light.<\/p>","choices":["dark?","dark.","dark,","dark;"],"correct":"A","explanation":"The words after the colon are a direct question (\"why do some living things glow in the dark?\"), so they end with a question mark. A period would treat the question as a statement, and a comma or semicolon would run it into the next sentence.","chart":null,"source":"calibration-2026-10-07"},{"id":"boundaries-n1","concept":"boundaries","domain":"SEC","difficulty":"medium","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","passage":"<p>The small robots that the city's engineering team designed to inspect underground water <span class=\"blank\" aria-label=\"blank\">______<\/span> about the size of a soda can. Each one can travel nearly two kilometers through a pipe on a single battery charge, sending video back to workers on the surface.<\/p>","choices":["pipes, are","pipes; are","pipes are","pipes: are"],"correct":"C","explanation":"The subject \"The small robots that the city's engineering team designed to inspect underground water pipes\" is followed directly by its verb \"are.\" No punctuation belongs between a subject and its verb, so no comma, semicolon, or colon is needed.","chart":null,"source":"calibration-2026-10-07"},{"id":"boundaries-n2","concept":"boundaries","domain":"SEC","difficulty":"hard","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","passage":"<p>The fossilized footprints that geologist Rosa Ibáñez and her team uncovered last year in the hardened mud of an ancient lake bed in the American <span class=\"blank\" aria-label=\"blank\">______<\/span> that people were living in the region several thousand years earlier than many researchers had assumed. The team dated seeds trapped in the layers above and below the prints.<\/p>","choices":["Southwest, suggest","Southwest—suggest","Southwest; suggest","Southwest suggest"],"correct":"D","explanation":"Everything from \"The fossilized footprints\" through \"the American Southwest\" is one long subject, and \"suggest\" is its verb. Nothing separates a subject from its verb, so no punctuation is needed, however long the subject is. A comma or dash would make it look as if an interrupting phrase had ended, and a semicolon must join two complete clauses.","chart":null,"source":"calibration-2026-10-07"},{"id":"crosstext-a1","concept":"crosstext","domain":"CS","difficulty":"medium","stem":"Based on the texts, both authors would most likely agree with which statement?","passage":"<p class=\"caption\">Text 1<\/p>\n<p>Many cities have started planting street trees to fight extreme summer heat. Urban ecologist Hana Mori measured surface temperatures in desert neighborhoods and found that sidewalks under a full tree canopy were up to 20°C cooler on summer afternoons than sidewalks in direct sun. Mori argues that city leaders should treat tree planting as basic public-health infrastructure, much like clean water.<\/p>\n<p class=\"caption\">Text 2<\/p>\n<p>Water engineer Luis Ortega agrees that shade from trees can make streets much cooler. But he warns that in desert cities, many popular shade trees need large amounts of water to survive, and some planting programs have lost thousands of young trees during droughts. Ortega recommends that cities choose drought-tolerant native species, even though these trees often grow more slowly and cast less shade.<\/p>","choices":["Cities should plant shade trees only in neighborhoods with a reliable water supply.","Drought-tolerant native trees provide as much cooling as most popular shade trees.","Tree planting should be treated as public-health infrastructure in desert cities.","Shade from street trees can noticeably lower temperatures on city streets."],"correct":"D","explanation":"Mori measured sidewalks up to 20°C cooler under trees, and Ortega \"agrees that shade from trees can make streets much cooler,\" so both would agree with D. Only Mori calls trees public-health infrastructure (C); Ortega says native trees cast less shade (B); and neither says trees should go only where water is reliable (A).","chart":null,"source":"calibration-2026-10-07"},{"id":"crosstext-a2","concept":"crosstext","domain":"CS","difficulty":"hard","stem":"Based on the texts, both authors would most likely agree with which statement?","passage":"<p class=\"caption\">Text 1<\/p>\n<p>Historian Celia Brandt argues that the private letters of nineteenth-century factory workers are a richer source than official company records for understanding working conditions. Company records, she notes, list wages and hours but say almost nothing about how workers experienced their jobs, while letters describe fatigue, injuries, and friendships in the workers' own words.<\/p>\n<p class=\"caption\">Text 2<\/p>\n<p>Historian Omar Reyes values workers' letters for the details of daily life that payroll ledgers miss, but he cautions that the letters survive unevenly. Workers who could write, and whose families saved their papers, are heavily represented, while many others left no letters at all. Reyes argues that historians should check letters against company records, which list every employee, before drawing broad conclusions about factory life.<\/p>","choices":["Company records are generally more reliable than letters as evidence of working conditions.","The surviving letters represent the full range of factory workers' experiences.","Workers' letters reveal aspects of factory life that company records do not capture.","Historians should rely mainly on letters when studying nineteenth-century factories."],"correct":"C","explanation":"Brandt says letters describe how workers experienced their jobs, which company records leave out, and Reyes values letters \"for the details of daily life that payroll ledgers miss.\" Both would agree with C. Reyes doubts that the letters represent everyone (B) and wants letters checked against records rather than relied on mainly (D), while Brandt does not think records are more reliable (A).","chart":null,"source":"calibration-2026-10-07"},{"id":"wic-m1","concept":"wic","domain":"CS","difficulty":"easy","stem":"As used in the text, what does the word \"cultivate\" most nearly mean?","passage":"<p>Before the new public library opened, its director spent a year meeting with students, parents, and local business owners. She hoped to cultivate a feeling that the building belonged to the whole community, not just to the people who already visited libraries often.<\/p>","choices":["plant","foster","refine","harvest"],"correct":"B","explanation":"The director met with many groups to build a feeling of belonging that did not exist yet, so \"cultivate\" means \"foster\" (help develop). \"Plant\" and \"harvest\" are farming senses of the word that don't fit a feeling, and \"refine\" means improving something that already exists.","chart":null,"source":"calibration-2026-10-07"},{"id":"wic-m2","concept":"wic","domain":"CS","difficulty":"medium","stem":"As used in the text, what does the word \"gravity\" most nearly mean?","passage":"<p>In her review of the documentary, critic Ana Lucero praised its narrator, who reads even the most shocking facts in a calm, level voice and never raises it for effect. That restraint, Lucero wrote, gives the film a gravity that a more dramatic delivery could not have achieved, making viewers take each fact more seriously.<\/p>","choices":["seriousness","heaviness","attraction","danger"],"correct":"A","explanation":"The calm delivery makes viewers \"take each fact more seriously,\" so \"gravity\" here means \"seriousness.\" \"Heaviness\" and \"attraction\" come from the physical sense of gravity (the pull between objects), and nothing in the review suggests \"danger.\"","chart":null,"source":"calibration-2026-10-07"}],"math":{"concepts":[{"id":"lin-eq1","name":"Linear equations in one variable","domain":"ALG","lesson":"Undo operations in reverse order and keep both sides balanced: distribute, combine like terms, move the variable terms to one side, then divide. Clear fractions first by multiplying every term by the common denominator. Watch for the special cases: if the x-terms cancel and you get a true statement (like 6 = 6), there are infinitely many solutions; a false statement (like 6 = 2) means no solution. When a question asks for an expression like 4x or 8x − 9, you can often find it directly without solving for x.","section":"math"},{"id":"lin-fn","name":"Linear functions","domain":"ALG","lesson":"A linear function f(x) = mx + b changes by the same amount for every step in x. The slope m is the rate of change (change in output ÷ change in input), and b is the starting value, f(0). Find m from any two points: (y₂ − y₁)/(x₂ − x₁); then use one point to find b. In word problems the slope is the 'per' amount (per mile, per hour) and the y-intercept is the fixed or starting amount. To read f(k), plug k in; to solve f(x) = k, set mx + b = k.","section":"math"},{"id":"lin-eq2","name":"Linear equations in two variables","domain":"ALG","lesson":"An equation like Ax + By = C describes a line; every point (x, y) on it is a solution. Find intercepts by setting the other variable to 0, and the slope by solving for y (slope = −A/B). Parallel lines have equal slopes; perpendicular slopes are negative reciprocals (2 and −1/2). In word problems, each term is (rate × amount), for example 3n + 1.5p = 24 for $3 notebooks and $1.50 pens.","section":"math"},{"id":"systems","name":"Systems of two linear equations","domain":"ALG","lesson":"Solve by substitution (solve one equation for a variable and plug in) or elimination (add or subtract the equations to cancel a variable). Often the question asks for x + y or 3x, which elimination gives you directly. Number of solutions: different slopes → exactly one; same slope, different intercepts → none (parallel lines); same line (one equation is a multiple of the other) → infinitely many. For word problems, write one equation for the count and one for the total value.","section":"math"},{"id":"lin-ineq","name":"Linear inequalities","domain":"ALG","lesson":"Solve an inequality like an equation, but flip the sign when you multiply or divide by a negative number. 'At most' means ≤, 'at least' means ≥, 'fewer than' means <. For the greatest whole number that works, solve, then round the boundary in the right direction. On a graph, a dashed line means < or >, a solid line means ≤ or ≥; shade above for y > … and below for y < …. To test a point, plug it into every inequality in the system.","section":"math"},{"id":"equiv","name":"Equivalent expressions","domain":"ADV","lesson":"Equivalent expressions are equal for every value of the variable. Tools: distribute and combine like terms, factor (common factor, difference of squares a² − b² = (a − b)(a + b), trinomials), exponent rules (xᵃ·xᵇ = xᵃ⁺ᵇ, (xᵃ)ᵇ = xᵃᵇ, x^(1/n) = ⁿ√x), and adding fractions with a common denominator. When an equation must hold for all x, match the coefficients of each power of x on both sides. A quick check: plug in a simple number such as x = 2 into the original and each choice.","section":"math"},{"id":"nonlin-eq","name":"Nonlinear equations and systems","domain":"ADV","lesson":"For quadratics, set the equation equal to 0, then factor, complete the square, or use the quadratic formula x = (−b ± √(b² − 4ac))/(2a). The discriminant b² − 4ac tells how many real solutions: positive → 2, zero → 1, negative → 0. The sum of the solutions is −b/a and the product is c/a. For radical or rational equations, solve and then check for extraneous solutions. For a line and a parabola, substitute to get one quadratic; its solutions are the x-coordinates of the intersection points.","section":"math"},{"id":"nonlin-fn","name":"Nonlinear functions (quadratic, exponential, polynomial)","domain":"ADV","lesson":"Quadratics: vertex form a(x − h)² + k shows the vertex (h, k); factored form a(x − r)(x − s) shows the x-intercepts; standard form ax² + bx + c shows the y-intercept c, and the vertex is at x = −b/(2a). If a > 0 the parabola opens up (minimum). Exponentials: f(x) = a·bˣ starts at a and multiplies by b each step; b = 1 + r is growth, b = 1 − r is decay (r as a decimal). Polynomial zeros: if f(c) = 0, then (x − c) is a factor. Transformations: f(x) + k shifts up, f(x − h) shifts right.","section":"math"},{"id":"ratios","name":"Ratios, rates, proportions, and units","domain":"PSDA","lesson":"Set up a proportion with matching units in the same positions (miles/hours = miles/hours) and cross-multiply. For unit conversions, multiply by conversion fractions so the unwanted units cancel (for example 60 minutes/1 hour). Rates combine by adding work per unit time, not by averaging times. For squared or cubed units, square or cube the conversion factor (1 ft² = 144 in²). Density = mass/volume and speed = distance/time are rates too.","section":"math"},{"id":"percent","name":"Percentages","domain":"PSDA","lesson":"Percent means 'per 100'. A p% increase multiplies by (1 + p/100); a p% decrease multiplies by (1 − p/100). Successive changes multiply, so +20% then −20% is ×1.2×0.8 = ×0.96, a 4% loss overall. Percent change = (new − old)/old × 100. To find the original amount after a change, divide by the multiplier. 'What percent of A is B' means B/A × 100.","section":"math"},{"id":"data1","name":"One-variable data: distributions, center, and spread","domain":"PSDA","lesson":"Mean = sum ÷ count; the median is the middle value of the sorted list (average the two middle values for an even count). Outliers pull the mean toward them but barely move the median. Range = max − min; standard deviation measures how spread out values are from the mean (more clustered → smaller). Adding the same number to every value shifts the mean and median but not the spread. Read histograms and dot plots carefully: each bar or dot is a count, not a value.","section":"math"},{"id":"data2","name":"Two-variable data: models and scatterplots","domain":"PSDA","lesson":"A line of best fit y = mx + b summarizes a scatterplot: the slope is the predicted change in y for each 1-unit increase in x, and b is the predicted y when x = 0 (it may not make sense in context). Use the model to predict by plugging in x. A residual is actual − predicted (positive when the point lies above the line). Linear models add a constant amount each step; exponential models multiply by a constant factor. Correlation is positive when y tends to rise as x rises.","section":"math"},{"id":"prob","name":"Probability and conditional probability","domain":"PSDA","lesson":"Probability = favorable outcomes ÷ total outcomes. With a two-way table, find the right row or column first: for 'given that' (conditional) questions, the denominator is only the group you are given, not the whole table. 'And' means both conditions at once (one cell); 'or' means either one (add, but don't double-count the overlap). For independent events, multiply the probabilities.","section":"math"},{"id":"infer","name":"Inference from sample statistics and margin of error","domain":"PSDA","lesson":"A random sample lets you estimate a population value: scale the sample proportion up to the population size. A margin of error gives a plausible range: estimate ± margin. Larger random samples give smaller margins of error. Results apply only to the population that was sampled; a sample of volunteers or of one group can't be generalized to everyone. A plausible value is any value inside the interval; you can't say the true value is definitely the estimate.","section":"math"},{"id":"claims","name":"Evaluating statistical claims: studies and experiments","domain":"PSDA","lesson":"Only a randomized experiment (random assignment to treatment groups) supports a cause-and-effect conclusion. An observational study can show an association but not causation. Random sampling (choosing participants randomly from a population) is what allows generalizing to that population. Look for both features: random selection → generalize; random assignment → causation. Beware of biased samples such as volunteers or people at one location.","section":"math"},{"id":"area-vol","name":"Area and volume","domain":"GEO","lesson":"Know the reference-sheet formulas: rectangle ℓw, triangle ½bh, circle πr², box ℓwh, cylinder πr²h, sphere (4/3)πr³, cone (1/3)πr²h, pyramid (1/3)ℓwh. If every length is scaled by k, areas scale by k² and volumes by k³. Break odd shapes into rectangles and triangles, or subtract a cut-out piece from a larger shape. Surface area is the sum of the areas of all faces.","section":"math"},{"id":"lines-angles","name":"Lines and angles","domain":"GEO","lesson":"Angles on a straight line add to 180°, and vertical angles are equal. When parallel lines are cut by a transversal, corresponding angles and alternate interior angles are equal, and same-side interior angles add to 180°. Angles around a point add to 360°. Set up an equation from these facts (for example (3x + 10) + (2x − 5) = 180) and solve.","section":"math"},{"id":"triangles","name":"Triangles: angles, congruence, and similarity","domain":"GEO","lesson":"The angles of a triangle add to 180°; an exterior angle equals the sum of the two remote interior angles. Isosceles triangles have two equal sides opposite two equal angles. Similar triangles (same angles) have proportional sides: set up side/side = side/side using corresponding vertices. If the sides scale by k, the area scales by k². A line parallel to one side of a triangle makes a smaller similar triangle.","section":"math"},{"id":"right-trig","name":"Right triangles and trigonometry","domain":"GEO","lesson":"Pythagorean theorem: a² + b² = c². Special right triangles: 45°-45°-90° sides x, x, x√2; 30°-60°-90° sides x, x√3, 2x. SOH-CAH-TOA: sin = opposite/hypotenuse, cos = adjacent/hypotenuse, tan = opposite/adjacent. In a right triangle sin A = cos B when A and B are the two acute angles (complementary). Radians: 180° = π radians.","section":"math"},{"id":"circles","name":"Circles","domain":"GEO","lesson":"Circumference 2πr, area πr². An arc's length is (central angle/360°) × 2πr and a sector's area is (angle/360°) × πr²; in radians, arc length = rθ. A tangent line is perpendicular to the radius at the point of tangency. The equation (x − h)² + (y − k)² = r² has center (h, k) and radius r; complete the square to put x² + y² + Dx + Ey + F = 0 in this form. An inscribed angle is half its intercepted arc.","section":"math"}],"bank":[{"id":"m-le1-01","section":"math","concept":"lin-eq1","domain":"ALG","difficulty":"easy","stem":"If \\(3x - 7 = 11\\), what is the value of \\(x\\)?","explanation":"Add 7 to both sides to get \\(3x = 18\\), then divide by 3: \\(x = 6\\). Choice D is \\(3x\\), not \\(x\\).","format":"mc","choices":["\\(\\frac{4}{3}\\)","4","6","18"],"correct":"C"},{"id":"m-le1-02","section":"math","concept":"lin-eq1","domain":"ALG","difficulty":"easy","stem":"If \\(\\frac{x}{4} + 5 = 9\\), what is the value of \\(x\\)?","explanation":"Subtract 5 from both sides: \\(\\frac{x}{4} = 4\\). Multiply both sides by 4: \\(x = 16\\).","format":"spr","answers":["16"]},{"id":"m-le1-03","section":"math","concept":"lin-eq1","domain":"ALG","difficulty":"medium","stem":"What value of \\(x\\) satisfies the equation \\(5(2x - 3) = 4x + 9\\)?","explanation":"Distribute: \\(10x - 15 = 4x + 9\\). Subtract \\(4x\\) and add 15: \\(6x = 24\\), so \\(x = 4\\).","format":"mc","choices":["1","2","4","6"],"correct":"C"},{"id":"m-le1-04","section":"math","concept":"lin-eq1","domain":"ALG","difficulty":"medium","stem":"In the equation \\(2(3x + k) = 6x + 14\\), \\(k\\) is a constant. If the equation has infinitely many solutions, what is the value of \\(k\\)?","explanation":"The left side is \\(6x + 2k\\). The equation has infinitely many solutions when both sides are identical, so \\(2k = 14\\) and \\(k = 7\\).","format":"mc","choices":["2","7","12","14"],"correct":"B"},{"id":"m-le1-05","section":"math","concept":"lin-eq1","domain":"ALG","difficulty":"medium","stem":"How many solutions does the equation \\(4(x - 2) = 4x - 5\\) have?","explanation":"Distributing gives \\(4x - 8 = 4x - 5\\). Subtracting \\(4x\\) leaves \\(-8 = -5\\), which is false for every \\(x\\), so there are no solutions.","format":"mc","choices":["Zero","Exactly one","Exactly two","Infinitely many"],"correct":"A"},{"id":"m-le1-06","section":"math","concept":"lin-eq1","domain":"ALG","difficulty":"hard","stem":"In the equation \\(ax + 3 = 5x - b\\), \\(a\\) and \\(b\\) are constants. If the equation has no solution, which of the following must be true?","explanation":"No solution means the \\(x\\)-terms cancel but the constants don't match. The \\(x\\)-terms cancel only if \\(a = 5\\). Then the equation is \\(3 = -b\\); it has no solution unless \\(b = -3\\) (which would give infinitely many). So \\(a = 5\\) and \\(b \\ne -3\\).","format":"mc","choices":["\\(a = 5\\) and \\(b \\ne -3\\)","\\(a = 5\\) and \\(b = -3\\)","\\(a \\ne 5\\)","\\(a = -5\\) and \\(b = 3\\)"],"correct":"A"},{"id":"m-le1-07"
