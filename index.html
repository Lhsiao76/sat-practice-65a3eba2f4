" text-anchor=\"end\" fill=\"#3d4450\">8<\/text><line x1=\"50\" x2=\"326\" y1=\"12\" y2=\"12\" stroke=\"#e1e5ea\"/><text x=\"45\" y=\"16\" font-size=\"11\" text-anchor=\"end\" fill=\"#3d4450\">10<\/text><line x1=\"50\" x2=\"326\" y1=\"223\" y2=\"223\" stroke=\"#1f2328\"/><line x1=\"50\" x2=\"50\" y1=\"223\" y2=\"12\" stroke=\"#1f2328\"/><text x=\"188\" y=\"259\" font-size=\"12\" text-anchor=\"middle\">x<\/text><text transform=\"translate(13,117.5) rotate(-90)\" font-size=\"12\" text-anchor=\"middle\">y<\/text><line x1=\"50\" y1=\"201.9\" x2=\"326\" y2=\"12\" stroke=\"#be185d\" stroke-width=\"2\"/><circle cx=\"80.67\" cy=\"159.7\" r=\"4\" fill=\"#1d4ed8\"/><circle cx=\"111.33\" cy=\"180.8\" r=\"4\" fill=\"#1d4ed8\"/><circle cx=\"142\" cy=\"117.5\" r=\"4\" fill=\"#1d4ed8\"/><circle cx=\"172.67\" cy=\"138.6\" r=\"4\" fill=\"#1d4ed8\"/><circle cx=\"203.33\" cy=\"75.3\" r=\"4\" fill=\"#1d4ed8\"/><circle cx=\"234\" cy=\"96.4\" r=\"4\" fill=\"#1d4ed8\"/><circle cx=\"264.67\" cy=\"33.1\" r=\"4\" fill=\"#1d4ed8\"/><circle cx=\"295.33\" cy=\"54.2\" r=\"4\" fill=\"#1d4ed8\"/><\/svg><\/div>","format":"mc","choices":["2","3","4","5"],"correct":"C"},{"id":"m-d2-04","section":"math","concept":"data2","domain":"PSDA","difficulty":"medium","stem":"A model predicts \\(y = 1.5x + 4\\). For one data point, \\(x = 10\\) and the actual value of \\(y\\) is 22. What is the residual (actual minus predicted) for this data point?","explanation":"The predicted value is \\(1.5(10) + 4 = 19\\). The residual is actual − predicted \\(= 22 - 19 = 3\\). It's positive because the point lies above the model.","format":"mc","choices":["−3","3","19","22"],"correct":"B"},{"id":"m-d2-05","section":"math","concept":"data2","domain":"PSDA","difficulty":"medium","stem":"The table shows the population of a town in the years after a new factory opened. Which model best describes how the population changes?","explanation":"The increases are 40, 48, and 57.6, so the change is not constant (not linear). Each value is 1.2 times the previous one (\\(240 \\div 200 = 288 \\div 240 = 1.2\\)), so it grows exponentially by 20% per year.","fig":"<table class=\"data\"><thead><tr><th>Years after opening<\/th><th>Population<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>200<\/td><\/tr><tr><td>1<\/td><td>240<\/td><\/tr><tr><td>2<\/td><td>288<\/td><\/tr><tr><td>3<\/td><td>345.6<\/td><\/tr><\/tbody><\/table>","format":"mc","choices":["Linear, increasing by 40 people per year","Exponential, increasing by 40% per year","Linear, increasing by 20 people per year","Exponential, increasing by 20% per year"],"correct":"D"},{"id":"m-d2-06","section":"math","concept":"data2","domain":"PSDA","difficulty":"hard","stem":"A line of best fit for a scatterplot passes through the points \\((2, 5)\\) and \\((10, 21)\\). Based on this line, what is the predicted value of \\(y\\) when \\(x = 15\\)?","explanation":"The slope is \\(\\frac{21 - 5}{10 - 2} = 2\\), so the line is \\(y = 2x + 1\\). At \\(x = 15\\), \\(y = 31\\).","format":"spr","answers":["31"]},{"id":"m-d2-07","section":"math","concept":"data2","domain":"PSDA","difficulty":"easy","stem":"The linear model \\(y = -3.2x + 85\\) estimates the percent of battery charge \\(y\\) remaining in a laptop after \\(x\\) hours of use. According to the model, what percent of the charge remains after 5 hours?","explanation":"\\(y = -3.2(5) + 85 = -16 + 85 = 69\\). Choice D adds 16 instead of subtracting.","format":"mc","choices":["69%","72%","85%","101%"],"correct":"A"},{"id":"m-prb-01","section":"math","concept":"prob","domain":"PSDA","difficulty":"easy","stem":"A bag contains 5 red marbles, 3 blue marbles, and 2 green marbles. If one marble is chosen at random, what is the probability that it is blue?","explanation":"There are \\(5 + 3 + 2 = 10\\) marbles, and 3 are blue: \\(\\frac{3}{10}\\). Choice C compares blue to non-blue.","format":"mc","choices":["\\(\\frac{3}{10}\\)","\\(\\frac{1}{3}\\)","\\(\\frac{3}{7}\\)","\\(\\frac{7}{10}\\)"],"correct":"A"},{"id":"m-prb-02","section":"math","concept":"prob","domain":"PSDA","difficulty":"medium","stem":"The table summarizes club membership for 100 students. If an 11th-grade student is selected at random, what is the probability that the student is in a club?","explanation":"Given an 11th grader, the denominator is the 50 eleventh graders. Of them, 22 are in a club: \\(\\frac{22}{50} = \\frac{11}{25}\\). Choice D divides by the 40 club members instead.","fig":"<p class=\"caption\">Club membership of 100 students<\/p><table class=\"data\"><thead><tr><th><\/th><th>In a club<\/th><th>Not in a club<\/th><th>Total<\/th><\/tr><\/thead><tbody><tr><td>10th grade<\/td><td>18<\/td><td>32<\/td><td>50<\/td><\/tr><tr><td>11th grade<\/td><td>22<\/td><td>28<\/td><td>50<\/td><\/tr><tr><td>Total<\/td><td>40<\/td><td>60<\/td><td>100<\/td><\/tr><\/tbody><\/table>","format":"mc","choices":["\\(\\frac{11}{50}\\)","\\(\\frac{11}{25}\\)","\\(\\frac{1}{2}\\)","\\(\\frac{11}{20}\\)"],"correct":"B"},{"id":"m-prb-03","section":"math","concept":"prob","domain":"PSDA","difficulty":"medium","stem":"The table shows the results of a survey of 200 people. If one of these people is selected at random, what is the probability that the person is a teen who prefers cats?","explanation":"22 of the 200 people are teens who prefer cats: \\(\\frac{22}{200} = 0.11\\). Because the question doesn't say 'given that,' the denominator is all 200 people.","fig":"<p class=\"caption\">Survey of 200 people: preferred pet<\/p><table class=\"data\"><thead><tr><th><\/th><th>Dog<\/th><th>Cat<\/th><th>Neither<\/th><th>Total<\/th><\/tr><\/thead><tbody><tr><td>Adults<\/td><td>46<\/td><td>34<\/td><td>40<\/td><td>120<\/td><\/tr><tr><td>Teens<\/td><td>30<\/td><td>22<\/td><td>28<\/td><td>80<\/td><\/tr><tr><td>Total<\/td><td>76<\/td><td>56<\/td><td>68<\/td><td>200<\/td><\/tr><\/tbody><\/table>","format":"spr","answers":[".11","0.11"]},{"id":"m-prb-04","section":"math","concept":"prob","domain":"PSDA","difficulty":"medium","stem":"Events \\(A\\) and \\(B\\) are independent. The probability of \\(A\\) is 0.3, and the probability of \\(B\\) is 0.5. What is the probability that both \\(A\\) and \\(B\\) occur?","explanation":"For independent events, multiply: \\(0.3 \\cdot 0.5 = 0.15\\). Choice D adds the probabilities.","format":"mc","choices":["0.15","0.2","0.65","0.8"],"correct":"A"},{"id":"m-prb-05","section":"math","concept":"prob","domain":"PSDA","difficulty":"hard","stem":"Using the survey results in the table, if a person who prefers dogs is selected at random, what is the probability that the person is an adult?","explanation":"Given 'prefers dogs,' the denominator is the 76 dog lovers. Of these, 46 are adults: \\(\\frac{46}{76} = \\frac{23}{38} \\approx 0.605\\).","fig":"<p class=\"caption\">Survey of 200 people: preferred pet<\/p><table class=\"data\"><thead><tr><th><\/th><th>Dog<\/th><th>Cat<\/th><th>Neither<\/th><th>Total<\/th><\/tr><\/thead><tbody><tr><td>Adults<\/td><td>46<\/td><td>34<\/td><td>40<\/td><td>120<\/td><\/tr><tr><td>Teens<\/td><td>30<\/td><td>22<\/td><td>28<\/td><td>80<\/td><\/tr><tr><td>Total<\/td><td>76<\/td><td>56<\/td><td>68<\/td><td>200<\/td><\/tr><\/tbody><\/table>","format":"spr","answers":["23/38",".6052",".6053","0.605"]},{"id":"m-prb-06","section":"math","concept":"prob","domain":"PSDA","difficulty":"medium","stem":"A spinner has 8 equal sections numbered 1 through 8. What is the probability that a spin lands on a number that is greater than 5 or even?","explanation":"The numbers that work are 2, 4, 6, 7, 8 (count 6 and 8 only once): 5 of 8. Adding \\(\\frac{3}{8} + \\frac{4}{8}\\) double-counts 6 and 8.","format":"mc","choices":["\\(\\frac{3}{8}\\)","\\(\\frac{1}{2}\\)","\\(\\frac{5}{8}\\)","\\(\\frac{7}{8}\\)"],"correct":"C"},{"id":"m-inf-01","section":"math","concept":"infer","domain":"PSDA","difficulty":"medium","stem":"A random sample of 200 students at a school of 1,800 students found that 46 of the students in the sample bike to school. Based on the sample, which is the best estimate of the number of students at the school who bike to school?","explanation":"The sample proportion is \\(\\frac{46}{200} = 0.23\\). Applied to the whole school: \\(0.23 \\cdot 1{,}800 = 414\\).","format":"mc","choices":["46","230","414","920"],"correct":"C"},{"id":"m-inf-02","section":"math","concept":"infer","domain":"PSDA","difficulty":"medium","stem":"Based on a random sample, a poll estimated that 62% of a city's voters support a new park, with a margin of error of 3%. Which of the following is a plausible value for the actual percent of the city's voters who support the park?","explanation":"Plausible values lie within \\(62\\% \\pm 3\\%\\), from 59% to 65%. Only 60% is in that interval.","format":"mc","choices":["55%","58%","60%","66%"],"correct":"C"},{"id":"m-inf-03","section":"math","concept":"infer","domain":"PSDA","difficulty":"medium","stem":"Two researchers each select a random sample from the same population to estimate the mean number of hours of sleep per night. Researcher A samples 400 people, and researcher B samples 100 people. Which statement is most likely true?","explanation":"Larger random samples give more precise estimates, so the margin of error is smaller for the sample of 400. (It shrinks roughly with \\(\\frac{1}{\\sqrt{n}}\\), so 4 times the sample size about halves it, not quarters it.)","format":"mc","choices":["Researcher A's estimate will have a smaller margin of error.","Researcher B's estimate will have a smaller margin of error.","The two estimates will have the same margin of error.","Researcher A's estimate will be exactly 4 times as accurate."],"correct":"A"},{"id":"m-inf-04","section":"math","concept":"infer","domain":"PSDA","difficulty":"medium","stem":"To estimate how often residents of a town exercise, a researcher surveyed 150 people at the town's largest gym. Which statement about the survey is most accurate?","explanation":"A sample is representative only if it is chosen randomly from the population. Gym-goers are not a random sample of residents, so the survey is biased, no matter how many people are asked.","format":"mc","choices":["The results can't be generalized to all residents, because people at a gym probably exercise more than typical residents.","The results can be generalized to all residents, because 150 people is a large enough sample to represent the whole town.","The results can be generalized to all residents, because the gym is the largest one in town.","The results show that going to the gym causes people to exercise more."],"correct":"A"},{"id":"m-inf-05","section":"math","concept":"infer","domain":"PSDA","difficulty":"medium","stem":"A quality inspector selects a random sample of 80 light bulbs from a shipment of 2,400 bulbs and finds that 6 are defective. Based on this sample, how many bulbs in the shipment are expected to be defective?","explanation":"\\(\\frac{6}{80} = 0.075\\) of the sample is defective, so about \\(0.075 \\cdot 2{,}400 = 180\\) bulbs in the shipment are expected to be defective.","format":"spr","answers":["180"]},{"id":"m-inf-06","section":"math","concept":"infer","domain":"PSDA","difficulty":"medium","stem":"From a random sample of a school's students, the mean time spent on social media is estimated to be 4.2 hours per day, with a margin of error of 0.5 hour. Which conclusion is most appropriate?","explanation":"The margin of error gives a range of plausible values for the <i>mean of the population that was sampled<\/i>: \\(4.2 \\pm 0.5\\). It says nothing about individual students, and it can't be extended to teenagers outside the school.","format":"mc","choices":["The mean time for all students at the school is exactly 4.2 hours per day.","It is plausible that the mean time for all students at the school is between 3.7 and 4.7 hours per day.","Every student at the school spends between 3.7 and 4.7 hours per day on social media.","It is plausible that the mean time for all teenagers in the country is between 3.7 and 4.7 hours per day."],"correct":"B"},{"id":"m-clm-01","section":"math","concept":"claims","domain":"PSDA","difficulty":"medium","stem":"A researcher selected 200 tomato plants at random from a large greenhouse and randomly assigned half to receive a new fertilizer. The plants that received the fertilizer produced significantly more tomatoes. Which conclusion is best supported?","explanation":"Random assignment to treatment groups supports a cause-and-effect conclusion, and random selection from the greenhouse lets us generalize to that greenhouse, but not to all plants everywhere.","format":"mc","choices":["The fertilizer causes increased tomato production for plants in this greenhouse.","The fertilizer causes increased tomato production for all plants.","There is an association between the fertilizer and production, but cause and effect can't be determined.","No conclusion can be drawn, because only 200 plants were used."],"correct":"A"},{"id":"m-clm-02","section":"math","concept":"claims","domain":"PSDA","difficulty":"medium","stem":"In an observational study, researchers found that adults who drink more coffee tend to sleep fewer hours per night. Which conclusion is appropriate?","explanation":"Without random assignment, an observational study can show only an association. Other factors (such as work schedules) could explain both, so causation can't be concluded in either direction.","format":"mc","choices":["Drinking coffee causes adults to sleep fewer hours, since the adults in the study who drank more coffee also slept less each night.","Sleeping fewer hours causes adults to drink more coffee.","There is no relationship between coffee drinking and sleep.","There is an association between coffee drinking and sleep, but the study does not show that coffee causes less sleep."],"correct":"D"},{"id":"m-clm-03","section":"math","concept":"claims","domain":"PSDA","difficulty":"medium","stem":"A city randomly selected 500 residents and randomly assigned each to receive either a reminder text or no text before trash pickup day. Residents who received texts were more likely to put out recycling. To which group can the conclusion that the texts increased recycling be applied?","explanation":"The residents were randomly selected from the city (so results generalize to the city) and randomly assigned to groups (so a causal conclusion is justified). Together, the causal conclusion applies to all city residents.","format":"mc","choices":["Only the 500 residents in the study","Only the residents who received texts","None, because the residents were not volunteers","All residents of the city"],"correct":"D"},{"id":"m-clm-04","section":"math","concept":"claims","domain":"PSDA","difficulty":"medium","stem":"A library wanted to know how much its town's residents read. It placed a survey at the checkout desk, and 300 people completed it. Why might the results be biased?","explanation":"The sample includes only library visitors who chose to respond, and they likely read more than typical residents. The sample is not random, so it doesn't represent the town.","format":"mc","choices":["People who visit the library probably read more than the average resident.","300 responses is too many for the survey to give reliable results.","The survey was given at only one time of day.","The library staff wrote the survey questions."],"correct":"A"},{"id":"m-clm-05","section":"math","concept":"claims","domain":"PSDA","difficulty":"medium","stem":"Sixty volunteers were randomly assigned to use either a new study app or a paper flashcard method for two weeks. The app group scored higher on a vocabulary test. Which statement is best supported?","explanation":"Random assignment supports a causal conclusion for the people in the study. But volunteers weren't randomly selected from a larger population, so the conclusion can't be generalized beyond them.","format":"mc","choices":["The app caused higher scores for these volunteers, but the result may not apply to all students.","The app causes higher scores for all students.","The app is associated with higher scores, but cause and effect can't be determined.","The results can't be trusted, because the participants were volunteers rather than students chosen at random from a school."],"correct":"A"},{"id":"m-clm-06","section":"math","concept":"claims","domain":"PSDA","difficulty":"medium","stem":"A principal wants to estimate the average number of hours students at her school spend on homework each week. Which sampling method would most likely produce a representative sample?","explanation":"Choosing students at random from a complete list gives every student the same chance of being picked. The other methods favor certain groups (early arrivals, advanced students, or volunteers).","format":"mc","choices":["Asking the first 100 students who arrive at school one morning","Surveying all students in two advanced math classes chosen by the principal","Posting an online survey and using the first 100 responses","Randomly selecting 100 students from a list of all students at the school"],"correct":"D"},{"id":"m-av-01","section":"math","concept":"area-vol","domain":"GEO","difficulty":"easy","stem":"A rectangle has a length of 12 centimeters and a width of 5 centimeters. What is the area of the rectangle, in square centimeters?","explanation":"Area = length × width = \\(12 \\cdot 5 = 60\\) square centimeters. Choice B is the perimeter.","format":"mc","choices":["17","34","60","120"],"correct":"C"},{"id":"m-av-02","section":"math","concept":"area-vol","domain":"GEO","difficulty":"easy","stem":"A right circular cylinder has a radius of 3 inches and a height of 10 inches. What is the volume of the cylinder, in cubic inches?","explanation":"\\(V = \\pi r^2 h = \\pi(3^2)(10) = 90\\pi\\). Choice A forgets to square the radius.","format":"mc","choices":["\\(30\\pi\\)","\\(60\\pi\\)","\\(900\\pi\\)","\\(90\\pi\\)"],"correct":"D"},{"id":"m-av-03","section":"math","concept":"area-vol","domain":"GEO","difficulty":"medium","stem":"A cube has a volume of 64 cubic inches. What is the total surface area of the cube, in square inches?","explanation":"The edge length is \\(\\sqrt[3]{64} = 4\\) inches. Each of the 6 faces has area \\(4^2 = 16\\), so the surface area is \\(6 \\cdot 16 = 96\\).","format":"mc","choices":["16","64","96","384"],"correct":"C"},{"id":"m-av-04","section":"math","concept":"area-vol","domain":"GEO","difficulty":"easy","stem":"The legs of a right triangle have lengths 6 and 8. What is the area of the triangle?","explanation":"The legs are a base and height: \\(\\frac{1}{2}(6)(8) = 24\\). Choice A is the hypotenuse.","format":"mc","choices":["10","14","24","48"],"correct":"C"},{"id":"m-av-05","section":"math","concept":"area-vol","domain":"GEO","difficulty":"hard","stem":"Each side of a square is increased by 20%. By what percent does the area of the square increase?","explanation":"Area scales by the square of the length factor: \\(1.2^2 = 1.44\\). The area increases by 44%, not 40%.","format":"spr","answers":["44"]},{"id":"m-av-06","section":"math","concept":"area-vol","domain":"GEO","difficulty":"medium","stem":"A sphere has a volume of \\(36\\pi\\) cubic centimeters. What is the radius of the sphere, in centimeters?","explanation":"\\(\\frac{4}{3}\\pi r^3 = 36\\pi\\), so \\(r^3 = 27\\) and \\(r = 3\\). Choice D is \\(r^3\\).","format":"mc","choices":["3","6","9","27"],"correct":"A"},{"id":"m-av-07","section":"math","concept":"area-vol","domain":"GEO","difficulty":"medium","stem":"The figure shows a shape made of right angles. The bottom side is 10 units long and the left side is 8 units long. A rectangular piece measuring 4 units wide and 3 units tall has been removed from the top-right corner. What is the area of the shape, in square units?","explanation":"Start with the full 10-by-8 rectangle (area 80) and subtract the missing 4-by-3 corner (area 12): \\(80 - 12 = 68\\).","fig":"<div class=\"mfigw\"><svg class=\"mfig\" viewBox=\"0 0 260 210\" width=\"260\" height=\"210\" role=\"img\" aria-label=\"L-shaped figure\" font-family=\"-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif\"><polygon points=\"30,20 150,20 150,92 230,92 230,185 30,185\" fill=\"#e8efff\" stroke=\"none\"/><line x1=\"30\" y1=\"20\" x2=\"150\" y2=\"20\" stroke=\"#1f2328\" stroke-width=\"2\"/><line x1=\"150\" y1=\"20\" x2=\"150\" y2=\"92\" stroke=\"#1f2328\" stroke-width=\"2\"/><line x1=\"150\" y1=\"92\" x2=\"230\" y2=\"92\" stroke=\"#1f2328\" stroke-width=\"2\"/><line x1=\"230\" y1=\"92\" x2=\"230\" y2=\"185\" stroke=\"#1f2328\" stroke-width=\"2\"/><line x1=\"230\" y1=\"185\" x2=\"30\" y2=\"185\" stroke=\"#1f2328\" stroke-width=\"2\"/><line x1=\"30\" y1=\"185\" x2=\"30\" y2=\"20\" stroke=\"#1f2328\" stroke-width=\"2\"/><text x=\"130\" y=\"202\" font-size=\"13\" text-anchor=\"middle\">10<\/text><text x=\"16\" y=\"106\" font-size=\"13\" text-anchor=\"middle\">8<\/text><text x=\"90\" y=\"14\" font-size=\"13\" text-anchor=\"middle\">6<\/text><text x=\"165\" y=\"60\" font-size=\"13\" text-anchor=\"start\">3<\/text><text x=\"190\" y=\"86\" font-size=\"13\" text-anchor=\"middle\">4<\/text><\/svg><\/div><p class=\"fignote\">Note: Figure not drawn to scale.<\/p>","format":"spr","answers":["68"]},{"id":"m-av-08","section":"math","concept":"area-vol","domain":"GEO","difficulty":"medium","stem":"A rectangular box with a base of 4 inches by 5 inches has the same volume as a cube with an edge length of 10 inches. What is the height of the box, in inches?","explanation":"The cube's volume is \\(10^3 = 1{,}000\\). Then \\(4 \\cdot 5 \\cdot h = 1{,}000\\), so \\(h = 50\\).","format":"mc","choices":["10","20","50","100"],"correct":"C"},{"id":"m-av-09","section":"math","concept":"area-vol","domain":"GEO","difficulty":"medium","stem":"A triangle has a base of 14 inches and an area of 63 square inches. What is the height of the triangle, in inches?","explanation":"\\(\\frac{1}{2}(14)h = 63\\), so \\(7h = 63\\) and \\(h = 9\\). Choice C forgets the \\(\\frac{1}{2}\\).","format":"mc","choices":["4.5","9","18","49"],"correct":"B"},{"id":"m-la-01","section":"math","concept":"lines-angles","domain":"GEO","difficulty":"easy","stem":"In the figure, two lines intersect. One of the angles formed measures 130°, and the angle adjacent to it measures \\(x°\\). What is the value of \\(x\\)?","explanation":"Adjacent angles formed by intersecting lines lie on a straight line, so they add to 180°: \\(x = 180 - 130 = 50\\).","fig":"<div class=\"mfigw\"><svg class=\"mfig\" viewBox=\"0 0 260 170\" width=\"260\" height=\"170\" role=\"img\" aria-label=\"Two intersecting lines\" font-family=\"-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif\"><line x1=\"20\" y1=\"140\" x2=\"240\" y2=\"30\" stroke=\"#1f2328\" stroke-width=\"2\"/><line x1=\"40\" y1=\"30\" x2=\"220\" y2=\"140\" stroke=\"#1f2328\" stroke-width=\"2\"/><text x=\"130\" y=\"62\" font-size=\"13\" text-anchor=\"middle\">130°<\/text><text x=\"164\" y=\"92\" font-size=\"13\" text-anchor=\"middle\">x°<\/text><\/svg><\/div><p class=\"fignote\">Note: Figure not drawn to scale.<\/p>","format":"mc","choices":["40","50","130","230"],"correct":"B"},{"id":"m-la-02","section":"math","concept":"lines-angles","domain":"GEO","difficulty":"easy","stem":"Two lines intersect, forming a pair of vertical angles that measure \\((3x + 10)°\\) and \\(70°\\). What is the value of \\(x\\)?","explanation":"Vertical angles are equal: \\(3x + 10 = 70\\), so \\(3x = 60\\) and \\(x = 20\\).","format":"mc","choices":["20","26.7","33.3","60"],"correct":"A"},{"id":"m-la-03","section":"math","concept":"lines-angles","domain":"GEO","difficulty":"medium","stem":"In the figure, lines \\(\\ell\\) and \\(m\\) are parallel and are cut by a transversal. The angles marked 65° and \\((2x + 15)°\\) are alternate interior angles. What is the value of \\(x\\)?","explanation":"Alternate interior angles formed by parallel lines are equal: \\(2x + 15 = 65\\), so \\(x = 25\\).","fig":"<div class=\"mfigw\"> ,"section":"math","concept":"right-trig","domain":"GEO","difficulty":"easy","stem":"An isosceles right triangle has legs of length 7. What is the length of its hypotenuse?","explanation":"In a 45°-45°-90° triangle the hypotenuse is \\(\\sqrt{2}\\) times a leg: \\(7\\sqrt{2}\\).","format":"mc","choices":["\\(7\\)","\\(7\\sqrt{3}\\)","\\(14\\)","\\(7\\sqrt{2}\\)"],"correct":"D"},{"id":"m-rt-06","section":"math","concept":"right-trig","domain":"GEO","difficulty":"medium","stem":"A 20-foot ladder leans against a vertical wall and makes a 60° angle with the level ground. How high up the wall, in feet, does the top of the ladder reach?","explanation":"The height is opposite the 60° angle and the ladder is the hypotenuse: \\(20 \\sin 60° = 20 \\cdot \\frac{\\sqrt{3}}{2} = 10\\sqrt{3}\\). Choice A is the distance from the wall.","format":"mc","choices":["10","\\(10\\sqrt{2}\\)","\\(20\\sqrt{3}\\)","\\(10\\sqrt{3}\\)"],"correct":"D"},{"id":"m-rt-07","section":"math","concept":"right-trig","domain":"GEO","difficulty":"medium","stem":"In right triangle \\(ABC\\), angle \\(C\\) is the right angle and \\(\\cos A = 0.6\\). What is the value of \\(\\sin A\\)?","explanation":"Think of a 3-4-5 right triangle: \\(\\cos A = \\frac{3}{5}\\) means the adjacent side is 3 and the hypotenuse is 5, so the opposite side is 4 and \\(\\sin A = \\frac{4}{5} = 0.8\\).","format":"spr","answers":[".8","0.8","4/5"]},{"id":"m-rt-08","section":"math","concept":"right-trig","domain":"GEO","difficulty":"medium","stem":"What is the measure of a 150° angle in radians?","explanation":"Multiply by \\(\\frac{\\pi}{180}\\): \\(150 \\cdot \\frac{\\pi}{180} = \\frac{5\\pi}{6}\\).","format":"mc","choices":["\\(\\frac{3\\pi}{4}\\)","\\(\\frac{5\\pi}{3}\\)","\\(\\frac{6\\pi}{5}\\)","\\(\\frac{5\\pi}{6}\\)"],"correct":"D"},{"id":"m-rt-09","section":"math","concept":"right-trig","domain":"GEO","difficulty":"medium","stem":"In a right triangle, \\(\\tan \\theta = \\frac{3}{4}\\) for one of the acute angles \\(\\theta\\), and the hypotenuse has length 20. What is the length of the shorter leg?","explanation":"\\(\\tan \\theta = \\frac{3}{4}\\) describes a 3-4-5 triangle. Scaling so the hypotenuse is 20 (factor 4) gives legs 12 and 16. The shorter leg is 12.","format":"spr","answers":["12"]},{"id":"m-cir-01","section":"math","concept":"circles","domain":"GEO","difficulty":"easy","stem":"A circle has a radius of 7 centimeters. What is the circumference of the circle, in centimeters?","explanation":"\\(C = 2\\pi r = 2\\pi(7) = 14\\pi\\). Choice C is the area.","format":"mc","choices":["\\(7\\pi\\)","\\(28\\pi\\)","\\(49\\pi\\)","\\(14\\pi\\)"],"correct":"D"},{"id":"m-cir-02","section":"math","concept":"circles","domain":"GEO","difficulty":"medium","stem":"What is the center of the circle with equation \\((x - 3)^2 + (y + 2)^2 = 25\\) in the \\(xy\\)-plane?","explanation":"In \\((x - h)^2 + (y - k)^2 = r^2\\), the center is \\((h, k)\\). Here \\(y + 2 = y - (-2)\\), so the center is \\((3, -2)\\).","format":"mc","choices":["\\((-3, 2)\\)","\\((3, 2)\\)","\\((-3, -2)\\)","\\((3, -2)\\)"],"correct":"D"},{"id":"m-cir-03","section":"math","concept":"circles","domain":"GEO","difficulty":"hard","stem":"The equation \\(x^2 + y^2 - 6x + 8y = 11\\) defines a circle in the \\(xy\\)-plane. What is the radius of the circle?","explanation":"Complete the square: \\((x^2 - 6x + 9) + (y^2 + 8y + 16) = 11 + 9 + 16\\), so \\((x - 3)^2 + (y + 4)^2 = 36\\) and the radius is 6.","format":"spr","answers":["6"]},{"id":"m-cir-04","section":"math","concept":"circles","domain":"GEO","difficulty":"medium","stem":"In a circle with a radius of 9, a central angle measures 80°. What is the length of the arc intercepted by the angle?","explanation":"Arc length = \\(\\frac{80}{360} \\cdot 2\\pi(9) = \\frac{2}{9} \\cdot 18\\pi = 4\\pi\\).","format":"mc","choices":["\\(2\\pi\\)","\\(8\\pi\\)","\\(18\\pi\\)","\\(4\\pi\\)"],"correct":"D"},{"id":"m-cir-05","section":"math","concept":"circles","domain":"GEO","difficulty":"medium","stem":"A sector of a circle with a radius of 6 has a central angle of 90°. The area of the sector is \\(k\\pi\\). What is the value of \\(k\\)?","explanation":"The sector is \\(\\frac{90}{360} = \\frac{1}{4}\\) of the circle, whose area is \\(36\\pi\\). So the sector's area is \\(9\\pi\\) and \\(k = 9\\).","format":"spr","answers":["9"]},{"id":"m-cir-06","section":"math","concept":"circles","domain":"GEO","difficulty":"hard","stem":"In the figure, \\(O\\) is the center of the circle, and \\(\\overline{PQ}\\) is tangent to the circle at point \\(P\\). If the radius is 5 and \\(OQ = 13\\), what is the length of \\(\\overline{PQ}\\)?","explanation":"A tangent is perpendicular to the radius at the point of tangency, so triangle \\(OPQ\\) has a right angle at \\(P\\). Then \\(PQ = \\sqrt{13^2 - 5^2} = \\sqrt{144} = 12\\).","fig":"<div class=\"mfigw\"><svg class=\"mfig\" viewBox=\"0 0 280 170\" width=\"280\" height=\"170\" role=\"img\" aria-label=\"Circle with center O; segment PQ tangent at P\" font-family=\"-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif\"><circle cx=\"80\" cy=\"90\" r=\"60\" fill=\"none\" stroke=\"#1f2328\" stroke-width=\"2\"/><line x1=\"80\" y1=\"90\" x2=\"80\" y2=\"30\" stroke=\"#1f2328\" stroke-width=\"2\"/><line x1=\"80\" y1=\"30\" x2=\"250\" y2=\"30\" stroke=\"#1f2328\" stroke-width=\"2\"/><line x1=\"80\" y1=\"90\" x2=\"250\" y2=\"30\" stroke=\"#1f2328\" stroke-width=\"2\"/><polyline fill=\"none\" stroke=\"#1f2328\" stroke-width=\"1.5\" points=\"80,42 92,42 92,30\"/><circle cx=\"80\" cy=\"90\" r=\"2.6\" fill=\"#1f2328\"/><text x=\"70\" y=\"103\" font-size=\"14\" font-style=\"italic\" text-anchor=\"middle\">O<\/text><circle cx=\"80\" cy=\"30\" r=\"2.6\" fill=\"#1f2328\"/><text x=\"74\" y=\"25\" font-size=\"14\" font-style=\"italic\" text-anchor=\"middle\">P<\/text><circle cx=\"250\" cy=\"30\" r=\"2.6\" fill=\"#1f2328\"/><text x=\"258\" y=\"29\" font-size=\"14\" font-style=\"italic\" text-anchor=\"middle\">Q<\/text><text x=\"70\" y=\"64\" font-size=\"13\" text-anchor=\"end\">5<\/text><text x=\"172\" y=\"72\" font-size=\"13\" text-anchor=\"middle\">13<\/text><\/svg><\/div><p class=\"fignote\">Note: Figure not drawn to scale.<\/p>","format":"spr","answers":["12"]},{"id":"m-cir-07","section":"math","concept":"circles","domain":"GEO","difficulty":"medium","stem":"An inscribed angle in a circle intercepts an arc that measures 110°. What is the measure of the inscribed angle?","explanation":"An inscribed angle is half of its intercepted arc: \\(\\frac{110}{2} = 55°\\). A central angle would equal the arc, 110°.","format":"mc","choices":["55°","70°","110°","220°"],"correct":"A"},{"id":"m-cir-08","section":"math","concept":"circles","domain":"GEO","difficulty":"hard","stem":"A circle in the \\(xy\\)-plane has its center at \\((2, -1)\\) and passes through the point \\((5, 3)\\). Which equation defines the circle?","explanation":"The radius is the distance from \\((2, -1)\\) to \\((5, 3)\\): \\(\\sqrt{3^2 + 4^2} = 5\\), so \\(r^2 = 25\\). The center \\((2, -1)\\) gives \\((x - 2)^2 + (y + 1)^2\\). Choice B uses \\(r\\) instead of \\(r^2\\).","format":"mc","choices":["\\((x + 2)^2 + (y - 1)^2 = 25\\)","\\((x - 2)^2 + (y + 1)^2 = 5\\)","\\((x - 2)^2 + (y + 1)^2 = 25\\)","\\((x - 5)^2 + (y - 3)^2 = 25\\)"],"correct":"C"},{"id":"m-cal-01","section":"math","concept":"percent","domain":"PSDA","difficulty":"hard","stem":"A store raised the price of a bicycle by 18%. Two months later, it lowered the new price by 18%. The final price was $435.42. What was the original price of the bicycle, in dollars?","explanation":"An 18% increase multiplies by 1.18 and an 18% decrease multiplies by 0.82, so the original price \\(p\\) satisfies \\(p(1.18)(0.82) = 435.42\\). Then \\(p = 435.42 \\div 0.9676 = 450\\). The two changes do not cancel, so 435.42 (A) is wrong; D undoes only the decrease.","format":"mc","choices":["435.42","450.00","513.80","531.00"],"correct":"B"},{"id":"m-cal-02","section":"math","concept":"percent","domain":"PSDA","difficulty":"hard","stem":"The population of a town was 24,800 in 2014 and 27,280 in 2019. If the population increases by the same percent every 5 years, what will the population be in 2029, to the nearest whole number?","explanation":"From 2014 to 2019 the population grew by a factor of \\(27{,}280 \\div 24{,}800 = 1.1\\) (a 10% increase). 2029 is two more 5-year periods after 2019: \\(27{,}280(1.1)^2 = 33{,}008.8 \\approx 33{,}009\\). Choice A is the 2024 value, and B assumes the same increase of 2,480 people each period.","format":"mc","choices":["30,008","32,240","33,009","34,720"],"correct":"C"},{"id":"m-cal-03","section":"math","concept":"percent","domain":"PSDA","difficulty":"hard","stem":"A savings account earns 3.2% interest, compounded annually. If $4,800 is deposited and no other deposits or withdrawals are made, what will the balance be after 6 years, to the nearest dollar?","explanation":"Compound growth multiplies by 1.032 each year: \\(4{,}800(1.032)^6 \\approx 4{,}800(1.20802) \\approx 5{,}799\\). Choice B uses simple interest (\\(4{,}800 + 6 \\cdot 153.60\\)), A is the balance after 1 year, and D is after 7 years.","format":"mc","choices":["4,954","5,722","5,799","5,984"],"correct":"C"},{"id":"m-cal-04","section":"math","concept":"ratios","domain":"PSDA","difficulty":"hard","stem":"A car's fuel efficiency is 32 miles per gallon, and gasoline costs $3.85 per gallon. To the nearest cent, what is the cost of the gasoline needed to drive 250 miles?","explanation":"The trip uses \\(250 \\div 32 = 7.8125\\) gallons, which cost \\(7.8125 \\cdot 3.85 \\approx 30.08\\) dollars. Choice B is the number of gallons, and D is the cost of 32 gallons.","format":"mc","choices":["2.03","7.81","30.08","123.20"],"correct":"C"},{"id":"m-cal-05","section":"math","concept":"ratios","domain":"PSDA","difficulty":"hard","stem":"A cyclist rides at an average speed of 22 kilometers per hour. What is this speed in meters per second, to the nearest tenth? (1 kilometer = 1,000 meters)","explanation":"22 kilometers per hour is 22,000 meters per 3,600 seconds: \\(22{,}000 \\div 3{,}600 \\approx 6.1\\) meters per second. Choice C divides by 600 instead of 3,600, and D multiplies by 3.6 instead of dividing.","format":"mc","choices":["0.4","6.1","36.7","79.2"],"correct":"B"},{"id":"m-cal-06","section":"math","concept":"prob","domain":"PSDA","difficulty":"hard","stem":"The table shows the results of a survey in which 400 adults were asked whether they prefer tea or coffee. If one of the adults who prefer coffee is selected at random, what is the probability that the adult is under 30?","explanation":"Restrict to the 280 adults who prefer coffee; 126 of them are under 30, so the probability is \\(\\frac{126}{280} = 0.45\\). Choice A divides by all 400 adults, C is the probability of being 30 or older, and D divides by the 172 adults under 30.","fig":"<p class=\"caption\">Preferred hot drink, by age group<\/p><table class=\"data\"><thead><tr><th><\/th><th>Under 30<\/th><th>30 and older<\/th><th>Total<\/th><\/tr><\/thead><tbody><tr><td>Tea<\/td><td>46<\/td><td>74<\/td><td>120<\/td><\/tr><tr><td>Coffee<\/td><td>126<\/td><td>154<\/td><td>280<\/td><\/tr><tr><td>Total<\/td><td>172<\/td><td>228<\/td><td>400<\/td><\/tr><\/tbody><\/table>","format":"mc","choices":["0.315","0.45","0.55","0.733"],"correct":"B"},{"id":"m-cal-07","section":"math","concept":"prob","domain":"PSDA","difficulty":"hard","stem":"A bag contains only red and blue marbles, in a ratio of 3 to 5. After 6 red marbles are added to the bag, the probability of drawing a red marble at random is \\(\\frac{1}{2}\\). How many marbles were in the bag before the red marbles were added?","explanation":"Let the bag have \\(3k\\) red and \\(5k\\) blue marbles. After adding 6 red marbles, red and blue are equal: \\(3k + 6 = 5k\\), so \\(k = 3\\), and the bag held \\(8k = 24\\) marbles. Choice C counts the marbles after the 6 were added.","format":"mc","choices":["16","24","30","48"],"correct":"B"},{"id":"m-cal-08","section":"math","concept":"data1","domain":"PSDA","difficulty":"hard","stem":"The mean of 11 test scores is 82.4. When the lowest score is removed, the mean of the remaining 10 scores is 85.1. What is the lowest score?","explanation":"The 11 scores add up to \\(11 \\cdot 82.4 = 906.4\\), and the remaining 10 add up to \\(10 \\cdot 85.1 = 851\\). The removed score is \\(906.4 - 851 = 55.4\\). Choice A is the change in the mean, and D subtracts that change from the original mean.","format":"mc","choices":["2.7","55.4","58.1","79.7"],"correct":"B"},{"id":"m-cal-09","section":"math","concept":"data2","domain":"PSDA","difficulty":"hard","stem":"A model estimates the number of visitors to a state park, \\(V\\), in thousands, \\(t\\) years after 2010 as \\(V = 14.2(1.06)^t\\). Based on the model, approximately how many people visited the park in 2022?","explanation":"2022 is 12 years after 2010, so \\(V = 14.2(1.06)^{12} \\approx 14.2(2.012) \\approx 28.6\\) thousand, or about 28,600 visitors. Choice B uses \\(t = 1\\), B adds 6% of 14.2 each year (linear growth), and D uses \\(t = 13\\).","format":"mc","choices":["About 28,600","About 15,100","About 24,400","About 30,300"],"correct":"A"},{"id":"m-cal-10","section":"math","concept":"data2","domain":"PSDA","difficulty":"hard","stem":"The scatterplot shows six data points and the line of best fit \\(y = 3.4x + 12.1\\). One of the data points is \\((8, 41.5)\\). How much greater is the \\(y\\)-coordinate of this point than the value the line gives for \\(x = 8\\)?","explanation":"The line predicts \\(y = 3.4(8) + 12.1 = 39.3\\) at \\(x = 8\\). The point is above the line by \\(41.5 - 39.3 = 2.2\\). Choice A subtracts in the wrong order (the point is above the line, not below it), and D is the predicted value itself.","fig":"<div class=\"mfigw\"><svg class=\"mfig\" viewBox=\"0 0 340 265\" width=\"340\" height=\"265\" role=\"img\" aria-label=\"Scatterplot of six points with the line of best fit y = 3.4x + 12.1\" font-family=\"-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif\"><line x1=\"50\" x2=\"50\" y1=\"223\" y2=\"12\" stroke=\"#e1e5ea\"/><text x=\"50\" y=\"237\" font-size=\"11\" text-anchor=\"middle\" fill=\"#3d4450\">0<\/text><line x1=\"89.43\" x2=\"89.43\" y1=\"223\" y2=\"12\" stroke=\"#e1e5ea\"/><text x=\"89.43\" y=\"237\" font-size=\"11\" text-anchor=\"middle\" fill=\"#3d4450\">2<\/text><line x1=\"128.86\" x2=\"128.86\" y1=\"223\" y2=\"12\" stroke=\"#e1e5ea\"/><text x=\"128.86\" y=\"237\" font-size=\"11\" text-anchor=\"middle\" fill=\"#3d4450\">4<\/text><line x1=\"168.29\" x2=\"168.29\" y1=\"223\" y2=\"12\" stroke=\"#e1e5ea\"/><text x=\"168.29\" y=\"237\" font-size=\"11\" text-anchor=\"middle\" fill=\"#3d4450\">6<\/text><line x1=\"207.71\" x2=\"207.71\" y1=\"223\" y2=\"12\" stroke=\"#e1e5ea\"/><text x=\"207.71\" y=\"237\" font-size=\"11\" text-anchor=\"middle\" fill=\"#3d4450\">8<\/text><line x1=\"247.14\" x2=\"247.14\" y1=\"223\" y2=\"12\" stroke=\"#e1e5ea\"/><text x=\"247.14\" y=\"237\" font-size=\"11\" text-anchor=\"middle\" fill=\"#3d4450\">10<\/text><line x1=\"286.57\" x2=\"286.57\" y1=\"223\" y2=\"12\" stroke=\"#e1e5ea\"/><text x=\"286.57\" y=\"237\" font-size=\"11\" text-anchor=\"middle\" fill=\"#3d4450\">12<\/text><line x1=\"326\" x2=\"326\" y1=\"223\" y2=\"12\" stroke=\"#e1e5ea\"/><text x=\"326\" y=\"237\" font-size=\"11\" text-anchor=\"middle\" fill=\"#3d4450\">14<\/text><line x1=\"50\" x2=\"326\" y1=\"223\" y2=\"223\" stroke=\"#e1e5ea\"/><text x=\"45\" y=\"227\" font-size=\"11\" text-anchor=\"end\" fill=\"#3d4450\">0<\/text><line x1=\"50\" x2=\"326\" y1=\"187.83\" y2=\"187.83\" stroke=\"#e1e5ea\"/><text x=\"45\" y=\"191.83\" font-size=\"11\" text-anchor=\"end\" fill=\"#3d4450\">10<\/text><line x1=\"50\" x2=\"326\" y1=\"152.67\" y2=\"152.67\" stroke=\"#e1e5ea\"/><text x=\"45\" y=\"156.67\" font-size=\"11\" text-anchor=\"end\" fill=\"#3d4450\">20<\/text><line x1=\"50\" x2=\"326\" y1=\"117.5\" y2=\"117.5\" stroke=\"#e1e5ea\"/><text x=\"45\" y=\"121.5\" font-size=\"11\" text-anchor=\"end\" fill=\"#3d4450\">30<\/text><line x1=\"50\" x2=\"326\" y1=\"82.33\" y2=\"82.33\" stroke=\"#e1e5ea\"/><text x=\"45\" y=\"86.33\" font-size=\"11\" text-anchor=\"end\" fill=\"#3d4450\">40<\/text><line x1=\"50\" x2=\"326\" y1=\"47.17\" y2=\"47.17\" stroke=\"#e1e5ea\"/><text x=\"45\" y=\"51.17\" font-size=\"11\" text-anchor=\"end\" fill=\"#3d4450\">50<\/text><line x1=\"50\" x2=\"326\" y1=\"12\" y2=\"12\" stroke=\"#e1e5ea\"/><text x=\"45\" y=\"16\" font-size=\"11\" text-anchor=\"end\" fill=\"#3d4450\">60<\/text><line x1=\"50\" x2=\"326\" y1=\"223\" y2=\"223\" stroke=\"#1f2328\"/><line x1=\"50\" x2=\"50\" y1=\"223\" y2=\"12\" stroke=\"#1f2328\"/><text x=\"188\" y=\"259\" font-size=\"12\" text-anchor=\"middle\">x<\/text><text transform=\"translate(13,117.5) rotate(-90)\" font-size=\"12\" text-anchor=\"middle\">y<\/text><line x1=\"50\" y1=\"180.45\" x2=\"326\" y2=\"13.06\" stroke=\"#be185d\" stroke-width=\"2\"/><circle cx=\"89.43\" cy=\"159.7\" r=\"4\" fill=\"#1d4ed8\"/><circle cx=\"128.86\" cy=\"127.7\" r=\"4\" fill=\"#1d4ed8\"/><circle cx=\"168.29\" cy=\"112.22\" r=\"4\" fill=\"#1d4ed8\"/><circle cx=\"207.71\" cy=\"77.06\" r=\"4\" fill=\"#1d4ed8\"/><circle cx=\"247.14\" cy=\"64.05\" r=\"4\" fill=\"#1d4ed8\"/><circle cx=\"286.57\" cy=\"33.45\" r=\"4\" fill=\"#1d4ed8\"/><\/svg><\/div>","format":"mc","choices":["-2.2","2.2","27.2","39.3"],"correct":"B"},{"id":"m-cal-11","section":"math","concept":"infer","domain":"PSDA","difficulty":"hard","stem":"In a random sample of 500 adults from a city with 285,000 adults, 130 said they use public transit every day. The margin of error for the sample proportion is 4 percentage points. Based on these results, which range most plausibly contains the number of adults in the city who use public transit every day?","explanation":"The sample proportion is \\(\\frac{130}{500} = 26\\%\\), so the plausible range is 22% to 30% of the city: \\(0.22 \\cdot 285{,}000 = 62{,}700\\) to \\(0.30 \\cdot 285{,}000 = 85{,}500\\). Choice C uses a margin of only 2 points, D starts at the estimate itself, and A applies the margin to the sample, not the city.","format":"mc","choices":["110 to 150","62,700 to 85,500","68,400 to 79,800","74,100 to 85,500"],"correct":"B"},{"id":"m-cal-12","section":"math","concept":"area-vol","domain":"GEO","difficulty":"hard","stem":"A cylindrical water tank has an inside diameter of 2.4 meters and an inside height of 3.5 meters. To the nearest cubic meter, what is the volume of the tank?","explanation":"The radius is half the diameter, 1.2 meters, so \\(V = \\pi r^2 h = \\pi(1.2)^2(3.5) = 5.04\\pi \\approx 15.8\\), or about 16 cubic meters. Choice D uses the diameter as the radius, and C uses \\(\\pi d h\\).","format":"mc","choices":["13","16","26","63"],"correct":"B"},{"id":"m-cal-13","section":"math","concept":"area-vol","domain":"GEO","difficulty":"hard","stem":"A rectangular prism has a volume of 1,701 cubic centimeters and a height of 7 centimeters. The length of its base is 3 times the width of its base. What is the total surface area of the prism, in square centimeters?","explanation":"With width \\(w\\), the volume is \\(3w \\cdot w \\cdot 7 = 21w^2 = 1{,}701\\), so \\(w^2 = 81\\) and \\(w = 9\\); the length is 27. The surface area is \\(2(27 \\cdot 9 + 27 \\cdot 7 + 9 \\cdot 7) = 2(243 + 189 + 63) = 990\\). Choice A counts each face only once.","format":"mc","choices":["495","729","990","1,701"],"correct":"C"},{"id":"m-cal-14","section":"math","concept":"lines-angles","domain":"GEO","difficulty":"hard","stem":"Two parallel lines are cut by a transversal. Two same-side interior angles formed by the transversal have measures \\((3x + 17)^\\circ\\) and \\((5x - 9)^\\circ\\). What is the measure, in degrees, of the larger of these two angles?","explanation":"Same-side interior angles are supplementary: \\(3x + 17 + 5x - 9 = 180\\), so \\(8x = 172\\) and \\(x = 21.5\\). The angles are \\(3(21.5) + 17 = 81.5\\) and \\(5(21.5) - 9 = 98.5\\). Choice B sets the angles equal, and A is the value of \\(x\\).","format":"mc","choices":["21.5","56","81.5","98.5"],"correct":"D"},{"id":"m-cal-15","section":"math","concept":"triangles","domain":"GEO","difficulty":"hard","stem":"In triangle \\(ABC\\), point \\(D\\) lies on \\(\\overline{AB}\\) and point \\(E\\) lies on \\(\\overline{AC}\\) so that \\(\\overline{DE}\\) is parallel to \\(\\overline{BC}\\). If \\(AD = 5.6\\), \\(DB = 8.4\\), and \\(DE = 4.6\\), what is the length of \\(\\overline{BC}\\)?","explanation":"Because \\(\\overline{DE} \\parallel \\overline{BC}\\), triangle \\(ADE\\) is similar to triangle \\(ABC\\). \\(AB = 5.6 + 8.4 = 14\\), so the scale factor is \\(14 \\div 5.6 = 2.5\\) and \\(BC = 2.5 \\cdot 4.6 = 11.5\\). Choice B uses \\(DB\\) instead of \\(AB\\), and C simply doubles \\(DE\\).","format":"mc","choices":["4.6","6.9","9.2","11.5"],"correct":"D"},{"id":"m-cal-16","section":"math","concept":"right-trig","domain":"GEO","difficulty":"hard","stem":"A wheelchair ramp rises 0.75 meter over a horizontal distance of 9 meters. To the nearest tenth of a degree, what is the measure of the angle the ramp makes with the horizontal ground?","explanation":"The rise is opposite the angle and the horizontal distance is adjacent, so \\(\\tan\\theta = \\frac{0.75}{9} \\approx 0.0833\\) and \\(\\theta \\approx 4.8^\\circ\\). Choice D is the other acute angle, and A is the angle in radians.","format":"mc","choices":["0.1","4.8","8.3","85.2"],"correct":"B"},{"id":"m-cal-17","section":"math","concept":"right-trig","domain":"GEO","difficulty":"hard","stem":"In right triangle \\(JKL\\), angle \\(K\\) is the right angle and \\(\\cos J = \\frac{20}{29}\\). If \\(JK = 50\\), what is the length of \\(\\overline{KL}\\)?","explanation":"\\(\\cos J = \\frac{JK}{JL}\\), so \\(JL = 50 \\cdot \\frac{29}{20} = 72.5\\). Then \\(KL = \\sqrt{72.5^2 - 50^2} = \\sqrt{2{,}756.25} = 52.5\\). (The sides are in the ratio 20 : 21 : 29.) Choice A uses the 21 from that /* ---------- charts ---------- */
function niceMax(v){ var p = Math.pow(10, Math.floor(Math.log10(v))); var m = v/p; var n = m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10; return n*p; }
function chartSVG(ch){
  var W=560,H=320,L=62,R=16,T=40,B=50, pw=W-L-R, ph=H-T-B;
  var max = niceMax(Math.max.apply(null, ch.values) * 1.12), n = ch.values.length;
  var o = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(ch.title)+'">';
  o += '<text x="'+(W/2)+'" y="20" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">'+esc(ch.title)+'</text>';
  for (var i=0;i<=5;i++){ var v = max*i/5, y = T+ph-ph*i/5;
    o += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#e3e6eb"/>';
    o += '<text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="#5b6470">'+(Math.round(v*10)/10)+'</text>'; }
  o += '<line x1="'+L+'" x2="'+L+'" y1="'+T+'" y2="'+(T+ph)+'" stroke="#5b6470"/><line x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+ph)+'" y2="'+(T+ph)+'" stroke="#5b6470"/>';
  o += '<text transform="translate(16,'+(T+ph/2)+') rotate(-90)" text-anchor="middle" font-size="12" fill="#5b6470">'+esc(ch.yLabel||'')+'</text>';
  var step = pw/n, pts = [];
  ch.values.forEach(function(v, i){
    var cx = L + step*i + step/2, y = T + ph - ph*v/max;
    o += '<text x="'+cx+'" y="'+(T+ph+20)+'" text-anchor="middle" font-size="13" fill="#1f2328">'+esc(ch.labels[i])+'</text>';
    if (ch.type === 'bar'){
      var bw = Math.min(56, step*0.6);
      o += '<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+(T+ph-y)+'" fill="#4f7be8"/>';
    }
    o += '<text x="'+cx+'" y="'+(y-8)+'" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">'+v+'</text>';
    pts.push([cx,y]);
  });
  if (ch.type === 'line'){
    o += '<polyline fill="none" stroke="#1d4ed8" stroke-width="2.5" points="'+pts.map(function(p){return p.join(',');}).join(' ')+'"/>';
    pts.forEach(function(p){ o += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4.5" fill="#1d4ed8"/>'; });
  }
  return o + '</svg>';
}
function passageHTML(q){ return (q.chart ? '<div class="chart">'+chartSVG(q.chart)+'</div>' : '') + (q.passage || ''); }

function choose(L){

  if (s.struck && s.struck[id] && s.struck[id][L]) delete s.struck[id][L]; // choosing a crossed-out answer un-crosses it (like Bluebook)

/* ---------- timer ---------- */
var lastTick = now(), saveCounter = 0;
function tick(){
  var t = now(), dt = Math.min(t - lastTick, 2000) / 1000; lastTick = t;
  if (view.page !== 'run' || document.hidden || !ACTIVE) return;
  var s = curSession(); if (!s || s.finishedAt) return;
  if (s.stage === 'break' && s.breakEnds) { var bl = (s.breakEnds - t) / 1000, bc = document.getElementById('breakclock'); if (bc) bc.textContent = fmtClock(bl); if (bl <= 0) { closeModal(); startNextModule(s); } return; }
  if (s.stage === 'q' && !modalOpen()) { var tq = qaRec(s, s.modules[s.mod][s.idx]); tq.sec = Math.round(((+tq.sec || 0) + dt) * 10) / 10; }
  if (!s.timed || (s.stage !== 'q' && s.stage !== 'check')) { if (++saveCounter % 5 === 0) save(); return; }
  var before = s.timeLeft[s.mod];
  s.timeLeft[s.mod] = Math.max(0, before - dt);
  var left = s.timeLeft[s.mod];
  var clock = document.getElementById('clock');
  if (clock) clock.textContent = fmtClock(left);
  if (before > 300 && left <= 300) { render(); if (!modalOpen()) modal('5 minutes left', '<p>Make sure every question has an answer. Guessing is better than leaving one blank.</p>'); }
  if (++saveCounter % 5 === 0) save();
  if (left <= 0 && before > 0){
    save();
    var tu = s.mode === 'speed' ? '<p>⏱️ Time! Let\'s see how many you got.</p>' : s.mode === 'boss' ? '<p>⏱️ Time\'s up! Your Boss Battle answers were submitted.</p>' : '<p>Module '+modNum(s, s.mod)+' has ended, and your answers have been submitted.</p>';
    modal(s.mode === 'speed' ? 'Time!' : 'Time\'s up', tu, [{label:'Continue', primary:true}]);
    submitModule();
  }
}
