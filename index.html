,","Similarly,"],"correct":"B","domain":"EI","concept":"transition","difficulty":"hard","explanation":"Winning a prize is surprising after failing twice. \"Even so\" means \"despite that.\" \"Consequently\" would wrongly say that failing caused the prize."},{"id":"transition-6","passage":"<p>To make paper by hand, workers first soak plant fibers in water and beat them into a pulp. <span class=\"blank\" aria-label=\"blank\">______<\/span> they spread the pulp in a thin layer over a screen and let it dry.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["Next,","Nonetheless,","In other words,","By contrast,"],"correct":"A","domain":"EI","concept":"transition","difficulty":"medium","explanation":"The text describes steps in order (\"first …\"), and spreading the pulp is the following step, so \"Next\" fits. The second sentence doesn't restate or contrast with the first."},{"id":"transition-7","passage":"<p>Wood frogs survive Alaska's harsh winters by allowing much of their bodies to freeze solid; in spring, they thaw and hop away. <span class=\"blank\" aria-label=\"blank\">______<\/span> some young painted turtles spend their first winter partly frozen in their underground nests before thawing in spring.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["Instead,","As a result,","Similarly,","In other words,"],"correct":"C","domain":"EI","concept":"transition","difficulty":"hard","explanation":"Both animals survive winter by partly freezing and thawing in spring, which is the same strategy, so \"Similarly\" fits. The turtles aren't caused by the frogs (B), and the second sentence isn't a restatement (D)."},{"id":"transition-8","passage":"<p>Scientists describe the kakapo, a parrot from New Zealand, as nocturnal. <span class=\"blank\" aria-label=\"blank\">______<\/span> the kakapo is active mainly at night and rests during the day.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["However,","As a result,","For example,","In other words,"],"correct":"D","domain":"EI","concept":"transition","difficulty":"medium","explanation":"The second sentence explains what \"nocturnal\" means, restating the first sentence in plainer words. \"In other words\" signals a restatement."},{"id":"synthesis-1","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Giant sequoias grow naturally only on the western slopes of California's Sierra Nevada.<\/li><li>The largest giant sequoia, called General Sherman, is about 84 meters tall.<\/li><li>General Sherman's trunk is about 11 meters wide at its base.<\/li><li>Some giant sequoias are more than 3,000 years old.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize the size of the largest giant sequoia. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Giant sequoias grow naturally only in California's Sierra Nevada.","Some giant sequoias are more than 3,000 years old.","The largest giant sequoia, General Sherman, stands about 84 meters tall, with a trunk about 11 meters wide at its base.","Giant sequoias can live for thousands of years in the Sierra Nevada."],"correct":"C","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"The goal is SIZE, so the answer needs the height and width measurements. B and D are about age, and A is about location."},{"id":"synthesis-2","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Camels live in deserts in Africa and Asia.<\/li><li>Llamas live in the Andes Mountains of South America.<\/li><li>Camels and llamas both belong to the camelid family.<\/li><li>People have used both animals for thousands of years to carry heavy loads.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize a similarity between camels and llamas. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Camels live in Africa and Asia, while llamas live in South America.","Like camels, llamas belong to the camelid family and have long been used by people to carry heavy loads.","Llamas live in the Andes Mountains of South America.","Camels live in deserts, but llamas live in mountains."],"correct":"B","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"\"Similarity\" means what they have in common: same family and the same use by people. A and D emphasize DIFFERENCES, the opposite of the goal."},{"id":"synthesis-3","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Katherine Johnson was a mathematician at NASA.<\/li><li>She calculated flight paths for early U.S. space missions.<\/li><li>In 1962, before becoming the first American to orbit Earth, astronaut John Glenn asked that Johnson personally check the computer's calculations for his flight.<\/li><li>She received the Presidential Medal of Freedom in 2015.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize how much astronauts trusted Johnson's work. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Katherine Johnson received the Presidential Medal of Freedom in 2015.","Katherine Johnson was a mathematician at NASA.","Johnson calculated flight paths for early U.S. space missions.","Before his historic 1962 orbit of Earth, astronaut John Glenn asked that Johnson personally check the computer's calculations."],"correct":"D","domain":"EI","concept":"synthesis","difficulty":"hard","explanation":"The goal mentions astronauts' TRUST. Glenn asking for Johnson specifically to check the computer's math shows that trust. The award (A) shows recognition, but not from astronauts."},{"id":"synthesis-4","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>The Dust Bowl was a period of severe dust storms in the U.S. Great Plains during the 1930s.<\/li><li>Farmers had plowed up native grasses whose deep roots held the soil in place.<\/li><li>A long drought dried out the exposed soil.<\/li><li>Strong winds then carried the loose soil away in huge clouds.<\/li><\/ul>","chart":null,"stem":"The student wants to explain what caused the Dust Bowl. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["After farmers plowed up the deep-rooted native grasses that held the soil in place, a long drought dried out the exposed soil, and strong winds carried it away.","The Dust Bowl was a period of severe dust storms in the 1930s.","Strong winds are common on the Great Plains.","The Dust Bowl took place in the Great Plains of the United States."],"correct":"A","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"The goal is CAUSES, and A lays out the chain of causes (plowing, then drought, then wind). B and D describe what and where, not why."},{"id":"synthesis-5","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Mercury is the planet closest to the Sun.<\/li><li>Mercury's daytime temperature can reach about 430°C.<\/li><li>At night, Mercury's temperature can drop to about −180°C.<\/li><li>Mercury has almost no atmosphere to trap heat.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize the difference between Mercury's daytime and nighttime temperatures. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Mercury is the closest planet to the Sun.","Mercury has almost no atmosphere to trap heat.","Mercury's temperature swings from about 430°C during the day to about −180°C at night.","Mercury's daytime temperature can reach about 430°C."],"correct":"C","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"A \"difference\" needs both numbers side by side. D gives only the daytime temperature, and B gives a reason without showing the difference."},{"id":"synthesis-6","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>The kora is a stringed instrument from West Africa.<\/li><li>It has 21 strings.<\/li><li>Its body is made from a large gourd covered with cowhide.<\/li><li>For centuries, musicians called griots have played the kora while telling stories and histories.<\/li><\/ul>","chart":null,"stem":"The student wants to introduce the kora to an audience unfamiliar with it. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The kora has 21 strings.","Griots have played music for centuries.","A gourd covered with cowhide forms the instrument's body.","The kora, a 21-string instrument from West Africa, has been played for centuries by griots, musicians who tell stories and histories."],"correct":"D","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"An unfamiliar audience needs to know what the kora is and where it's from, and any special terms (like \"griots\") need to be explained. D does all of that; the others give single details without introducing the instrument."},{"id":"synthesis-7","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Researchers asked 100 volunteers to memorize a list of words.<\/li><li>Half of the volunteers then slept for eight hours; the other half stayed awake for the same amount of time.<\/li><li>When tested, the volunteers who had slept remembered about 20 percent more words.<\/li><li>The researchers concluded that sleep helps the brain store new memories.<\/li><\/ul>","chart":null,"stem":"The student wants to present the study's conclusion. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Researchers asked 100 volunteers to memorize a list of words.","Because volunteers who slept recalled about 20 percent more words than those who stayed awake, the researchers concluded that sleep helps the brain store new memories.","Half of the volunteers slept for eight hours.","The volunteers were tested on a list of words."],"correct":"B","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"Only B states the conclusion (sleep helps store memories), along with the result that supports it. The other choices describe how the study was set up."},{"id":"wic-9","passage":"<p>Although early reviewers dismissed the composer's experimental symphony as mere noise, later critics came to <span class=\"blank\" aria-label=\"blank\">______<\/span> it as a turning point in modern music, praising the very clashing sounds that had once offended audiences.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["disregard","imitate","laud","misinterpret"],"correct":"C","domain":"CS","concept":"wic","difficulty":"hard","explanation":"\"Although\" sets up a contrast with \"dismissed,\" and \"praising\" restates the blank. \"Laud\" means to praise highly. \"Disregard\" would repeat the early reviewers' reaction instead of contrasting with it."},{"id":"wic-10","passage":"<p>The witness's account was frustratingly <span class=\"blank\" aria-label=\"blank\">______<\/span>: she could not recall the color of the car, the time of the accident, or even which direction the driver had been heading.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["vague","meticulous","emphatic","persuasive"],"correct":"A","domain":"CS","concept":"wic","difficulty":"medium","explanation":"The colon introduces evidence: she couldn't remember any specific details. \"Vague\" means unclear or lacking detail. \"Meticulous\" (very careful and detailed) is the opposite."},{"id":"wic-11","passage":"<p>Botanist Lucia Ferrer's claim that the orchid is pollinated by only a single moth species remains <span class=\"blank\" aria-label=\"blank\">______<\/span>: although the idea is plausible, no one has yet observed the moth visiting the flower.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["obsolete","indisputable","celebrated","speculative"],"correct":"D","domain":"CS","concept":"wic","difficulty":"hard","explanation":"The claim is \"plausible\" but hasn't been confirmed by observation, so it is \"speculative,\" based on reasoning rather than proof. \"Indisputable\" is the opposite, and \"obsolete\" would mean it had been replaced."},{"id":"wic-12","passage":"<p>The mayor's speech was notably <span class=\"blank\" aria-label=\"blank\">______<\/span>; she spoke for only three minutes, yet she managed to outline every major part of her plan.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["rambling","concise","hesitant","ornate"],"correct":"B","domain":"CS","concept":"wic","difficulty":"medium","explanation":"Covering everything in only three minutes means the speech was short but complete. \"Concise\" means saying a lot in few words. \"Rambling\" and \"ornate\" suggest long or fancy speech."},{"id":"wic-13","passage":"<p>Some historians argue that the treaty did not resolve the conflict so much as <span class=\"blank\" aria-label=\"blank\">______<\/span> it: by leaving the border dispute unsettled, the agreement allowed tensions to grow worse over the following decade.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["exacerbate","conclude","document","simplify"],"correct":"A","domain":"CS","concept":"wic","difficulty":"hard","explanation":"The colon explains that the treaty let tensions \"grow worse.\" \"Exacerbate\" means to make a problem worse. \"Conclude\" is what the treaty did NOT do (\"did not resolve\")."},{"id":"wic-14","passage":"<p>The novelist is known for her <span class=\"blank\" aria-label=\"blank\">______<\/span> style; a single sentence of hers may run for half a page, wandering through memories, side comments, and descriptions before it finally reaches its point.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["terse","predictable","digressive","formal"],"correct":"C","domain":"CS","concept":"wic","difficulty":"hard","explanation":"Sentences that \"wander\" through side comments before reaching the point are \"digressive\" (straying from the main topic). \"Terse\" means short and blunt, which is the opposite."},{"id":"wic-15","passage":"<p>To avoid wasting the expedition's limited supplies, the team leader was <span class=\"blank\" aria-label=\"blank\">______<\/span> about rationing, measuring out each day's food and water to the gram.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["careless","scrupulous","ambivalent","apologetic"],"correct":"B","domain":"CS","concept":"wic","difficulty":"hard","explanation":"Measuring \"to the gram\" shows extreme care and precision, which is the meaning of \"scrupulous.\" \"Careless\" is the opposite, and nothing suggests mixed feelings (\"ambivalent\")."},{"id":"wic-16","passage":"<p>Because the results of the first trial were so <span class=\"blank\" aria-label=\"blank\">______<\/span>, with some patients improving dramatically and others not at all, the researchers could draw no firm conclusion about the drug's effectiveness.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["uniform","promising","conclusive","inconsistent"],"correct":"D","domain":"CS","concept":"wic","difficulty":"hard","explanation":"Some patients improved dramatically and others didn't improve at all, so the results varied widely. \"Inconsistent\" fits. \"Uniform\" (all the same) and \"conclusive\" contradict \"no firm conclusion.\""},{"id":"wic-17","passage":"<p>Many species of deep-sea fish are <span class=\"blank\" aria-label=\"blank\">______<\/span>: they are rarely seen by researchers because they live in waters too deep and dark for most cameras and submarines to reach.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["elusive","aggressive","abundant","colorful"],"correct":"A","domain":"CS","concept":"wic","difficulty":"hard","explanation":"The fish are \"rarely seen\" because they are hard to reach. \"Elusive\" means difficult to find or catch. The text says nothing about how aggressive, common, or colorful they are."},{"id":"wic-18","passage":"<p>Although the two scientists agreed on the basic facts, their interpretations of the data were strikingly <span class=\"blank\" aria-label=\"blank\">______<\/span>: one saw evidence of a warming trend, while the other saw only normal variation.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["similar","technical","divergent","tentative"],"correct":"C","domain":"CS","concept":"wic","difficulty":"hard","explanation":"\"Although they agreed on the facts\" sets up a contrast, and the colon shows two very different readings. \"Divergent\" means going in different directions. \"Similar\" ignores the contrast."},{"id":"wic-19","passage":"<p>The tiny town's library had a <span class=\"blank\" aria-label=\"blank\">______<\/span> budget, so the librarians relied on donated books and volunteer staff to keep it open.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["lavish","meager","flexible","secret"],"correct":"B","domain":"CS","concept":"wic","difficulty":"medium","explanation":"Relying on donations and volunteers shows there wasn't much money. \"Meager\" means small or not enough. \"Lavish\" (generous, plentiful) is the opposite."},{"id":"wic-20","passage":"<p>Critics of the proposal argued that its benefits were <span class=\"blank\" aria-label=\"blank\">______<\/span> at best: the new highway would shorten commutes by less than a minute while costing hundreds of millions of dollars.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["substantial","immediate","obvious","negligible"],"correct":"D","domain":"CS","concept":"wic","difficulty":"hard","explanation":"Saving \"less than a minute\" is a tiny benefit. \"Negligible\" means so small it hardly matters. \"Substantial\" means large, the opposite of the critics' point."},{"id":"wic-21","passage":"<p>Though often shown in films as fierce hunters of humans, most shark species are fairly <span class=\"blank\" aria-label=\"blank\">______<\/span> toward people, rarely approaching swimmers and almost never attacking them.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["indifferent","hostile","devoted","curious"],"correct":"A","domain":"CS","concept":"wic","difficulty":"hard","explanation":"\"Though\" contrasts the movie image with reality: sharks rarely approach or attack, meaning they show little interest in people. That's \"indifferent.\" \"Hostile\" matches the movie image, and \"curious\" sharks would approach."},{"id":"wic-22","passage":"<p>The physicist's early theory, once widely accepted, is now considered <span class=\"blank\" aria-label=\"blank\">______<\/span>; newer measurements have shown that several of its key predictions were incorrect.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["innovative","influential","obsolete","controversial"],"correct":"C","domain":"CS","concept":"wic","difficulty":"hard","explanation":"A theory whose key predictions were shown to be wrong is no longer in use, so it is \"obsolete\" (out of date). \"Controversial\" would mean people still argue about it, but the measurements have settled the question."},{"id":"wic-23","passage":"<p>In her memoir, the chef writes about her grandmother's cooking with <span class=\"blank\" aria-label=\"blank\">______<\/span>, recalling each dish fondly and crediting her grandmother with inspiring her entire career.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["indifference","reverence","suspicion","impatience"],"correct":"B","domain":"CS","concept":"wic","difficulty":"hard","explanation":"Recalling dishes \"fondly\" and giving her grandmother credit for her career shows deep respect and admiration, which is \"reverence.\" The other choices are negative or uncaring."},{"id":"wic-24","passage":"<p>Engineers designed the bridge to be <span class=\"blank\" aria-label=\"blank\">______<\/span>, able to bend slightly in strong winds and during earthquakes without cracking.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["rigid","ornamental","temporary","flexible"],"correct":"D","domain":"CS","concept":"wic","difficulty":"medium","explanation":"\"Able to bend slightly … without cracking\" defines \"flexible.\" \"Rigid\" means stiff and unbending, which is the opposite."},{"id":"wic-25","passage":"<p>The class was <span class=\"blank\" aria-label=\"blank\">______<\/span> to begin the long research project, but once they started building the model city, no one wanted to stop.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["reluctant","eager","prepared","unable"],"correct":"A","domain":"CS","concept":"wic","difficulty":"medium","explanation":"\"But once they started … no one wanted to stop\" signals a change from not wanting to begin. \"Reluctant\" means unwilling or hesitant. \"Eager\" wouldn't create a contrast with \"but.\""},{"id":"wic-26","passage":"<p>Without enough rain, the farmers' wheat crop was <span class=\"blank\" aria-label=\"blank\">______<\/span>, producing only half the usual harvest.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["abundant","colorful","sparse","delicious"],"correct":"C","domain":"CS","concept":"wic","difficulty":"medium","explanation":"Half the usual harvest means the crop was thin and small. \"Sparse\" means thinly spread or scanty. \"Abundant\" is the opposite."},{"id":"wic-27","passage":"<p>The detective's <span class=\"blank\" aria-label=\"blank\">______<\/span> question made the suspect nervous; it showed that she already knew far more about the crime than he had expected.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["random","pointed","polite","confusing"],"correct":"B","domain":"CS","concept":"wic","difficulty":"hard","explanation":"A \"pointed\" question is sharp and aimed directly at something specific, which is why it revealed what the detective knew. A \"random\" or \"confusing\" question wouldn't show she knew a lot."},{"id":"wic-28","passage":"<p>The heavy wooden table was built to be <span class=\"blank\" aria-label=\"blank\">______<\/span>, and after a hundred years of family dinners, it still stood as sturdy as the day it was made.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["fragile","portable","decorative","durable"],"correct":"D","domain":"CS","concept":"wic","difficulty":"medium","explanation":"Still \"sturdy\" after a hundred years means it was built to last, which is \"durable.\" \"Fragile\" (easily broken) is the opposite."},{"id":"wic-29","passage":"<p>Anyone who hopes to see the comet should be <span class=\"blank\" aria-label=\"blank\">______<\/span>: it appears for only a few minutes before sunrise, and it won't return for another 70 years.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["prompt","fearful","doubtful","generous"],"correct":"A","domain":"CS","concept":"wic","difficulty":"medium","explanation":"The comet is visible only briefly, so viewers must be on time. \"Prompt\" means acting quickly or on time. Nothing suggests fear, doubt, or generosity."},{"id":"wic-30","passage":"<p>Though he usually answered questions in long, careful paragraphs, Mr. Tanaka's reply to the reporter was <span class=\"blank\" aria-label=\"blank\">______<\/span>: \"No comment.\"<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["lengthy","emotional","curt","confusing"],"correct":"C","domain":"CS","concept":"wic","difficulty":"hard","explanation":"\"Though he usually\" signals a contrast with long answers, and \"No comment\" is extremely short and abrupt. \"Curt\" means rudely brief. \"Lengthy\" describes his usual style, not this reply."},{"id":"wic-31","passage":"<p>The two friends' personalities were <span class=\"blank\" aria-label=\"blank\">______<\/span>: Jae loved loud parties, while Omar preferred quiet hikes alone.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["identical","contrasting","mysterious","harmonious"],"correct":"B","domain":"CS","concept":"wic","difficulty":"medium","explanation":"Loud parties versus quiet solo hikes are opposite preferences, so their personalities were \"contrasting.\" \"Identical\" is the opposite of what the colon shows."},{"id":"wic-32","passage":"<p>Volunteers worked to <span class=\"blank\" aria-label=\"blank\">______<\/span> the old theater, repairing its seats, repainting its walls, and fixing its leaky roof so that it could open again.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["demolish","abandon","sell","restore"],"correct":"D","domain":"CS","concept":"wic","difficulty":"medium","explanation":"Repairing and fixing the theater so it can reopen means bringing it back to good condition, which is \"restore.\" \"Demolish\" means tear down, the opposite."},{"id":"structure-7","passage":"<p>Many people assume that early humans used caves mainly as places to live. Yet archaeological evidence suggests that people rarely lived deep inside caves, where it was dark and damp; they usually camped near cave entrances. <u>The paintings found far from the entrances, in narrow passages that could be reached only by crawling, may therefore have served some purpose other than decorating a home.<\/u><\/p>","chart":null,"stem":"Which choice best describes the function of the underlined sentence in the text as a whole?","choices":["It provides evidence that early humans lived deep inside caves.","It describes the techniques early humans used to make cave paintings.","It questions whether early humans made the paintings at all.","It draws a conclusion about the paintings based on evidence about where people lived."],"correct":"D","domain":"CS","concept":"structure","difficulty":"hard","explanation":"\"Therefore\" signals a conclusion. Since people didn't live deep in caves, paintings found deep inside probably weren't home decorations. A contradicts the evidence, and the text never describes painting methods."},{"id":"structure-8","passage":"<p>In 1928, Alexander Fleming returned from a vacation to find mold growing in one of his dishes of bacteria. A less observant scientist might simply have thrown the dish away. Fleming, however, noticed that the bacteria closest to the mold had died. His curiosity about that small detail led to the discovery of penicillin, the first widely used antibiotic.<\/p>","chart":null,"stem":"Which choice best states the main purpose of the text?","choices":["To show how close attention to an unexpected detail led to an important discovery","To argue that scientists should take more vacations","To explain in detail how penicillin kills bacteria","To compare Fleming's methods with those of other scientists of his time"],"correct":"A","domain":"CS","concept":"structure","difficulty":"hard","explanation":"The text emphasizes Fleming noticing a small, surprising detail (\"however, noticed\") and that this curiosity led to penicillin. The vacation is just background, and the text never explains how penicillin works."},{"id":"structure-9","passage":"<p>Some cities have begun painting rooftops white. Dark roofs absorb sunlight and heat the buildings beneath them, forcing air conditioners to work harder. White roofs reflect much of that sunlight away. A study in one city found that buildings with white roofs used up to 20 percent less energy for cooling on hot days.<\/p>","chart":null,"stem":"Which choice best describes the overall structure of the text?","choices":["It describes a problem and explains why no solution has been found.","It compares the costs of several kinds of roofing materials.","It introduces a practice, explains the reasoning behind it, and reports evidence of its benefit.","It argues that all buildings should have dark roofs."],"correct":"C","domain":"CS","concept":"structure","difficulty":"medium","explanation":"Sentence 1 introduces white roofs, sentences 2–3 explain why they help, and sentence 4 gives study results. Costs are never compared, and the text favors white roofs, not dark ones."},{"id":"structure-10","passage":"<p class=\"intro\">The following text is from an original short story.<\/p>\n<p>Nadia had promised herself she wouldn't cry at the airport. She checked her passport twice, joked with her father about airplane food, and hugged her little brother quickly, as if it were an ordinary school morning. <u>Only when the security line turned the corner and her family disappeared from view did she let her hands stop being steady.<\/u><\/p>","chart":null,"stem":"Which choice best describes the function of the underlined sentence in the text as a whole?","choices":["It reveals that Nadia has forgotten her passport.","It shows that Nadia's calm behavior had been a deliberate effort to hide her emotions.","It suggests that Nadia is excited about trying the airplane food.","It explains why Nadia's family decided not to come to the airport."],"correct":"B","domain":"CS","concept":"structure","difficulty":"hard","explanation":"Nadia acted normal on purpose (she \"had promised herself\"), and the underlined sentence shows she lets her feelings out only once her family can't see. Her family did come, and she had her passport."},{"id":"crosstext-7","passage":"<p class=\"caption\">Text 1<\/p>\n<p>Many astronomers once assumed that planets orbiting other stars would resemble those in our solar system, with small rocky planets close to their star and large gas giants farther away.<\/p>\n<p class=\"caption\">Text 2<\/p>\n<p>Since the 1990s, astronomers have found thousands of planets around other stars. Among the first discovered were \"hot Jupiters,\" gas giants orbiting extremely close to their stars, far closer than Mercury is to the Sun. Many other systems, however, do have arrangements similar to our own.<\/p>","chart":null,"stem":"Based on the texts, how would the astronomers in Text 2 most likely respond to the assumption in Text 1?","choices":["By agreeing that it accurately describes every planetary system","By claiming that no other planetary system resembles our solar system","By arguing that gas giants cannot exist close to their stars","By pointing out that discoveries show the assumption doesn't hold for all systems, even though some systems do fit it"],"correct":"D","domain":"CS","concept":"crosstext","difficulty":"hard","explanation":"Hot Jupiters break the assumed pattern, but Text 2 also says \"many other systems … do have arrangements similar to our own.\" So D is a partial disagreement. B ignores that last sentence, and C contradicts the hot Jupiters."},{"id":"crosstext-8","passage":"<p class=\"caption\">Text 1<\/p>\n<p>Linguist Ana Ruiz argues that texting has harmed young people's writing skills, pointing to the abbreviations and missing punctuation common in text messages.<\/p>\n<p class=\"caption\">Text 2<\/p>\n<p>Researcher David Kim compared students' text messages with essays they wrote for school. Although the students used many abbreviations when texting, those abbreviations almost never appeared in their essays. Kim concludes that students switch between casual and formal writing depending on the situation.<\/p>","chart":null,"stem":"Based on the texts, how would Kim (Text 2) most likely respond to Ruiz's argument (Text 1)?","choices":["He would argue that the habits she points to in text messages don't necessarily carry over into students' formal writing.","He would agree that students' school essays are full of abbreviations.","He would claim that students rarely send text messages.","He would argue that using abbreviations makes school essays stronger."],"correct":"A","domain":"CS","concept":"crosstext","difficulty":"hard","explanation":"Kim found that texting habits didn't show up in essays, which challenges Ruiz's evidence. B contradicts his finding, and he never says abbreviations improve essays."},{"id":"crosstext-9","passage":"<p class=\"caption\">Text 1<\/p>\n<p>Some city leaders argue that building more parking garages downtown is the best way to bring more shoppers to local businesses.<\/p>\n<p class=\"caption\">Text 2<\/p>\n<p>A study of downtown shopping districts found that shoppers who arrived on foot, by bike, or by bus visited stores more often each month and spent more in total than shoppers who drove, even though drivers spent more on each visit.<\/p>","chart":null,"stem":"Based on the texts, how would the author of Text 2 most likely respond to the city leaders in Text 1?","choices":["By agreeing that parking garages are the only way to help local businesses","By suggesting that focusing only on drivers may overlook shoppers who contribute more to local businesses over time","By claiming that drivers spend less on each visit than other shoppers do","By arguing that businesses should move out of downtown areas"],"correct":"B","domain":"CS","concept":"crosstext","difficulty":"medium","explanation":"The study shows non-drivers spend more in total, so focusing only on parking might miss valuable shoppers. C contradicts the text (\"drivers spent more on each visit\")."},{"id":"crosstext-10","passage":"<p class=\"caption\">Text 1<\/p>\n<p>Many nutrition guides once told people to avoid eggs because eggs contain cholesterol, which was thought to raise the level of cholesterol in the blood.<\/p>\n<p class=\"caption\">Text 2<\/p>\n<p>More recent studies have found that for most healthy people, the cholesterol in food has only a small effect on blood cholesterol. Researchers note, however, that a minority of people are especially sensitive to cholesterol in their diet.<\/p>","chart":null,"stem":"Based on the texts, how would the researchers in Text 2 most likely respond to the advice in Text 1?","choices":["By agreeing that everyone should avoid eggs completely","By arguing that eggs contain no cholesterol","By saying the advice was likely too broad for most people, though it might still matter for some","By claiming that blood cholesterol has nothing to do with health"],"correct":"C","domain":"CS","concept":"crosstext","difficulty":"hard","explanation":"Text 2 says dietary cholesterol has a small effect for MOST people but notes some people are sensitive, so the advice was too broad but not entirely wrong. B and D make claims Text 2 never makes."},{"id":"central-7","passage":"<p class=\"intro\">The following text is from an original novel.<\/p>\n<p>When the letter from the music conservatory finally arrived, Lin didn't open it. She set it on the piano, where it leaned against the music stand all afternoon while she practiced the same difficult passage again and again. She told herself she was waiting until she got the passage right. But each time her fingers stumbled, her eyes drifted to the envelope.<\/p>","chart":null,"stem":"Which choice best states the main idea of the text?","choices":["Lin delays learning a result she cares about, and her nervousness about it shows even as she tries to focus on practicing.","Lin has decided not to attend the conservatory.","Lin has already learned that she was accepted to the conservatory.","Lin is frustrated because the piano is out of tune."],"correct":"A","domain":"II","concept":"central","difficulty":"hard","explanation":"She avoids opening the letter, but \"each time her fingers stumbled, her eyes drifted to the envelope,\" showing the letter is on her mind. She hasn't opened it, so she can't know the result (C)."},{"id":"central-8","passage":"<p>Spider silk is one of the toughest materials known: pound for pound, some kinds can absorb more energy before breaking than steel. Scientists would like to produce it in large quantities for uses such as medical stitches and lightweight protective gear. Spiders, however, are difficult to farm, because many species are territorial and will eat one another. Researchers are therefore trying to produce silk proteins using bacteria, yeast, and even silkworms instead.<\/p>","chart":null,"stem":"Which choice best states the main idea of the text?","choices":["Spiders are more dangerous to people than most people think.","Steel is no longer used in protective gear.","Because spider silk is valuable but spiders are hard to farm, scientists are looking for other ways to produce it.","Silkworms produce stronger silk than spiders do."],"correct":"C","domain":"II","concept":"central","difficulty":"medium","explanation":"The text moves from why silk is valuable, to the problem with farming spiders, to the solution researchers are trying. C covers all of it. A, B, and D aren't supported."},{"id":"detail-7","passage":"<p>The Dead Sea, which lies between Jordan and Israel, is so salty that fish and most plants cannot survive in it. The water's high salt content also makes it unusually dense, so swimmers float on its surface with almost no effort.<\/p>","chart":null,"stem":"According to the text, why do swimmers float easily in the Dead Sea?","choices":["The water is unusually warm.","The salty water is very dense.","There are no fish to disturb them.","The sea is very shallow."],"correct":"B","domain":"II","concept":"detail","difficulty":"medium","explanation":"The text says the salt makes the water \"unusually dense, so swimmers float.\" The lack of fish is a separate detail, not the reason for floating."},{"id":"detail-8","passage":"<p class=\"intro\">The following text is from an original short story.<\/p>\n<p>Grandpa Ike kept a small notebook in his coat pocket at all times. He didn't write appointments or grocery lists in it. Instead, whenever he heard a word he didn't know (on the radio, at the hardware store, in a conversation overheard at the bus stop), he wrote it down, and that evening he would look it up in the enormous dictionary on his kitchen table.<\/p>","chart":null,"stem":"According to the text, what does Grandpa Ike use his notebook for?","choices":["Keeping track of his appointments","Writing grocery lists","Recording radio programs he enjoys","Writing down unfamiliar words so he can look them up later"],"correct":"D","domain":"II","concept":"detail","difficulty":"hard","explanation":"The text says he wrote down words he didn't know and looked them up each evening. A and B are exactly what the text says he did NOT use it for."},{"id":"coe-text-7","passage":"<p>Psychologist Dana Levi claims that people remember information better after explaining it to someone else than after only reading it.<\/p>","chart":null,"stem":"Which finding, if true, would most directly support Levi's claim?","choices":["Participants who read a passage and then explained it to a partner recalled more of it a week later than participants who spent the same time reading the passage twice.","Participants who explained a passage to a partner reported that explaining was tiring.","Participants recalled more of a passage the day after reading it than a week after reading it.","Participants who read a passage twice recalled more of it than participants who read it once."],"correct":"A","domain":"II","concept":"coe-text","difficulty":"hard","explanation":"The claim compares explaining with only reading, and A tests exactly that with equal time. D compares two kinds of reading and never involves explaining."},{"id":"coe-text-8","passage":"<p>Economist Raj Patel hypothesizes that a town's new farmers market drew customers away from the town's grocery stores.<\/p>","chart":null,"stem":"Which finding, if true, would most directly weaken Patel's hypothesis?","choices":["Grocery store sales fell after the farmers market opened.","Grocery store sales stayed about the same after the market opened, even though the market attracted many shoppers.","The farmers market sells mostly fruits and vegetables.","Many shoppers said they enjoyed visiting the farmers market."],"correct":"B","domain":"II","concept":"coe-text","difficulty":"hard","explanation":"If the market drew customers away, grocery sales should drop. B shows they didn't, despite the market being busy, which weakens the hypothesis. A would support it."},{"id":"coe-text-9","passage":"<p>In the original novel <em>Harbor Lights<\/em>, the narrator describes Captain Mendes as both strict and caring toward his crew.<\/p>","chart":null,"stem":"Which quotation from the novel most effectively illustrates the claim?","choices":["\"The captain ate alone in his cabin each night, the door shut tight.\"","\"Captain Mendes had sailed these waters for thirty years.\"","\"He punished every sailor who arrived late to watch, yet he never once ate his own supper before making sure each man had been fed.\"","\"The crew whispered that the captain had once been a pirate.\""],"correct":"C","domain":"II","concept":"coe-text","difficulty":"medium","explanation":"The claim needs BOTH traits. Punishing lateness shows strictness, and feeding his crew before himself shows care. The other quotations show neither trait clearly."},{"id":"coe-text-10","passage":"<p>Historian Grace Owusu argues that a 1962 newspaper editorial changed public opinion about a proposed dam in her state.<\/p>","chart":null,"stem":"Which finding, if true, would most directly support Owusu's argument?","choices":["The editorial was written by a well-known journalist.","The dam was eventually built several years later.","Many newspapers in the state published editorials on a wide range of topics that year.","Surveys taken just before and just after the editorial appeared showed that support for the dam dropped from 60 percent to 35 percent, and no other major news about the dam appeared during that time."],"correct":"D","domain":"II","concept":"coe-text","difficulty":"hard","explanation":"To show the editorial CHANGED opinion, you need a before-and-after shift with no other likely cause. D provides both. A says who wrote it but not what effect it had."},{"id":"coe-text-11","passage":"<p>In the original poem \"Morning Bus,\" the speaker expresses a feeling of loneliness despite being surrounded by people.<\/p>","chart":null,"stem":"Which quotation from the poem most effectively illustrates the claim?","choices":["\"Forty strangers breathing in a row, / and not one voice that knows my name.\"","\"The driver hums an old familiar tune / and taps the wheel at every yellow light.\"","\"Rain streaks the window like a pencil sketch / of trees I've passed a hundred times before.\"","\"We rumble past the bakery and the school, / the same two corners every single day.\""],"correct":"A","domain":"II","concept":"coe-text","difficulty":"medium","explanation":"\"Forty strangers\" shows a crowd, and \"not one voice that knows my name\" shows loneliness, so both parts of the claim are covered. The other lines describe the ride without loneliness."},{"id":"coe-text-12","passage":"<p>Botanist Kwame Asante hypothesizes that a certain climbing vine grows toward nearby trees because it detects the shade the trees cast, not because it detects the trees' scent.<\/p>","chart":null,"stem":"Which finding, if true, would most directly support Asante's hypothesis?","choices":["The vine grows faster in sunny areas than in shady ones.","The vine grows toward trees that have a strong scent.","In a greenhouse, the vine grew toward a dark screen that blocked light but had no scent, and it did not grow toward an unshaded container of crushed tree leaves.","The vine is commonly found in forests with many trees."],"correct":"C","domain":"II","concept":"coe-text","difficulty":"hard","explanation":"The hypothesis says shade matters and scent doesn't. C separates the two: the vine followed shade with no scent and ignored scent with no shade. B points toward scent, the opposite."},{"id":"coe-text-13","passage":"<p>In an original essay, the author argues that boredom can be valuable because it pushes people to invent their own activities.<\/p>","chart":null,"stem":"Which quotation from the essay most effectively supports the author's argument?","choices":["\"Most people dislike waiting in long lines at the grocery store.\"","\"On the rainy afternoon when the power went out, my sister and I, with nothing to watch and nothing to play, invented an entire kingdom out of couch cushions and cardboard.\"","\"Boredom is a common complaint among teenagers during summer vacation.\"","\"Some studies suggest that people check their phones dozens of times each day.\""],"correct":"B","domain":"II","concept":"coe-text","difficulty":"medium","explanation":"B shows boredom (\"nothing to watch and nothing to play\") leading to invention (a cushion kingdom), which is exactly the argument. C mentions boredom but not any benefit."},{"id":"coe-quant-7","passage":"<p class=\"caption\">Average Number of Birds Counted per Hour at Three Feeders<\/p>\n<table class=\"data\"><thead><tr><th>Feeder type<\/th><th>Before squirrel guard<\/th><th>After squirrel guard<\/th><\/tr><\/thead><tbody><tr><td>Tube<\/td><td>14<\/td><td>22<\/td><\/tr><tr><td>Platform<\/td><td>18<\/td><td>19<\/td><\/tr><tr><td>Hopper<\/td><td>11<\/td><td>20<\/td><\/tr><\/tbody><\/table>\n<p>A student hypothesizes that adding a squirrel guard increases bird visits more for tube and hopper feeders than for platform feeders.<\/p>","chart":null,"stem":"Which choice best describes data from the table that support the student's hypothesis?","choices":["Bird counts rose by 8 per hour at the tube feeder and by 9 at the hopper feeder but by only 1 at the platform feeder.","The platform feeder had the most birds per hour before the guard was added.","All three feeders had more birds per hour after the guard was added.","The hopper feeder had 20 birds per hour after the guard was added."],"correct":"A","domain":"II","concept":"coe-quant","difficulty":"hard","explanation":"The hypothesis compares the SIZE of the increases, so you must calculate each change: tube +8, hopper +9, platform +1. C is true but doesn't compare the increases."},{"id":"coe-quant-8","passage":"<p>The theater's manager claims that the average ticket price in 2024 was more than 50 percent higher than it was in 2016.<\/p>","chart":{"type":"line","title":"Average Ticket Price at Starlight Cinema","yLabel":"Price (dollars)","labels":["2016","2018","2020","2022","2024"],"values":[9,10,8,11,12]},"stem":"Which choice best describes data from the graph that weaken the manager's claim?","choices":["The average price rose from $11 in 2022 to $12 in 2024.","The average price dropped between 2018 and 2020.","The highest average price shown was in 2024.","The average price rose from $9 in 2016 to $12 in 2024, an increase of only about 33 percent."],"correct":"D","domain":"II","concept":"coe-quant","difficulty":"hard","explanation":"A 50 percent increase from $9 would be $13.50, but the 2024 price was $12, about 33 percent higher. Only D compares 2016 with 2024, which is what the claim is about."},{"id":"coe-quant-9","passage":"<p class=\"caption\">Volunteers at Riverside Cleanup Events<\/p>\n<table class=\"data\"><thead><tr><th>Month<\/th><th>Adults<\/th><th>Teens<\/th><\/tr><\/thead><tbody><tr><td>April<\/td><td>40<\/td><td>12<\/td><\/tr><tr><td>June<\/td><td>35<\/td><td>30<\/td><\/tr><tr><td>August<\/td><td>38<\/td><td>45<\/td><\/tr><\/tbody><\/table>\n<p>The organizers noticed that teen participation grew much faster than adult participation over the spring and summer. <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most effectively uses data from the table to complete the statement?","choices":["For example, 40 adults volunteered in April.","For example, the number of teen volunteers rose from 12 in April to 45 in August, while the number of adult volunteers stayed between 35 and 40.","For example, 30 teens volunteered in June.","For example, more adults than teens volunteered in April."],"correct":"B","domain":"II","concept":"coe-quant","difficulty":"medium","explanation":"The statement compares how much each group CHANGED. B shows teens rising sharply while adults stayed about the same. The other choices give single numbers with no comparison over time."},{"id":"coe-quant-10","passage":"<p>A researcher claims that the share of students who read for fun drops most sharply between grade 6 and grade 8.<\/p>","chart":{"type":"bar","title":"Students Who Read for Fun at Least Once a Week","yLabel":"Percent of students","labels":["Grade 4","Grade 6","Grade 8","Grade 10"],"values":[72,58,41,33]},"stem":"Which choice best describes data from the graph that support the researcher's claim?","choices":["Grade 4 had the highest percentage, at 72 percent.","Fewer than half of grade 10 students read for fun at least once a week.","The percentage fell by 17 points from grade 6 to grade 8, more than the 14-point drop from grade 4 to grade 6 or the 8-point drop from grade 8 to grade 10.","The percentage fell from 72 percent in grade 4 to 33 percent in grade 10."],"correct":"C","domain":"II","concept":"coe-quant","difficulty":"hard","explanation":"\"Most sharply\" means you must compare every drop: 14, then 17, then 8 points. C shows that the grade 6 to 8 drop is the biggest. D shows the overall decline but not where it was steepest."},{"id":"inference-7","passage":"<p>Biologists had measured the lizards on a small Caribbean island just before a powerful hurricane struck. When they measured the surviving lizards after the storm, they found that the survivors had, on average, larger toe pads and shorter back legs than the lizards measured before. Because these lizards cling to branches during high winds, this finding suggests that <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most logically completes the text?","choices":["the hurricane caused the lizards' legs to shrink.","lizards with larger toe pads and shorter back legs may have been better able to hold on during the storm.","long-legged lizards had left the island before the storm arrived.","lizards on other islands have longer back legs."],"correct":"B","domain":"II","concept":"inference","difficulty":"hard","explanation":"The survivors differed from the earlier group, and the lizards survive by clinging, so the traits likely helped them hold on. A confuses survival with change (a storm doesn't shrink legs), and C and D bring in information the text doesn't give."},{"id":"inference-8","passage":"<p>Pumpkin farmers in one region noticed that their harvests were smaller in years when fewer bees were seen in their fields. Pumpkin flowers must be visited by insects that carry pollen from male flowers to female flowers before fruit can develop. This suggests that <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most logically completes the text?","choices":["the smaller harvests may have resulted partly from fewer flowers being pollinated.","pumpkins grow larger when no insects visit them.","bees prefer pumpkin flowers to all other flowers.","weather has no effect on pumpkin harvests."],"correct":"A","domain":"II","concept":"inference","difficulty":"medium","explanation":"Fruit needs insect pollination, and fewer bees appeared in poor years, so fewer pollinated flowers is a logical explanation. \"Partly\" keeps the claim modest. D overreaches; the text never rules out weather."},{"id":"inference-9","passage":"<p>Historians studying a 1700s merchant's account books found that his purchases of sugar and tea for his own household increased sharply in 1765. That same year, his records show that he began selling fabric to customers in three new towns and that his total income nearly doubled. Based on these records, it is most reasonable to conclude that <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most logically completes the text?","choices":["sugar and tea became much cheaper in 1765.","the merchant stopped selling fabric after 1765.","the merchant's customers in the new towns mainly bought tea.","the merchant's higher income may have allowed him to buy more sugar and tea."],"correct":"D","domain":"II","concept":"inference","difficulty":"hard","explanation":"His income nearly doubled in the same year his household bought more sugar and tea, so the extra money is a reasonable explanation. Prices (A) are never mentioned, and the new customers bought fabric, not tea (C)."},{"id":"inference-10","passage":"<p>In an experiment, researchers gave two groups of children the same puzzle. Afterward, children in the first group were praised for being smart, while children in the second group were praised for working hard. When later offered a choice between an easy puzzle and a challenging one, most children in the second group chose the challenging puzzle, while most in the first group chose the easy one. This suggests that <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most logically completes the text?","choices":["the children in the first group were smarter than those in the second group.","all children prefer easy puzzles.","the kind of praise children receive may influence their willingness to take on challenges.","praise has no effect on the choices children make."],"correct":"C","domain":"II","concept":"inference","difficulty":"hard","explanation":"The only difference between the groups was the type of praise, and the groups chose differently, so the praise likely mattered. B is disproved by the second group, and D is the opposite of the result."},{"id":"boundaries-7","passage":"<p>The first successful vaccine was developed by English doctor Edward Jenner in <span class=\"blank\" aria-label=\"blank\">______<\/span> it protected people against smallpox.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["1796;","1796,","1796","1796, and,"],"correct":"A","domain":"SEC","concept":"boundaries","difficulty":"hard","explanation":"Both sides are independent clauses, so a semicolon joins them. B is a comma splice, C is a run-on, and D adds an extra comma after \"and.\""},{"id":"sva-7","passage":"<p>Neither the coach nor the players <span class=\"blank\" aria-label=\"blank\">______<\/span> expecting the storm to arrive so quickly.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["was","is","has been","were"],"correct":"D","domain":"SEC","concept":"sva","difficulty":"hard","explanation":"With \"neither … nor\" (and \"either … or\"), the verb agrees with the subject closer to it. Here that's \"the players,\" which is plural, so use \"were.\""},{"id":"colon-7","passage":"<p>The lighthouse keeper's log described the terrible storm in a single <span class=\"blank\" aria-label=\"blank\">______<\/span> \"Waves over the gallery, glass cracked, light still burning.\"<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["sentence;","sentence, and","sentence:","sentence"],"correct":"C","domain":"SEC","concept":"colon","difficulty":"hard","explanation":"The first part is a complete sentence, and the quotation that follows is the \"single sentence\" it mentions. A colon introduces it. A semicolon (A) would need a complete clause after it."},{"id":"modifier-7","passage":"<p>Having survived for more than 4,000 years, <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["the bristlecone pine known as Methuselah is among the oldest known living trees.","scientists consider the bristlecone pine known as Methuselah to be among the oldest known living trees.","the age of the bristlecone pine known as Methuselah makes it among the oldest living trees.","among the oldest known living trees is the bristlecone pine known as Methuselah."],"correct":"A","domain":"SEC","concept":"modifier","difficulty":"hard","explanation":"The tree is what survived for 4,000 years, so the tree must come right after the comma. B says the scientists survived 4,000 years, and C says the age survived."},{"id":"pronoun-7","passage":"<p>Although the two toy companies merged in 2019, each still sells products under <span class=\"blank\" aria-label=\"blank\">______<\/span> original name.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["their","its","it's","they're"],"correct":"B","domain":"SEC","concept":"pronoun","difficulty":"hard","explanation":"The antecedent of the pronoun is \"each\" (each company), which is singular, so it takes \"its.\" Don't match the pronoun to \"two toy companies.\""},{"id":"transition-9","passage":"<p>The ancient Romans built roads so well that some are still in use today, nearly 2,000 years later. <span class=\"blank\" aria-label=\"blank\">______<\/span> many modern highways need major repairs after only a few decades.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["By contrast,","For example,","As a result,","Likewise,"],"correct":"A","domain":"EI","concept":"transition","difficulty":"hard","explanation":"Roads lasting 2,000 years and highways needing repairs within decades are opposites, so a contrast transition fits. Modern highways aren't an example of Roman roads or a result of them."},{"id":"transition-10","passage":"<p>Many people assume that a slowing metabolism is the main reason adults gain weight as they age. <span class=\"blank\" aria-label=\"blank\">______<\/span> a large 2021 study found that metabolism stays fairly steady from about age 20 to age 60.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["Accordingly,","Similarly,","However,","For instance,"],"correct":"C","domain":"EI","concept":"transition","difficulty":"hard","explanation":"The study's finding contradicts the common assumption, so a contrast word is needed. \"Accordingly\" and \"For instance\" would suggest the study supports the assumption."},{"id":"transition-11","passage":"<p>The first tea bags were reportedly small silk pouches meant only to hold samples of loose tea for customers to try at home. <span class=\"blank\" aria-label=\"blank\">______<\/span> some customers began brewing the tea without removing it from the pouches, and a new way of making tea caught on.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["In other words,","Soon, however,","Similarly,","In conclusion,"],"correct":"B","domain":"EI","concept":"transition","difficulty":"hard","explanation":"The pouches were meant only as sample holders, but customers used them in an unexpected way. \"Soon, however\" shows a change over time that goes against the original purpose. The second sentence isn't a restatement (A) or a conclusion (D)."},{"id":"transition-12","passage":"<p>Recycling one aluminum can saves enough energy to run a television for about three hours. <span class=\"blank\" aria-label=\"blank\">______<\/span> recycling aluminum uses about 95 percent less energy than making new aluminum from raw ore.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["Nevertheless,","Instead,","In contrast,","In fact,"],"correct":"D","domain":"EI","concept":"transition","difficulty":"medium","explanation":"The second sentence backs up and strengthens the first with an even bigger fact about the energy savings. \"In fact\" adds emphasis in the same direction. There's no contrast."},{"id":"transition-13","passage":"<p>The marathon's organizers had prepared for warm weather, setting up extra water stations along the course. <span class=\"blank\" aria-label=\"blank\">______<\/span> the morning of the race brought cold rain and strong wind, and runners needed blankets more than water.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["As it turned out,","For this reason,","Similarly,","In addition,"],"correct":"A","domain":"EI","concept":"transition","difficulty":"hard","explanation":"The organizers expected heat, but what actually happened was the opposite. \"As it turned out\" signals an outcome different from what was expected. \"For this reason\" wrongly suggests that the planning caused the rain."},{"id":"synthesis-8","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>The Mariana Trench is in the western Pacific Ocean.<\/li><li>Its deepest known point, the Challenger Deep, is about 10,900 meters below sea level.<\/li><li>Mount Everest rises about 8,850 meters above sea level.<\/li><li>In 1960, Jacques Piccard and Don Walsh became the first people to reach the Challenger Deep.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize how deep the Challenger Deep is by making a comparison. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The Challenger Deep is about 10,900 meters deep, so deep that Mount Everest, at about 8,850 meters tall, could fit inside with room to spare.","The Mariana Trench is located in the western Pacific Ocean.","In 1960, two explorers became the first people to reach the Challenger Deep.","Mount Everest rises about 8,850 meters above sea level."],"correct":"A","domain":"EI","concept":"synthesis","difficulty":"hard","explanation":"The goal requires a comparison that shows depth, and only A compares the trench's depth with Everest's height. D gives Everest's height alone, with no comparison."},{"id":"synthesis-9","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Octavia E. Butler was an American science fiction author.<\/li><li>She published her first novel, <em>Patternmaster<\/em>, in 1976.<\/li><li>In 1995, she became the first science fiction writer to receive a MacArthur Fellowship, an award sometimes called a \"genius grant.\"<\/li><li>Her novel <em>Kindred<\/em> is often taught in schools.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize an achievement that made Butler a \"first.\" Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Butler's novel <em>Kindred<\/em> is often taught in schools.","In 1995, Octavia E. Butler became the first science fiction writer to receive a MacArthur Fellowship.","Butler published her first novel, <em>Patternmaster<\/em>, in 1976.","Octavia E. Butler was an American science fiction author."],"correct":"B","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"The goal asks for an achievement that was a \"first.\" Only B describes one. C mentions her \"first novel,\" but that's simply her first book, not a first-ever achievement."},{"id":"synthesis-10","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Some city bike-share programs use docking stations, where bikes must be picked up and returned.<\/li><li>Other programs are \"dockless\": bikes can be left anywhere within a service area.<\/li><li>Docking stations keep sidewalks orderly.<\/li><li>Dockless bikes are more convenient for riders but are sometimes left blocking sidewalks.<\/li><\/ul>","chart":null,"stem":"The student wants to present the main tradeoff between the two types of programs. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Some bike-share programs use docking stations, where bikes must be picked up and returned.","Dockless bikes can be left anywhere within a service area.","Docking stations keep sidewalks orderly, while dockless bikes are more convenient but sometimes end up blocking sidewalks.","Bike-share programs give riders a way to travel around a city."],"correct":"C","domain":"EI","concept":"synthesis","difficulty":"hard","explanation":"A tradeoff means each option has an advantage the other lacks. C shows that docks are orderly and dockless bikes are convenient but can be messy. The other choices describe only one type."},{"id":"synthesis-11","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Ada Lovelace was a mathematician born in London in 1815.<\/li><li>She worked with Charles Babbage on his design for a mechanical computer called the Analytical Engine.<\/li><li>In 1843, she published notes that included a step-by-step method for the machine to calculate a series of numbers.<\/li><li>Many historians consider this method the first published computer program.<\/li><\/ul>","chart":null,"stem":"The student wants to explain why Lovelace is often called the first computer programmer. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Ada Lovelace was a mathematician born in London in 1815.","Lovelace worked with Charles Babbage.","The Analytical Engine was a mechanical computer designed by Charles Babbage.","Lovelace's 1843 notes included a step-by-step method for Babbage's Analytical Engine to calculate numbers, which many historians consider the first published computer program."],"correct":"D","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"To explain WHY she's called the first programmer, you need the method she wrote and that historians see it as the first program. D includes both. B and C mention the machine but not her program."},{"id":"synthesis-12","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>In 2019, researchers attached tiny tracking devices to 50 Arctic terns.<\/li><li>Arctic terns migrate between the Arctic and Antarctica each year.<\/li><li>The researchers wanted to learn which routes the birds take and where they stop to rest.<\/li><li>Some of the tracked birds flew more than 90,000 kilometers in a single year.<\/li><\/ul>","chart":null,"stem":"The student wants to present the aim of the research study. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["To learn which routes Arctic terns take on their migration and where they stop to rest, researchers attached tracking devices to 50 of the birds in 2019.","Some Arctic terns flew more than 90,000 kilometers in a single year.","Arctic terns migrate between the Arctic and Antarctica each year.","Researchers attached tiny tracking devices to 50 Arctic terns."],"correct":"A","domain":"EI","concept":"synthesis","difficulty":"hard","explanation":"The \"aim\" is what the researchers wanted to learn, and A states it directly. B is a result, and D describes the method without the purpose."},{"id":"synthesis-13","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>The Great Pyramid of Giza was completed around 2560 BCE.<\/li><li>It was built as a tomb for the pharaoh Khufu.<\/li><li>The Colosseum in Rome was completed in 80 CE.<\/li><li>It was built as an arena for public games and shows.<\/li><\/ul>","chart":null,"stem":"The student wants to contrast the purposes of the two structures. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The Great Pyramid was completed around 2560 BCE, and the Colosseum was completed in 80 CE.","While the Great Pyramid was built as a tomb for the pharaoh Khufu, the Colosseum was built as an arena for public games and shows.","Both the Great Pyramid and the Colosseum are famous ancient structures.","The Colosseum, in Rome, was completed in 80 CE."],"correct":"B","domain":"EI","concept":"synthesis","difficulty":"hard","explanation":"The goal is to contrast PURPOSES. B sets \"tomb\" against \"arena\" with \"While.\" A contrasts dates, not purposes, which is a common trap."},{"id":"synthesis-14","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Ynes Mexia was a Mexican American botanist.<\/li><li>She began studying plants in her fifties.<\/li><li>She collected about 145,000 plant specimens on expeditions across the Americas.<\/li><li>Around 500 of the plants she collected were new to science.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize how productive Mexia was as a plant collector. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Ynes Mexia was a Mexican American botanist.","Mexia began studying plants in her fifties.","On expeditions across the Americas, Mexia collected about 145,000 plant specimens, around 500 of which were new to science.","Mexia was a botanist who went on expeditions."],"correct":"C","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"\"Productive\" means she produced a lot, and C gives the impressive numbers. B is interesting but is about when she started, not how much she collected."},{"id":"synthesis-15","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>In 2017, Middleton School started its classes 50 minutes later in the morning.<\/li><li>Before the change, classes had started at 7:30 a.m.<\/li><li>After the change, students slept an average of 34 more minutes per night.<\/li><li>Attendance also improved after the change.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize the effects of the later start time. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Before 2017, classes at Middleton School started at 7:30 a.m.","In 2017, Middleton School changed its daily schedule.","Middleton School's later start time began in 2017.","After Middleton School moved its start time 50 minutes later, students slept an average of 34 more minutes per night, and attendance improved."],"correct":"D","domain":"EI","concept":"synthesis","difficulty":"hard","explanation":"\"Effects\" means results. D gives both results (more sleep, better attendance). A, B, and C describe the change itself, not what it led to."},{"id":"synthesis-16","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Many animals use camouflage to avoid predators.<\/li><li>The leaf-tailed gecko of Madagascar has a flat, wrinkled tail that looks like a dead leaf.<\/li><li>Some moths have wing patterns that resemble tree bark.<\/li><li>Camouflage can also help predators sneak up on prey.<\/li><\/ul>","chart":null,"stem":"The student wants to give a specific example of an animal that uses camouflage. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The leaf-tailed gecko of Madagascar has a flat, wrinkled tail that looks like a dead leaf.","Many animals use camouflage to avoid predators.","Camouflage can also help predators sneak up on prey.","Camouflage is used by animals around the world."],"correct":"A","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"The goal asks for a SPECIFIC example, and A names one animal and describes its disguise. B and C are general statements about camouflage, not examples."},{"id":"synthesis-17","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>The Brooklyn Bridge opened in New York City in 1883.<\/li><li>When it opened, it was the longest suspension bridge in the world.<\/li><li>It was the first suspension bridge to use steel wire for its cables.<\/li><li>Today, more than 100,000 vehicles cross it each day.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize what made the bridge an engineering milestone when it opened. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The Brooklyn Bridge opened in New York City in 1883.","Today, more than 100,000 vehicles cross the Brooklyn Bridge each day.","When it opened in 1883, the Brooklyn Bridge was the world's longest suspension bridge and the first to use steel wire for its cables.","The Brooklyn Bridge is located in New York City."],"correct":"C","domain":"EI","concept":"synthesis","difficulty":"hard","explanation":"The goal focuses on what was groundbreaking WHEN IT OPENED, and C gives both records. B is impressive, but it describes today's traffic, not an engineering milestone from 1883."},{"id":"synthesis-18","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>The blue whale is the largest animal known to have ever lived.<\/li><li>An adult blue whale can be about 30 meters long.<\/li><li>The whale shark is the largest living fish.<\/li><li>An adult whale shark is typically about 12 meters long.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize the difference in length between the two animals. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The whale shark is the largest living fish.","At about 30 meters long, an adult blue whale can be more than twice the length of a typical adult whale shark, which is about 12 meters long.","Both the blue whale and the whale shark live in the ocean.","The blue whale is the largest animal known to have ever lived."],"correct":"B","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"A difference in length requires both lengths, and B compares them directly. C points out a similarity, the opposite of the goal."},{"id":"synthesis-19","passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Researchers studied whether listening to music while studying affects test scores.<\/li><li>Sixty college students took part.<\/li><li>Students who studied in silence scored slightly higher than students who listened to music with lyrics.<\/li><li>The study tested only one type of test: vocabulary quizzes.<\/li><\/ul>","chart":null,"stem":"The student wants to acknowledge a limitation of the study. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Students who studied in silence scored slightly higher than those who listened to music with lyrics.","Sixty college students took part in a study about music and studying.","Researchers studied whether listening to music while studying affects test scores.","Because the study tested only vocabulary quizzes, its results may not apply to other kinds of tests."],"correct":"D","domain":"EI","concept":"synthesis","difficulty":"hard","explanation":"A limitation is a reason the results might not apply widely. D uses the \"only vocabulary quizzes\" note to point that out. A reports the result, not a limitation."}]}</script>
<script>
(function(){
'use strict';
var DATA = JSON.parse(document.getElementById('sat-data').textContent);
var CONCEPTS = DATA.concepts, CMAP = {};
CONCEPTS.forEach(function(c){ CMAP[c.id] = c; });
var DOMAINS = {CS:'Craft and Structure', II:'Information and Ideas', SEC:'Standard English Conventions', EI:'Expression of Ideas'};
var DOMAIN_ORDER = ['CS','II','SEC','EI'];
var Q = {};
DATA.test.forEach(function(q){ Q[q.id] = q; });
DATA.bank.forEach(function(q){ Q[q.id] = q; });
var ORIGINAL_MODULES = [DATA.test.filter(function(q){return q.module===1;}).map(function(q){return q.id;}),
                        DATA.test.filter(function(q){return q.module===2;}).map(function(q){return q.id;})];
var MODULE_SECONDS = 32*60;
var PER_CONCEPT = 3, MAX_PRACTICE_CONCEPTS = 8;
var BLUEPRINT = [
 [['wic',5],['structure',2],['crosstext',1],['central',1],['detail',1],['coe-text',2],['coe-quant',1],['inference',2],['boundaries',1],['sva',1],['pronoun',1],['tense',1],['possessive',1],['colon',1],['modifier',1],['transition',2],['synthesis',3]],
 [['wic',5],['structure',1],['crosstext',2],['central',1],['detail',1],['coe-text',2],['coe-quant',2],['inference',1],['supplement',1],['boundaries',1],['sva',1],['verbform',1],['colon',1],['pronoun',1],['modifier',1],['transition',2],['synthesis',3]]
];
var KEY = 'dsat-rw-simulator-v1';

/* ---------- storage ---------- */
var S, storageOK = true;
function blankState(){ return {app:'dsat-rw-simulator', version:1, sessions:{}, openIds:[], archiveIds:[], conceptArchived:{}, counters:{test:0, practice:0}, lastExport:null, ui:{page:'home'}}; }
function normalize(){
  var b = blankState();
  for (var k in b) if (S[k] === undefined) S[k] = b[k];
  S.openIds = S.openIds.filter(function(id){ return S.sessions[id] && !S.sessions[id].finishedAt; });
  S.archiveIds = S.archiveIds.filter(function(id){ return S.sessions[id] && S.sessions[id].finishedAt; });
}
function load(){
  try { var raw = window.localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : blankState(); }
  catch(e){ storageOK = false; S = blankState(); }
  if (!S || typeof S !== 'object' || !S.sessions) S = blankState();
  normalize();
}
function save(){
  try { window.localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch(e){ storageOK = false; }
}

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function strip(h){ var d = document.createElement('div'); d.innerHTML = h; return d.textContent || ''; }
function now(){ return Date.now(); }
function fmtDate(t){ if (!t) return '—'; var d = new Date(t); return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) + ', ' + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function fmtDay(t){ if (!t) return '—'; return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function fmtClock(sec){ sec = Math.max(0, Math.ceil(sec)); var m = Math.floor(sec/60), s = sec%60; return m + ':' + (s<10?'0':'') + s; }
