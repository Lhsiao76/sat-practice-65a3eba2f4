<html lang="en">

<title>Digital SAT Reading &amp; Writing Simulator</title>
<style>
:root{--blue:#1d4ed8;--blue-d:#1e3a8a;--blue-l:#e8efff;--ink:#1f2328;--muted:#5b6470;--line:#d7dce3;--bg:#f6f7fb;--ok:#15803d;--ok-l:#e7f6ec;--bad:#b91c1c;--bad-l:#fdecec;--amber:#b45309;--amber-l:#fff4d6;--mark:#c2185b;--mark-l:#fde7f0;--serif:Georgia,"Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font-weight:600;text-decoration:none}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:disabled,.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{min-height:34px;padding:4px 12px;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 60px}
.topnav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topnav .in{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 12px}
.topnav .brand{font-weight:800;margin-right:auto;color:var(--blue-d);padding:6px 4px}
.topnav button{border:0;background:none;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);min-height:40px}
.topnav button.on{background:var(--blue-l);color:var(--blue-d)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0}
.card h2{margin:0 0 8px;font-size:21px}
.card h3{margin:0 0 6px;font-size:18px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hero h1{margin:4px 0 6px;font-size:28px;color:var(--blue-d)}
.flaghelp{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
@media(min-width:700px){.flaghelp{grid-template-columns:1fr 1fr}}
.flaghelp>div{border-radius:10px;padding:10px 12px;font-size:15px}
.fh-mark{background:var(--mark-l)}.fh-unsure{background:var(--amber-l)}
.warn{background:var(--amber-l);border:1px solid #f0c36d;border-radius:10px;padding:10px 14px;margin:12px 0;font-size:15px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.b-weak{background:var(--bad-l);color:var(--bad)}.b-improving{background:var(--amber-l);color:var(--amber)}.b-mastered{background:var(--ok-l);color:var(--ok)}.b-new{background:#eef0f3;color:var(--muted)}.b-archived{background:#e9e4f7;color:#5b3fb0}
.b-wrong{background:var(--bad-l);color:var(--bad)}.b-unsure{background:var(--amber-l);color:var(--amber)}.b-ok{background:var(--ok-l);color:var(--ok)}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bar{height:10px;background:#eceff4;border-radius:6px;overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--blue)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.score{background:var(--blue-l);border-radius:12px;padding:12px 14px}
.score b{display:block;font-size:30px;color:var(--blue-d);line-height:1.1}
/* runner */
.runner{display:flex;flex-direction:column;height:100vh;height:100dvh;background:#fff}
.rhead{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 14px;border-bottom:2px dashed #b9c0cc;background:#fff}
.rhead .title{font-weight:700;font-size:15px;line-height:1.25}
.rhead .title small{display:block;font-weight:500;color:var(--muted)}
.timer{text-align:center}
.timer .clock{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.timer .clock.low{color:var(--bad)}
.timer button{border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12px;padding:2px 10px;margin-top:2px}
.rhead .right{justify-self:end;display:flex;gap:6px}
.rbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pane{padding:18px 22px}
.pane.left{background:#fff}
@media(min-width:900px){.rbody.split{display:grid;grid-template-columns:1fr 1fr;overflow:hidden}.rbody.split .pane{overflow-y:auto;-webkit-overflow-scrolling:touch;height:100%}.rbody.split .pane.left{border-right:5px solid #e3e7ee}}
@media(max-width:899px){.pane.left{border-bottom:5px solid #e3e7ee}}
.passage{font-family:var(--serif);font-size:18px;line-height:1.65;max-width:680px}
.passage p{margin:0 0 12px}
.passage p.intro{font-style:italic;color:#3d4450}
.passage p.caption{font-family:var(--sans);font-weight:700;font-size:16px;margin:12px 0 6px}
.passage ul.notes{margin:6px 0 12px;padding-left:24px}.passage ul.notes li{margin:4px 0}
.passage u{text-decoration-thickness:2px;text-underline-offset:3px}
.blank{letter-spacing:1px;white-space:nowrap}
table.data{border-collapse:collapse;margin:6px 0 14px;font-family:var(--sans);font-size:15px}
table.data th,table.data td{border:1px solid #9aa3af;padding:6px 10px;text-align:center}
table.data th{background:#f0f2f6}
table.data td:first-child,table.data th:first-child{text-align:left}
.chart{margin:4px 0 14px;max-width:560px}
.chart svg{width:100%;height:auto;display:block;font-family:var(--sans)}
.qtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px;background:#f3f4f7;border-radius:6px;padding:6px}
.qnum{background:#1f2328;color:#fff;font-weight:700;min-width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;padding:0 6px}
.flag{display:inline-flex;align-items:center;gap:6px;border:1.5px solid transparent;background:transparent;border-radius:999px;padding:4px 12px;min-height:38px;font-weight:600;font-size:15px}
.flag .ico{font-size:17px}
.flag.mark{color:var(--mark)}.flag.mark.on{background:var(--mark-l);border-color:var(--mark)}
.flag.unsure{color:var(--amber)}.flag.unsure.on{background:var(--amber-l);border-color:var(--amber)}
.flag:not(.on){border-color:#cfd5de;color:#4b5563}
.ctag{font-size:13px;font-weight:700;color:var(--blue-d);background:var(--blue-l);border-radius:999px;padding:3px 10px;margin-bottom:10px;display:inline-block}
.stem{font-family:var(--serif);font-size:18px;margin:4px 0 14px;line-height:1.55}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid #8b95a3;border-radius:10px;padding:11px 14px;font-family:var(--serif);font-size:17px;line-height:1.45;min-height:52px}
.choice .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid #4b5563;display:inline-flex;align-items:center;justify-content:center;font-family:var(--sans);font-weight:700;font-size:14px;margin-top:1px}
.choice.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset;background:#f5f8ff}
.choice.sel .L{background:var(--blue);border-color:var(--blue);color:#fff}
.rfoot{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#e9edf5}
.rfoot .navbtn{justify-self:center;background:#1f2328;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:700;min-height:42px}
.rfoot .r{justify-self:end;display:flex;gap:8px}
.rfoot .l{font-size:13px;color:var(--muted)}
/* grid */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:10px;margin:12px 0}
.qcell{position:relative;height:48px;border:1.5px dashed #7b8494;background:#fff;border-radius:6px;font-weight:700;color:var(--blue-d);font-size:16px}
.qcell.ans{border:1.5px solid var(--blue);background:var(--blue);color:#fff}
.qcell.cur{outline:3px solid #1f2328;outline-offset:2px}
.qcell .m{position:absolute;top:-8px;right:-6px;font-size:14px}
.qcell .u{position:absolute;bottom:-8px;right:-6px;background:var(--amber);color:#fff;border-radius:999px;font-size:11px;padding:0 5px;line-height:16px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.lg-box{display:inline-block;width:16px;height:16px;border-radius:3px;border:1.5px dashed #7b8494}
.lg-box.a{background:var(--blue);border:1.5px solid var(--blue)}
/* review */
.rv{border:1px solid var(--line);border-radius:12px;margin:14px 0;background:#fff;overflow:hidden}
.rv-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:#f3f5f9;border-bottom:1px solid var(--line)}
.rv-b{padding:14px 16px}
.rv .passage{font-size:16px}
.rv .stem{font-size:16px}
.rchoice{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;margin:4px 0;font-family:var(--serif);font-size:16px;border:1px solid transparent}
.rchoice .L{flex:none;font-family:var(--sans);font-weight:700;width:24px}
.rchoice.correct{background:var(--ok-l);border-color:#9bd3ad}
.rchoice.picked{background:var(--bad-l);border-color:#f0a8a8}
.rchoice .tag{margin-left:auto;font-family:var(--sans);font-size:12px;font-weight:700;white-space:nowrap}
.yours{display:grid;grid-template-columns:1fr;gap:6px;margin:10px 0;font-size:15px}
@media(min-width:700px){.yours{grid-template-columns:1fr 1fr}}
.yours div{padding:8px 10px;border-radius:8px;background:#f6f7fa}
.why{background:#f6f7fa;border-left:4px solid var(--blue);padding:10px 12px;border-radius:6px;margin:10px 0;font-size:15px}
.lesson{background:#fff8e6;border-left:4px solid var(--amber);padding:10px 12px;border-radius:6px;margin:10px 0;font-size:15px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.filters button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;min-height:38px}
.filters button.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d)}
details.pass summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:14px;margin-bottom:6px}
/* modal */
.mback{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.mbox{background:#fff;border-radius:14px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mbox h3{margin:0 0 8px;font-size:20px}
.mbox .mbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:16px}
textarea.bk{width:100%;min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px}
.center{text-align:center}
.big{font-size:20px}
.kbd{font-size:12px;color:var(--muted)}
@media print{.topnav,.btn{display:none}}
</style>

<script id="sat-data" type="application/json">{"concepts":[{"id":"wic","name":"Words in context","domain":"CS","lesson":"The right word is decided by clues in the sentence, not by which word sounds most impressive. Look for a restatement (a colon or a phrase that explains the blank), an example, or a contrast signal like \"but,\" \"yet,\" \"rather than,\" or \"does not … instead.\" Before you look at the choices, predict your own simple word for the blank, then choose the answer closest to it. Also check the tone: is the blank positive, negative, or mixed?"},{"id":"structure","name":"Text structure & purpose","domain":"CS","lesson":"These questions ask what a text (or one sentence) is DOING, not just what it says. Give each sentence a short job label, like \"sets up a puzzle,\" \"gives evidence,\" \"shows a contrast,\" or \"explains the result,\" then match that pattern to a choice. Wrong answers often mention real details from the passage but describe the wrong job, or use extreme words like \"disproves completely\" or \"criticizes\" that the text doesn't support."},{"id":"crosstext","name":"Cross-text connections","domain":"CS","lesson":"Sum up each text's main point in one sentence. Then ask: would the Text 2 author agree, disagree, or say \"only partly\" or \"not always\"? The correct answer matches exactly how far Text 2's evidence goes. It is often a qualification (\"this isn't true for everyone\") rather than total rejection. Cross out choices that put claims in an author's mouth that the text never makes."},{"id":"central","name":"Central idea","domain":"II","lesson":"The main idea has to cover the whole passage, not just one detail. Watch for a turning point (\"But,\" \"Yet,\" \"Now she saw\"). In stories, the main idea usually involves that change in a character's feelings or situation. Eliminate choices that are too narrow (one detail), too broad, or that add something the text never says."},{"id":"detail","name":"Supporting details","domain":"II","lesson":"\"According to the text\" means the answer is stated directly in the passage. Find the exact sentence that answers the question and match it word for word in meaning. Wrong choices often swap two nearby details (like direction vs. distance) or change one small word, so double-check against the text before you choose."},{"id":"coe-text","name":"Command of evidence: textual","domain":"II","lesson":"Start by pinning down the exact claim, because every key word matters (\"native species,\" not just \"bees\"; \"both welcoming AND indifferent\"). The correct finding or quotation proves that specific claim. Choices that are true, on-topic, or support only half of the claim are wrong. For \"weaken\" questions, look for evidence that shows the opposite of what the claim predicts."},{"id":"coe-quant","name":"Command of evidence: quantitative (tables & graphs)","domain":"II","lesson":"Read the title, labels, and units of the table or graph first, then reread the claim carefully. The correct answer uses accurate numbers AND addresses what the claim is actually about. If the claim compares groups, says \"most,\" or says \"every year,\" the data in your answer must make that comparison or test that pattern. A choice can quote true numbers and still be wrong because it doesn't speak to the claim."},{"id":"inference","name":"Inferences","domain":"II","lesson":"Pick the conclusion that follows most logically from the information given: no more and no less. Notice what the text sets up, such as a contrast between two groups or an experiment where only one thing was different. Avoid answers that overgeneralize (\"all,\" \"any,\" \"the main cause\") or depend on facts the text never mentions, even if those facts are true in real life."},{"id":"boundaries","name":"Sentence boundaries (semicolons, run-ons, comma splices)","domain":"SEC","lesson":"An independent clause has a subject and a verb and could stand alone as a sentence. You can join two independent clauses with a period, a semicolon, or a comma plus a FANBOYS conjunction (for, and, nor, but, or, yet, so). A comma alone (a comma splice) or nothing at all (a run-on) is wrong. Words like \"however\" and \"in fact\" are NOT conjunctions, so they need a semicolon or period before them and a comma after."},{"id":"colon","name":"Colons & lists","domain":"SEC","lesson":"A colon must come after a complete sentence (an independent clause), and it introduces what comes next: a list, an explanation, or an example. Never put a colon right after a verb or after words like \"such as\" or \"including\" (\"The recipe requires: flour\" is wrong). A semicolon can't introduce a list, because what follows a semicolon must be its own complete sentence (or items in a list that already has commas inside it)."},{"id":"supplement","name":"Nonessential elements (commas, dashes, parentheses)","domain":"SEC","lesson":"Extra information that interrupts a sentence must be set off by a MATCHING pair: two commas, two dashes, or two parentheses. If the interruption opens with a dash, it must close with a dash. Test it by removing the extra part; the sentence should still be complete and correct. But don't add commas around essential information, like a name right after a title (\"poet Jacqueline Woodson\"), and never put a single comma between a subject and its verb."},{"id":"sva","name":"Subject–verb agreement","domain":"SEC","lesson":"The verb must agree with its true subject, which is often NOT the noun right before the verb. Cross out prepositional phrases (\"of letters,\" \"at the site\") and other interrupters to find the real subject. In inverted sentences, where the verb comes before the subject (\"Among the discoveries was a set of tools\"), look after the verb for the subject. Words like \"each,\" \"the number,\" and collective nouns like \"collection\" are singular; subjects joined by \"and\" are plural."},{"id":"pronoun","name":"Pronoun–antecedent agreement","domain":"SEC","lesson":"A pronoun must match the noun it stands for (its antecedent) in number. Find the antecedent first. \"Each,\" \"every,\" \"a species,\" \"the council,\" and \"the band\" are singular, so they take \"its\"; plural nouns take \"their.\" Remember: \"its\" shows ownership and \"it's\" means \"it is\"; \"their\" shows ownership and \"they're\" means \"they are.\""},{"id":"tense","name":"Verb tense","domain":"SEC","lesson":"Use time clues (\"last summer,\" \"since 2010,\" \"next spring,\" \"by the time\") and the tense of the other verbs in the sentence. Use simple past for an action finished at a specific past time, present perfect (\"has increased\") for something that started in the past and continues to now, and past perfect (\"had done\") for an action completed before another past action. Verbs in a list should usually share the same tense."},{"id":"verbform","name":"Verb forms (complete sentences)","domain":"SEC","lesson":"Every sentence needs a main verb with a tense, like \"records\" or \"was.\" Forms like \"recording,\" \"to record,\" \"being,\" and \"having recorded\" cannot be the main verb by themselves. When a long phrase separates the subject from the blank, cover the phrase up and check whether the sentence has a main verb yet. If it already has one, the blank may need an -ing phrase instead."},{"id":"possessive","name":"Possessives & plurals","domain":"SEC","lesson":"Ask two questions: How many are there? And do they own the next noun? Plural with no ownership: add -s (\"scientists\"). One owner: add 's (\"the hummingbird's wings\"). More than one owner: add an apostrophe after the s (\"two researchers' estimates\"). Irregular plurals that don't end in s just add 's (\"children's books\"), and \"-s's\" is never right for a plural."},{"id":"modifier","name":"Modifiers (dangling modifiers)","domain":"SEC","lesson":"An introductory phrase followed by a comma describes whatever noun comes right after the comma. So \"Having studied butterflies for a decade, ___\" must be followed by the person who did the studying, not that person's data or research. Ask \"who or what is doing or being described?\" and make sure that noun comes first. Choices that make sense in meaning can still be wrong if the wrong noun follows the comma."},{"id":"transition","name":"Transitions","domain":"EI","lesson":"Figure out the relationship between the two sentences BEFORE reading the choices. Same direction: \"similarly,\" \"for example,\" \"moreover.\" Contrast or surprise: \"however,\" \"in reality,\" \"even so,\" \"nevertheless\" (these last two mean \"despite that\"). Cause and effect: \"therefore,\" \"as a result,\" \"consequently.\" Restating: \"in other words.\" Then read the sentences aloud in your head with your choice to make sure the logic works."},{"id":"synthesis","name":"Rhetorical synthesis (using notes)","domain":"EI","lesson":"Read the goal in the question first. It's the only thing that matters. Every choice may use accurate facts from the notes, but only one accomplishes the specific goal: comparing, contrasting, introducing something to a new audience, explaining a cause, or presenting a conclusion. Underline the key words in the goal (\"difference,\" \"similarity,\" \"unfamiliar audience,\" \"conclusion\") and check that your answer clearly does that job."}],"test":[{"id":"T1","num":1,"module":1,"passage":"<p>Marisol had expected the city's famous cherry blossoms to last all spring, but within a week the petals had fallen and been swept from the sidewalks. Their beauty, she realized, was <span class=\"blank\" aria-label=\"blank\">______<\/span>, and that brevity was part of what drew crowds to the park each year.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["ubiquitous","ephemeral","pragmatic","candid"],"correct":"B","domain":"CS","concept":"wic","difficulty":"medium","explanation":"\"Ephemeral\" means short-lived, matching petals that fell \"within a week\" and the \"brevity\" of their beauty."},{"id":"T2","num":2,"module":1,"passage":"<p>Smartphones have become so <span class=\"blank\" aria-label=\"blank\">______<\/span> in daily life that researchers who study attention find it difficult to recruit adult participants who do not own one.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["ubiquitous","ambivalent","benevolent","eloquent"],"correct":"A","domain":"CS","concept":"wic","difficulty":"medium","explanation":"\"Ubiquitous\" means found everywhere, which explains why nonowners are hard to find."},{"id":"T3","num":3,"module":1,"passage":"<p>Rather than pursue an ambitious plan that the town council could never afford, engineer Ruth Okafor proposed a <span class=\"blank\" aria-label=\"blank\">______<\/span> solution: repair the existing bridge in stages, using money already set aside in the annual budget.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["tenacious","ephemeral","pragmatic","mysterious"],"correct":"C","domain":"CS","concept":"wic","difficulty":"medium","explanation":"\"Pragmatic\" means practical and realistic, contrasting with an unaffordable plan."},{"id":"T4","num":4,"module":1,"passage":"<p>In her letters, the poet was remarkably <span class=\"blank\" aria-label=\"blank\">______<\/span> about her failures, openly describing rejected manuscripts and harsh reviews rather than hiding them from her friends.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["benevolent","ubiquitous","secretive","candid"],"correct":"D","domain":"CS","concept":"wic","difficulty":"medium","explanation":"\"Candid\" means open and honest, matching \"openly describing\" failures."},{"id":"T5","num":5,"module":1,"passage":"<p>Many readers feel <span class=\"blank\" aria-label=\"blank\">______<\/span> about the novel's ending: they admire its daring refusal to solve the mystery, yet they are frustrated that the main character's fate is never revealed.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["ambivalent","eloquent","tenacious","indifferent"],"correct":"A","domain":"CS","concept":"wic","difficulty":"medium","explanation":"\"Ambivalent\" means having mixed feelings: readers both admire and are frustrated by the ending."},{"id":"T6","num":6,"module":1,"passage":"<p>Octopuses can change the color and texture of their skin in less than a second, a skill long assumed to depend entirely on their eyes. Yet octopus eyes lack the color-sensitive cells that humans use to see color. In 2015, researchers found that octopus skin itself contains light-sensitive proteins called opsins, suggesting that the skin may detect light directly. This discovery offers one possible explanation for how an apparently color-blind animal can blend so precisely into colorful surroundings.<\/p>","chart":null,"stem":"Which choice best describes the overall structure of the text?","choices":["It presents a theory about octopus vision and then offers evidence that disproves it completely.","It compares the skin of octopuses with the skin of other animals that change color.","It describes a puzzling ability, presents a research finding, and explains how that finding might help resolve the puzzle.","It summarizes a long-running scientific debate and concludes that the debate cannot be settled."],"correct":"C","domain":"CS","concept":"structure","difficulty":"medium","explanation":"The text presents a puzzle (color-blind eyes, precise camouflage), a finding (opsins in skin), and a possible explanation."},{"id":"T7","num":7,"module":1,"passage":"<p>When the first transcontinental railroad in the United States was completed in 1869, an estimated 12,000 or more Chinese immigrants had worked on the Central Pacific line—roughly 90 percent of its workforce. Yet in the famous photograph taken at the ceremony celebrating the railroad's completion, almost none of these workers appear. Historians have since used payroll records, letters, and objects found at old work camps to recover the workers' experiences.<\/p>","chart":null,"stem":"Which choice best describes the function of the second sentence in the overall structure of the text?","choices":["It provides evidence that the Chinese workforce was smaller than historians once claimed.","It highlights a contrast between the workers' large contribution and their near absence from a well-known record of the event.","It explains why historians prefer photographs to written records.","It describes how Chinese communities celebrated the completion of the railroad."],"correct":"B","domain":"CS","concept":"structure","difficulty":"medium","explanation":"\"Yet\" signals a contrast between 90 percent of the workforce and the workers' near absence from the photograph."},{"id":"T8","num":8,"module":1,"passage":"<p class=\"caption\">Text 1<\/p>\n<p>Some art critics argue that museums should display artworks in strict chronological order so that visitors can trace how styles developed over time. In this view, mixing works from different centuries in one gallery confuses visitors and hides the story of artistic change.<\/p>\n<p class=\"caption\">Text 2<\/p>\n<p>Curator Dana Whitfield argues that museums should sometimes juxtapose works from very different eras—placing, for instance, a fifteenth-century portrait beside a contemporary photograph. Such pairings, Whitfield claims, prompt visitors to notice shared choices in composition and theme that a strictly chronological arrangement would keep out of view.<\/p>","chart":null,"stem":"Based on the texts, how would Whitfield (Text 2) most likely respond to the critics in Text 1?","choices":["By agreeing that chronological order is the only acceptable way to arrange a museum","By arguing that arrangements that cross eras can reveal connections that chronological displays tend to hide","By claiming that visitors are more interested in photography than in portrait painting","By insisting that museums stop displaying works older than the twentieth century"],"correct":"B","domain":"CS","concept":"crosstext","difficulty":"medium","explanation":"Whitfield says cross-era pairings show connections that chronological order \"would keep out of view.\""},{"id":"T9","num":9,"module":1,"passage":"<p class=\"intro\">The following text is from an original short story.<\/p>\n<p>Every morning, Grandfather Tomás walked the same path to the harbor, though he had not fished in years. He would stand at the end of the pier, watching the younger crews load their nets, and offer advice no one had asked for. The fishermen rolled their eyes. But when a storm damaged three boats one autumn, it was Tomás who remembered how the old crews had braced their hulls against the rocks. By spring, the same fishermen who had once ignored him were waiting at the pier each morning before he arrived.<\/p>","chart":null,"stem":"Which choice best states the main idea of the text?","choices":["Tomás deeply regrets that he no longer fishes with the younger crews.","Storms have become more frequent and more damaging in the harbor.","Tomás prefers giving advice to strangers rather than to his own family.","The fishermen's attitude toward Tomás changes once his experience proves valuable."],"correct":"D","domain":"II","concept":"central","difficulty":"medium","explanation":"The fishermen move from rolling their eyes to waiting for Tomás after his knowledge helps them."},{"id":"T10","num":10,"module":1,"passage":"<p>Honeybees share the location of food through a movement known as the waggle dance. A forager returning to the hive walks in a straight line while shaking its body, then circles back and repeats the run. The angle of the straight run relative to vertical shows the direction of the food relative to the sun, while the length of time the bee waggles shows distance: the longer the waggle, the farther away the food.<\/p>","chart":null,"stem":"According to the text, what does the length of time a bee waggles indicate?","choices":["The amount of food available at the site","The direction of the food relative to the sun","How far the food is from the hive","The number of foragers needed to collect the food"],"correct":"C","domain":"II","concept":"detail","difficulty":"medium","explanation":"The text states that \"the longer the waggle, the farther away the food.\""},{"id":"T11","num":11,"module":1,"passage":"<p>Ecologist Priya Raman hypothesizes that urban gardens increase the number of <em>native<\/em> bee species in surrounding neighborhoods, not simply the total number of bees.<\/p>","chart":null,"stem":"Which finding, if true, would most directly support Raman's hypothesis?","choices":["Neighborhoods within 500 meters of urban gardens were home to significantly more native bee species than similar neighborhoods without gardens.","Neighborhoods near urban gardens had more honeybees, a non-native species, but the same number of native bee species as neighborhoods without gardens.","Urban gardens produced more vegetables in years when more bees visited them.","Residents living near urban gardens reported seeing more butterflies than residents living elsewhere."],"correct":"A","domain":"II","concept":"coe-text","difficulty":"medium","explanation":"More native species near gardens directly supports the claim about native species, not total bees; B contradicts it."},{"id":"T12","num":12,"module":1,"passage":"<p>In an original novel, <em>The Lantern Keeper<\/em>, the main character, Edith, is portrayed as tenacious in pursuing her goal of opening a bookshop.<\/p>","chart":null,"stem":"Which quotation from the novel most effectively illustrates the claim?","choices":["\"Edith watched the rain gather on the windowpane and, for once, thought of nothing at all.\"","\"Edith laughed easily and was liked by nearly everyone in the village.\"","\"Some nights Edith lay awake, wondering whether she had chosen the right life.\"","\"When the bank refused her loan for the third time, Edith returned the next morning with a revised plan and asked again.\""],"correct":"D","domain":"II","concept":"coe-text","difficulty":"medium","explanation":"Returning with a new plan after three refusals shows persistence, the meaning of \"tenacious.\""},{"id":"T13","num":13,"module":1,"passage":"<p class=\"caption\">Average Daily Screen Time Reported by Students at Lincoln Middle School, 2024 (hours)<\/p>\n<table class=\"data\"><thead><tr><th>Grade<\/th><th>Weekdays<\/th><th>Weekends<\/th><\/tr><\/thead><tbody><tr><td>Grade 6<\/td><td>3.1<\/td><td>4.5<\/td><\/tr><tr><td>Grade 7<\/td><td>3.6<\/td><td>5.2<\/td><\/tr><tr><td>Grade 8<\/td><td>4.2<\/td><td>6.0<\/td><\/tr><\/tbody><\/table>\n<p>A student analyzing the survey results concluded that reported screen time tends to increase with grade level on both weekdays and weekends. <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most effectively uses data from the table to complete the statement?","choices":["For example, sixth graders reported 3.1 hours of screen time on weekdays and 4.5 hours on weekends.","For example, average weekday screen time rose from 3.1 hours in grade 6 to 4.2 hours in grade 8, and average weekend screen time rose from 4.5 hours to 6.0 hours.","For example, eighth graders reported more screen time on weekends (6.0 hours) than on weekdays (4.2 hours).","For example, seventh graders reported 5.2 hours of screen time on weekends."],"correct":"B","domain":"II","concept":"coe-quant","difficulty":"medium","explanation":"Only B shows the change across all three grades for both weekdays and weekends."},{"id":"T14","num":14,"module":1,"passage":"<p>In the 1800s, many U.S. towns set their clocks by local solar noon, so the time in one town could differ by several minutes from the time in a town just 50 miles away. For most residents, who rarely traveled far, these differences caused little trouble. Railroad companies, however, ran trains across hundreds of miles on tight schedules. In 1883, the major railroads adopted a system of standard time zones, which suggests that <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most logically completes the text?","choices":["most town residents had long demanded a single national time.","solar noon was no longer used for any purpose after 1883.","the many different local times created practical problems for coordinating train schedules.","railroad companies wanted to reduce the total number of trains they operated."],"correct":"C","domain":"II","concept":"inference","difficulty":"medium","explanation":"The text contrasts residents (little trouble) with railroads (long routes, tight schedules), implying local times caused scheduling problems."},{"id":"T15","num":15,"module":1,"passage":"<p>Tardigrades, microscopic animals sometimes called water bears, can survive extreme drying out by entering a state called a tun, in which their metabolism slows to less than 0.01 percent of its normal rate. Researchers found that tardigrades whose production of a group of proteins called CAHS had been blocked were far less likely to survive drying out than tardigrades that produced the proteins normally. These results suggest that <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most logically completes the text?","choices":["CAHS proteins play an important role in tardigrades' ability to survive drying out.","tardigrades cannot survive for long periods in water.","any animal that produces CAHS proteins can survive drying out.","metabolism has no effect on whether tardigrades survive drying out."],"correct":"A","domain":"II","concept":"inference","difficulty":"medium","explanation":"Blocking CAHS reduced survival, so the proteins likely matter; C overgeneralizes to all animals."},{"id":"T16","num":16,"module":1,"passage":"<p>The Great Barrier Reef is the largest coral reef system in the <span class=\"blank\" aria-label=\"blank\">______<\/span> stretches more than 2,300 kilometers along the northeastern coast of Australia.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["world, it","world it","world, and, it","world; it"],"correct":"D","domain":"SEC","concept":"boundaries","difficulty":"medium","explanation":"A semicolon correctly joins two independent clauses; A is a comma splice and B is a run-on."},{"id":"T17","num":17,"module":1,"passage":"<p>The collection of letters that abolitionist Frederick Douglass wrote to his friends and allies <span class=\"blank\" aria-label=\"blank\">______<\/span> valuable insight into his thinking during the Civil War.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["offer","have offered","offers","are offering"],"correct":"C","domain":"SEC","concept":"sva","difficulty":"medium","explanation":"The singular subject \"collection\" requires the singular verb \"offers.\""},{"id":"T18","num":18,"module":1,"passage":"<p>Each of the robotic rovers sent to Mars has carried scientific instruments designed specifically for <span class=\"blank\" aria-label=\"blank\">______<\/span> mission.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["their","its","they're","it's"],"correct":"B","domain":"SEC","concept":"pronoun","difficulty":"medium","explanation":"\"Each\" is singular, so the singular possessive \"its\" is needed; \"it's\" means \"it is.\""},{"id":"T19","num":19,"module":1,"passage":"<p>Last summer, marine biologist Ana Reyes <span class=\"blank\" aria-label=\"blank\">______<\/span> more than 200 sea turtle nests along the Florida coast, recording the number of eggs in each one.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["monitors","will monitor","has been monitoring","monitored"],"correct":"D","domain":"SEC","concept":"tense","difficulty":"medium","explanation":"\"Last summer\" signals a completed past action, so the simple past \"monitored\" is correct."},{"id":"T20","num":20,"module":1,"passage":"<p>The two <span class=\"blank\" aria-label=\"blank\">______<\/span> estimates of the ancient city's population differed by nearly 10,000 people, so a third team was asked to review the evidence.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["researcher's","researchers'","researchers","researchers's"],"correct":"B","domain":"SEC","concept":"possessive","difficulty":"medium","explanation":"\"Two\" researchers own the estimates, so the plural possessive \"researchers'\" is correct."},{"id":"T21","num":21,"module":1,"passage":"<p>The expedition's supply list included three <span class=\"blank\" aria-label=\"blank\">______<\/span> water purification tablets, a satellite phone, and a first-aid kit.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["essentials:","essentials, and","essentials;","essentials so"],"correct":"A","domain":"SEC","concept":"colon","difficulty":"medium","explanation":"A colon follows an independent clause to introduce the list that explains \"three essentials.\""},{"id":"T22","num":22,"module":1,"passage":"<p>Having studied the migration of monarch butterflies for more than a decade, <span class=\"blank\" aria-label=\"blank\">______<\/span> that some of the insects travel as far as 4,800 kilometers to reach their winter forests in Mexico.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["the data collected by entomologist Hana Mori showed","entomologist Hana Mori's research showed","entomologist Hana Mori showed","it was shown by entomologist Hana Mori"],"correct":"C","domain":"SEC","concept":"modifier","difficulty":"medium","explanation":"The modifier \"Having studied…\" must be followed by the person who studied, Hana Mori."},{"id":"T23","num":23,"module":1,"passage":"<p>Early telescopes used glass lenses to bend light, but these lenses often produced blurry, rainbow-colored edges around objects. <span class=\"blank\" aria-label=\"blank\">______<\/span> Isaac Newton designed a telescope in 1668 that used a curved mirror instead of a lens, avoiding the problem.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["Similarly,","In other words,","Nevertheless,","To address this flaw,"],"correct":"D","domain":"EI","concept":"transition","difficulty":"medium","explanation":"Newton's mirror design was a response to the lens problem, so \"To address this flaw\" fits."},{"id":"T24","num":24,"module":1,"passage":"<p>Many people assume that deserts are nearly lifeless. <span class=\"blank\" aria-label=\"blank\">______<\/span> the Sonoran Desert in North America supports more than 2,000 species of plants, along with hundreds of species of birds, reptiles, and mammals.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["Therefore,","In reality,","Similarly,","As a result,"],"correct":"B","domain":"EI","concept":"transition","difficulty":"medium","explanation":"The second sentence contradicts the common assumption, so \"In reality\" fits."},{"id":"T25","num":25,"module":1,"passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>The Hubble Space Telescope was launched in 1990.<\/li><li>Hubble's main mirror is 2.4 meters wide.<\/li><li>The James Webb Space Telescope was launched in 2021.<\/li><li>Webb's main mirror is 6.5 meters wide.<\/li><li>A larger mirror collects more light, allowing astronomers to observe fainter objects.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize a difference between the two telescopes' mirrors. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Hubble was launched in 1990, while Webb was launched in 2021.","Both Hubble and Webb are space telescopes used by astronomers.","Webb's 6.5-meter mirror is much wider than Hubble's 2.4-meter mirror, so Webb can collect more light and observe fainter objects.","A larger mirror collects more light, allowing astronomers to observe fainter objects."],"correct":"C","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"Only C compares the two mirror sizes and explains why the difference matters."},{"id":"T26","num":26,"module":1,"passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Wangari Maathai was a Kenyan environmental activist.<\/li><li>In 1977, she founded the Green Belt Movement.<\/li><li>The movement encouraged women to plant trees to fight deforestation.<\/li><li>More than 51 million trees have been planted through the movement.<\/li><li>Maathai received the Nobel Peace Prize in 2004.<\/li><\/ul>","chart":null,"stem":"The student wants to introduce the Green Belt Movement to an audience unfamiliar with it. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Founded in 1977 by Kenyan activist Wangari Maathai, the Green Belt Movement encourages women to plant trees to fight deforestation.","Wangari Maathai received the Nobel Peace Prize in 2004.","More than 51 million trees have been planted.","Maathai, who won the Nobel Peace Prize, was from Kenya."],"correct":"A","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"A explains what the movement is, who founded it, when, and its purpose for a new audience."},{"id":"T27","num":27,"module":1,"passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Researchers studied two groups of students preparing for a vocabulary test.<\/li><li>Group 1 reread a word list for 30 minutes.<\/li><li>Group 2 spent 30 minutes quizzing themselves on the same words.<\/li><li>One week later, Group 2 remembered 25 percent more words than Group 1.<\/li><\/ul>","chart":null,"stem":"The student wants to present the study's conclusion. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Group 1 reread a word list for 30 minutes.","Researchers studied two groups of students preparing for a vocabulary test.","Both groups of students studied the same words for 30 minutes.","Students who quizzed themselves remembered 25 percent more words a week later than students who reread the same list for the same amount of time, suggesting that self-quizzing is the more effective study method."],"correct":"D","domain":"EI","concept":"synthesis","difficulty":"medium","explanation":"Only D states the result and the conclusion drawn from it."},{"id":"T28","num":28,"module":2,"passage":"<p>Critics who expected the senator's farewell address to be a dry list of accomplishments were surprised by how <span class=\"blank\" aria-label=\"blank\">______<\/span> it was: in vivid, carefully balanced sentences, she moved many listeners to tears.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["brief","eloquent","ambivalent","pragmatic"],"correct":"B","domain":"CS","concept":"wic","difficulty":"hard","explanation":"\"Eloquent\" means expressive and persuasive, matching \"vivid, carefully balanced sentences\" that moved listeners."},{"id":"T29","num":29,"module":2,"passage":"<p>Although the foundation presented its donations to the town as purely <span class=\"blank\" aria-label=\"blank\">______<\/span>, records later revealed that the gifts had been timed to win favorable treatment from local regulators—hardly the kindly generosity the foundation had advertised.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["benevolent","ephemeral","candid","tenacious"],"correct":"A","domain":"CS","concept":"wic","difficulty":"hard","explanation":"\"Benevolent\" means kindly and charitable, echoed by \"kindly generosity,\" which the records contradict."},{"id":"T30","num":30,"module":2,"passage":"<p>Before approving the new medication, regulators will <span class=\"blank\" aria-label=\"blank\">______<\/span> the clinical trial data, examining each reported side effect and checking whether the researchers' statistical methods were sound.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["disregard","summarize","scrutinize","celebrate"],"correct":"C","domain":"CS","concept":"wic","difficulty":"hard","explanation":"\"Scrutinize\" means examine closely, matching \"examining each reported side effect.\""},{"id":"T31","num":31,"module":2,"passage":"<p>In her history of nineteenth-century textile mills, historian Lena Fiorelli does not <span class=\"blank\" aria-label=\"blank\">______<\/span> the harsh conditions workers faced; instead, she documents them in unflinching detail, drawing on diaries, wage ledgers, and factory inspection reports.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["obscure","emphasize","investigate","record"],"correct":"A","domain":"CS","concept":"wic","difficulty":"hard","explanation":"\"Does not obscure… instead documents\" sets up a contrast between hiding and fully revealing."},{"id":"T32","num":32,"module":2,"passage":"<p class=\"intro\">The following text is from an original short story.<\/p>\n<p>Theo's feelings about moving to the city were decidedly mixed. He <span class=\"blank\" aria-label=\"blank\">______<\/span> the prospect of museums, crowded markets, and late-night trains, yet each time he pictured leaving the orchard behind, a heaviness settled in his chest.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["dreaded","ignored","questioned","relished"],"correct":"D","domain":"CS","concept":"wic","difficulty":"hard","explanation":"\"Mixed\" feelings and \"yet\" signal that the first reaction is positive; \"relished\" means enjoyed."},{"id":"T33","num":33,"module":2,"passage":"<p>Composer Florence Price's Symphony in E Minor, premiered by the Chicago Symphony Orchestra in 1933, made her the first Black woman to have a symphony performed by a major American orchestra. For decades afterward, however, her music was rarely performed, and many of her manuscripts were presumed lost. In 2009, a couple renovating an abandoned house in St. Anne, Illinois, discovered dozens of Price's scores—including two violin concertos—in the attic. Since then, orchestras around the world have performed and recorded works that audiences had never heard.<\/p>","chart":null,"stem":"Which choice best states the main purpose of the text?","choices":["To argue that Price's symphony was superior to other works premiered in 1933","To trace how Price's music moved from early recognition to neglect and then to renewed attention","To explain the musical techniques Price used in her violin concertos","To criticize the Chicago Symphony Orchestra for failing to perform Price's later works"],"correct":"B","domain":"CS","concept":"structure","difficulty":"hard","explanation":"The text moves from Price's 1933 milestone to decades of neglect to rediscovery and renewed performance."},{"id":"T34","num":34,"module":2,"passage":"<p class=\"caption\">Text 1<\/p>\n<p>For much of the twentieth century, many paleontologists held that dinosaurs were cold-blooded, like modern lizards and crocodiles, relying on their surroundings to regulate body temperature. This view rested largely on dinosaurs' evolutionary relationship to living reptiles.<\/p>\n<p class=\"caption\">Text 2<\/p>\n<p>A 2022 study measured chemical markers of metabolic rate preserved in fossil bones. The researchers found that many dinosaurs, including the group that gave rise to birds, had high metabolic rates comparable to those of modern birds and mammals. Some plant-eating groups, however, appear to have had lower rates, closer to those of modern reptiles.<\/p>","chart":null,"stem":"Based on the texts, how would the researchers in Text 2 most likely respond to the view described in Text 1?","choices":["They would argue that the view is incorrect for every group of dinosaurs.","They would agree that evolutionary relationships provide the best evidence about dinosaur metabolism.","They would contend that the view does not apply to all dinosaurs, since evidence indicates that many had metabolic rates like those of warm-blooded animals.","They would claim that no dinosaurs were able to regulate their own body temperature."],"correct":"C","domain":"CS","concept":"crosstext","difficulty":"hard","explanation":"Text 2 finds many dinosaurs had high metabolic rates but some did not, so the view fails for many, not all; A ignores the lower-rate groups."},{"id":"T35","num":35,"module":2,"passage":"<p class=\"caption\">Text 1<\/p>\n<p>Economist Marco Bellini argues that the four-day workweek is a pragmatic reform rather than a utopian experiment. In trials at dozens of companies, productivity held steady while reported employee burnout fell sharply. Bellini concludes that most businesses would benefit from adopting a four-day schedule.<\/p>\n<p class=\"caption\">Text 2<\/p>\n<p>Labor researcher Aisha Coleman notes that most four-day-week trials have involved office-based firms that volunteered to participate—companies already inclined to believe the policy would succeed. Coleman cautions that results from such firms may not predict what would happen in hospitals, factories, or retail stores, where output depends heavily on the number of hours that workers are present.<\/p>","chart":null,"stem":"Based on the texts, how would Coleman (Text 2) most likely respond to Bellini's conclusion (Text 1)?","choices":["She would argue that it relies on trials whose participants may not represent many kinds of businesses.","She would agree that employee burnout is no longer a concern for most companies.","She would claim that productivity actually decreased in most of the trials.","She would contend that hospitals and factories have already adopted four-day schedules successfully."],"correct":"A","domain":"CS","concept":"crosstext","difficulty":"hard","explanation":"Coleman questions whether volunteer office firms represent hospitals, factories, and retail, which undercuts \"most businesses.\""},{"id":"T36","num":36,"module":2,"passage":"<p class=\"intro\">The following text is from an original short story. Mara has just returned to her childhood home after many years away.<\/p>\n<p>The kitchen was smaller than she remembered, though nothing in it had changed: the same chipped blue bowl on the windowsill, the same calendar from a year long past. It was not the room that had shrunk, Mara understood, but the world she had once believed it contained. As a child she had thought these four walls held everything worth knowing. Now she saw only a kitchen—and missed, with a sharpness that surprised her, the girl who had seen more.<\/p>","chart":null,"stem":"Which choice best states the main idea of the text?","choices":["Mara is disappointed that her family never updated the kitchen.","Mara regrets leaving home and decides to stay permanently.","Mara recalls specific events from her childhood that took place in the kitchen.","Mara realizes that her own perception, not the kitchen, has changed, and she feels a sense of loss about that change."],"correct":"D","domain":"II","concept":"central","difficulty":"hard","explanation":"\"It was not the room that had shrunk… but the world she had once believed it contained,\" followed by missing her younger self."},{"id":"T37","num":37,"module":2,"passage":"<p>Most plants open tiny pores called stomata during the day to take in carbon dioxide for photosynthesis, but open pores also let water escape. Many desert plants, such as cacti and pineapples, use a process called CAM photosynthesis: they open their stomata only at night, when cooler temperatures reduce water loss, and store the carbon dioxide as an acid. During the day, with their stomata closed, they release the stored carbon dioxide inside their tissues and use it for photosynthesis.<\/p>","chart":null,"stem":"According to the text, how do CAM plants reduce water loss?","choices":["They carry out photosynthesis only at night.","They store water in the form of an acid.","They open their stomata at night rather than during the day.","They have no stomata at all."],"correct":"C","domain":"II","concept":"detail","difficulty":"hard","explanation":"CAM plants open stomata only at night, when cooler temperatures reduce water loss; they still photosynthesize during the day (A)."},{"id":"T38","num":38,"module":2,"passage":"<p>Linguist Tomás Herrera claims that young children learning two languages at the same time do not become confused between them, as was once widely believed, but instead learn early on to keep the two language systems separate.<\/p>","chart":null,"stem":"Which finding, if true, would most directly support Herrera's claim?","choices":["Bilingual toddlers as young as two consistently use the word order of each language with speakers of that language, switching smoothly depending on whom they are addressing.","Bilingual children know more words in total, across both languages, than monolingual children of the same age.","Some bilingual children occasionally mix words from both languages in a single sentence.","Many parents of bilingual children report that they once worried their children would become confused."],"correct":"A","domain":"II","concept":"coe-text","difficulty":"hard","explanation":"Using each language's word order correctly with the right speaker shows early separation of the two systems."},{"id":"T39","num":39,"module":2,"passage":"<p>In an original poem, \"Night Ferry,\" the speaker describes the city as both welcoming and indifferent to the people who arrive there.<\/p>","chart":null,"stem":"Which quotation from the poem most effectively illustrates the claim?","choices":["\"The water slaps the hull in steady time / as gulls retreat to rooftops for the night.\"","\"I count the bridges—one, two, three, and four— / each strung with lights like beads along a thread.\"","\"My ticket, damp and folded in my fist, / I wait to see the far shore taking shape.\"","\"The harbor lamps reach out their yellow hands / yet never turn to see whose face they light.\""],"correct":"D","domain":"II","concept":"coe-text","difficulty":"hard","explanation":"Lamps \"reach out\" (welcoming) yet \"never turn to see\" (indifferent), showing both qualities."},{"id":"T40","num":40,"module":2,"passage":"<p class=\"caption\">Three-Year Survival Rate of Transplanted Oak Seedlings, by Site and Planting Method (%)<\/p>\n<table class=\"data\"><thead><tr><th>Site<\/th><th>Planted bare<\/th><th>Planted with protective tube<\/th><\/tr><\/thead><tbody><tr><td>Ridge<\/td><td>34<\/td><td>61<\/td><\/tr><tr><td>Valley<\/td><td>52<\/td><td>58<\/td><\/tr><tr><td>Meadow<\/td><td>41<\/td><td>77<\/td><\/tr><\/tbody><\/table>\n<p>Forester Jun Park hypothesized that protective tubes improve seedling survival most at sites where deer frequently eat young trees—the ridge and the meadow—and least in the valley, where deer are rare.<\/p>","chart":null,"stem":"Which choice best describes data from the table that support Park's hypothesis?","choices":["At every site, seedlings planted with tubes survived at a higher rate than seedlings planted bare.","Bare seedlings in the valley had the highest survival rate of any bare seedlings, at 52 percent.","Tubes raised survival by 27 percentage points on the ridge and 36 points in the meadow, but by only 6 points in the valley.","Seedlings planted with tubes in the meadow had the highest survival rate in the table, at 77 percent."],"correct":"C","domain":"II","concept":"coe-quant","difficulty":"hard","explanation":"The hypothesis is about where tubes help <em>most<\/em>; only C compares the size of the gains across sites."},{"id":"T41","num":41,"module":2,"passage":"<p>A student claims that the number of libraries in Region X offering \"library of things\" programs increased in every two-year period from 2016 to 2024.<\/p>","chart":{"type":"line","title":"Libraries in Region X with \"Library of Things\" Programs","yLabel":"Number of libraries","labels":["2016","2018","2020","2022","2024"],"values":[12,30,28,65,110]},"stem":"Which choice best describes data from the graph that weaken the student's claim?","choices":["The number of libraries fell slightly, from 30 in 2018 to 28 in 2020.","The number of libraries rose from 12 in 2016 to 110 in 2024.","The largest increase occurred between 2022 and 2024.","More than 100 libraries offered the programs by 2024."],"correct":"A","domain":"II","concept":"coe-quant","difficulty":"hard","explanation":"The drop from 30 to 28 between 2018 and 2020 contradicts \"increased in every two-year period.\""},{"id":"T42","num":42,"module":2,"passage":"<p>During the 1918 influenza pandemic, Philadelphia allowed a large parade to go forward on September 28, while St. Louis closed schools, theaters, and other public gathering places soon after its first cases appeared in early October. Researchers comparing the two cities have found that Philadelphia's death rate climbed within weeks to a peak far higher than St. Louis's. Because the two cities had similar populations and were struck by the same strain of the virus, the comparison suggests that <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice most logically completes the text?","choices":["parades were the main cause of the 1918 pandemic.","St. Louis had more hospitals than Philadelphia did.","the virus was more deadly in Philadelphia's climate than in St. Louis's.","early limits on public gatherings may have slowed the spread of influenza."],"correct":"D","domain":"II","concept":"inference","difficulty":"hard","explanation":"With population and strain similar, the key difference is the timing of restrictions; hospitals and climate are not discussed."},{"id":"T43","num":43,"module":2,"passage":"<p>The axolotl—a salamander native to the lakes near Mexico <span class=\"blank\" aria-label=\"blank\">______<\/span> can regrow lost limbs, parts of its heart, and even portions of its brain.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["City,","City—","City;","City"],"correct":"B","domain":"SEC","concept":"supplement","difficulty":"hard","explanation":"The interrupting phrase opens with a dash, so it must close with a dash."},{"id":"T44","num":44,"module":2,"passage":"<p>Many people believe that bats are <span class=\"blank\" aria-label=\"blank\">______<\/span> most bat species can see quite well, and some can even detect ultraviolet light.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["blind, in fact,","blind; in fact,","blind in fact,","blind: in fact;"],"correct":"B","domain":"SEC","concept":"boundaries","difficulty":"hard","explanation":"A semicolon separates the two independent clauses, and \"in fact\" is followed by a comma."},{"id":"T45","num":45,"module":2,"passage":"<p>Among the most significant discoveries at the excavation site <span class=\"blank\" aria-label=\"blank\">______<\/span> a set of bronze tools, which suggests that the settlement traded with distant regions.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["were","are","have been","was"],"correct":"D","domain":"SEC","concept":"sva","difficulty":"hard","explanation":"In this inverted sentence the subject is \"a set\" (singular), so \"was\" is correct."},{"id":"T46","num":46,"module":2,"passage":"<p>The Rosetta Stone, discovered in 1799 by French soldiers in Egypt, <span class=\"blank\" aria-label=\"blank\">______<\/span> the same decree in three scripts, a feature that allowed scholars to decipher Egyptian hieroglyphs.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["recording","to record","records","having recorded"],"correct":"C","domain":"SEC","concept":"verbform","difficulty":"hard","explanation":"The sentence needs a main verb for the subject \"The Rosetta Stone\"; \"records\" supplies it."},{"id":"T47","num":47,"module":2,"passage":"<p>Researchers studying the island's birds identified three distinct <span class=\"blank\" aria-label=\"blank\">______<\/span> songs used to attract mates, calls that warn of predators, and contact calls that keep flocks together.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["categories:","categories,","categories;","categories"],"correct":"A","domain":"SEC","concept":"colon","difficulty":"hard","explanation":"A colon after the independent clause introduces the list of three categories."},{"id":"T48","num":48,"module":2,"passage":"<p>Each species of bamboo flowers at <span class=\"blank\" aria-label=\"blank\">______<\/span> own fixed interval, which for some species is as long as 120 years.<\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["their","its","it's","they're"],"correct":"B","domain":"SEC","concept":"pronoun","difficulty":"hard","explanation":"\"Each species\" is singular, so the possessive \"its\" is correct."},{"id":"T49","num":49,"module":2,"passage":"<p>Built entirely without mortar, <span class=\"blank\" aria-label=\"blank\">______<\/span><\/p>","chart":null,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["the stones in Machu Picchu's walls were cut by Inca builders so precisely that a knife blade cannot fit between them.","Machu Picchu's walls contain stones cut so precisely that a knife blade cannot fit between them.","a knife blade cannot fit between the stones of Machu Picchu's walls.","Inca builders cut the stones of Machu Picchu's walls so precisely that a knife blade cannot fit between them."],"correct":"B","domain":"SEC","concept":"modifier","difficulty":"hard","explanation":"\"Built entirely without mortar\" describes the walls, so \"Machu Picchu's walls\" must come right after the comma."},{"id":"T50","num":50,"module":2,"passage":"<p>Physicist Chien-Shiung Wu's 1956 experiment provided the first evidence that a supposed law of physics, the conservation of parity, does not always hold. The experiment confirmed a prediction made by theorists Tsung-Dao Lee and Chen Ning Yang. <span class=\"blank\" aria-label=\"blank\">______<\/span> the 1957 Nobel Prize in Physics was awarded to Lee and Yang alone; Wu was not included.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["Consequently,","For example,","Likewise,","Even so,"],"correct":"D","domain":"EI","concept":"transition","difficulty":"hard","explanation":"Despite Wu's key role, she was left out of the prize; \"Even so\" signals this unexpected contrast."},{"id":"T51","num":51,"module":2,"passage":"<p>Glass appears solid and rigid at room temperature. <span class=\"blank\" aria-label=\"blank\">______<\/span> its atoms lack the orderly, repeating arrangement found in crystalline solids such as quartz; structurally, glass more closely resembles a liquid that has been frozen in place.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical transition?","choices":["Therefore,","Similarly,","At the atomic level, however,","For this reason,"],"correct":"C","domain":"EI","concept":"transition","difficulty":"hard","explanation":"The second sentence contrasts glass's solid appearance with its disordered atomic structure."},{"id":"T52","num":52,"module":2,"passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>Bioluminescence is the production of light by living organisms.<\/li><li>Fireflies use bioluminescence to attract mates.<\/li><li>Anglerfish use a glowing lure to attract prey.<\/li><li>Some squid use bioluminescence to match the light coming from above, hiding their silhouettes from predators below.<\/li><\/ul>","chart":null,"stem":"The student wants to emphasize that bioluminescence serves a variety of purposes. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Fireflies use bioluminescence to attract mates.","Bioluminescence serves many purposes: fireflies use it to attract mates, anglerfish to lure prey, and some squid to hide from predators.","Both anglerfish and fireflies are able to produce their own light.","Bioluminescence is the production of light by living organisms."],"correct":"B","domain":"EI","concept":"synthesis","difficulty":"hard","explanation":"Only B names several different purposes (mates, prey, hiding)."},{"id":"T53","num":53,"module":2,"passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>In 1900, about 40 percent of U.S. workers were employed in agriculture.<\/li><li>By 2000, less than 2 percent of U.S. workers were employed in agriculture.<\/li><li>Over the same period, total U.S. farm output rose substantially.<\/li><li>Historians link this change to mechanization and improved crop varieties.<\/li><\/ul>","chart":null,"stem":"The student wants to highlight the contrast between the trend in farm employment and the trend in farm output. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["In 1900, about 40 percent of U.S. workers were employed in agriculture.","Mechanization and improved crop varieties transformed U.S. farming during the twentieth century.","Although the share of U.S. workers employed in agriculture fell from about 40 percent in 1900 to less than 2 percent in 2000, farm output rose substantially over the same period.","By 2000, less than 2 percent of U.S. workers were employed in agriculture, a result historians link to mechanization."],"correct":"C","domain":"EI","concept":"synthesis","difficulty":"hard","explanation":"C uses \"Although\" to set falling employment against rising output."},{"id":"T54","num":54,"module":2,"passage":"<p>While researching a topic, a student has taken the following notes:<\/p>\n<ul class=\"notes\"><li>The Voynich manuscript is a handwritten book that radiocarbon testing dates to the early 1400s.<\/li><li>It is written in an unknown script that no one has deciphered.<\/li><li>It contains drawings of plants, many of which do not match any known species.<\/li><li>It is held at Yale University's Beinecke Rare Book and Manuscript Library.<\/li><\/ul>","chart":null,"stem":"The student wants to explain why the manuscript remains a mystery to researchers. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Written in an undeciphered script and filled with drawings of plants that match no known species, the early-fifteenth-century Voynich manuscript continues to puzzle researchers.","The Voynich manuscript is held at Yale University's Beinecke Rare Book and Manuscript Library.","Radiocarbon testing dates the Voynich manuscript to the early 1400s.","The Voynich manuscript is a handwritten book that contains drawings of plants."],"correct":"A","domain":"EI","concept":"synthesis","difficulty":"hard","explanation":"A gives the reasons (undeciphered script, unknown plants) that the manuscript remains a mystery."}],"bank":[{"id":"wic-1","passage":"<p>The hiking guide warned that the canyon trail was <span class=\"blank\" aria-label=\"blank\">______<\/span> after heavy rain: rocks became slick, and parts of the path washed away entirely.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["treacherous","scenic","familiar","crowded"],"correct":"A","domain":"CS","concept":"wic","difficulty":"medium","explanation":"The colon introduces an explanation: slick rocks and a washed-out path describe danger. \"Treacherous\" means hidden or sudden danger. \"Scenic\" (beautiful) and \"crowded\" have nothing to do with the clues."},{"id":"wic-2","passage":"<p>Unlike her outgoing older brother, who chatted with everyone at family gatherings, Priya was <span class=\"blank\" aria-label=\"blank\">______<\/span>, preferring to sit quietly in a corner with a book.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["boisterous","reserved","generous","curious"],"correct":"B","domain":"CS","concept":"wic","difficulty":"medium","explanation":"\"Unlike her outgoing older brother\" signals a contrast, and \"preferring to sit quietly\" restates the blank. \"Reserved\" means quiet and keeping to oneself. \"Boisterous\" (loud and energetic) describes the brother, not Priya."},{"id":"wic-3","passage":"<p>The science museum's new exhibit was designed to be <span class=\"blank\" aria-label=\"blank\">______<\/span>: visitors could touch real fossils, operate a model volcano, and assemble their own dinosaur skeletons.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["fragile","temporary","interactive","expensive"],"correct":"C","domain":"CS","concept":"wic","difficulty":"medium","explanation":"Everything after the colon describes visitors doing things with the exhibit (touching, operating, assembling). \"Interactive\" means allowing people to take part. Nothing in the text says the exhibit is temporary, fragile, or costly."},{"id":"wic-4","passage":"<p>Scientists had long assumed that the deep ocean floor was nearly barren, so they were astonished to find it <span class=\"blank\" aria-label=\"blank\">______<\/span> with life: crabs, worms, and glowing fish crowded around the vents of hot water.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["dimmed","unfamiliar","cautious","teeming"],"correct":"D","domain":"CS","concept":"wic","difficulty":"medium","explanation":"\"Teeming with\" means full of or crowded with, which matches \"crowded around the vents\" and contrasts with \"nearly barren.\" The other words don't describe a large amount of life."},{"id":"wic-5","passage":"<p>Though the critic praised the film's acting, she found its plot <span class=\"blank\" aria-label=\"blank\">______<\/span>; nearly every twist, she wrote, could be guessed within the first ten minutes.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["predictable","intricate","original","suspenseful"],"correct":"A","domain":"CS","concept":"wic","difficulty":"medium","explanation":"The second half explains the blank: twists that can be guessed early make a plot \"predictable.\" \"Original\" and \"suspenseful\" are the opposite of what the critic describes, and \"Though … praised\" signals that this is a criticism."},{"id":"wic-6","passage":"<p>To <span class=\"blank\" aria-label=\"blank\">______<\/span> the effects of the long drought, the town installed rain barrels, limited lawn watering, and repaired leaking pipes.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["mitigate","celebrate","predict","ignore"],"correct":"A","domain":"CS","concept":"wic","difficulty":"hard","explanation":"The town's actions (saving and protecting water) are meant to reduce the drought's harm. \"Mitigate\" means to make something less severe. You don't \"predict\" effects by repairing pipes, and the town is clearly not ignoring them."},{"id":"wic-7","passage":"<p>The biologist's early results were promising but not <span class=\"blank\" aria-label=\"blank\">______<\/span>; before publishing, she repeated the experiment three more times to make sure the effect was real.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["conclusive","surprising","complicated","expensive"],"correct":"A","domain":"CS","concept":"wic","difficulty":"hard","explanation":"She repeated the experiment \"to make sure the effect was real,\" so the early results didn't settle the question yet. \"Conclusive\" means proving something firmly. The clue is about certainty, not surprise or cost."},{"id":"wic-8","passage":"<p>Sea otters <span class=\"blank\" aria-label=\"blank\">______<\/span> their reputation as some of the ocean's cleverest animals: they use rocks as tools to crack open shellfish, and some even keep a favorite rock tucked in a pouch of loose skin under one arm.<\/p>","chart":null,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":["undermine","conceal","justify","abandon"],"correct":"C","domain":"CS","concept":"wic","difficulty":"hard","explanation":"The tool use described after the colon is evidence that otters really are clever, so their behavior \"justifies\" (shows to be deserved) their reputation. \"Undermine\" would mean weakening the reputation, which is the opposite."},{"id":"structure-1","passage":"<p>For years, city planners in the town of Fairhaven assumed that adding lanes to the main highway would ease traffic. When the highway was widened in 2015, however, travel times improved for only a few months before traffic returned to its old levels. Transportation researchers call this effect \"induced demand\": when driving becomes easier, more people choose to drive, filling up the new space.<\/p>","chart":null,"stem":"Which choice best describes the overall structure of the text?","choices":["It describes a plan, reports an unexpected result, and then offers an explanation for that result.","It compares two towns' approaches to traffic and argues that one approach is better.","It lists several causes of traffic and ranks them from most to least important.","It describes a problem and proposes a new solution that planners should try next."],"correct":"A","domain":"CS","concept":"structure","difficulty":"medium","explanation":"Sentence 1 gives the plan (add lanes), sentence 2 the surprising result (traffic came back), and sentence 3 an explanation (induced demand). Only one town is discussed, and no new solution is proposed."},{"id":"structure-2","passage":"<p>The monarch butterfly's bright orange wings are hard to miss. Birds, however, quickly learn to avoid eating these butterflies. <u>As caterpillars, monarchs feed on milkweed, a plant containing toxins that remain in the insects' bodies even after they become adults.<\/u> A bird that eats a monarch usually becomes sick, and it is unlikely to try another.<\/p>","chart":null,"stem":"Which choice best describes the function of the underlined sentence in the text as a whole?","choices":["It explains the source of a quality that leads birds to avoid monarchs.","It introduces a new topic that is unrelated to the first two sentences.","It challenges the claim that birds avoid eating monarchs.","It describes how monarchs choose where to lay their eggs."],"correct":"A","domain":"CS","concept":"structure","difficulty":"medium","explanation":"The text first says birds avoid monarchs, and the underlined sentence explains WHY: milkweed toxins stay in their bodies. It supports the earlier claim rather than challenging it."},{"id":"structure-3","passage":"<p>In 1955, at age 67, Emma Gatewood told her family she was going for a walk. She then hiked the entire Appalachian Trail, more than 2,000 miles, wearing canvas sneakers and carrying a homemade bag, and became the first woman to complete the trail alone in a single season. Newspaper stories about \"Grandma Gatewood\" drew national attention to the trail, which at the time was poorly maintained in many places, and helped inspire efforts to improve it.<\/p>","chart":null,"stem":"Which choice best states the main purpose of the text?","choices":["To argue that hikers should wear sneakers instead of boots","To compare hiking in the 1950s with hiking today","To explain why the Appalachian Trail was first built","To describe a hiker's remarkable achievement and the effect it had on the trail"],"correct":"D","domain":"CS","concept":"structure","difficulty":"medium","explanation":"The text tells what Gatewood did (her record-setting hike) and what resulted (attention and improvements to the trail). The sneakers are a detail, not an argument, and the text never explains why the trail was built."},{"id":"structure-4","passage":"<p>Many people picture the Sahara Desert as an endless sea of sand dunes. <u>In fact, only about a quarter of the Sahara is covered by dunes.<\/u> Much of the rest consists of rocky plateaus, gravel plains, and even mountains, some of which occasionally receive snow.<\/p>","chart":null,"stem":"Which choice best describes the function of the underlined sentence in the text as a whole?","choices":["It provides an example that supports the commo
